<script>
/* ============================================================
   PART 5 — AUTH LOGIC
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, el, store, CONFIG,
    formatDate, formatDateTime, timeAgo,
    escapeHtml, initials, Toast, Modal, retry
  } = window.LH;

  if (!supabase) {
    console.error('[Auth] Supabase client chưa khởi tạo');
    return;
  }

  /* ==========================================================
     5.1 CONSTANTS
     ========================================================== */
  const INTERNAL_EMAIL_DOMAIN = '@liquidhub.internal';
  const USERNAME_RE = /^[a-zA-Z][a-zA-Z0-9._]{2,23}$/;
  const PASSWORD_MIN = 6;
  const RATE_LIMIT_KEY = 'lh_login_attempts_v1';
  const RATE_LIMIT_WINDOW = 15 * 60 * 1000;   // 15 phút
  const RATE_LIMIT_MAX = 6;                    // 6 lần / 15 phút

  /* ==========================================================
     5.2 HELPERS
     ========================================================== */
  function computeEmail(username) {
    return String(username || '').trim().toLowerCase() + INTERNAL_EMAIL_DOMAIN;
  }

  function validateUsername(u) {
    if (!u) return 'Vui lòng nhập username';
    if (u.length < 3) return 'Username phải có ít nhất 3 ký tự';
    if (u.length > 24) return 'Username tối đa 24 ký tự';
    if (!USERNAME_RE.test(u)) {
      return 'Username chỉ chứa chữ, số, dấu chấm và gạch dưới, bắt đầu bằng chữ';
    }
    return null;
  }

  function validatePassword(p) {
    if (!p) return 'Vui lòng nhập mật khẩu';
    if (p.length < PASSWORD_MIN) return `Mật khẩu phải có ít nhất ${PASSWORD_MIN} ký tự`;
    return null;
  }

  function passwordStrength(p) {
    if (!p) return { level: '', label: '' };
    let score = 0;
    if (p.length >= 6) score++;
    if (p.length >= 10) score++;
    if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score++;
    if (/\d/.test(p)) score++;
    if (/[^A-Za-z0-9]/.test(p)) score++;
    if (score <= 1) return { level: 'weak', label: 'Yếu' };
    if (score <= 2) return { level: 'fair', label: 'Trung bình' };
    if (score <= 3) return { level: 'good', label: 'Khá mạnh' };
    return { level: 'strong', label: 'Mạnh' };
  }

  /* ==========================================================
     5.3 RATE LIMITING (client-side)
     ========================================================== */
  const RateLimit = {
    get() {
      const data = store.get(RATE_LIMIT_KEY, { attempts: [], lockedUntil: 0 });
      const now = Date.now();
      data.attempts = (data.attempts || []).filter(t => now - t < RATE_LIMIT_WINDOW);
      return data;
    },
    save(data) {
      store.set(RATE_LIMIT_KEY, data);
    },
    isLocked() {
      const d = this.get();
      return d.lockedUntil > Date.now();
    },
    lockedRemaining() {
      const d = this.get();
      return Math.max(0, d.lockedUntil - Date.now());
    },
    recordFailure() {
      const d = this.get();
      d.attempts.push(Date.now());
      if (d.attempts.length >= RATE_LIMIT_MAX) {
        d.lockedUntil = Date.now() + RATE_LIMIT_WINDOW;
        d.attempts = [];
      }
      this.save(d);
    },
    recordSuccess() {
      store.set(RATE_LIMIT_KEY, { attempts: [], lockedUntil: 0 });
    },
    remainingAttempts() {
      const d = this.get();
      return Math.max(0, RATE_LIMIT_MAX - d.attempts.length);
    }
  };

  /* ==========================================================
     5.4 LOGIN HISTORY LOGGING
     ========================================================== */
  async function logLoginHistory({ userId = null, username, success, reason = '' }) {
    try {
      const ua = navigator.userAgent || '';
      await supabase.from('login_history').insert({
        user_id: userId,
        username: username || null,
        success: !!success,
        reason: reason || null,
        user_agent: ua.slice(0, 400),
        ip_address: null // client không lấy được IP thật; Part 9 Edge Function sẽ bổ sung
      });
    } catch (e) {
      // Không chặn flow đăng nhập nếu log lỗi
      console.warn('[logLoginHistory]', e);
    }
  }

  /* ==========================================================
     5.5 PROFILE LOADING / ROLE CHECK
     ========================================================== */
  async function ensureProfile(user, usernameHint = null) {
    if (!user || !user.id) return null;
    try {
      // Try fetch existing
      let { data: profile, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .maybeSingle();

      if (error && error.code !== 'PGRST116') {
        console.warn('[ensureProfile] fetch', error.message);
      }

      // If missing, create
      if (!profile) {
        const uname = usernameHint
          || (user.user_metadata && user.user_metadata.username)
          || (user.email || '').split('@')[0]
          || 'user' + Math.floor(Math.random() * 100000);

        const { data: created, error: insErr } = await supabase
          .from('profiles')
          .insert({
            id: user.id,
            username: uname.toLowerCase(),
            display_name: uname,
            created_at: new Date().toISOString()
          })
          .select()
          .maybeSingle();
        if (insErr) {
          console.warn('[ensureProfile] insert', insErr.message);
          return null;
        }
        profile = created;
      }

      // Determine admin role
      let isAdmin = false;
      try {
        const { data: roleRow } = await supabase
          .from('user_roles')
          .select('role')
          .eq('user_id', user.id)
          .maybeSingle();
        if (roleRow && (roleRow.role === 'admin' || roleRow.role === 'super_admin')) {
          isAdmin = true;
        }
      } catch {}
      if (!isAdmin && profile && profile.role === 'admin') isAdmin = true;

      return { profile, isAdmin };
    } catch (e) {
      console.warn('[ensureProfile]', e);
      return null;
    }
  }

  async function fetchWallet(userId) {
    if (!userId) return null;
    try {
      const { data, error } = await supabase
        .from('wallets')
        .select('*')
        .eq('user_id', userId)
        .maybeSingle();
      if (error) return null;
      if (!data) {
        // create empty wallet
        const { data: created } = await supabase
          .from('wallets')
          .insert({ user_id: userId, balance: 0 })
          .select()
          .maybeSingle();
        return created;
      }
      return data;
    } catch { return null; }
  }

  /* ==========================================================
     5.6 AUTH MODULE
     ========================================================== */
  const Auth = {
    initialized: false,
    authModal: null,

    init() {
      if (this.initialized) return;
      this.initialized = true;

      // Session restore on boot
      this.restoreSession();

      // Listen to auth changes
      supabase.auth.onAuthStateChange((event, session) => {
        console.log('[Auth] state change:', event);
        if (event === 'SIGNED_IN' && session && session.user) {
          this._applySession(session.user);
        } else if (event === 'SIGNED_OUT') {
          this._clearSession();
        } else if (event === 'TOKEN_REFRESHED' && session && session.user) {
          State.session = session;
        }
      });
    },

    async restoreSession() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (error) return;
        if (data && data.session && data.session.user) {
          State.session = data.session;
          await this._applySession(data.session.user);
        }
      } catch (e) {
        console.warn('[Auth.restoreSession]', e);
      }
    },

    async _applySession(user) {
      State.user = user;
      State.session = (await supabase.auth.getSession()).data.session;
      const result = await ensureProfile(user);
      if (result) {
        State.profile = result.profile;
        State.isAdmin = result.isAdmin;
      } else {
        State.profile = null;
        State.isAdmin = false;
      }
      // wallet
      try { State.wallet = await fetchWallet(user.id); } catch {}
      // header sync
      if (typeof window.LH.renderUserState === 'function') window.LH.renderUserState();
      // refresh sidebar admin section
      State.emit('auth:login', { user, profile: State.profile, isAdmin: State.isAdmin });
    },

    _clearSession() {
      State.user = null;
      State.profile = null;
      State.isAdmin = false;
      State.session = null;
      State.wallet = null;
      if (typeof window.LH.renderUserState === 'function') window.LH.renderUserState();
      State.emit('auth:logout');
    },

    /* ---------- REGISTER ---------- */
    async register(username, password, confirmPassword) {
      const uErr = validateUsername(username);
      if (uErr) throw new Error(uErr);
      const pErr = validatePassword(password);
      if (pErr) throw new Error(pErr);
      if (password !== confirmPassword) throw new Error('Mật khẩu xác nhận không khớp');

      const uname = username.trim().toLowerCase();

      // Check username uniqueness (best-effort via profiles)
      try {
        const { data: existing } = await supabase
          .from('profiles')
          .select('id')
          .eq('username', uname)
          .maybeSingle();
        if (existing) throw new Error('Username đã tồn tại, vui lòng chọn tên khác');
      } catch (e) {
        if (e.message && e.message.includes('tồn tại')) throw e;
        // Bỏ qua lỗi truy vấn — server vẫn sẽ chặn trùng qua signUp nếu có
      }

      const email = computeEmail(uname);

      // Sign up
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { username: uname } }
      });

      if (error) {
        // Common errors
        if (/already registered|already exists/i.test(error.message)) {
          throw new Error('Username đã tồn tại');
        }
        if (/password/i.test(error.message)) {
          throw new Error('Mật khẩu không hợp lệ (tối thiểu ' + PASSWORD_MIN + ' ký tự)');
        }
        if (/rate limit/i.test(error.message)) {
          throw new Error('Quá nhiều yêu cầu, vui lòng thử lại sau');
        }
        throw new Error(error.message || 'Đăng ký thất bại');
      }

      if (!data) throw new Error('Đăng ký thất bại: không có phản hồi từ server');

      // If Supabase requires email confirmation, session will be null
      if (!data.session) {
        // Attempt immediate login
        const loginRes = await supabase.auth.signInWithPassword({ email, password });
        if (loginRes.error) {
          throw new Error(
            'Đăng ký thành công nhưng cần xác nhận email. ' +
            'Vui lòng liên hệ admin hoặc tắt "Confirm email" trong Supabase Auth settings.'
          );
        }
      }

      // Create profile if not auto-created
      if (data.user) {
        try {
          await supabase.from('profiles').upsert({
            id: data.user.id,
            username: uname,
            display_name: uname,
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' });
        } catch (e) {
          console.warn('[register] profile upsert:', e);
        }
      }

      // Load session state
      const session = (await supabase.auth.getSession()).data.session;
      if (session && session.user) {
        await this._applySession(session.user);
      }

      return { user: data.user, username: uname };
    },

    /* ---------- LOGIN ---------- */
    async login(username, password) {
      // Rate limit
      if (RateLimit.isLocked()) {
        const secs = Math.ceil(RateLimit.lockedRemaining() / 1000);
        throw new Error(`Bạn đã thử quá nhiều lần. Vui lòng đợi ${secs}s.`);
      }

      const uErr = validateUsername(username);
      if (uErr) throw new Error(uErr);
      if (!password) throw new Error('Vui lòng nhập mật khẩu');

      const uname = username.trim().toLowerCase();
      const email = computeEmail(uname);

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        RateLimit.recordFailure();
        await logLoginHistory({
          userId: null,
          username: uname,
          success: false,
          reason: error.message
        });
        const remaining = RateLimit.remainingAttempts();
        let msg = error.message || 'Đăng nhập thất bại';
        if (/invalid login credentials/i.test(msg)) {
          msg = 'Sai username hoặc mật khẩu';
          if (remaining > 0 && remaining <= 3) msg += ` (còn ${remaining} lần thử)`;
        } else if (/email not confirmed/i.test(msg)) {
          msg = 'Tài khoản chưa xác nhận. Vui lòng liên hệ admin.';
        }
        throw new Error(msg);
      }

      if (!data || !data.session || !data.session.user) {
        throw new Error('Đăng nhập thất bại: không nhận được phiên');
      }

      RateLimit.recordSuccess();
      await this._applySession(data.session.user);

      await logLoginHistory({
        userId: data.session.user.id,
        username: uname,
        success: true
      });

      return data.session.user;
    },

    /* ---------- LOGOUT ---------- */
    async logout(all = false) {
      try {
        if (all) {
          // Sign out of all sessions if supported
          try { await supabase.auth.signOut({ scope: 'global' }); }
          catch { await supabase.auth.signOut(); }
        } else {
          await supabase.auth.signOut();
        }
        this._clearSession();
        Toast.success('Đã đăng xuất');
        return true;
      } catch (e) {
        Toast.error('Lỗi đăng xuất: ' + (e.message || 'unknown'));
        return false;
      }
    },

    /* ---------- CHANGE PASSWORD ---------- */
    async changePassword(newPassword) {
      if (!State.user) throw new Error('Bạn chưa đăng nhập');
      const err = validatePassword(newPassword);
      if (err) throw new Error(err);
      const { error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) throw new Error(error.message || 'Không đổi được mật khẩu');
      Toast.success('Đã đổi mật khẩu thành công');
      return true;
    },

    /* ---------- UPDATE PROFILE ---------- */
    async updateProfile(patch) {
      if (!State.user) throw new Error('Chưa đăng nhập');
      const { data, error } = await supabase
        .from('profiles')
        .update({ ...patch, updated_at: new Date().toISOString() })
        .eq('id', State.user.id)
        .select()
        .maybeSingle();
      if (error) throw new Error(error.message);
      State.profile = data;
      if (typeof window.LH.renderUserState === 'function') window.LH.renderUserState();
      State.emit('profile:updated', data);
      return data;
    },

      const modal = Modal.open({

          // Init

    _updateRateLimitBanner(body) {
      const banner = body.querySelector('#rateLimitBanner');
      const text = body.querySelector('#rateLimitText');
      if (!banner) return;
      if (RateLimit.isLocked()) {
        const secs = Math.ceil(RateLimit.lockedRemaining() / 1000);
        const mins = Math.ceil(secs / 60);
        text.textContent = `Bạn đã thử quá nhiều lần. Vui lòng đợi ${mins} phút.`;
        banner.classList.add('show');
        body.querySelector('#loginSubmitBtn').disabled = true;
      } else {
        banner.classList.remove('show');
        const btn = body.querySelector('#loginSubmitBtn');
        if (btn) btn.disabled = false;
      }
    },

    _bindAuthModal(body, close) {
      const tabs = body.querySelector('#authTabs');
      const loginForm = body.querySelector('#loginForm');
      const registerForm = body.querySelector('#registerForm');
      const heroTitle = body.querySelector('#authHeroTitle');
      const heroSub = body.querySelector('#authHeroSub');

      // Tabs switching
      const switchTab = (target) => {
        tabs.dataset.active = target;
        tabs.querySelectorAll('.auth-tab').forEach(t => {
          t.classList.toggle('active', t.dataset.tab === target);
        });
        loginForm.hidden = target !== 'login';
        registerForm.hidden = target !== 'register';
        if (target === 'login') {
          heroTitle.textContent = 'Chào mừng trở lại';
          heroSub.textContent = 'Đăng nhập để tiếp tục mua sắm và quản lý tài khoản';
        } else {
          heroTitle.textContent = 'Tạo tài khoản mới';
          heroSub.textContent = 'Chỉ cần username và mật khẩu — không cần email';
        }
      };

      tabs.querySelectorAll('.auth-tab').forEach(t => {
        t.addEventListener('click', () => switchTab(t.dataset.tab));
      });
      body.querySelectorAll('[data-switch]').forEach(a => {
        a.addEventListener('click', () => switchTab(a.dataset.switch));
      });

      // Password visibility toggles
      body.querySelectorAll('[data-pw-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = body.querySelector('#' + btn.dataset.pwToggle);
          if (!input) return;
          const isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          btn.innerHTML = `<i data-lucide="${isPw ? 'eye-off' : 'eye'}"></i>`;
          if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
        });
      });

      // Password strength
      const regPwd = body.querySelector('#regPassword');
      const strengthEl = body.querySelector('#pwdStrength');
      const strengthLabel = body.querySelector('#pwdStrengthLabel');
      regPwd.addEventListener('input', () => {
        const { level, label } = passwordStrength(regPwd.value);
        strengthEl.className = 'pwd-strength ' + (level || '');
        strengthLabel.textContent = label ? `Độ mạnh: ${label}` : '';
        strengthLabel.style.color = level === 'weak' ? 'var(--danger)'
          : level === 'fair' ? 'var(--warning)'
          : level === 'good' ? 'var(--info)'
          : level === 'strong' ? 'var(--success)' : 'var(--text-3)';
      });

      // ---- LOGIN SUBMIT ----
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (loginForm.dataset.loading === '1') return;

        // clear errors
        clearFormErrors(loginForm);
        const u = body.querySelector('#loginUsername').value.trim();
        const p = body.querySelector('#loginPassword').value;

        // basic client-side validate
        const uErr = validateUsername(u);
        if (uErr) { showFieldError(loginForm, 'username', uErr); return; }

        if (RateLimit.isLocked()) {
          this._updateRateLimitBanner(body);
          Toast.error('Đã tạm khoá do thử quá nhiều lần');
          return;
        }

        setLoading(loginForm, body.querySelector('#loginSubmitBtn'), true);
        try {
          await this.login(u, p);
          Toast.success('Đăng nhập thành công');
          close();
          // refresh current view
          window.LH.refreshCurrentView && window.LH.refreshCurrentView();
        } catch (err) {
          Toast.error(err.message || 'Đăng nhập thất bại');
          showFieldError(loginForm, 'password', err.message || '');
          this._updateRateLimitBanner(body);
        } finally {
          setLoading(loginForm, body.querySelector('#loginSubmitBtn'), false);
        }
      });

      // ---- REGISTER SUBMIT ----
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (registerForm.dataset.loading === '1') return;
        clearFormErrors(registerForm);

        const u = body.querySelector('#regUsername').value.trim();
        const p = body.querySelector('#regPassword').value;
        const c = body.querySelector('#regConfirm').value;

        const uErr = validateUsername(u);
        if (uErr) { showFieldError(registerForm, 'username', uErr); return; }
        const pErr = validatePassword(p);
        if (pErr) { showFieldError(registerForm, 'password', pErr); return; }
        if (p !== c) { showFieldError(registerForm, 'confirm', 'Mật khẩu xác nhận không khớp'); return; }

        setLoading(registerForm, body.querySelector('#registerSubmitBtn'), true);
        try {
          await this.register(u, p, c);
          Toast.success('Đăng ký thành công. Chào mừng bạn!');
          close();
          window.LH.refreshCurrentView && window.LH.refreshCurrentView();
        } catch (err) {
          Toast.error(err.message || 'Đăng ký thất bại');
          if (/username/i.test(err.message)) showFieldError(registerForm, 'username', err.message);
          else if (/mật khẩu/i.test(err.message)) showFieldError(registerForm, 'password', err.message);
        } finally {
          setLoading(registerForm, body.querySelector('#registerSubmitBtn'), false);
        }
      });
    }
  };

  function showFieldError(form, key, msg) {
    const node = form.querySelector(`[data-err="${key}"]`);
    if (node) {
      node.textContent = msg;
      node.hidden = false;
      node.previousElementSibling?.classList.add('invalid');
    }
  }
  function clearFormErrors(form) {
    form.querySelectorAll('[data-err]').forEach(n => { n.hidden = true; n.textContent = ''; });
    form.querySelectorAll('.input.invalid').forEach(n => n.classList.remove('invalid'));
  }
  function setLoading(form, btn, loading) {
    form.dataset.loading = loading ? '1' : '0';
    if (!btn) return;
    btn.disabled = loading;
    if (loading) {
      btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span><span>Đang xử lý…</span>`;
    } else {
      const label = btn.id === 'loginSubmitBtn' ? 'Đăng nhập' : 'Tạo tài khoản';
      btn.innerHTML = `<span>${label}</span>`;
    }
  }

  window.LH.Auth = Auth;

            <div class="danger-zone">
              <div class="danger-zone-title"><i data-lucide="alert-triangle"></i>Vùng nguy hiểm</div>
              <div class="danger-zone-desc">Đăng xuất khỏi tất cả phiên trên mọi thiết bị.</div>
              <button class="btn btn-danger btn-sm" style="width:100%;" id="logoutAllBtn"><i data-lucide="log-out"></i>Đăng xuất tất cả</button>
            </div>
          </div>
        </div>
      </div>

      <!-- PANEL: LOGIN HISTORY -->
      <div class="acc-tab-panel" data-panel="history" hidden>
        <div class="acc-card">
          <div class="acc-card-header">
            <div class="acc-card-icon"><i data-lucide="history"></i></div>
            <div>
              <div class="acc-card-title">Lịch sử đăng nhập</div>
              <div class="acc-card-sub">Các lần đăng nhập gần đây của bạn</div>
            </div>
          </div>
          <div id="loginHistoryList">
            <div class="text-center" style="padding:30px;">
              <div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- PANEL: ORDERS -->
      <div class="acc-tab-panel" data-panel="orders" hidden>
        <div class="acc-card">
          <div class="acc-card-header">
            <div class="acc-card-icon"><i data-lucide="package"></i></div>
            <div>
              <div class="acc-card-title">Đơn hàng của bạn</div>
              <div class="acc-card-sub">Xem chi tiết tại trang Đơn hàng</div>
            </div>
          </div>
          <div id="accOrdersPreview">
            <div class="text-center" style="padding:30px;">
              <div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div>
            </div>
          </div>
          <a href="#/orders" class="btn btn-primary" style="margin-top:14px;width:100%;"><i data-lucide="arrow-right"></i>Xem tất cả đơn hàng</a>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // Tabs
    container.querySelectorAll('.acc-tab').forEach(t => {
      t.addEventListener('click', () => {
        const panel = t.dataset.tab;
        container.querySelectorAll('.acc-tab').forEach(x => x.classList.toggle('active', x === t));
        container.querySelectorAll('.acc-tab-panel').forEach(p => p.hidden = p.dataset.panel !== panel);
        if (panel === 'history') loadLoginHistory();
        if (panel === 'orders') loadOrdersPreview();
      });
    });

    // Password toggles
    container.querySelectorAll('[data-pw-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = container.querySelector('#' + btn.dataset.pwToggle);
        if (!input) return;
        const isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        btn.innerHTML = `<i data-lucide="${isPw ? 'eye-off' : 'eye'}"></i>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
      });
    });

    // Change password
    container.querySelector('#changePwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = container.querySelector('#newPw').value;
      const p2 = container.querySelector('#newPwConfirm').value;
      if (!p1 || p1.length < PASSWORD_MIN) { Toast.error(`Mật khẩu tối thiểu ${PASSWORD_MIN} ký tự`); return; }
      if (p1 !== p2) { Toast.error('Mật khẩu xác nhận không khớp'); return; }
      const btn = container.querySelector('#changePwBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span> Đang xử lý…`;
      try {
        await Auth.changePassword(p1);
        container.querySelector('#newPw').value = '';
        container.querySelector('#newPwConfirm').value = '';
      } catch (err) {
        Toast.error(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="save"></i>Đổi mật khẩu`;
        if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
      }
    });

    // Logout all
    container.querySelector('#logoutAllBtn').addEventListener('click', async () => {
      const ok = await Modal.confirm('Đăng xuất khỏi tất cả thiết bị?', { okText: 'Đăng xuất', danger: true });
      if (ok) await Auth.logout(true);
    });

    // Refresh session
    container.querySelector('#refreshSessionBtn').addEventListener('click', async () => {
      try {
        const { data, error } = await supabase.auth.refreshSession();
        if (error) throw error;
        Toast.success('Đã làm mới phiên đăng nhập');
        updateSessionStart();
      } catch (err) {
        Toast.error('Không thể làm mới: ' + (err.message || ''));
      }
    });

    // Edit profile
    container.querySelector('#editProfileBtn').addEventListener('click', () => openEditProfileModal());

    // Session start
    function updateSessionStart() {
      const el = container.querySelector('#accSessionStart');
      if (el && State.session && State.session.expires_at) {
        const expires = new Date(State.session.expires_at * 1000);
        el.textContent = 'Hết hạn ' + formatDateTime(expires);
      }
    }
    updateSessionStart();

    // Load stats asynchronously
    loadOverviewStats();
    async function loadOverviewStats() {
      try {
        const [orderCountRes, loginCountRes, lastLoginRes] = await Promise.all([
          supabase.from('orders').select('id', { count: 'exact', head: true }).eq('user_id', State.user.id),
          supabase.from('login_history').select('id', { count: 'exact', head: true }).eq('user_id', State.user.id).eq('success', true),
          supabase.from('login_history').select('created_at').eq('user_id', State.user.id).eq('success', true).order('created_at', { ascending: false }).limit(1).maybeSingle()
        ]);
        const oc = container.querySelector('#accOrderCount');
        const lc = container.querySelector('#accLoginCount');
        const ll = container.querySelector('#accLastLogin');
        if (oc) oc.textContent = String(orderCountRes.count || 0);
        if (lc) lc.textContent = String(loginCountRes.count || 0);
        if (ll) ll.textContent = lastLoginRes.data ? timeAgo(lastLoginRes.data.created_at) : '—';
      } catch (e) {
        console.warn('[acc stats]', e);
      }
    }

    async function loadLoginHistory() {
      const list = container.querySelector('#loginHistoryList');
      if (!list) return;
      try {
        const { data, error } = await supabase
          .from('login_history')
          .select('*')
          .eq('user_id', State.user.id)
          .order('created_at', { ascending: false })
          .limit(20);
        if (error) throw error;
        if (!data || !data.length) {
          list.innerHTML = `<div class="empty-state-desc" style="text-align:center;padding:20px;">Chưa có lịch sử đăng nhập.</div>`;
          return;
        }
        list.innerHTML = `<div class="history-list">
          ${data.map(h => `
            <div class="history-item">
              <div class="history-item-icon ${h.success ? 'success' : 'fail'}">
                <i data-lucide="${h.success ? 'check' : 'x'}"></i>
              </div>
              <div class="history-item-body">
                <div class="history-item-title">${h.success ? 'Đăng nhập thành công' : 'Đăng nhập thất bại'}</div>
                <div class="history-item-meta">${formatDateTime(h.created_at)} · ${escapeHtml((h.user_agent || '').slice(0, 80))}</div>
              </div>
            </div>
          `).join('')}
        </div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [list] });
      } catch (err) {
        list.innerHTML = `<div class="empty-state-desc" style="text-align:center;padding:20px;">Không tải được lịch sử: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadOrdersPreview() {
      const el = container.querySelector('#accOrdersPreview');
      if (!el) return;
      try {
        const { data, error } = await supabase
          .from('orders')
          .select('*')
          .eq('user_id', State.user.id)
          .order('created_at', { ascending: false })
          .limit(5);
        if (error) throw error;
        if (!data || !data.length) {
          el.innerHTML = `<div class="empty-state-desc" style="text-align:center;padding:20px;">Chưa có đơn hàng nào.</div>`;
          return;
        }
        el.innerHTML = `<div class="history-list">
          ${data.map(o => `
            <div class="history-item">
              <div class="history-item-icon"><i data-lucide="package"></i></div>
              <div class="history-item-body">
                <div class="history-item-title">${escapeHtml(o.code || 'Đơn #' + (o.id || '').slice(0, 8))}</div>
                <div class="history-item-meta">${formatDateTime(o.created_at)} · ${formatCurrency(o.total_amount || 0)}</div>
              </div>
              <span class="badge ${o.status === 'completed' ? 'badge-success' : o.status === 'pending' ? 'badge-warning' : o.status === 'cancelled' ? 'badge-danger' : 'badge-info'}">${escapeHtml(o.status || 'pending')}</span>
            </div>
          `).join('')}
        </div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [el] });
      } catch (err) {
        el.innerHTML = `<div class="empty-state-desc" style="text-align:center;padding:20px;">Không tải được đơn hàng: ${escapeHtml(err.message)}</div>`;
      }
    }
  }

  function renderNoAuth(container) {
    container.innerHTML = `
      <div class="acc-noauth anim-up">
        <div class="acc-noauth-icon"><i data-lucide="lock"></i></div>
        <div class="acc-noauth-title">Bạn chưa đăng nhập</div>
        <div class="acc-noauth-desc">
          Đăng nhập hoặc tạo tài khoản để quản lý đơn hàng, số dư ví và lịch sử giao dịch.
        </div>
        <div class="acc-noauth-actions">
          <button class="btn btn-primary" id="noauthLogin"><i data-lucide="log-in"></i>Đăng nhập</button>
          <button class="btn btn-glass" id="noauthRegister"><i data-lucide="user-plus"></i>Đăng ký</button>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
    container.querySelector('#noauthLogin').addEventListener('click', () => Auth.openLogin());
    container.querySelector('#noauthRegister').addEventListener('click', () => Auth.openRegister());
  }

  /* ==========================================================
     5.8 EDIT PROFILE MODAL
     ========================================================== */
  function openEditProfileModal() {
    const p = State.profile || {};
    const content = document.createElement('div');
    content.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <label class="field-label">Tên hiển thị</label>
          <input type="text" class="input" id="editDisplayName" value="${escapeHtml(p.display_name || '')}" placeholder="Tên hiển thị">
        </div>
        <div class="field">
          <label class="field-label">Avatar URL</label>
          <input type="url" class="input" id="editAvatarUrl" value="${escapeHtml(p.avatar_url || '')}" placeholder="https://…">
          <div class="field-hint">Dán URL ảnh hoặc upload sau (Part 7 sẽ hỗ trợ upload trực tiếp)</div>
        </div>
        <div class="field">
          <label class="field-label">Tiêu đề</label>
          <input type="text" class="input" id="editTitle" value="${escapeHtml(p.title || '')}" placeholder="VD: Chuyên gia MMO">
        </div>
        <div class="field">
          <label class="field-label">Giới thiệu ngắn</label>
          <textarea class="textarea" id="editBio" placeholder="Giới thiệu về bạn…">${escapeHtml(p.bio || '')}</textarea>
        </div>
      </div>
    `;
    const m = Modal.open({
      title: 'Chỉnh sửa hồ sơ',
      content,
      actions: [
        { label: 'Huỷ', className: 'btn-glass', onClick: (close) => close() },
        { label: 'Lưu', className: 'btn-primary', onClick: async (close) => {
          const patch = {
            display_name: content.querySelector('#editDisplayName').value.trim() || null,
            avatar_url: content.querySelector('#editAvatarUrl').value.trim() || null,
            title: content.querySelector('#editTitle').value.trim() || null,
            bio: content.querySelector('#editBio').value.trim() || null
          };
          try {
            await Auth.updateProfile(patch);
            Toast.success('Đã cập nhật hồ sơ');
            close();
            window.LH.refreshCurrentView && window.LH.refreshCurrentView();
          } catch (err) {
            Toast.error('Lỗi: ' + (err.message || 'unknown'));
          }
        }}
      ]
    });
  }

  /* ==========================================================
     5.9 REGISTER ACCOUNT VIEW
     ========================================================== */
  window.LH.Views = window.LH.Views || {};
  window.LH.Views.account = (container, hash) => renderAccount(container, hash);

  /* ==========================================================
     5.10 INIT
     ========================================================== */
  function init() {
    Auth.init();
    // Override header login button behavior (Part 2's openLoginPlaceholder)
    const loginBtn = document.getElementById('loginBtn');
    if (loginBtn) {
      // Remove existing listeners by cloning
      const clone = loginBtn.cloneNode(true);
      loginBtn.parentNode.replaceChild(clone, loginBtn);
      clone.addEventListener('click', () => Auth.openLogin());
    }
    // Wire user menu's login/register buttons (they already call LH.Auth if present, but let's ensure)
    console.log('%cPart 5 loaded — Auth, Account, Login History', 'color:#f59e0b;font-weight:700;');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script>
/* ============================================================
   PART 6 — WALLET · DEPOSIT · CHECKOUT · ORDERS · HISTORY
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, el, store, CONFIG,
    formatCurrency, formatDate, formatDateTime, timeAgo,
    escapeHtml, Toast, Modal, compressImage, uuidv4, debounce
  } = window.LH;

  if (!supabase) {
    console.error('[Part6] Supabase required');
    return;
  }

  /* ==========================================================
     6.1 SITE CONFIG (bank & bitcoin settings)
     ========================================================== */
  const SiteConfig = {
    cache: new Map(),
    async get(key, fallback = null) {
      if (this.cache.has(key)) return this.cache.get(key);
      try {
        const { data, error } = await supabase
          .from('website_settings')
          .select('value')
          .eq('key', key)
          .maybeSingle();
        if (error || !data) {
          this.cache.set(key, fallback);
          return fallback;
        }
        this.cache.set(key, data.value);
        return data.value;
      } catch {
        return fallback;
      }
    },
    invalidate(key) {
      if (key) this.cache.delete(key);
      else this.cache.clear();
    },
    async getBankConfig() {
      const v = await this.get('bank_config', null);
      if (!v) return null;
      return {
        bank_id: v.bank_id || v.bank_code || 'MB',
        bank_name: v.bank_name || v.bank_id || 'Ngân hàng',
        account_no: v.account_no || v.account_number || '',
        account_name: v.account_name || '',
        logo_url: v.logo_url || '',
        note: v.note || ''
      };
    },
    async getBitcoinConfig() {
      const v = await this.get('bitcoin_config', null);
      if (!v) return null;
      return {
        network: v.network || 'Bitcoin (BTC)',
        address: v.address || '',
        note: v.note || '',
        qr_url: v.qr_url || ''
      };
    }
  };
  window.LH.SiteConfig = SiteConfig;

  /* ==========================================================
     6.2 WALLET HELPERS
     ========================================================== */
  const Wallet = {
    async fetch(userId) {
      if (!userId) return null;
      const { data, error } = await supabase
        .from('wallets')
        .select('*')
        .eq('user_id', userId)
        .maybeSingle();
      if (error) return null;
      if (!data) {
        const { data: created } = await supabase
          .from('wallets')
          .insert({ user_id: userId, balance: 0 })
          .select()
          .maybeSingle();
        return created;
      }
      return data;
    },

    async getBalance(userId) {
      const w = await this.fetch(userId);
      return w ? Number(w.balance) || 0 : 0;
    },

    async transactions(userId, { page = 0, limit = 20 } = {}) {
      if (!userId) return { items: [], total: 0 };
      try {
        const from = page * limit;
        const { data, error, count } = await supabase
          .from('wallet_transactions')
          .select('*', { count: 'exact' })
          .eq('user_id', userId)
          .order('created_at', { ascending: false })
          .range(from, from + limit - 1);
        if (error) return { items: [], total: 0 };
        return { items: data || [], total: count || 0 };
      } catch { return { items: [], total: 0 }; }
    },

    async depositRequests(userId, { page = 0, limit = 20 } = {}) {
      if (!userId) return { items: [], total: 0 };
      try {
        const from = page * limit;
        const { data, error, count } = await supabase
          .from('deposit_requests')
          .select('*', { count: 'exact' })
          .eq('user_id', userId)
          .order('created_at', { ascending: false })
          .range(from, from + limit - 1);
        if (error) return { items: [], total: 0 };
        return { items: data || [], total: count || 0 };
      } catch { return { items: [], total: 0 }; }
    },

    async createDepositRequest(payload) {
      const { data, error } = await supabase
        .from('deposit_requests')
        .insert(payload)
        .select()
        .maybeSingle();
      if (error) throw new Error(error.message || 'Không tạo được yêu cầu nạp tiền');
      return data;
    },

    // Attempt credit/debit via RPC first, fall back to direct update
    async adjust(userId, deltaAmount, { type = 'adjust', reason = '', refId = null } = {}) {
      const current = await this.fetch(userId);
      if (!current) throw new Error('Không tìm thấy ví');
      const before = Number(current.balance) || 0;
      const after = before + deltaAmount;
      if (after < 0) throw new Error('Số dư không đủ');

      // Try RPC first (Part 9 provides atomic version)
      try {
        const { data, error } = await supabase.rpc('wallet_adjust', {
          p_user_id: userId,
          p_amount: deltaAmount,
          p_type: type,
          p_reason: reason,
          p_ref_id: refId
        });
        if (!error) return { before, after, rpc: true, data };
      } catch {}

      // Fallback: direct update (requires RLS policy allowing user update own wallet for debit, or admin only)
      const { data: updated, error: updErr } = await supabase
        .from('wallets')
        .update({ balance: after, updated_at: new Date().toISOString() })
        .eq('user_id', userId)
        .eq('balance', before)  // optimistic concurrency
        .select()
        .maybeSingle();
      if (updErr) throw new Error('Lỗi cập nhật ví: ' + updErr.message);
      if (!updated) throw new Error('Xung đột dữ liệu ví, vui lòng thử lại');

      // Insert ledger
      try {
        await supabase.from('wallet_transactions').insert({
          user_id: userId,
          amount: deltaAmount,
          type,
          reason,
          ref_id: refId,
          balance_before: before,
          balance_after: after
        });
      } catch (e) {
        console.warn('[Wallet.adjust] ledger insert', e);
      }
      return { before, after, rpc: false };
    }
  };
  window.LH.Wallet = Wallet;

  /* ==========================================================
     6.3 CLIPBOARD
     ========================================================== */
  async function copyToClipboard(text, btn) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      if (btn) {
        btn.classList.add('copied');
        const original = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="check"></i>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = original;
          if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
        }, 1400);
      }
      Toast.success('Đã sao chép', 1400);
      return true;
    } catch {
      Toast.error('Không sao chép được');
      return false;
    }
  }
  window.LH.copyToClipboard = copyToClipboard;

  /* ==========================================================
     6.4 QR GENERATOR (using qrcode.js)
     ========================================================== */
  const QR = {
    async toDataURL(text, size = 320) {
      if (!window.QRCode || !window.QRCode.toDataURL) {
        throw new Error('QRCode library chưa sẵn sàng');
      }
      return await window.QRCode.toDataURL(text, {
        width: size,
        margin: 1,
        color: { dark: '#0f172a', light: '#ffffff' },
        errorCorrectionLevel: 'M'
      });
    },

    vietQRUrl({ bankId, accountNo, accountName, amount, description }) {
      const base = 'https://img.vietqr.io/image';
      const params = new URLSearchParams();
      if (amount) params.set('amount', String(Math.round(amount)));
      if (description) params.set('addInfo', description);
      if (accountName) params.set('accountName', accountName);
      const qs = params.toString();
      return `${base}/${encodeURIComponent(bankId)}-${encodeURIComponent(accountNo)}-compact2.jpg${qs ? '?' + qs : ''}`;
    },

    bitcoinUrl({ address, amount, label }) {
      let uri = `bitcoin:${address}`;
      const p = [];
      if (amount) p.push(`amount=${amount}`);
      if (label) p.push(`label=${encodeURIComponent(label)}`);
      if (p.length) uri += '?' + p.join('&');
      return uri;
    }
  };
  window.LH.QR = QR;

  /* ==========================================================
     6.5 DEPOSIT CODE GENERATOR
     ========================================================== */
  function generateDepositCode() {
    const d = new Date();
    const yy = String(d.getFullYear()).slice(-2);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
    return `NAP${yy}${mm}${dd}${rand}`;
  }
  function generateOrderCode() {
    const d = new Date();
    const yy = String(d.getFullYear()).slice(-2);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
    return `ORD${yy}${mm}${dd}${rand}`;
  }

  /* ==========================================================
     6.6 RECEIPT UPLOAD (Supabase Storage)
     ========================================================== */
  async function uploadReceipt(file) {
    if (!file) return null;
    if (!file.type.startsWith('image/')) throw new Error('Chỉ hỗ trợ ảnh');
    if (file.size > 8 * 1024 * 1024) throw new Error('Ảnh tối đa 8MB');

    // compress
    let uploadFile = file;
    try {
      uploadFile = await compressImage(file, 1600, 0.85);
    } catch (e) {
      console.warn('[uploadReceipt] compress failed, using original', e);
    }

    const ext = (uploadFile.name || 'receipt.jpg').split('.').pop() || 'jpg';
    const path = `${State.user.id}/${Date.now()}_${uuidv4().slice(0, 8)}.${ext}`;

    const { data, error } = await supabase.storage
      .from(CONFIG.STORAGE_BUCKETS.RECEIPTS)
      .upload(path, uploadFile, {
        cacheControl: '3600',
        upsert: false,
        contentType: uploadFile.type || 'image/jpeg'
      });

    if (error) throw new Error('Upload thất bại: ' + error.message);

    const { data: pub } = supabase.storage
      .from(CONFIG.STORAGE_BUCKETS.RECEIPTS)
      .getPublicUrl(path);

    return {
      path,
      url: pub?.publicUrl || null
    };
  }

  /* ==========================================================
     6.7 WALLET VIEW

    container.innerHTML = `

        <div class="wallet-hero-label">Số dư khả dụng</div>
        <div class="wallet-hero-balance" id="walletBalance">—</div>
        <div class="wallet-hero-sub">Nạp tiền để mua sản phẩm và dịch vụ nhanh chóng</div>
        <div class="wallet-hero-actions">
          <button class="wallet-hero-btn" id="walletDepositBtn"><i data-lucide="plus-circle"></i>Nạp tiền</button>
          <a href="#/orders" class="wallet-hero-btn outline"><i data-lucide="package"></i>Đơn hàng</a>
        </div>
        <div class="wallet-stats-grid">
          <div class="wallet-stat">
            <div class="wallet-stat-label">Tổng đã nạp</div>

      const pendingCount = (items || []).filter(r => r.status === 'pending').length;
      const pc = document.getElementById('walletPendingCount');
      if (pc) pc.textContent = String(pendingCount);

      panel.innerHTML = `<div class="tx-list">
        ${items.map(t => {

          const isIn = amt >= 0;

          const reasonLabel = t.reason || t.type || 'Giao dịch';

            <div class="tx-item">

              <div class="tx-body">

                <div class="tx-amount ${cls}">${isIn ? '+' : ''}${formatCurrency(amt)}</div>

        <div class="deposit-tabs" id="depositTabs">

      `;

        const body = document.getElementById('depositBody');

Số TK: ${cfg.account_no}

      // Amount presets

        preset.addEventListener('click', () => {
          body.querySelectorAll('.amount-preset').forEach(x => x.classList.remove('active'));

        const amt = parseFloat(amountInput.value) || 0;
        const wrap = body.querySelector('#bankQrWrap');
        if (!wrap) return;

        // Prefer VietQR if bank_id & account_no look valid
        if (cfg.bank_id && cfg.account_no && /^[0-9A-Z]{6,20}$/i.test(cfg.account_no)) {
          const url = QR.vietQRUrl({
            bankId: cfg.bank_id,
            accountNo: cfg.account_no,
            accountName: cfg.account_name,
            amount: amt || undefined,
            description: code
          });
          wrap.innerHTML = `
            <img src="${escapeHtml(url)}" alt="VietQR" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=&quot;bank-qr-caption&quot;>Không tải được QR VietQR. Vui lòng chuyển khoản thủ công theo thông tin bên trái.</div>'">
            <div class="bank-qr-caption">Quét mã để chuyển khoản${amt ? ' ' + formatCurrency(amt) : ''} với nội dung <strong>${escapeHtml(code)}</strong></div>
          `;
        } else {
          // Fallback to manual QR of bank info
          try {
            const text = `Bank: ${cfg.bank_name}
Acc: ${cfg.account_no}
Name: ${cfg.account_name}
Amount: ${amt || 0}
Memo: ${code}`;
            const dataUrl = await QR.toDataURL(text, 320);
            wrap.innerHTML = `
              <img src="${dataUrl}" alt="QR">
              <div class="bank-qr-caption">Quét để xem thông tin chuyển khoản</div>
            `;
          } catch (e) {
            wrap.innerHTML = `<div class="bank-qr-caption">Không tạo được QR. Vui lòng chuyển khoản theo thông tin bên trái.</div>`;
          }
        }
      }
      refreshQR();

      // Upload receipt
      let receiptFile = null;
      const zone = body.querySelector('#uploadZone');
      const fileInput = body.querySelector('#receiptInput');
      const previewWrap = body.querySelector('#receiptPreview');

      zone?.addEventListener('click', () => fileInput.click());
      zone?.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone?.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone?.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
      });
      fileInput?.addEventListener('change', (e) => {
        if (e.target.files?.[0]) handleFile(e.target.files[0]);
      });

      async function handleFile(file) {
        if (!file.type.startsWith('image/')) { Toast.error('Chỉ hỗ trợ ảnh'); return; }
        if (file.size > 8 * 1024 * 1024) { Toast.error('Ảnh tối đa 8MB'); return; }
        receiptFile = file;
        const url = URL.createObjectURL(file);
        previewWrap.innerHTML = `
          <div class="upload-preview">
            <img src="${url}" alt="preview">
            <button class="upload-remove" id="removeReceipt"><i data-lucide="x"></i></button>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons({ nodes: [previewWrap] });
        previewWrap.querySelector('#removeReceipt')?.addEventListener('click', () => {
          receiptFile = null;
          previewWrap.innerHTML = '';
          fileInput.value = '';
        });
      }

      // Submit
      const submitBtn = body.querySelector('#submitDepositBtn');
      submitBtn?.addEventListener('click', async () => {
        const amt = parseFloat(body.querySelector('#depositAmount').value) || 0;
        if (amt < 10000) { Toast.error('Số tiền tối thiểu 10.000₫'); return; }
        if (!receiptFile) { Toast.error('Vui lòng tải ảnh chứng minh chuyển khoản'); return; }
        if (submitBtn.disabled) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span> Đang gửi…`;

        try {
          // Upload receipt first
          const receipt = await uploadReceipt(receiptFile);
          // Create request
          const payload = {
            user_id: State.user.id,
            code,
            amount: amt,
            method: 'bank',
            status: 'pending',
            bank_info: {
              bank_id: cfg.bank_id,
              bank_name: cfg.bank_name,
              account_no: cfg.account_no,
              account_name: cfg.account_name
            },
            tx_code: (body.querySelector('#depositTxCode').value || '').trim() || null,
            receipt_url: receipt?.url || null,
            receipt_path: receipt?.path || null,
            note: (body.querySelector('#depositNote').value || '').trim() || null
          };
          await Wallet.createDepositRequest(payload);
          Toast.success('Đã gửi yêu cầu nạp tiền. Vui lòng chờ admin duyệt.');
          // Reset UI
          body.querySelector('#depositAmount').value = '';
          body.querySelector('#depositTxCode').value = '';
          body.querySelector('#depositNote').value = '';
          receiptFile = null;
          previewWrap.innerHTML = '';
          fileInput.value = '';
          // reload pending
          loadPendingRequests();
        } catch (err) {
          Toast.error(err.message || 'Gửi yêu cầu thất bại');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i data-lucide="send"></i>Gửi yêu cầu nạp`;
          if (window.lucide) window.lucide.createIcons({ nodes: [submitBtn] });
        }
      });
    }

            <label class="field-label">Mã giao dịch / TXID</label>
            <input type="text" class="input" id="btcTxId" placeholder="VD: a1b2c3…" autocomplete="off">
          </div>

          <div class="field" style="margin-bottom:10px;">
            <label class="field-label">Ảnh chụp giao dịch</label>
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="receiptInput" accept="image/*" hidden>
              <i data-lucide="image-up"></i>
              <div class="upload-zone-text">Nhấn để tải ảnh lên</div>
              <div class="upload-zone-hint">Hỗ trợ JPG, PNG, WEBP · Tối đa 8MB</div>
            </div>
            <div id="receiptPreview" style="margin-top:10px;"></div>
          </div>

          <div class="field" style="margin-bottom:14px;">
            <label class="field-label">Giá trị USD/VND quy đổi (nếu bạn muốn ghi rõ)</label>
            <input type="number" class="input" id="btcAmountVnd" placeholder="VD: 1000000" min="0" step="1000">
          </div>

          <button class="btn btn-primary btn-block btn-lg" id="submitBtcBtn">
            <i data-lucide="send"></i>Gửi yêu cầu nạp
          </button>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [body] });

      // Copy address
      body.querySelector('#copyBtcAddr')?.addEventListener('click', (e) => {
        copyToClipboard(cfg.address, e.currentTarget);
      });
      body.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => copyToClipboard(btn.dataset.copy, btn));
      });

      // QR
      async function refreshBtcQR() {
        const wrap = body.querySelector('#btcQrWrap');
        if (!wrap) return;
        const amt = parseFloat(body.querySelector('#btcAmount').value) || 0;
        try {
          const uri = QR.bitcoinUrl({ address: cfg.address, amount: amt || undefined, label: code });
          const dataUrl = await QR.toDataURL(uri, 320);
          wrap.innerHTML = `
            <img src="${dataUrl}" alt="Bitcoin QR">
            <div class="bank-qr-caption">Quét để mở ví Bitcoin. Nội dung memo: <strong>${escapeHtml(code)}</strong></div>
          `;
        } catch {
          wrap.innerHTML = `<div class="bank-qr-caption">Không tạo được QR. Vui lòng copy địa chỉ ví.</div>`;
        }
      }
      refreshBtcQR();
      body.querySelector('#btcAmount')?.addEventListener('input', debounce(refreshBtcQR, 400));

      // Upload
      let receiptFile = null;
      const zone = body.querySelector('#uploadZone');
      const fileInput = body.querySelector('#receiptInput');
      const previewWrap = body.querySelector('#receiptPreview');

      zone?.addEventListener('click', () => fileInput.click());
      fileInput?.addEventListener('change', (e) => {
        if (e.target.files?.[0]) handleFile(e.target.files[0]);
      });
      zone?.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone?.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone?.addEventListener('drop', (e) => {
        e.preventDefault(); zone.classList.remove('dragover');
        if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
      });

      async function handleFile(file) {
        if (!file.type.startsWith('image/')) { Toast.error('Chỉ hỗ trợ ảnh'); return; }
        if (file.size > 8 * 1024 * 1024) { Toast.error('Ảnh tối đa 8MB'); return; }
        receiptFile = file;
        const url = URL.createObjectURL(file);
        previewWrap.innerHTML = `
          <div class="upload-preview">
            <img src="${url}" alt="preview">
            <button class="upload-remove" id="removeReceipt"><i data-lucide="x"></i></button>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons({ nodes: [previewWrap] });
        previewWrap.querySelector('#removeReceipt')?.addEventListener('click', () => {
          receiptFile = null; previewWrap.innerHTML = ''; fileInput.value = '';
        });
      }

      // Submit
      const submitBtn = body.querySelector('#submitBtcBtn');
      submitBtn?.addEventListener('click', async () => {
        const amtVnd = parseFloat(body.querySelector('#btcAmountVnd').value) || 0;
        const amtBtc = parseFloat(body.querySelector('#btcAmount').value) || 0;
        const txId = (body.querySelector('#btcTxId').value || '').trim();
        if (!txId && !receiptFile) { Toast.error('Cần cung cấp TXID hoặc ảnh chụp giao dịch'); return; }
        if (amtVnd < 10000) { Toast.error('Vui lòng nhập giá trị VND tương đương (tối thiểu 10.000₫)'); return; }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span> Đang gửi…`;
        try {
          let receipt = null;
          if (receiptFile) receipt = await uploadReceipt(receiptFile);
          await Wallet.createDepositRequest({
            user_id: State.user.id,
            code,
            amount: amtVnd,
            method: 'bitcoin',
            status: 'pending',
            bank_info: {
              network: cfg.network,
              address: cfg.address
            },
            tx_code: txId || null,
            crypto_amount: amtBtc || null,
            receipt_url: receipt?.url || null,
            receipt_path: receipt?.path || null
          });
          Toast.success('Đã gửi yêu cầu nạp Bitcoin. Admin sẽ xác minh giao dịch.');
          loadPendingRequests();
        } catch (err) {
          Toast.error(err.message || 'Gửi yêu cầu thất bại');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i data-lucide="send"></i>Gửi yêu cầu nạp`;
          if (window.lucide) window.lucide.createIcons({ nodes: [submitBtn] });
        }
      });
    }

    // Deposit hero button
    document.getElementById('walletDepositBtn')?.addEventListener('click', () => {
      const panel = document.querySelector('[data-panel="deposit"]');
      if (panel) {
        document.querySelectorAll('#walletTabs .acc-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'deposit'));
        document.querySelectorAll('#walletTabs + .acc-tab-panel, .acc-tab-panel').forEach(p => p.hidden = p.dataset.panel !== 'deposit');
      }
      const amountInput = document.getElementById('depositAmount');
      if (amountInput) amountInput.focus();
    });
  }

  const Checkout = {
    open() {

      Wallet.fetch(State.user.id).then(wallet => {
        const balance = Number(wallet?.balance) || 0;
        const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
        const enough = balance >= subtotal;

        const body = document.createElement('div');
        body.innerHTML = `
          <div class="checkout-items">
            ${items.map(i => `
              <div class="checkout-item">
                <div class="checkout-item-img">

                </div>
                <div class="checkout-item-price">${formatCurrency(i.price * i.qty)}</div>
              </div>
            `).join('')}
          </div>

          <div class="checkout-summary">
            <div class="checkout-row">
              <span>Số dư ví hiện tại</span>
              <span style="font-weight:700;color:${enough ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(balance)}</span>
            </div>
            <div class="checkout-row">
              <span>Tạm tính</span>
              <span>${formatCurrency(subtotal)}</span>
            </div>
            <div class="checkout-row total">
              <span>Tổng thanh toán</span>
              <span class="checkout-total-value">${formatCurrency(subtotal)}</span>
            </div>
          </div>

          ${!enough ? `
            <div class="checkout-balance-warn">
              <i data-lucide="alert-triangle"></i>
              <span>Số dư không đủ. Vui lòng nạp thêm <strong>${formatCurrency(subtotal - balance)}</strong> trước khi thanh toán.</span>
            </div>
          ` : ''}
        `;

        const actions = [
          { label: 'Huỷ', className: 'btn-glass', onClick: (close) => close() }
        ];
        if (enough) {
          actions.push({
            label: 'Xác nhận thanh toán',
            className: 'btn-primary',
            onClick: async (close) => {
              close();
              await this.placeOrder(items, subtotal);
            }
          });
        } else {
          actions.push({
            label: 'Nạp tiền ngay',
            className: 'btn-primary',
            onClick: (close) => { close(); location.hash = '#/wallet'; }
          });
        }

        Modal.open({
          title: 'Xác nhận thanh toán',
          content: body,
          size: 'md',
          onMount: (mountBody) => {
            if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
          },
          actions
        });
      });
    },

    async placeOrder(items, subtotal) {
      const orderCode = generateOrderCode();
      const userId = State.user.id;

      // Show processing
      const loadingToast = (() => {
        const root = document.getElementById('toastRoot');
        const node = document.createElement('div');
        node.className = 'toast toast-info show';
        node.innerHTML = `
          <span class="spinner" style="width:16px;height:16px;"></span>
          <div class="toast-msg">Đang xử lý đơn hàng…</div>
        `;
        root.appendChild(node);
        return () => node.remove();
      })();

      try {
        // Try RPC first (atomic operation — Part 9 SQL)
        try {
          const { data: rpcData, error: rpcErr } = await supabase.rpc('place_order', {
            p_items: items.map(i => ({ product_id: i.productId, qty: i.qty, unit_price: i.price })),
            p_code: orderCode,
            p_note: null
          });
          if (!rpcErr && rpcData) {
            loadingToast();
            await this._onSuccess(rpcData);
            return;
          }
          if (rpcErr) {
            console.warn('[Checkout] RPC place_order failed:', rpcErr.message);
            // Fall through to manual path
          }
        } catch (rpcEx) {
          console.warn('[Checkout] RPC exception:', rpcEx);
        }

        // Fallback: manual placement
        // 1) Insert order
        const { data: order, error: orderErr } = await supabase
          .from('orders')
          .insert({
            user_id: userId,
            code: orderCode,
            subtotal,
            total_amount: subtotal,
            status: 'pending',
            payment_status: 'paid',  // wallet deducted below
            note: null
          })
          .select()
          .maybeSingle();
        if (orderErr) throw new Error('Tạo đơn thất bại: ' + orderErr.message);
        if (!order) throw new Error('Không nhận được phản hồi tạo đơn');

        // 2) Insert items
        const orderItems = items.map(i => ({
          order_id: order.id,
          product_id: i.productId,
          product_name: i.name,
          qty: i.qty,
          unit_price: i.price,
          subtotal: i.price * i.qty
        }));
        const { error: itemsErr } = await supabase.from('order_items').insert(orderItems);
        if (itemsErr) throw new Error('Tạo chi tiết đơn thất bại: ' + itemsErr.message);

        // 3) Debit wallet
        await Wallet.adjust(userId, -subtotal, {
          type: 'purchase',
          reason: `Thanh toán đơn ${orderCode}`,
          refId: order.id
        });

        // 4) Mark order completed (basic flow — Part 7 can process async)
        await supabase.from('orders')
          .update({ status: 'completed', updated_at: new Date().toISOString() })
          .eq('id', order.id);

        loadingToast();
        await this._onSuccess({ ...order, status: 'completed' });

      } catch (err) {
        loadingToast();
        console.error('[Checkout.placeOrder]', err);
        Toast.error(err.message || 'Thanh toán thất bại');
      }
    },

    async _onSuccess(order) {
      // Clear cart
      window.LH.Cart?.clear();
      // Refresh wallet in state
      State.wallet = await Wallet.fetch(State.user.id);
      // success modal
      const body = document.createElement('div');
      body.className = 'checkout-success';
      body.innerHTML = `
        <div class="checkout-success-icon"><i data-lucide="check"></i></div>
        <div class="checkout-success-title">Đặt hàng thành công!</div>
        <div class="checkout-success-desc">
          Mã đơn: <strong style="font-family:'JetBrains Mono',monospace;">${escapeHtml(order.code || '')}</strong><br>
          Đơn hàng đang được xử lý. Bạn có thể theo dõi trong mục "Đơn hàng".
        </div>
      `;
      Modal.open({
        title: '',
        content: body,
        size: 'sm',
        onMount: (mountBody, close) => {
          const header = mountBody.parentNode.querySelector('.modal-header');
          if (header) header.style.display = 'none';
          mountBody.parentNode.style.padding = '0';
          if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });

          const actionsWrap = document.createElement('div');
          actionsWrap.style.padding = '0 24px 24px';
          actionsWrap.style.display = 'flex';
          actionsWrap.style.gap = '10px';
          actionsWrap.style.flexWrap = 'wrap';

          const viewBtn = document.createElement('a');
          viewBtn.href = '#/orders';
          viewBtn.className = 'btn btn-primary flex-1';
          viewBtn.style.textDecoration = 'none';
          viewBtn.innerHTML = `<i data-lucide="package"></i>Xem đơn hàng`;
          viewBtn.addEventListener('click', () => close());

          const closeBtn = document.createElement('button');
          closeBtn.className = 'btn btn-glass';
          closeBtn.textContent = 'Đóng';
          closeBtn.addEventListener('click', () => close());

          actionsWrap.appendChild(viewBtn);
          actionsWrap.appendChild(closeBtn);
          mountBody.parentNode.appendChild(actionsWrap);
          if (window.lucide) window.lucide.createIcons({ nodes: [actionsWrap] });
        }
      });
      Toast.success('Đặt hàng thành công');
      State.emit('order:created', order);
    }
  };
  window.LH.Checkout = Checkout;

  async function renderOrders(container, hash) {
    if (!State.user) {
      container.innerHTML = `
        <div class="empty-state anim-up">
          <div class="empty-state-icon"><i data-lucide="lock"></i></div>
          <div class="empty-state-title">Cần đăng nhập</div>

          <button class="btn btn-primary" id="ordersLoginBtn"><i data-lucide="log-in"></i>Đăng nhập</button>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });
      container.querySelector('#ordersLoginBtn').addEventListener('click', () => window.LH.Auth.openLogin());
      return;
    }

    container.innerHTML = `
      <div class="section-head anim-fade">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Đơn hàng</div>
          <div class="section-title">Đơn mua & Lịch sử</div>
          <div class="section-sub">Theo dõi trạng thái và xem chi tiết giao dịch</div>
        </div>
      </div>

      <div class="orders-filter" id="ordersFilter">
        <button class="order-filter-chip active" data-status=""><i data-lucide="list"></i>Tất cả</button>
        <button class="order-filter-chip" data-status="pending"><i data-lucide="clock"></i>Chờ xử lý</button>
        <button class="order-filter-chip" data-status="processing"><i data-lucide="loader"></i>Đang xử lý</button>
        <button class="order-filter-chip" data-status="completed"><i data-lucide="check-circle"></i>Hoàn thành</button>
        <button class="order-filter-chip" data-status="cancelled"><i data-lucide="x-circle"></i>Đã huỷ</button>
      </div>

      <div id="ordersListWrap"></div>
      <div class="wallet-pagination" id="ordersPagination"></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const filterState = { status: '', page: 0, limit: 10 };
    const listWrap = container.querySelector('#ordersListWrap');
    const pagWrap = container.querySelector('#ordersPagination');

    container.querySelectorAll('.order-filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        container.querySelectorAll('.order-filter-chip').forEach(c => c.classList.toggle('active', c === chip));
        filterState.status = chip.dataset.status || '';
        filterState.page = 0;
        loadOrders();
      });
    });

    async function loadOrders() {
      listWrap.innerHTML = `<div class="text-center" style="padding:40px;"><div class="spinner spinner-lg" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
      pagWrap.innerHTML = '';

      try {
        let query = supabase
          .from('orders')
          .select('*, order_items(*)', { count: 'exact' })
          .eq('user_id', State.user.id)
          .order('created_at', { ascending: false });
        if (filterState.status) query = query.eq('status', filterState.status);
        const from = filterState.page * filterState.limit;
        query = query.range(from, from + filterState.limit - 1);

        const { data, error, count } = await query;
        if (error) throw error;

        if (!data || !data.length) {
          listWrap.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon"><i data-lucide="package-open"></i></div>
            <div class="empty-state-title">Chưa có đơn hàng</div>
            <div class="empty-state-desc">${filterState.status ? 'Không có đơn ở trạng thái này.' : 'Bạn chưa có đơn hàng nào.'}</div>
            <a href="#/shop" class="btn btn-primary"><i data-lucide="shopping-bag"></i>Khám phá Shop</a>
          </div>`;
          if (window.lucide) window.lucide.createIcons({ nodes: [listWrap] });
          return;
        }

        // render
        const list = document.createElement('div');
        list.className = 'orders-list';
        data.forEach(o => {
          const items = o.order_items || [];
          const previewItems = items.slice(0, 4);
          const more = Math.max(0, items.length - 4);
          const totalQty = items.reduce((s, i) => s + (i.qty || 0), 0);
          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-head">
              <div>
                <div class="order-code">${escapeHtml(o.code || '#' + (o.id || '').slice(0, 8))}</div>
                <div class="caption">${formatDateTime(o.created_at)} · ${totalQty} sản phẩm</div>
              </div>
              <span class="order-status ${escapeHtml(o.status || 'pending')}">${escapeHtml(getStatusLabel(o.status))}</span>
            </div>
            <div class="order-items-preview">
              ${previewItems.map(it => `
                <div class="order-item-thumb">
                  <div style="width:100%;height:100%;display:grid;place-items:center;color:var(--text-4);">
                    <i data-lucide="package" style="width:18px;height:18px;"></i>
                  </div>
                </div>
              `).join('')}
              ${more > 0 ? `<div class="order-more-items">+${more}</div>` : ''}
            </div>
            <div class="order-foot">
              <span>${items.length} sản phẩm</span>
              <span class="order-total">${formatCurrency(o.total_amount || 0)}</span>
            </div>
          `;
          card.addEventListener('click', () => openOrderDetail(o));
          list.appendChild(card);
        });
        listWrap.innerHTML = '';
        listWrap.appendChild(list);
        if (window.lucide) window.lucide.createIcons({ nodes: [listWrap] });

        // pagination
        const totalPages = Math.ceil((count || 0) / filterState.limit);
        if (totalPages > 1) {
          let html = '';
          for (let i = 0; i < totalPages; i++) {
            html += `<button class="page-btn ${i === filterState.page ? 'active' : ''}" data-page="${i}">${i + 1}</button>`;
          }
          pagWrap.innerHTML = html;
          pagWrap.querySelectorAll('[data-page]').forEach(b => {
            b.addEventListener('click', () => {
              filterState.page = parseInt(b.dataset.page, 10);
              loadOrders();
            });
          });
        }

      } catch (err) {
        listWrap.innerHTML = `<div class="empty-state"><div class="empty-state-desc">Lỗi tải đơn: ${escapeHtml(err.message || 'unknown')}</div></div>`;
      }
    }

    function getStatusLabel(s) {
      return ({
        pending: 'Chờ xử lý',
        processing: 'Đang xử lý',
        completed: 'Hoàn thành',
        cancelled: 'Đã huỷ',
        refunded: 'Đã hoàn tiền'
      })[s] || (s || 'Chờ xử lý');
    }

    function openOrderDetail(o) {
      const items = o.order_items || [];
      const body = document.createElement('div');
      body.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="checkout-summary">
            <div class="checkout-row"><span>Mã đơn</span><span style="font-family:'JetBrains Mono',monospace;font-weight:700;">${escapeHtml(o.code || '')}</span></div>
            <div class="checkout-row"><span>Ngày đặt</span><span>${formatDateTime(o.created_at)}</span></div>
            <div class="checkout-row"><span>Trạng thái</span><span class="order-status ${escapeHtml(o.status)}">${escapeHtml(getStatusLabel(o.status))}</span></div>
            <div class="checkout-row total"><span>Tổng tiền</span><span class="checkout-total-value">${formatCurrency(o.total_amount || 0)}</span></div>
          </div>
          <div>
            <div class="h4" style="margin-bottom:8px;">Sản phẩm</div>
            <div class="checkout-items">
              ${items.map(it => `
                <div class="checkout-item">
                  <div class="checkout-item-img" style="display:grid;place-items:center;color:var(--text-4);"><i data-lucide="package" style="width:18px;height:18px;"></i></div>
                  <div class="checkout-item-body">
                    <div class="checkout-item-name">${escapeHtml(it.product_name || 'Sản phẩm')}</div>
                    <div class="checkout-item-sub">${it.qty} × ${formatCurrency(it.unit_price || 0)}</div>
                  </div>
                  <div class="checkout-item-price">${formatCurrency(it.subtotal || 0)}</div>
                </div>
              `).join('')}
            </div>
          </div>
          ${o.note ? `<div class="caption">Ghi chú: ${escapeHtml(o.note)}</div>` : ''}
        </div>
      `;
      Modal.open({
        title: 'Chi tiết đơn hàng',
        content: body,
        size: 'md',
        onMount: (b) => { if (window.lucide) window.lucide.createIcons({ nodes: [b] }); }
      });
    }

    loadOrders();
  }

  function init() {
