/* ============================================================
   FORMS HANDLING
============================================================ */
document.addEventListener("submit", function(e){
  const form = e.target;
  const type = form.dataset.form;
  if(!type) return;
  e.preventDefault();

  if(type === "contact"){
    const fd = new FormData(form);
    const name = (fd.get("name")||"").toString().trim();
    const email = (fd.get("email")||"").toString().trim();
    const phone = (fd.get("phone")||"").toString().trim();
    const message = (fd.get("message")||"").toString().trim();
    if(!name || !email || !message){ toast("Vui lòng điền đầy đủ thông tin bắt buộc","warn"); return; }
    DB.contacts.push({id:uid("ct"), name, email, phone, message, status:"new", createdAt:new Date().toISOString()});
    save();
    form.reset();
    toast("Đã gửi liên hệ. Chúng tôi sẽ phản hồi sớm nhất!","ok");
    return;
  }

  if(type === "checkout"){
    const cart = getCart();
    if(!cart.length){ toast("Giỏ hàng trống","err"); return; }
    const fd = new FormData(form);
    const name = (fd.get("name")||"").toString().trim();
    const phone = (fd.get("phone")||"").toString().trim();
    const email = (fd.get("email")||"").toString().trim();
    const note = (fd.get("note")||"").toString().trim();
    if(!name || !phone){ toast("Vui lòng nhập họ tên và số điện thoại","warn"); return; }
    const items = cart.map(c=>{
      const p = getProduct(c.id);
      return p ? {id:p.id, name:p.name, price:p.price, qty:c.qty} : null;
    }).filter(Boolean);
    const total = items.reduce((s,i)=>s + i.price*i.qty, 0);
    const code = "ORD" + Date.now().toString(36).toUpperCase().slice(-7);
    DB.orders.push({id:uid("od"), code, items, total, customer:{name,phone,email,note}, status:"pending", createdAt:new Date().toISOString()});
    save();
    setCart([]);
    openModal("Đặt hàng thành công",
      '<div style="text-align:center;padding:10px 0">' +
        '<div style="width:70px;height:70px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px">'+icon("check-circle",34)+'</div>' +
        '<h3 class="h4 mb-1">Cảm ơn bạn đã đặt hàng!</h3>' +
        '<p class="small muted mb-2">Mã đơn hàng của bạn:</p>' +
        '<div class="pill pill-primary" style="font-size:1rem;padding:9px 20px;font-family:monospace;letter-spacing:.08em">'+code+'</div>' +
        '<p class="small muted mt-3" style="line-height:1.7">Admin sẽ liên hệ với bạn qua số điện thoại <b>'+esc(phone)+'</b> để xác nhận và bàn giao sản phẩm.</p>' +
      '</div>',
      '<a href="#/shop" data-link class="btn btn-primary" data-action="closeModal">Tiếp tục mua sắm</a>'
    );
    return;
  }

  if(type === "profile"){
    const fd = new FormData(form);
    DB.profile.name = (fd.get("name")||"").toString().trim() || DB.profile.name;
    DB.profile.username = (fd.get("username")||"").toString().trim();
    DB.profile.title = (fd.get("title")||"").toString().trim();
    DB.profile.bio = (fd.get("bio")||"").toString().trim();
    DB.profile.avatar = (fd.get("avatar")||"").toString().trim();
    DB.profile.cover = (fd.get("cover")||"").toString().trim();
    DB.profile.verified = !!fd.get("verified");
    DB.profile.online = !!fd.get("online");
    if(!DB.profile.avatar) DB.profile.avatar = avatarPh(DB.profile.name[0]||"T","#6C5CE7","#FF5C8A");
    if(!DB.profile.cover) DB.profile.cover = ph(DB.profile.name,"#6C5CE7","#2E90FA");
    save();
    toast("Đã lưu hồ sơ","ok");
    return;
  }

  if(type === "profileStats"){
    const fd = new FormData(form);
    DB.profile.stats = (DB.profile.stats||[]).map((st,i)=>({
      label: (fd.get("label"+i)||st.label).toString(),
      value: (fd.get("value"+i)||st.value).toString()
    }));
    save();
    toast("Đã cập nhật thống kê","ok");
    return;
  }

  if(type === "profileSocials"){
    const fd = new FormData(form);
    DB.profile.socials = (DB.profile.socials||[]).map((s,i)=>({
      ...s,
      name: (fd.get("name"+i)||s.name).toString(),
      url: (fd.get("url"+i)||s.url).toString()
    }));
    save();
    toast("Đã lưu liên kết","ok");
    return;
  }

  if(type === "bank"){
    const fd = new FormData(form);
    const bankBin = (fd.get("bankBin")||"").toString();
    const bk = BANKS.find(b=>b.bin === bankBin);
    DB.settings.bank = {
      bankBin,
      bankName: (fd.get("bankName")||"").toString() || (bk?bk.name:"Ngân hàng"),
      accountNo: (fd.get("accountNo")||"").toString().trim(),
      accountName: (fd.get("accountName")||"").toString().trim().toUpperCase(),
      transferPrefix: (fd.get("transferPrefix")||"NLTH").toString().trim(),
      minAmount: Math.max(1000, Number(fd.get("minAmount"))||10000),
      presets: (fd.get("presets")||"").toString().split(",").map(x=>Number(x.trim())).filter(x=>x>0),
      note: (fd.get("note")||"").toString()
    };
    if(!DB.settings.bank.presets.length) DB.settings.bank.presets = [20000,50000,100000,200000,500000];
    save();
    toast("Đã lưu cấu hình ngân hàng","ok");
    return;
  }

  if(type === "appearance"){
    const fd = new FormData(form);
    DB.settings.theme.primary = (fd.get("primary")||"#6C5CE7").toString();
    DB.settings.theme.accent = (fd.get("accent")||"#FF5C8A").toString();
    DB.settings.theme.radius = Number(fd.get("radius"))||20;
    DB.settings.theme.animations = !!fd.get("animations");
    applyTheme();
    save();
    toast("Đã áp dụng giao diện mới","ok");
    return;
  }

  if(type === "brand"){
    const fd = new FormData(form);
    DB.settings.siteName = (fd.get("siteName")||"").toString().trim();
    DB.settings.siteTagline = (fd.get("siteTagline")||"").toString().trim();
    DB.settings.logo = (fd.get("logo")||"").toString().trim();
    DB.settings.favicon = (fd.get("favicon")||"").toString().trim();
    save();
    toast("Đã lưu thương hiệu","ok");
    return;
  }

  if(type === "hero"){
    const fd = new FormData(form);
    DB.settings.heroBadge = (fd.get("heroBadge")||"").toString();
    DB.settings.heroTitle = (fd.get("heroTitle")||"").toString();
    DB.settings.heroDesc = (fd.get("heroDesc")||"").toString();
    DB.settings.heroPrimaryText = (fd.get("heroPrimaryText")||"").toString();
    DB.settings.heroPrimaryLink = (fd.get("heroPrimaryLink")||"").toString();
    DB.settings.heroSecondaryText = (fd.get("heroSecondaryText")||"").toString();
    DB.settings.heroSecondaryLink = (fd.get("heroSecondaryLink")||"").toString();
    DB.settings.announce = (fd.get("announce")||"").toString();
    DB.settings.announceOn = !!fd.get("announceOn");
    save();
    toast("Đã lưu Hero","ok");
    return;
  }

  if(type === "banner"){
    const fd = new FormData(form);
    DB.settings.banner = {
      title: (fd.get("title")||"").toString(),
      desc: (fd.get("desc")||"").toString(),
      btnText: (fd.get("btnText")||"").toString(),
      btnLink: (fd.get("btnLink")||"").toString(),
      image: DB.settings.banner.image || ""
    };
    save();
    toast("Đã lưu banner","ok");
    return;
  }

  if(type === "contact"){
    const fd = new FormData(form);
    DB.settings.contact = {
      email: (fd.get("email")||"").toString(),
      hotline: (fd.get("hotline")||"").toString(),
      phone: (fd.get("phone")||"").toString(),
      address: (fd.get("address")||"").toString(),
      facebook: (fd.get("facebook")||"").toString(),
      zalo: (fd.get("zalo")||"").toString(),
      telegram: (fd.get("telegram")||"").toString(),
      youtube: DB.settings.contact.youtube || "",
      tiktok: DB.settings.contact.tiktok || "",
      workingHours: (fd.get("workingHours")||"").toString()
    };
    save();
    toast("Đã lưu thông tin liên hệ","ok");
    return;
  }

  if(type === "legal"){
    const fd = new FormData(form);
    DB.settings.terms = (fd.get("terms")||"").toString();
    DB.settings.privacy = (fd.get("privacy")||"").toString();
    save();
    toast("Đã lưu nội dung pháp lý","ok");
    return;
  }

  if(type === "product"){
    const fd = new FormData(form);
    const id = (fd.get("id")||"").toString();
    const data = {
      name: (fd.get("name")||"").toString().trim(),
      image: (fd.get("image")||"").toString().trim(),
      price: Number(fd.get("price"))||0,
      oldPrice: Number(fd.get("oldPrice"))||0,
      category: (fd.get("category")||"").toString(),
      stock: Number(fd.get("stock"))||0,
      featured: !!fd.get("featured"),
      badge: (fd.get("badge")||"").toString(),
      active: !!fd.get("active"),
      desc: (fd.get("desc")||"").toString(),
      detail: (fd.get("detail")||"").toString()
    };
    if(!data.name){ toast("Vui lòng nhập tên sản phẩm","warn"); return; }
    if(!data.image) data.image = ph(data.name, "#6C5CE7", "#FF5C8A");
    if(id){
      const idx = DB.products.findIndex(p=>p.id===id);
      if(idx>=0){ DB.products[idx] = {...DB.products[idx], ...data}; }
      toast("Đã cập nhật sản phẩm","ok");
    }else{
      DB.products.push({id:uid("p"), ...data, createdAt:new Date().toISOString()});
      toast("Đã thêm sản phẩm mới","ok");
    }
    closeModal();
    save();
    return;
  }

  if(type === "category"){
    const fd = new FormData(form);
    const id = (fd.get("id")||"").toString();
    const data = {name:(fd.get("name")||"").toString().trim(), icon:(fd.get("icon")||"package").toString()};
    if(!data.name){ toast("Nhập tên danh mục","warn"); return; }
    if(id){
      const idx = DB.categories.findIndex(c=>c.id===id);
      if(idx>=0) DB.categories[idx] = {...DB.categories[idx], ...data};
    }else{
      DB.categories.push({id:uid("c"), ...data});
    }
    closeModal(); save(); toast("Đã lưu danh mục","ok");
    return;
  }

  if(type === "post"){
    const fd = new FormData(form);
    const id = (fd.get("id")||"").toString();
    const data = {
      title: (fd.get("title")||"").toString().trim(),
      thumb: (fd.get("thumb")||"").toString().trim(),
      excerpt: (fd.get("excerpt")||"").toString(),
      content: (fd.get("content")||"").toString(),
      category: (fd.get("category")||"Khác").toString(),
      author: (fd.get("author")||DB.profile.name).toString(),
      published: !!fd.get("published"),
      featured: !!fd.get("featured")
    };
    if(!data.title){ toast("Nhập tiêu đề bài viết","warn"); return; }
    if(!data.thumb) data.thumb = ph(data.title, "#6C5CE7", "#2E90FA");
    if(id){
      const idx = DB.posts.findIndex(p=>p.id===id);
      if(idx>=0) DB.posts[idx] = {...DB.posts[idx], ...data};
      toast("Đã cập nhật bài viết","ok");
    }else{
      DB.posts.push({id:uid("b"), ...data, date:new Date().toISOString(), views:0});
      toast("Đã đăng bài viết mới","ok");
    }
    closeModal(); save();
    return;
  }

  if(type === "faq"){
    const fd = new FormData(form);
    const id = (fd.get("id")||"").toString();
    const data = {q:(fd.get("q")||"").toString().trim(), a:(fd.get("a")||"").toString().trim()};
    if(!data.q || !data.a){ toast("Nhập đầy đủ câu hỏi và câu trả lời","warn"); return; }
    if(id){
      const idx = DB.faqs.findIndex(f=>f.id===id);
      if(idx>=0) DB.faqs[idx] = {...DB.faqs[idx], ...data};
    }else{
      DB.faqs.push({id:uid("f"), ...data});
    }
    closeModal(); save(); toast("Đã lưu FAQ","ok");
    return;
  }
});

/* ============================================================
   GLOBAL CLICK DELEGATION
============================================================ */
document.addEventListener("click", function(e){
  // ripple coords
  const btn = e.target.closest(".btn");
  if(btn){
    const rect = btn.getBoundingClientRect();
    btn.style.setProperty("--mx", (e.clientX - rect.left) + "px");
    btn.style.setProperty("--my", (e.clientY - rect.top) + "px");
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;

  switch(a){
    /* ---- NAV / UI ---- */
    case "toggleTheme": {
      DB.settings.theme.mode = DB.settings.theme.mode === "dark" ? "light" : "dark";
      applyTheme(); persist();
      toast(DB.settings.theme.mode === "dark" ? "Đã bật chế độ tối" : "Đã bật chế độ sáng","ok",1600);
      break;
    }
    case "openMobileNav": $("#mobileNav").classList.add("open"); document.body.style.overflow="hidden"; break;
    case "closeMobileNav": $("#mobileNav").classList.remove("open"); document.body.style.overflow=""; break;
    case "closeModal": closeModal(); break;
    case "toggleAcc": {
      const item = el.closest(".acc-item");
      if(item) item.classList.toggle("open");
      break;
    }
    case "copy": copyText(el.dataset.text || "", el.dataset.label || ""); break;
    case "toggleFav": toggleFav(el.dataset.id); break;

    /* ---- SHOP ---- */
    case "shopCat":
      shopState.cat = el.dataset.cat || "";
      render();
      break;
    case "blogCat":
      blogState.cat = el.dataset.cat || "";
      render();
      break;
    case "addToCart": addToCart(el.dataset.id, 1); break;
    case "addToCartQty": {
      const q = Number($("#pdQty")?.textContent)||1;
      addToCart(el.dataset.id, q);
      break;
    }
    case "buyNow": {
      addToCart(el.dataset.id, Number($("#pdQty")?.textContent)||1);
      location.hash = "#/checkout";
      break;
    }
    case "pdQtyUp": {
      const p = getProduct(parseHash().id);
      const elq = $("#pdQty");
      if(elq && p){ const v = Number(elq.textContent)+1; if(v<=p.stock) elq.textContent = v; }
      break;
    }
    case "pdQtyDown": {
      const elq = $("#pdQty");
      if(elq){ const v = Math.max(1, Number(elq.textContent)-1); elq.textContent = v; }
      break;
    }

    /* ---- CART ---- */
    case "cartQty": {
      const id = el.dataset.id, d = Number(el.dataset.d);
      const cart = getCart();
      const item = cart.find(c=>c.id===id);
      if(!item) break;
      const p = getProduct(id);
      const nq = item.qty + d;
      if(nq <= 0){ setCart(cart.filter(c=>c.id!==id)); }
      else if(p && nq > p.stock){ toast("Chỉ còn " + p.stock + " sản phẩm","warn"); }
      else { item.qty = nq; setCart(cart); }
      render();
      break;
    }
    case "cartRemove": {
      const cart = getCart().filter(c=>c.id !== el.dataset.id);
      setCart(cart); render(); toast("Đã xoá sản phẩm khỏi giỏ","ok",1600);
      break;
    }
    case "clearCart":
      confirmDialog("Xoá giỏ hàng","Bạn có chắc muốn xoá toàn bộ sản phẩm khỏi giỏ hàng?", ()=>{
        setCart([]); render(); toast("Đã xoá giỏ hàng","ok",1600);
      }, "Xoá tất cả");
      break;

    /* ---- DEPOSIT ---- */
    case "depositAmount": {
      depositState.amount = Number(el.dataset.amount) || 0;
      render();
      break;
    }
    case "openQR": window.open(el.dataset.url, "_blank", "noopener"); break;
    case "downloadQR": {
      const img = $("#depositQR");
      if(!img) break;
      fetch(img.src, {mode:"cors"}).then(r=>r.blob()).then(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "vietqr-" + depositState.code + ".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 3000);
        toast("Đã tải mã QR","ok");
      }).catch(()=>{ window.open(img.src, "_blank", "noopener"); });
      break;
    }
    case "submitDeposit": {
      const b = DB.settings.bank;
      if(depositState.amount < b.minAmount){ toast("Số tiền tối thiểu là " + money(b.minAmount),"warn"); break; }
      const code = depositState.code;
      if(DB.deposits.some(d=>d.code === code && d.status === "pending")){
        toast("Yêu cầu này đã được gửi trước đó","warn"); break;
      }
      DB.deposits.push({
        id: uid("dp"), code, amount: depositState.amount,
        status: "pending", createdAt: new Date().toISOString(),
        info: b.transferPrefix + " " + code
      });
      save();
      depositState.code = generateDepositCode();
      openModal("Đã gửi yêu cầu nạp tiền",
        '<div style="text-align:center;padding:8px 0">' +
          '<div style="width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px">'+icon("check-circle",30)+'</div>' +
          '<p class="small" style="line-height:1.7">Yêu cầu nạp <b>'+money(depositState.amount || 0)+'</b> đã được ghi nhận với mã <b style="font-family:monospace">'+esc(code)+'</b>.</p>' +
          '<p class="small muted mt-2" style="line-height:1.7">Admin sẽ kiểm tra sao kê ngân hàng và duyệt thủ công. Vui lòng không tắt trang cho đến khi hoàn tất chuyển khoản.</p>' +
        '</div>',
        '<button class="btn btn-primary" data-action="closeModal">Đã hiểu</button>'
      );
      break;
    }

    /* ---- PROFILE ---- */
    case "copyProfile": {
      const p = DB.profile, c = DB.settings.contact;
      copyText(p.name + "\n" + p.username + "\n" + p.title + "\n" + c.email + "\n" + c.hotline, "thông tin hồ sơ");
      break;
    }
    case "shareProfile": {
      if(navigator.share){
        navigator.share({title:DB.profile.name, text:DB.profile.bio, url:location.href}).catch(()=>{});
      }else{
        copyText(location.href, "liên kết");
      }
      break;
    }
    case "sharePost": {
      if(navigator.share){
        const p = getPost(el.dataset.id);
        navigator.share({title:p.title, text:p.excerpt, url:location.href}).catch(()=>{});
      }else{
        copyText(location.href, "liên kết bài viết");
      }
      break;
    }

    /* ---- ADMIN AUTH ---- */
    case "adminLogout": {
      sessionStorage.removeItem(SESSION_KEY);
      toast("Đã đăng xuất","ok",1600);
      render();
      break;
    }
    case "togglePass": {
      const inp = $("#loginPass");
      if(inp) inp.type = inp.type === "password" ? "text" : "password";
      break;
    }
    case "adminNav": {
      adminSection = el.dataset.sec;
      const side = $("#adminSide");
      if(side) side.classList.remove("open");
      render();
      break;
    }
    case "setThemeMode": {
      DB.settings.theme.mode = el.dataset.mode;
      applyTheme(); persist(); render();
      break;
    }
    case "toggleSection": {
      const key = el.dataset.key;
      const sec = DB.settings.sections.find(s=>s.key===key);
      if(sec){ sec.on = el.checked; save(); }
      break;
    }
    case "moveSection": {
      const key = el.dataset.key, dir = Number(el.dataset.dir);
      const arr = DB.settings.sections;
      const i = arr.findIndex(s=>s.key===key);
      const j = i + dir;
      if(i>=0 && j>=0 && j<arr.length){
        [arr[i], arr[j]] = [arr[j], arr[i]];
        save();
      }
      break;
    }

    /* ---- ADMIN PRODUCTS ---- */
    case "newProduct": openProductModal(null); break;
    case "editProduct": openProductModal(el.dataset.id); break;
    case "deleteProduct": {
      confirmDialog("Xoá sản phẩm","Bạn có chắc muốn xoá sản phẩm này? Hành động không thể hoàn tác.", ()=>{
        DB.products = DB.products.filter(p=>p.id !== el.dataset.id);
        save(); toast("Đã xoá sản phẩm","ok",1600);
      }, "Xoá");
      break;
    }

    /* ---- ADMIN CATEGORIES ---- */
    case "newCategory": openCategoryModal(null); break;
    case "editCategory": openCategoryModal(el.dataset.id); break;
    case "deleteCategory": {
      const id = el.dataset.id;
      const used = DB.products.filter(p=>p.category===id).length;
      confirmDialog("Xoá danh mục", used ? "Danh mục này có "+used+" sản phẩm. Xoá danh mục sẽ không xoá sản phẩm nhưng sản phẩm sẽ hiển thị 'Khác'." : "Bạn có chắc muốn xoá danh mục này?", ()=>{
        DB.categories = DB.categories.filter(c=>c.id !== id);
        save(); toast("Đã xoá danh mục","ok",1600);
      }, "Xoá");
      break;
    }

    /* ---- ADMIN POSTS ---- */
    case "newPost": openPostModal(null); break;
    case "editPost": openPostModal(el.dataset.id); break;
    case "deletePost": {
      confirmDialog("Xoá bài viết","Bạn có chắc muốn xoá bài viết này?", ()=>{
        DB.posts = DB.posts.filter(p=>p.id !== el.dataset.id);
        save(); toast("Đã xoá bài viết","ok",1600);
      }, "Xoá");
      break;
    }

    /* ---- ADMIN ORDERS ---- */
    case "viewOrder": openOrderModal(el.dataset.id); break;
    case "deleteOrder": {
      confirmDialog("Xoá đơn hàng","Bạn có chắc muốn xoá đơn hàng này?", ()=>{
        DB.orders = DB.orders.filter(o=>o.id !== el.dataset.id);
        save(); toast("Đã xoá đơn hàng","ok",1600);
      }, "Xoá");
      break;
    }
    case "setOrderStatus": {
      const o = DB.orders.find(x=>x.id === el.dataset.id);
      if(o){ o.status = el.dataset.status; save(); closeModal(); toast("Đã cập nhật trạng thái đơn","ok",1600); }
      break;
    }

    /* ---- ADMIN DEPOSITS ---- */
    case "approveDeposit": {
      const d = DB.deposits.find(x=>x.id === el.dataset.id);
      if(d){ d.status = "approved"; d.reviewedAt = new Date().toISOString(); save(); toast("Đã duyệt yêu cầu nạp tiền","ok"); }
      break;
    }
    case "rejectDeposit": {
      confirmDialog("Từ chối nạp tiền","Bạn chắc chắn từ chối yêu cầu nạp tiền này?", ()=>{
        const d = DB.deposits.find(x=>x.id === el.dataset.id);
        if(d){ d.status = "rejected"; d.reviewedAt = new Date().toISOString(); save(); toast("Đã từ chối yêu cầu","ok",1600); }
      }, "Từ chối");
      break;
    }
    case "deleteDeposit": {
      DB.deposits = DB.deposits.filter(d=>d.id !== el.dataset.id);
      save(); toast("Đã xoá yêu cầu","ok",1600);
      break;
    }

    /* ---- ADMIN CONTACTS ---- */
    case "markContact": {
      const c = DB.contacts.find(x=>x.id === el.dataset.id);
      if(c){ c.status = "done"; save(); toast("Đã đánh dấu xử lý","ok",1600); }
      break;
    }
    case "deleteContact": {
      DB.contacts = DB.contacts.filter(c=>c.id !== el.dataset.id);
      save(); toast("Đã xoá liên hệ","ok",1600);
      break;
    }

    /* ---- ADMIN FAQ ---- */
    case "newFaq": openFaqModal(null); break;
    case "editFaq": openFaqModal(el.dataset.id); break;
    case "deleteFaq": {
      DB.faqs = DB.faqs.filter(f=>f.id !== el.dataset.id);
      save(); toast("Đã xoá FAQ","ok",1600);
      break;
    }

    /* ---- ADMIN REVIEWS ---- */
    case "deleteReview": {
      DB.reviews = DB.reviews.filter(r=>r.id !== el.dataset.id);
      save(); toast("Đã xoá đánh giá","ok",1600);
      break;
    }

    /* ---- DATA ---- */
    case "exportData": {
      const data = JSON.stringify(DB, null, 2);
      const blob = new Blob([data], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "backup-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      toast("Đã xuất dữ liệu JSON","ok");
      break;
    }
    case "importData": {
      const inp = $("#importFile");
      if(inp) inp.click();
      break;
    }
    case "resetData": {
      confirmDialog("Đặt lại dữ liệu","Toàn bộ dữ liệu sẽ được thay bằng dữ liệu mẫu ban đầu. Bạn có chắc?", ()=>{
        localStorage.removeItem(STORE_KEY);
        loadDB(); applyTheme(); render();
        toast("Đã đặt lại dữ liệu mẫu","ok");
      }, "Đặt lại");
      break;
    }
    case "wipeData": {
      confirmDialog("Xoá toàn bộ dữ liệu","CẢNH BÁO: Thao tác này sẽ xoá toàn bộ sản phẩm, bài viết, đơn hàng và cấu hình. Không thể hoàn tác. Tiếp tục?", ()=>{
        localStorage.removeItem(STORE_KEY);
        localStorage.removeItem(CART_KEY);
        localStorage.removeItem(FAV_KEY);
        sessionStorage.removeItem(SESSION_KEY);
        location.hash = "#/home";
        location.reload();
      }, "Xoá tất cả");
      break;
    }
  }
});

/* ============================================================

        '<div class="field"><label class="label">Tồn kho</label><input class="input" type="number" name="stock" value="'+(p?p.stock:10)+'" min="0"></div>' +
      '</div>' +
      '<div class="field"><label class="label">Nhãn nổi bật</label><select class="select-full" name="badge">' +

        '<option value="new" '+(p&&p.badge==="new"?"selected":"")+'>MỚI</option>' +

        '<button type="button" class="btn btn-ghost" data-action="closeModal">Huỷ</button>' +
        '<button type="submit" class="btn btn-primary">'+icon("save",16)+' Lưu sản phẩm</button>' +

      '<div class="field"><label class="label">Ảnh thumbnail (URL)</label><input class="input" name="thumb" value="'+(p?esc(p.thumb):"")+'" placeholder="Để trống tự tạo"></div>' +
      '<div class="field"><label class="label">Mô tả ngắn</label><textarea class="textarea" name="excerpt" style="min-height:70px">'+(p?esc(p.excerpt):"")+'</textarea></div>' +
      '<div class="field"><label class="label">Nội dung (HTML)</label><textarea class="textarea" name="content" style="min-height:180px;font-family:monospace;font-size:.8rem">'+(p?esc(p.content):"")+'</textarea></div>' +
      '<div class="flex gap-2 wrap">' +
        '<label class="checkbox"><input type="checkbox" name="published" '+(!p||p.published!==false?"checked":"")+'> Xuất bản</label>' +
        '<label class="checkbox"><input type="checkbox" name="featured" '+(p&&p.featured?"checked":"")+'> Nổi bật</label>' +
      '</div>' +
      '<div class="flex gap-1 mt-3" style="justify-content:flex-end">' +
        '<button type="button" class="btn btn-ghost" data-action="closeModal">Huỷ</button>' +
        '<button type="submit" class="btn btn-primary">'+icon("save",16)+' Lưu bài viết</button>' +

}

function openFaqModal(id){
  const f = id ? DB.faqs.find(x=>x.id===id) : null;
  openModal(f ? "Sửa FAQ" : "Thêm câu hỏi",
    '<form data-form="faq">' +
      '<input type="hidden" name="id" value="'+(f?f.id:"")+'">' +
      '<div class="field"><label class="label">Câu hỏi *</label><input class="input" name="q" value="'+(f?esc(f.q):"")+'" required></div>' +
      '<div class="field"><label class="label">Câu trả lời *</label><textarea class="textarea" name="a" required>'+(f?esc(f.a):"")+'</textarea></div>' +
      '<div class="flex gap-1 mt-2" style="justify-content:flex-end">' +

        '<button type="submit" class="btn btn-primary">'+icon("save",16)+' Lưu</button>' +

function openOrderModal(id){
  const o = DB.orders.find(x=>x.id===id);
  if(!o) return;
  const itemsHTML = o.items.map(i=>'<div class="between" style="padding:8px 0;border-bottom:1px dashed var(--border);font-size:.85rem"><span>'+esc(i.name)+' × '+i.qty+'</span><span style="font-weight:700">'+money(i.price*i.qty)+'</span></div>').join("");
  openModal("Chi tiết đơn hàng " + o.code,
    '<div style="display:grid;gap:9px;margin-bottom:16px">' +
      '<div class="bank-row"><span class="k">Mã đơn</span><span class="v" style="font-family:monospace">'+esc(o.code)+'</span></div>' +
      '<div class="bank-row"><span class="k">Khách hàng</span><span class="v">'+esc(o.customer.name)+'</span></div>' +
      '<div class="bank-row"><span class="k">Điện thoại</span><span class="v">'+esc(o.customer.phone||"—")+'</span></div>' +
      '<div class="bank-row"><span class="k">Email</span><span class="v">'+esc(o.customer.email||"—")+'</span></div>' +
      '<div class="bank-row"><span class="k">Ngày đặt</span><span class="v">'+fmtDate(o.createdAt)+'</span></div>' +
      (o.customer.note ? '<div class="bank-row"><span class="k">Ghi chú</span><span class="v">'+esc(o.customer.note)+'</span></div>' : '') +
      '<div class="bank-row"><span class="k">Trạng thái</span><span class="v">'+orderStatusPill(o.status)+'</span></div>' +
    '</div>' +
    '<h4 class="h4 mb-1">Sản phẩm</h4>' + itemsHTML +
    '<div class="summary-row total"><span>Tổng cộng</span><span>'+money(o.total)+'</span></div>' +
    '<h4 class="h4 mt-3 mb-1">Cập nhật trạng thái</h4>' +
    '<div class="flex wrap gap-1">' +
      '<button class="btn btn-sm '+(o.status==="pending"?"btn-primary":"btn-ghost")+'" data-action="setOrderStatus" data-id="'+o.id+'" data-status="pending">Chờ xử lý</button>' +
      '<button class="btn btn-sm '+(o.status==="processing"?"btn-primary":"btn-ghost")+'" data-action="setOrderStatus" data-id="'+o.id+'" data-status="processing">Đang xử lý</button>' +
      '<button class="btn btn-sm '+(o.status==="completed"?"btn-primary":"btn-ghost")+'" data-action="setOrderStatus" data-id="'+o.id+'" data-status="completed">Hoàn tất</button>' +
      '<button class="btn btn-sm '+(o.status==="cancelled"?"btn-primary":"btn-ghost")+'" data-action="setOrderStatus" data-id="'+o.id+'" data-status="cancelled">Huỷ</button>' +
    '</div>', "", {wide:true});
}

/* ============================================================
   LOGIN FORM
============================================================ */
document.addEventListener("submit", function(e){
  if(e.target.id !== "loginForm") return;
  e.preventDefault();
  const pass = ($("#loginPass")?.value || "");
  if(pass === ADMIN_PASS){
    sessionStorage.setItem(SESSION_KEY, "1");
    toast("Đăng nhập thành công","ok");
    render();
  }else{
    toast("Mật khẩu không đúng","err");
    const inp = $("#loginPass");
    if(inp){ inp.value = ""; inp.focus(); }
  }
});

/* ============================================================
   SEARCH / SORT (delegated input listeners)
============================================================ */
document.addEventListener("input", debounce(function(e){
  const t = e.target;
  if(!t) return;
  if(t.id === "shopSearch"){
    shopState.q = t.value;
    const res = $("#shopResults");
    if(res) res.innerHTML = shopResultsHTML(filteredProducts());
    observeReveal();
  }
  if(t.id === "adminProductSearch"){
    const q = t.value.toLowerCase();
    const rows = $$("#adminProductRows tr");
    rows.forEach(tr=>{
      const pid = tr.dataset.pid;
      const p = getProduct(pid);
      if(!p) return;
      tr.style.display = (p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)) ? "" : "none";
    });
  }
}, 260));

document.addEventListener("change", function(e){
  const t = e.target;
  if(!t) return;
  if(t.id === "shopSort"){
    shopState.sort = t.value;
    const res = $("#shopResults");
    if(res){ res.innerHTML = shopResultsHTML(filteredProducts()); observeReveal(); }
  }
  if(t.id === "importFile"){
    const file = t.files && t.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed || typeof parsed !== "object" || !parsed.settings) throw new Error("invalid");
        DB = deepMerge(seedDB(), parsed);
        persist();
        applyTheme();
        render();
        toast("Đã nhập dữ liệu thành công","ok");
      }catch(err){
        toast("File JSON không hợp lệ","err");
      }
    };
    reader.readAsText(file);
    t.value = "";
  }
});

/* ============================================================
   SCROLL & SYNC
============================================================ */
window.addEventListener("scroll", function(){
  const h = $("#header");
  if(h) h.classList.toggle("scrolled", window.scrollY > 8);
}, {passive:true});

window.addEventListener("hashchange", function(){
  render();
});

if(CHANNEL){
  CHANNEL.onmessage = function(ev){
    if(ev.data && ev.data.type === "sync"){
      // Reload from storage so admin changes reflect instantly in other tabs
      try{
        const raw = localStorage.getItem(STORE_KEY);
        if(raw){ DB = deepMerge(seedDB(), JSON.parse(raw)); applyTheme(); render(); }
      }catch(e){}
    }
  };
}
window.addEventListener("storage", function(e){
  if(e.key === STORE_KEY && e.newValue){
    try{ DB = deepMerge(seedDB(), JSON.parse(e.newValue)); applyTheme(); render(); }catch(err){}
  }
});

/* ============================================================
   BOOT
============================================================ */
(function init(){
  loadDB();
  applyTheme();
  if(!location.hash) location.hash = "#/home";
  render();
  updateCartBadge();
  // preload: mark all reveals visible after 1.5s as fallback
  setTimeout(()=>{ $$(".reveal:not(.in)").forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < window.innerHeight) el.classList.add("in");
  }); }, 400);
  console.log("%c Nguyễn Lê Thảo — Digital Store ", "background:linear-gradient(135deg,#6C5CE7,#FF5C8A);color:#fff;font-weight:800;padding:6px 14px;border-radius:8px;font-size:13px");
  console.log("%cAdmin: #/admin", "color:#6C5CE7;font-weight:700");
})();
</script>
