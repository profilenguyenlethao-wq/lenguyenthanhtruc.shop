</style>

<script>
/* ============================================================
   PART 3 — VIEWS: HOME, SHOP, SERVICES · COMPONENTS · DATA
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, el, store, CONFIG,
    formatCurrency, escapeHtml, initials, Toast, Modal
  } = window.LH;

  /* ==========================================================
     3.1 LH.Data — core query layer (extended by Part 9)
     ========================================================== */
  const Data = {
    async getOwnerProfile() {
      if (!supabase) return null;
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('is_owner', true)
          .limit(1)
          .maybeSingle();
        if (error) { console.warn('[Data.getOwnerProfile]', error.message); return null; }
        return data;
      } catch (e) { console.warn('[Data.getOwnerProfile]', e); return null; }
    },

    async getCategories() {
      if (!supabase) return [];
      try {
        const { data, error } = await supabase
          .from('categories')
          .select('*')
          .order('sort_order', { ascending: true })
          .order('name', { ascending: true });
        if (error) { console.warn('[Data.getCategories]', error.message); return []; }
        return data || [];
      } catch { return []; }
    },

    async getProducts(opts = {}) {
      if (!supabase) return { items: [], total: 0 };
      const {
        categoryId = null,
        search = '',
        minPrice = null,
        maxPrice = null,
        sort = 'newest',
        page = 0,
        limit = CONFIG.PAGINATION_SIZE,
        featuredOnly = false,
        onSaleOnly = false
      } = opts;

      try {
        let q = supabase.from('products').select('*', { count: 'exact' }).eq('is_visible', true);
        if (categoryId) q = q.eq('category_id', categoryId);
        if (featuredOnly) q = q.eq('is_featured', true);
        if (onSaleOnly) q = q.not('sale_price', 'is', null);
        if (minPrice != null) q = q.gte('price', minPrice);
        if (maxPrice != null) q = q.lte('price', maxPrice);
        if (search) q = q.ilike('name', `%${search}%`);

        switch (sort) {
          case 'price_asc':  q = q.order('price', { ascending: true }); break;
          case 'price_desc': q = q.order('price', { ascending: false }); break;
          case 'oldest':     q = q.order('created_at', { ascending: true }); break;
          case 'name_asc':   q = q.order('name', { ascending: true }); break;
          case 'newest':
          default:           q = q.order('created_at', { ascending: false }); break;
        }

        const from = page * limit;
        q = q.range(from, from + limit - 1);

        const { data, error, count } = await q;
        if (error) { console.warn('[Data.getProducts]', error.message); return { items: [], total: 0 }; }
        return { items: data || [], total: count || 0 };
      } catch (e) {
        console.warn('[Data.getProducts]', e);
        return { items: [], total: 0 };
      }
    },

    async getServices(opts = {}) {
      if (!supabase) return { items: [], total: 0 };
      const { categoryId = null, search = '', sort = 'newest', page = 0, limit = 24, featuredOnly = false } = opts;
      try {
        let q = supabase.from('services').select('*', { count: 'exact' }).eq('is_visible', true);
        if (categoryId) q = q.eq('category_id', categoryId);
        if (featuredOnly) q = q.eq('is_featured', true);
        if (search) q = q.ilike('name', `%${search}%`);
        switch (sort) {
          case 'price_asc': q = q.order('price', { ascending: true }); break;
          case 'price_desc': q = q.order('price', { ascending: false }); break;
          default: q = q.order('created_at', { ascending: false });
        }
        const from = page * limit;
        q = q.range(from, from + limit - 1);
        const { data, error, count } = await q;
        if (error) { console.warn('[Data.getServices]', error.message); return { items: [], total: 0 }; }
        return { items: data || [], total: count || 0 };
      } catch (e) {
        console.warn('[Data.getServices]', e);
        return { items: [], total: 0 };
      }
    },

    async getPublicStats() {
      // Best-effort, ignores errors
      if (!supabase) return { users: 0, orders: 0, products: 0 };
      try {
        const [usersQ, ordersQ, productsQ] = await Promise.all([
          supabase.from('profiles').select('id', { count: 'exact', head: true }),
          supabase.from('orders').select('id', { count: 'exact', head: true }),
          supabase.from('products').select('id', { count: 'exact', head: true }).eq('is_visible', true)
        ]);
        return {
          users: usersQ.count || 0,
          orders: ordersQ.count || 0,
          products: productsQ.count || 0
        };
      } catch { return { users: 0, orders: 0, products: 0 }; }
    }
  };
  window.LH.Data = window.LH.Data || {};
  Object.assign(window.LH.Data, Data);

  /* ==========================================================
     3.2 Helpers — product image, price, stock display
     ========================================================== */
  function getProductImage(p) {
    if (!p) return '';
    if (p.thumbnail_url) return p.thumbnail_url;
    if (Array.isArray(p.images) && p.images.length) {
      const first = p.images[0];
      if (typeof first === 'string') return first;
      if (first && first.url) return first.url;
    }
    if (p.image_url) return p.image_url;
    return '';
  }

  function getDisplayPrice(p) {
    const sale = p.sale_price != null ? Number(p.sale_price) : null;
    const base = Number(p.price) || 0;
    if (sale != null && sale > 0 && sale < base) {
      return { current: sale, original: base, hasSale: true };
    }
    return { current: base, original: null, hasSale: false };
  }

  function getStockInfo(p) {
    if (p.in_stock === false || p.stock === 0) return { cls: 'out', label: 'Hết hàng' };
    if (typeof p.stock === 'number' && p.stock > 0 && p.stock <= 5) {
      return { cls: 'low', label: `Còn ${p.stock}` };
    }
    return { cls: '', label: 'Còn hàng' };
  }

  function formatSoldOrViews(n) {
    const num = Number(n) || 0;
    if (num >= 1000000) return (num / 1000000).toFixed(1).replace('.0','') + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1).replace('.0','') + 'k';
    return String(num);
  }

  /* ==========================================================
     3.3 Component — ProductCard
     ========================================================== */
  function ProductCard(p) {
    const card = el('div', { class: 'pcard', 'data-product-id': p.id || '' });
    const img = getProductImage(p);
    const price = getDisplayPrice(p);
    const stock = getStockInfo(p);
    const catName = p._category_name || p.category_name || '';

    // badges
    const badges = [];
    if (price.hasSale) {
      const pct = Math.round((1 - price.current / price.original) * 100);
      badges.push(`<span class="pbadge sale">-${pct}%</span>`);
    }
    if (p.is_featured) badges.push(`<span class="pbadge featured">Nổi bật</span>`);
    if (p.is_new) badges.push(`<span class="pbadge new">Mới</span>`);

    card.innerHTML = `
      <div class="pcard-media">
        ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.name || '')}" loading="lazy" decoding="async">`
              : `<div class="pcard-placeholder"><i data-lucide="image-off"></i></div>`}
        <div class="pcard-badges">${badges.join('')}</div>
        <button class="pcard-wish" aria-label="Yêu thích"><i data-lucide="heart"></i></button>
      </div>
      <div class="pcard-body">
        ${catName ? `<div class="pcard-cat">${escapeHtml(catName)}</div>` : ''}
        <div class="pcard-name">${escapeHtml(p.name || 'Sản phẩm')}</div>
        ${p.short_desc ? `<div class="pcard-desc">${escapeHtml(p.short_desc)}</div>` : ''}
        <div class="pcard-price-row">
          <span class="pcard-price">${formatCurrency(price.current)}</span>
          ${price.hasSale ? `<span class="pcard-price-old">${formatCurrency(price.original)}</span>` : ''}
        </div>
        <div class="pcard-foot">
          <span class="pcard-stock ${stock.cls}">
            <i data-lucide="${stock.cls === 'out' ? 'x-circle' : stock.cls === 'low' ? 'alert-circle' : 'check-circle'}"></i>
            ${escapeHtml(stock.label)}
          </span>
          <button class="pcard-buy" aria-label="Xem sản phẩm"><i data-lucide="arrow-right"></i></button>
        </div>
      </div>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('.pcard-wish')) {
        e.stopPropagation();
        toggleWish(p, card);
        return;
      }
      openProductDetail(p);
    });

    return card;
  }

  function toggleWish(p, card) {
    const btn = card.querySelector('.pcard-wish');
    if (!btn) return;
    btn.classList.toggle('active');
    const isActive = btn.classList.contains('active');
    btn.innerHTML = `<i data-lucide="${isActive ? 'heart-filled' : 'heart'}" style="${isActive ? 'fill:currentColor;' : ''}"></i>`;
    if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
    // Persist locally
    try {
      const list = store.get('lh_wishlist', []) || [];
      const idx = list.indexOf(p.id);
      if (isActive && idx === -1) list.push(p.id);
      if (!isActive && idx !== -1) list.splice(idx, 1);
      store.set('lh_wishlist', list);
    } catch {}
    Toast.success(isActive ? 'Đã thêm vào yêu thích' : 'Đã bỏ yêu thích', 1500);
  }

  function openProductDetail(p) {
    if (!p || !p.id) { Toast.info('Chi tiết sản phẩm sẽ mở ở Phần 4.'); return; }
    location.hash = `#/product?id=${encodeURIComponent(p.id)}`;
  }

  /* ==========================================================
     3.4 Component — ServiceCard
     ========================================================== */
  function ServiceCard(s) {
    const card = el('div', { class: 'scard', 'data-service-id': s.id || '' });
    const price = getDisplayPrice(s);
    const iconUrl = s.icon_url || s.thumbnail_url || '';
    const desc = s.short_desc || s.description || '';
    const timeText = s.delivery_time ? `~${s.delivery_time}` : '';

    card.innerHTML = `
      <div class="scard-icon">
        ${iconUrl ? `<img src="${escapeHtml(iconUrl)}" alt="">` : `<i data-lucide="${escapeHtml(s.icon || 'briefcase')}"></i>`}
      </div>
      <div class="scard-body">
        <div class="scard-name">${escapeHtml(s.name || 'Dịch vụ')}</div>
        ${desc ? `<div class="scard-desc">${escapeHtml(desc)}</div>` : ''}
        <div class="scard-meta">
          ${price.current > 0 ? `<span class="scard-price">${formatCurrency(price.current)}</span>` : '<span class="scard-badge">Liên hệ</span>'}
          ${timeText ? `<span class="scard-time"><i data-lucide="clock"></i>${escapeHtml(timeText)}</span>` : ''}
        </div>
      </div>
    `;
    card.addEventListener('click', () => {
      Toast.info('Chi tiết dịch vụ sẽ mở ở Phần 4.');
    });
    return card;
  }

  /* ==========================================================
     3.5 Component — CategoryChips
     ========================================================== */
  function renderCategoryChips(container, categories, activeId, onPick, opts = {}) {
    if (!container) return;
    const { allowAll = true, showCounts = false } = opts;
    const chips = [];
    if (allowAll) {
      chips.push({ id: null, name: 'Tất cả', icon: 'grid', count: opts.total });
    }
    categories.forEach(c => chips.push({
      id: c.id,
      name: c.name,
      icon: c.icon || 'tag',
      count: showCounts ? c.count : null
    }));

    container.innerHTML = chips.map(c => `
      <button class="cat-chip ${(activeId === c.id) || (activeId == null && c.id == null) ? 'active' : ''}" data-cat-id="${c.id || ''}">
        <i data-lucide="${escapeHtml(c.icon)}"></i>
        <span>${escapeHtml(c.name)}</span>
        ${c.count != null ? `<span class="cat-chip-count">${c.count}</span>` : ''}
      </button>
    `).join('');

    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    container.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.catId || null;
        container.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        if (typeof onPick === 'function') onPick(id);
      });
    });
  }

  /* ==========================================================
     3.6 Component — ProfileHero
     ========================================================== */
  function ProfileHero(profile, stats) {
    const wrap = el('div', { class: 'profile-hero anim-up' });
    const p = profile || {};
    const displayName = p.display_name || p.username || 'Liquid Hub';
    const avatar = p.avatar_url || '';
    const cover = p.cover_url || '';
    const isOnline = p.status === 'online' || p.is_online === true;
    const socials = [];
    if (p.zalo) socials.push({ key: 'zalo', icon: 'message-circle', label: 'Zalo', href: `https://zalo.me/${escapeHtml(String(p.zalo).replace(/[^\d]/g,''))}` });
    if (p.facebook) socials.push({ key: 'facebook', icon: 'facebook', label: 'Facebook', href: ensureProtocol(p.facebook, 'https://facebook.com/') });
    if (p.tiktok) socials.push({ key: 'tiktok', icon: 'music-2', label: 'TikTok', href: ensureProtocol(p.tiktok, 'https://tiktok.com/@') });
    if (p.telegram) socials.push({ key: 'telegram', icon: 'send', label: 'Telegram', href: ensureProtocol(p.telegram, 'https://t.me/') });
    if (p.website) socials.push({ key: 'website', icon: 'globe', label: 'Website', href: ensureProtocol(p.website, '') });
    if (p.contact_email) socials.push({ key: 'email', icon: 'mail', label: 'Email', href: `mailto:${escapeHtml(p.contact_email)}` });

    const statItems = [
      { icon: 'users', value: formatSoldOrViews(stats?.users ?? p.stat_customers ?? 0), label: 'Khách hàng' },
      { icon: 'package', value: formatSoldOrViews(stats?.orders ?? p.stat_orders ?? 0), label: 'Đơn hàng' },
      { icon: 'star', value: formatSoldOrViews(stats?.products ?? p.stat_rating ?? 0), label: 'Sản phẩm' },
      { icon: 'clock', value: p.experience_years ? p.experience_years + ' năm' : '5+ năm', label: 'Kinh nghiệm' }
    ];

    wrap.innerHTML = `
      <div class="profile-cover">
        ${cover ? `<img src="${escapeHtml(cover)}" alt="Cover">` : `<div class="profile-cover-pattern"></div>`}
      </div>
      <div class="profile-body">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar">
            ${avatar ? `<img src="${escapeHtml(avatar)}" alt="${escapeHtml(displayName)}">` : escapeHtml(initials(displayName))}
          </div>
          <div class="status-dot ${isOnline ? 'online' : ''}" aria-label="${isOnline ? 'Đang hoạt động' : 'Ngoại tuyến'}"></div>
        </div>
        <div class="profile-name">
          ${escapeHtml(displayName)}
          ${p.is_verified ? `<i data-lucide="badge-check" class="verified-badge"></i>` : ''}
        </div>
        ${p.username ? `<div class="profile-username">@${escapeHtml(p.username)}</div>` : ''}
        ${p.title ? `<div class="profile-title"><i data-lucide="briefcase"></i>${escapeHtml(p.title)}</div>` : ''}
        ${p.bio ? `<div class="profile-bio">${escapeHtml(p.bio)}</div>` : ''}
        ${socials.length ? `
          <div class="profile-socials">
            ${socials.map(s => `
              <a href="${escapeHtml(s.href)}" target="_blank" rel="noopener noreferrer" class="social-btn ${s.key}">
                <i data-lucide="${s.icon}"></i>
                <span>${escapeHtml(s.label)}</span>
              </a>
            `).join('')}
          </div>
        ` : ''}
        <div class="profile-stats">
          ${statItems.map(it => `
            <div class="pstat">
              <div class="pstat-icon"><i data-lucide="${it.icon}"></i></div>
              <div class="pstat-value">${escapeHtml(String(it.value))}</div>
              <div class="pstat-label">${escapeHtml(it.label)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    return wrap;
  }

  function ensureProtocol(v, prefix) {
    const s = String(v || '').trim();
    if (!s) return '#';
    if (/^https?:\/\//i.test(s)) return s;
    if (prefix) return prefix + s;
    return 'https://' + s;
  }

  /* ==========================================================
     3.7 Component — HeroBanner
     ========================================================== */
  function HeroBanner(custom) {
    const c = custom || {};
    const eyebrow = c.eyebrow || 'Liquid Hub Premium';
    const title = c.title || 'Nền tảng sản phẩm số & dịch vụ MMO hàng đầu';
    const desc = c.desc || 'Tài khoản game, tài nguyên số, dịch vụ MMO chất lượng cao — bảo mật, nhanh chóng, uy tín.';
    const primary = c.primary || { label: 'Khám phá Shop', href: '#/shop', icon: 'shopping-bag' };
    const secondary = c.secondary || { label: 'Xem dịch vụ', href: '#/services', icon: 'briefcase' };

    const wrap = el('div', { class: 'hero-banner anim-up' });
    wrap.innerHTML = `
      <div class="hero-content">
        <div class="hero-eyebrow"><i data-lucide="sparkles"></i>${escapeHtml(eyebrow)}</div>
        <h1 class="hero-title">${escapeHtml(title)}</h1>
        <p class="hero-desc">${escapeHtml(desc)}</p>
        <div class="hero-actions">
          <a href="${escapeHtml(primary.href)}" class="hero-btn"><i data-lucide="${escapeHtml(primary.icon)}"></i>${escapeHtml(primary.label)}</a>
          <a href="${escapeHtml(secondary.href)}" class="hero-btn outline"><i data-lucide="${escapeHtml(secondary.icon)}"></i>${escapeHtml(secondary.label)}</a>
        </div>
      </div>
    `;
    return wrap;
  }

  /* ==========================================================
     3.8 Component — TrustStrip
     ========================================================== */
  function TrustStrip() {
    const items = [
      { icon: 'shield-check', title: 'Bảo mật', desc: 'Giao dịch an toàn 100%' },
      { icon: 'zap', title: 'Nhanh chóng', desc: 'Xử lý trong vài phút' },
      { icon: 'headphones', title: 'Hỗ trợ 24/7', desc: 'Luôn sẵn sàng giúp đỡ' },
      { icon: 'badge-check', title: 'Uy tín', desc: 'Được tin dùng hàng đầu' }
    ];
    const wrap = el('div', { class: 'trust-strip' });
    wrap.innerHTML = items.map(it => `
      <div class="trust-item">
        <div class="trust-icon"><i data-lucide="${it.icon}"></i></div>
        <div class="trust-title">${it.title}</div>
        <div class="trust-desc">${it.desc}</div>
      </div>
    `).join('');
    return wrap;
  }

  /* ==========================================================
     3.9 Component — EmptyState
     ========================================================== */
  function EmptyState({ icon = 'inbox', title = 'Không có dữ liệu', desc = '', action = null }) {
    const wrap = el('div', { class: 'empty-state anim-fade' });
    wrap.innerHTML = `
      <div class="empty-state-icon"><i data-lucide="${escapeHtml(icon)}"></i></div>
      <div class="empty-state-title">${escapeHtml(title)}</div>
      ${desc ? `<div class="empty-state-desc">${escapeHtml(desc)}</div>` : ''}
      ${action ? `<button class="btn btn-primary" data-empty-action><i data-lucide="${escapeHtml(action.icon || 'arrow-right')}"></i>${escapeHtml(action.label)}</button>` : ''}
    `;
    if (action && action.onClick) {
      wrap.querySelector('[data-empty-action]')?.addEventListener('click', action.onClick);
    }
    return wrap;
  }

  /* ==========================================================
     3.10 Component — SkeletonProductGrid
     ========================================================== */
  function SkeletonProductGrid(count = 8) {
    const grid = el('div', { class: 'product-grid' });
    for (let i = 0; i < count; i++) {
      const sk = el('div', { class: 'pcard', style: 'pointer-events:none;' });
      sk.innerHTML = `
        <div class="pcard-media skeleton"></div>
        <div class="pcard-body">
          <div class="skeleton skeleton-text" style="width:40%;"></div>
          <div class="skeleton skeleton-text" style="width:90%;height:14px;"></div>
          <div class="skeleton skeleton-text" style="width:60%;height:14px;"></div>
          <div class="skeleton skeleton-text" style="width:50%;height:18px;margin-top:8px;"></div>
        </div>
      `;
      grid.appendChild(sk);
    }
    return grid;
  }

  /* ==========================================================
     3.11 View — HOME
     ========================================================== */
  async function renderHome(container) {
    container.innerHTML = '';
    const frag = document.createDocumentFragment();

    // Hero
    frag.appendChild(HeroBanner());

    // Profile section wrapper
    const profileSection = el('section', { class: 'section' });
    profileSection.appendChild(el('div', { class: 'skeleton', style: 'height:260px;border-radius:28px;' }));
    frag.appendChild(profileSection);

    // Featured products section (placeholder)
    const featuredSection = el('section', { class: 'section' });
    featuredSection.innerHTML = `
      <div class="section-head">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Nổi bật</div>
          <div class="section-title">Sản phẩm đang hot</div>
          <div class="section-sub">Những sản phẩm được yêu thích nhất</div>
        </div>
        <a href="#/shop" class="section-action">Xem tất cả <i data-lucide="arrow-right"></i></a>
      </div>
    `;
    featuredSection.appendChild(SkeletonProductGrid(4));
    frag.appendChild(featuredSection);

    // Services section placeholder
    const servicesSection = el('section', { class: 'section' });
    servicesSection.innerHTML = `
      <div class="section-head">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Dịch vụ</div>
          <div class="section-title">Dịch vụ chuyên nghiệp</div>
          <div class="section-sub">Đa dạng dịch vụ MMO & Digital</div>
        </div>
        <a href="#/services" class="section-action">Xem tất cả <i data-lucide="arrow-right"></i></a>
      </div>
    `;
    const svcGrid = el('div', { class: 'service-grid' });
    for (let i = 0; i < 3; i++) {
      const s = el('div', { class: 'scard skeleton', style: 'height:120px;' });
      svcGrid.appendChild(s);
    }
    servicesSection.appendChild(svcGrid);
    frag.appendChild(servicesSection);

    // Trust strip
    frag.appendChild(TrustStrip());

    container.appendChild(frag);
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // ---- Load real data ----
    const [ownerProfile, stats, featuredProducts, featuredServices] = await Promise.all([
      Data.getOwnerProfile(),
      Data.getPublicStats(),
      Data.getProducts({ featuredOnly: true, limit: 8 }),
      Data.getServices({ featuredOnly: true, limit: 6 })
    ]);

    // Replace profile section
    profileSection.innerHTML = '';
    profileSection.appendChild(ProfileHero(ownerProfile, stats));

    // Replace featured products
    const fGrid = featuredSection.querySelector('.product-grid');
    if (fGrid) {
      const newGrid = el('div', { class: 'product-grid' });
      if (featuredProducts.items.length) {
        featuredProducts.items.forEach(p => newGrid.appendChild(ProductCard(p)));
      } else {
        // Fallback: use non-featured latest
        const fallback = await Data.getProducts({ limit: 8 });
        if (fallback.items.length) {
          fallback.items.forEach(p => newGrid.appendChild(ProductCard(p)));
        } else {
          newGrid.replaceWith(EmptyState({
            icon: 'package-open',
            title: 'Chưa có sản phẩm',
            desc: 'Sản phẩm sẽ xuất hiện ở đây khi quản trị viên thêm vào.',
            action: { label: 'Xem Shop', icon: 'shopping-bag', onClick: () => location.hash = '#/shop' }
          }));
        }
      }
      if (fGrid.parentNode) fGrid.parentNode.replaceChild(newGrid, fGrid);
    }

    // Replace services grid
    const oldSvcGrid = servicesSection.querySelector('.service-grid');
    if (oldSvcGrid) {
      const newSvc = el('div', { class: 'service-grid' });
      const items = featuredServices.items.length ? featuredServices.items : (await Data.getServices({ limit: 6 })).items;
      if (items.length) {
        items.slice(0, 6).forEach(s => newSvc.appendChild(ServiceCard(s)));
      } else {
        newSvc.replaceWith(EmptyState({
          icon: 'briefcase',
          title: 'Chưa có dịch vụ',
          desc: 'Dịch vụ sẽ hiển thị khi được thêm vào hệ thống.'
        }));
      }
      if (oldSvcGrid.parentNode) oldSvcGrid.parentNode.replaceChild(newSvc, oldSvcGrid);
    }

    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
  }

  /* ==========================================================
     3.12 View — SHOP
     ========================================================== */
  async function renderShop(container, hash) {
    container.innerHTML = `
      <div class="section-head anim-fade">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Cửa hàng</div>
          <div class="section-title">Sản phẩm số & dịch vụ</div>
          <div class="section-sub">Chọn lọc kỹ càng, giao dịch an toàn</div>
        </div>
      </div>

      <div class="shop-toolbar">
        <div class="shop-search-wrap">
          <i data-lucide="search" class="search-icon"></i>
          <input type="search" class="input" id="shopSearch" placeholder="Tìm sản phẩm…" autocomplete="off">
        </div>
        <div class="shop-sort">
          <select class="select" id="shopSort" aria-label="Sắp xếp">
            <option value="newest">Mới nhất</option>
            <option value="oldest">Cũ nhất</option>
            <option value="price_asc">Giá tăng dần</option>
            <option value="price_desc">Giá giảm dần</option>
            <option value="name_asc">Tên A → Z</option>
          </select>
        </div>
      </div>

      <div class="cat-scroll" id="shopCats"></div>

      <div class="shop-filters">
        <button class="filter-pill" data-filter="featured">
          <i data-lucide="star"></i> Nổi bật
        </button>
        <button class="filter-pill" data-filter="sale">
          <i data-lucide="tag"></i> Khuyến mãi
        </button>
        <div class="price-range-row" style="margin-left:auto;">
          <input type="number" class="input" id="priceMin" placeholder="Giá từ" style="width:100px;" min="0">
          <span class="caption">—</span>
          <input type="number" class="input" id="priceMax" placeholder="Đến" style="width:100px;" min="0">
          <button class="btn btn-glass btn-sm" id="applyPriceBtn">Áp dụng</button>
        </div>
      </div>

      <div id="shopResults"></div>
      <div id="shopPagination"></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // state
    const S = {
      page: 0,
      limit: CONFIG.PAGINATION_SIZE,
      categoryId: null,
      search: '',
      sort: 'newest',
      featuredOnly: false,
      onSaleOnly: false,
      minPrice: null,
      maxPrice: null
    };

    const resultsEl = container.querySelector('#shopResults');
    const pagEl = container.querySelector('#shopPagination');
    const catsEl = container.querySelector('#shopCats');

    // load categories
    const categories = await Data.getCategories();
    renderCategoryChips(catsEl, categories, null, (id) => {
      S.categoryId = id;
      S.page = 0;
      load();
    });

    async function load() {
      resultsEl.innerHTML = '';
      resultsEl.appendChild(SkeletonProductGrid(S.limit > 8 ? 8 : S.limit));

      const { items, total } = await Data.getProducts({
        categoryId: S.categoryId,
        search: S.search,
        sort: S.sort,
        page: S.page,
        limit: S.limit,
        featuredOnly: S.featuredOnly,
        onSaleOnly: S.onSaleOnly,
        minPrice: S.minPrice,
        maxPrice: S.maxPrice
      });

      resultsEl.innerHTML = '';

      if (!items.length) {
        resultsEl.appendChild(EmptyState({
          icon: 'package-search',
          title: 'Không tìm thấy sản phẩm',
          desc: 'Thử đổi danh mục, từ khoá hoặc bộ lọc khác.',
          action: { label: 'Xoá bộ lọc', icon: 'x', onClick: () => resetFilters() }
        }));
        if (window.lucide) window.lucide.createIcons({ nodes: [resultsEl] });
        pagEl.innerHTML = '';
        return;
      }

      // enrich with category names
      const catMap = new Map(categories.map(c => [c.id, c.name]));
      items.forEach(p => { p._category_name = catMap.get(p.category_id) || ''; });

      const grid = el('div', { class: 'product-grid' });
      items.forEach(p => grid.appendChild(ProductCard(p)));
      resultsEl.appendChild(grid);
      if (window.lucide) window.lucide.createIcons({ nodes: [resultsEl] });

      // pagination
      renderPagination(total);
    }

    function renderPagination(total) {
      const totalPages = Math.ceil(total / S.limit);
      if (totalPages <= 1) { pagEl.innerHTML = ''; return; }

      const maxVisible = 5;
      let startPage = Math.max(0, S.page - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages - 1, startPage + maxVisible - 1);
      if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(0, endPage - maxVisible + 1);
      }

      let html = `<div class="pagination">`;
      html += `<button class="page-btn" ${S.page === 0 ? 'disabled' : ''} data-page="${S.page - 1}"><i data-lucide="chevron-left"></i></button>`;
      if (startPage > 0) {
        html += `<button class="page-btn" data-page="0">1</button>`;
        if (startPage > 1) html += `<span style="padding:0 4px;color:var(--text-4);">…</span>`;
      }
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === S.page ? 'active' : ''}" data-page="${i}">${i + 1}</button>`;
      }
      if (endPage < totalPages - 1) {
        if (endPage < totalPages - 2) html += `<span style="padding:0 4px;color:var(--text-4);">…</span>`;
        html += `<button class="page-btn" data-page="${totalPages - 1}">${totalPages}</button>`;
      }
      html += `<button class="page-btn" ${S.page === totalPages - 1 ? 'disabled' : ''} data-page="${S.page + 1}"><i data-lucide="chevron-right"></i></button>`;
      html += `</div>`;

      pagEl.innerHTML = html;
      if (window.lucide) window.lucide.createIcons({ nodes: [pagEl] });
      pagEl.querySelectorAll('[data-page]').forEach(b => {
        b.addEventListener('click', () => {
          const p = parseInt(b.dataset.page, 10);
          if (p >= 0 && p !== S.page) {
            S.page = p;
            load();
            window.scrollTo({ top: 0, behavior: State.reducedMotion ? 'auto' : 'smooth' });
          }
        });
      });
    }

    function resetFilters() {
      S.categoryId = null;
      S.search = '';
      S.sort = 'newest';
      S.featuredOnly = false;
      S.onSaleOnly = false;
      S.minPrice = null;
      S.maxPrice = null;
      S.page = 0;
      container.querySelector('#shopSearch').value = '';
      container.querySelector('#shopSort').value = 'newest';
      container.querySelector('#priceMin').value = '';
      container.querySelector('#priceMax').value = '';
      catsEl.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      const allChip = catsEl.querySelector('[data-cat-id=""]');
      if (allChip) allChip.classList.add('active');
      container.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      load();
    }

    // bind events
    const searchInput = container.querySelector('#shopSearch');
    searchInput.addEventListener('input', window.LH.debounce((e) => {
      S.search = e.target.value.trim();
      S.page = 0;
      load();
    }, 320));

    container.querySelector('#shopSort').addEventListener('change', (e) => {
      S.sort = e.target.value;
      S.page = 0;
      load();
    });

    container.querySelectorAll('.filter-pill[data-filter]').forEach(pill => {
      pill.addEventListener('click', () => {
        const kind = pill.dataset.filter;
        if (kind === 'featured') {
          S.featuredOnly = !S.featuredOnly;
          pill.classList.toggle('active', S.featuredOnly);
        } else if (kind === 'sale') {
          S.onSaleOnly = !S.onSaleOnly;
          pill.classList.toggle('active', S.onSaleOnly);
        }
        S.page = 0;
        load();
      });
    });

    container.querySelector('#applyPriceBtn').addEventListener('click', () => {
      const min = parseInt(container.querySelector('#priceMin').value, 10);
      const max = parseInt(container.querySelector('#priceMax').value, 10);
      S.minPrice = isFinite(min) && min >= 0 ? min : null;
      S.maxPrice = isFinite(max) && max >= 0 ? max : null;
      S.page = 0;
      load();
    });

    load();
  }

  /* ==========================================================
     3.13 View — SERVICES
     ========================================================== */
  async function renderServices(container, hash) {
    container.innerHTML = `
      <div class="section-head anim-fade">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Dịch vụ MMO</div>
          <div class="section-title">Dịch vụ chuyên nghiệp</div>
          <div class="section-sub">Tư vấn, xử lý nhanh chóng, bảo mật tuyệt đối</div>
        </div>
      </div>

      <div class="shop-toolbar">
        <div class="shop-search-wrap">
          <i data-lucide="search" class="search-icon"></i>
          <input type="search" class="input" id="svcSearch" placeholder="Tìm dịch vụ…" autocomplete="off">
        </div>
        <div class="shop-sort">
          <select class="select" id="svcSort" aria-label="Sắp xếp">
            <option value="newest">Mới nhất</option>
            <option value="price_asc">Giá tăng dần</option>
            <option value="price_desc">Giá giảm dần</option>
          </select>
        </div>
      </div>

      <div class="cat-scroll" id="svcCats"></div>
      <div id="svcResults"></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const S = { page: 0, limit: 24, categoryId: null, search: '', sort: 'newest' };
    const resultsEl = container.querySelector('#svcResults');
    const catsEl = container.querySelector('#svcCats');

    const categories = await Data.getCategories();
    renderCategoryChips(catsEl, categories, null, (id) => {
      S.categoryId = id; S.page = 0; load();
    });

    async function load() {
      resultsEl.innerHTML = '';
      const sk = el('div', { class: 'service-grid' });
      for (let i = 0; i < 3; i++) sk.appendChild(el('div', { class: 'scard skeleton', style: 'height:120px;' }));
      resultsEl.appendChild(sk);

      const { items } = await Data.getServices({
        categoryId: S.categoryId, search: S.search, sort: S.sort, page: S.page, limit: S.limit
      });
      resultsEl.innerHTML = '';

      if (!items.length) {
        resultsEl.appendChild(EmptyState({
          icon: 'briefcase',
          title: 'Chưa có dịch vụ',
          desc: 'Dịch vụ sẽ xuất hiện khi được thêm vào hệ thống.'
        }));
        if (window.lucide) window.lucide.createIcons({ nodes: [resultsEl] });
        return;
      }

      const grid = el('div', { class: 'service-grid' });
      items.forEach(s => grid.appendChild(ServiceCard(s)));
      resultsEl.appendChild(grid);
      if (window.lucide) window.lucide.createIcons({ nodes: [resultsEl] });
    }

    container.querySelector('#svcSearch').addEventListener('input', window.LH.debounce((e) => {
      S.search = e.target.value.trim();
      S.page = 0; load();
    }, 320));

    container.querySelector('#svcSort').addEventListener('change', (e) => {
      S.sort = e.target.value;
      S.page = 0; load();
    });

    load();
  }

  /* ==========================================================
     3.14 Register Views
     ========================================================== */
  window.LH.Views = window.LH.Views || {};
  window.LH.Views.home = (container, hash) => renderHome(container, hash);
  window.LH.Views.shop = (container, hash) => renderShop(container, hash);
  window.LH.Views.services = (container, hash) => renderServices(container, hash);

  /* ==========================================================
     3.15 Re-render on route change (Router already fires)
     ========================================================== */
  // Router in Part 2 already calls LH.Views[name]. Additional helpers below:
  window.addEventListener('lh:view', (e) => {
    if (e.detail && e.detail.view === 'shop' && e.detail.hash) {
      // Could parse query string in Part 4 — leave room
    }
  });

  /* ==========================================================
     3.16 Manual refresh from realtime (Part 9 will emit)
     ========================================================== */
  window.LH.refreshCurrentView = function () {
    const v = State.currentView;
    if (window.LH.Views[v] && document.querySelector('#viewContainer')) {
      try { window.LH.Views[v](document.querySelector('#viewContainer'), location.hash); }
      catch (e) { console.warn('[refreshCurrentView]', e); }
    }
  };

  console.log('%cPart 3 loaded — Profile, Home, Shop, Services, Cards', 'color:#06b6d4;font-weight:700;');
})();
</script>

      const nextBtn = document.getElementById('ivNext');
      if (prevBtn) prevBtn.style.display = this.images.length > 1 ? 'grid' : 'none';
      if (nextBtn) nextBtn.style.display = this.images.length > 1 ? 'grid' : 'none';
      this.resetTransform();
    },

    nav(dir) {
      if (this.images.length < 2) return;
      this.index = (this.index + dir + this.images.length) % this.images.length;
      this.show();
    },

    close() {
      if (!this.backdrop) return;
      this.backdrop.classList.remove('active');
      document.body.style.overflow = '';
    },

    applyTransform() {
      this.img.style.transform = `translate(${this.tx}px, ${this.ty}px) scale(${this.scale})`;
      if (this.zoomLabel) this.zoomLabel.textContent = Math.round(this.scale * 100) + '%';
    },

    resetTransform() {
      this.scale = 1;
      this.tx = 0;
      this.ty = 0;
      this.applyTransform();
    },

    zoomBy(factor) {
      const newScale = Math.max(this.minScale, Math.min(this.maxScale, this.scale * factor));
      if (Math.abs(newScale - this.scale) < 0.01) return;
      // Zoom to center
      const rect = this.img.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      this.zoomTo(newScale, cx, cy);
    },

    zoomTo(newScale, cx, cy) {
      newScale = Math.max(this.minScale, Math.min(this.maxScale, newScale));
      if (cx == null) {
        const rect = this.img.getBoundingClientRect();
        cx = rect.left + rect.width / 2;
        cy = rect.top + rect.height / 2;
      }
      const rect = this.img.getBoundingClientRect();
      const originX = cx - rect.left;
      const originY = cy - rect.top;
      const ratio = newScale / this.scale;
      // Adjust translation to keep point under cursor
      this.tx = this.tx + (originX - rect.width / 2) * (ratio - 1);
      this.ty = this.ty + (originY - rect.height / 2) * (ratio - 1);
      this.scale = newScale;
      this.clampTranslation();
      this.applyTransform();
    },

    clampTranslation() {
      if (this.scale <= 1.05) {
        this.tx = 0;
        this.ty = 0;
        return;
      }
      // Limit translation so image stays somewhat visible
      const rect = this.img.getBoundingClientRect();
      const maxX = (rect.width * this.scale - window.innerWidth) / 2;
      const maxY = (rect.height * this.scale - window.innerHeight) / 2;
      this.tx = Math.max(-maxX, Math.min(maxX, this.tx));
      this.ty = Math.max(-maxY, Math.min(maxY, this.ty));
    },

    onPointerDown(e) {
      if (!this.backdrop.classList.contains('active')) return;
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      this.track.setPointerCapture(e.pointerId);

      if (this.pointers.size === 1) {
        this.touchStartTime = Date.now();
        this.touchStartX = e.clientX;
        this.dragStartX = e.clientX;
        this.dragStartY = e.clientY;
        this.startX = this.tx;
        this.startY = this.ty;
        this.isDragging = this.scale > 1.05;
      } else if (this.pointers.size === 2) {
        const pts = Array.from(this.pointers.values());
        this.startDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        this.startScale = this.scale;
        this.isDragging = false;
      }
    },

    onPointerMove(e) {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (this.pointers.size === 2) {
        const pts = Array.from(this.pointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        if (this.startDist > 0) {
          const factor = dist / this.startDist;
          const newScale = Math.max(this.minScale, Math.min(this.maxScale, this.startScale * factor));
          const midX = (pts[0].x + pts[1].x) / 2;
          const midY = (pts[0].y + pts[1].y) / 2;
          this.zoomTo(newScale, midX, midY);
        }
        return;
      }

      if (this.pointers.size === 1) {
        if (this.isDragging) {
          this.tx = this.startX + (e.clientX - this.dragStartX);
          this.ty = this.startY + (e.clientY - this.dragStartY);
          this.clampTranslation();
          this.applyTransform();
        }
      }
    },

    onPointerUp(e) {
      const wasSingle = this.pointers.size === 1;
      const startXAtDown = this.touchStartX;
      const startTimeAtDown = this.touchStartTime;
      this.pointers.delete(e.pointerId);
      try { this.track.releasePointerCapture(e.pointerId); } catch {}

      if (wasSingle && !this.isDragging) {
        // Could be swipe
        const dx = e.clientX - startXAtDown;
        const dt = Date.now() - startTimeAtDown;
        if (Math.abs(dx) > this.swipeThreshold && dt < 500 && this.scale <= 1.05) {
          this.nav(dx > 0 ? -1 : 1);
        }
      }
      this.isDragging = false;
      if (this.pointers.size < 2) this.startDist = 0;
    }
  };
  window.LH.ImageViewer = ImageViewer;

  /* ==========================================================
     4.2 CART SYSTEM
     ========================================================== */
  const Cart = {
    KEY: 'lh_cart_v1',
    items: [],

    init() {
      const saved = store.get(this.KEY, []);
      if (Array.isArray(saved)) this.items = saved.filter(x => x && x.productId);
      this.updateUI();
    },

    persist() {
      store.set(this.KEY, this.items);
      State.emit('cart:changed', this.items);
      this.updateUI();
    },

    add(product, qty = 1, opts = {}) {
      if (!product || !product.id) {
        Toast.error('Không thể thêm sản phẩm');
        return false;
      }
      const stock = Number(product.stock);
      const inStock = product.in_stock !== false && (isNaN(stock) || stock > 0);
      if (!inStock) {
        Toast.error('Sản phẩm đã hết hàng');
        return false;
      }
      const price = this.getUnitPrice(product);
      const idx = this.items.findIndex(i => i.productId === product.id);
      if (idx >= 0) {
        const newQty = this.items[idx].qty + qty;
        if (!isNaN(stock) && stock > 0 && newQty > stock) {
          Toast.warning(`Chỉ còn ${stock} sản phẩm`);
          this.items[idx].qty = stock;
        } else {
          this.items[idx].qty = newQty;
        }
      } else {
        this.items.push({
          productId: product.id,
          name: product.name || 'Sản phẩm',
          price,
          qty: Math.max(1, Math.min(qty, isNaN(stock) || stock === 0 ? 999 : stock)),
          image: window.LH.Data && window.LH.Data._getImage ? window.LH.Data._getImage(product) : (product.thumbnail_url || product.image_url || ''),
          slug: product.slug || '',
          stock: isNaN(stock) ? null : stock
        });
      }
      this.persist();
      this.syncIfLoggedIn();
      if (!opts.silent) Toast.success('Đã thêm vào giỏ hàng');
      return true;
    },

    remove(productId) {
      this.items = this.items.filter(i => i.productId !== productId);
      this.persist();
      this.syncIfLoggedIn();
    },

    updateQty(productId, qty) {
      const item = this.items.find(i => i.productId === productId);
      if (!item) return;
      if (qty <= 0) {
        this.remove(productId);
        return;
      }
      if (item.stock && qty > item.stock) {
        Toast.warning(`Chỉ còn ${item.stock} sản phẩm`);
        qty = item.stock;
      }
      item.qty = qty;
      this.persist();
      this.syncIfLoggedIn();
    },

    clear() {
      this.items = [];
      this.persist();
      this.syncIfLoggedIn();
    },

    getUnitPrice(p) {
      const sale = p.sale_price != null ? Number(p.sale_price) : null;
      const base = Number(p.price) || 0;
      return (sale != null && sale > 0 && sale < base) ? sale : base;
    },

    getCount() {
      return this.items.reduce((s, i) => s + (i.qty || 0), 0);
    },

    getSubtotal() {
      return this.items.reduce((s, i) => s + (i.price * i.qty), 0);
    },

    async syncIfLoggedIn() {
      // Placeholder hook — Part 6/9 will implement server-side sync
      if (!State.user) return;
      // Part 9 will add: supabase.from('carts').upsert(...)
    },

    updateUI() {
      // Header badge
      const btn = document.getElementById('cartBtn');
      if (btn) {
        const count = this.getCount();
        if (count > 0) {
          btn.classList.add('has-badge');
          btn.dataset.badge = count > 99 ? '99+' : String(count);
        } else {
          btn.classList.remove('has-badge');
          btn.removeAttribute('data-badge');
        }
      }
      // Drawer
      this.renderDrawer();
    },

    renderDrawer() {
      const body = document.getElementById('cartBody');
      const footer = document.getElementById('cartFooter');
      const countEl = document.getElementById('cartCountBadge');
      if (!body) return;

      if (countEl) countEl.textContent = this.getCount();

      if (!this.items.length) {
        body.innerHTML = `
          <div class="cart-empty">
            <div class="cart-empty-icon"><i data-lucide="shopping-cart"></i></div>
            <div class="cart-empty-title">Giỏ hàng trống</div>
            <div class="cart-empty-desc">Hãy thêm sản phẩm bạn muốn mua</div>
            <a href="#/shop" class="btn btn-primary" id="cartGoShop"><i data-lucide="shopping-bag"></i> Khám phá Shop</a>
          </div>
        `;
        if (footer) footer.style.display = 'none';
        if (window.lucide) window.lucide.createIcons({ nodes: [body] });
        document.getElementById('cartGoShop')?.addEventListener('click', () => this.close());
        return;
      }

      if (footer) footer.style.display = 'block';
      body.innerHTML = '';
      this.items.forEach(item => {
        const node = document.createElement('div');
        node.className = 'cart-item';
        node.dataset.productId = item.productId;
        node.innerHTML = `
          <div class="cart-item-img">
            ${item.image ? `<img src="${escapeHtml(item.image)}" alt="">` : `<div class="placeholder"><i data-lucide="image-off"></i></div>`}
          </div>
          <div class="cart-item-body">
            <div class="cart-item-name">${escapeHtml(item.name)}</div>
            <div class="cart-item-price">${formatCurrency(item.price)}</div>
            <div class="cart-item-row">
              <div class="cart-qty-mini">
                <button data-action="dec" aria-label="Giảm"><i data-lucide="minus"></i></button>
                <span>${item.qty}</span>
                <button data-action="inc" aria-label="Tăng"><i data-lucide="plus"></i></button>
              </div>
              <div class="caption" style="font-weight:700;">${formatCurrency(item.price * item.qty)}</div>
            </div>
          </div>
          <button class="cart-remove-btn" data-action="remove" aria-label="Xoá"><i data-lucide="x"></i></button>

        body.appendChild(node);
      });
      if (window.lucide) window.lucide.createIcons({ nodes: [body] });

      // Bind events
      body.querySelectorAll('.cart-item').forEach(itemNode => {
        const pid = itemNode.dataset.productId;
        itemNode.querySelector('[data-action="inc"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          const it = this.items.find(i => i.productId === pid);
          if (it) this.updateQty(pid, it.qty + 1);
        });
        itemNode.querySelector('[data-action="dec"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          const it = this.items.find(i => i.productId === pid);
          if (it) this.updateQty(pid, it.qty - 1);
        });
        itemNode.querySelector('[data-action="remove"]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          this.remove(pid);
        });
      });

      // Footer
      if (footer) {
        const subtotal = this.getSubtotal();
        footer.innerHTML = `
          <div class="cart-summary-row">
            <span>Tạm tính (${this.getCount()} sản phẩm)</span>
            <span>${formatCurrency(subtotal)}</span>
          </div>
          <div class="cart-summary-row">
            <span>Phí xử lý</span>
            <span>Miễn phí</span>
          </div>
          <div class="cart-total-row">
            <span class="cart-total-label">Tổng cộng</span>
            <span class="cart-total-value">${formatCurrency(subtotal)}</span>
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="cartCheckoutBtn">
            <i data-lucide="credit-card"></i> Tiến hành thanh toán
          </button>
        `;
        if (window.lucide) window.lucide.createIcons({ nodes: [footer] });
        document.getElementById('cartCheckoutBtn')?.addEventListener('click', () => {
          this.close();
          if (!State.user) {
            Toast.warning('Vui lòng đăng nhập để thanh toán');
            if (window.LH.Auth) window.LH.Auth.openLogin();
            return;
          }
          // Part 6 will implement checkout flow
          if (window.LH.Checkout && typeof window.LH.Checkout.open === 'function') {
            window.LH.Checkout.open();
          } else {
            Toast.info('Thanh toán sẽ khả dụng ở Phần 6.');
          }
        });
      }
    },

    open() {
      const drawer = document.getElementById('cartDrawer');
      const overlay = document.getElementById('cartOverlay');
      if (!drawer) return;
      drawer.classList.add('open');

      if (!drawer) return;
      drawer.classList.remove('open');
      if (overlay) overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  };

  /* ==========================================================
     4.4 PRODUCT DETAIL HELPERS
     ========================================================== */
  function parseHashQuery(hash) {
    const qIndex = (hash || '').indexOf('?');
    if (qIndex === -1) return {};
    const qs = hash.slice(qIndex + 1);
    const out = {};
    qs.split('&').forEach(pair => {
      const [k, v] = pair.split('=');
      if (k) out[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
    return out;
  }

  async function getProductById(id) {
    if (!id || !supabase) return null;
    try {
      const { data, error } = await supabase
        .from('products')
        .select('*')
        .eq('id', id)
        .maybeSingle();
      if (error) { console.warn('[getProductById]', error.message); return null; }
      return data;
    } catch (e) { console.warn('[getProductById]', e); return null; }
  }

  async function getProductImages(product) {
    // 1) If product has product_images rows, use them
    if (product && product.id && supabase) {
      try {
        const { data, error } = await supabase
          .from('product_images')
          .select('*')
          .eq('product_id', product.id)
          .order('sort_order', { ascending: true });
        if (!error && Array.isArray(data) && data.length) {
          return data.map(r => r.url || r.image_url).filter(Boolean);
        }
      } catch {}
    }
    // 2) Fallback to jsonb images
    const images = [];
    if (product) {
      if (Array.isArray(product.images)) {
        product.images.forEach(x => {
          if (typeof x === 'string') images.push(x);
          else if (x && x.url) images.push(x.url);
        });
      }
      if (product.thumbnail_url) images.unshift(product.thumbnail_url);
      else if (product.image_url) images.unshift(product.image_url);
    }
    // dedupe
    return Array.from(new Set(images.filter(Boolean)));
  }

  async function getRelatedProducts(product, limit = 4) {
    if (!product || !product.id) return [];
    try {
      let q = supabase.from('products').select('*').eq('is_visible', true).neq('id', product.id);
      if (product.category_id) q = q.eq('category_id', product.category_id);
      const { data, error } = await q.order('created_at', { ascending: false }).limit(limit);
      if (error) return [];
      return data || [];
    } catch { return []; }
  }

  async function getCategoriesMap() {
    const cats = await (window.LH.Data.getCategories ? window.LH.Data.getCategories() : Promise.resolve([]));
    const map = new Map();
    (cats || []).forEach(c => map.set(c.id, c));
    return { list: cats || [], map };
  }

      const sale = product.sale_price != null ? Number(product.sale_price) : null;
      const base = Number(product.price) || 0;
      return (sale != null && sale > 0 && sale < base) ? { current: sale, original: base, hasSale: true } : { current: base, original: null, hasSale: false };
    })());

    const stock = product.in_stock === false || product.stock === 0 ? 'out'
      : (typeof product.stock === 'number' && product.stock > 0 && product.stock <= 5) ? 'low'

    container.innerHTML = '';

    // Main wrap

    if (product.is_featured) badges.push(`<span class="pbadge featured">Nổi bật</span>`);
    if (product.is_new) badges.push(`<span class="pbadge new">Mới</span>`);

    }

    const nameEl = el('h1', { class: 'pd-name' });
    nameEl.textContent = product.name || 'Sản phẩm';
    info.appendChild(nameEl);

    if (product.short_desc) {
      const sd = el('div', { class: 'pd-short-desc' });
      sd.textContent = product.short_desc;
      info.appendChild(sd);
    }

    // Meta chips
    const chips = el('div', { class: 'pd-meta-chips' });
    if (product.code) chips.innerHTML += `<span class="pd-chip"><i data-lucide="hash"></i>${escapeHtml(product.code)}</span>`;
    if (product.delivery_time) chips.innerHTML += `<span class="pd-chip"><i data-lucide="clock"></i>${escapeHtml(product.delivery_time)}</span>`;
    if (product.warranty) chips.innerHTML += `<span class="pd-chip"><i data-lucide="shield-check"></i>${escapeHtml(product.warranty)}</span>`;
    if (chips.innerHTML) info.appendChild(chips);

    // Price block
    const priceBlock = el('div', { class: 'pd-price-block' });
    priceBlock.innerHTML = `
      <div class="pd-price-row">
        <span class="pd-price-now">${formatCurrency(price.current)}</span>
        ${price.hasSale ? `<span class="pd-price-old">${formatCurrency(price.original)}</span>` : ''}
        ${price.hasSale ? `<span class="pd-discount-tag">-${Math.round((1 - price.current / price.original) * 100)}%</span>` : ''}
      </div>
      <div class="pd-price-note"><i data-lucide="shield-check"></i>Thanh toán an toàn · Hoàn tiền nếu lỗi</div>
    `;
    info.appendChild(priceBlock);

    // Qty + stock
    const qtyRow = el('div', { class: 'pd-qty-row' });
    const stockLabel = stock === 'out' ? 'Hết hàng' : stock === 'low' ? `Còn ${product.stock} sản phẩm` : 'Còn hàng';
    qtyRow.innerHTML = `
      <div class="qty-stepper">
        <button class="qty-btn" id="qtyDec" aria-label="Giảm"><i data-lucide="minus"></i></button>
        <div class="qty-val" id="qtyVal">1</div>
        <button class="qty-btn" id="qtyInc" aria-label="Tăng"><i data-lucide="plus"></i></button>
      </div>
      <div class="pd-stock-note ${stock}">
        <i data-lucide="${stock === 'out' ? 'x-circle' : stock === 'low' ? 'alert-circle' : 'check-circle'}"></i>
        ${escapeHtml(stockLabel)}
      </div>
    `;
    info.appendChild(qtyRow);

    // CTA
    const ctaRow = el('div', { class: 'pd-cta-row' });
    ctaRow.innerHTML = `
      <button class="btn btn-glass btn-lg" id="pdAddCart" ${stock === 'out' ? 'disabled' : ''}>
        <i data-lucide="shopping-cart"></i> Thêm vào giỏ
      </button>
      <button class="btn btn-primary btn-lg flex-1" id="pdBuyNow" ${stock === 'out' ? 'disabled' : ''}>
        <i data-lucide="zap"></i> Mua ngay
      </button>
    `;
    info.appendChild(ctaRow);

    wrap.appendChild(info);
    frag.appendChild(wrap);

    // ---------- Tabs (description / specs / reviews) ----------
    const tabs = el('div', { class: 'pd-tabs' });
    tabs.innerHTML = `
      <div class="pd-tabs-nav">
        <button class="pd-tab active" data-tab="desc"><i data-lucide="file-text"></i> Mô tả</button>
        <button class="pd-tab" data-tab="specs"><i data-lucide="list"></i> Thông số</button>
        <button class="pd-tab" data-tab="reviews"><i data-lucide="star"></i> Đánh giá</button>
      </div>
      <div class="pd-tab-panel" data-panel="desc">
        ${product.description
          ? `<div class="pd-desc">${escapeHtml(product.description)}</div>`
          : `<div class="empty-state-desc">Chưa có mô tả chi tiết.</div>`}
      </div>
      <div class="pd-tab-panel" data-panel="specs" hidden>
        ${renderSpecsPanel(product)}
      </div>
      <div class="pd-tab-panel" data-panel="reviews" hidden>
        <div class="empty-state-desc" style="text-align:center;padding:20px;">
          <i data-lucide="star" style="width:24px;height:24px;opacity:0.5;"></i>
          <div style="margin-top:8px;">Đánh giá sẽ hiển thị sau khi có khách hàng mua sản phẩm.</div>
        </div>
      </div>
    `;
    frag.appendChild(tabs);

    // Related
    const relatedWrap = el('div', { class: 'pd-related' });
    relatedWrap.innerHTML = `
      <div class="section-head">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Gợi ý</div>
          <div class="section-title">Sản phẩm liên quan</div>
        </div>
        <a href="#/shop" class="section-action">Xem tất cả <i data-lucide="arrow-right"></i></a>
      </div>
    `;
    frag.appendChild(relatedWrap);

    container.appendChild(frag);
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // ---- Bind interactions ----
    // Main image click → viewer
    if (images.length) {
      mainImg.addEventListener('click', () => ImageViewer.open(images, 0));
    }

    // Qty stepper
    let qty = 1;
    const maxQty = typeof product.stock === 'number' && product.stock > 0 ? product.stock : 999;
    const qtyValEl = document.getElementById('qtyVal');
    document.getElementById('qtyInc').addEventListener('click', () => {
      if (qty < maxQty) { qty++; qtyValEl.textContent = qty; }
    });
    document.getElementById('qtyDec').addEventListener('click', () => {
      if (qty > 1) { qty--; qtyValEl.textContent = qty; }
    });

    // Add to cart
    document.getElementById('pdAddCart')?.addEventListener('click', () => {
      Cart.add(product, qty);
      Cart.open();
    });

    // Buy now
    document.getElementById('pdBuyNow')?.addEventListener('click', () => {
      Cart.add(product, qty, { silent: true });
      if (!State.user) {
        Toast.warning('Vui lòng đăng nhập để tiếp tục');
        if (window.LH.Auth) window.LH.Auth.openLogin();
        return;
      }
      if (window.LH.Checkout && typeof window.LH.Checkout.open === 'function') {
        window.LH.Checkout.open();
      } else {
        Toast.info('Thanh toán sẽ khả dụng ở Phần 6.');
        Cart.open();
      }
    });

    // Tabs
    tabs.querySelectorAll('.pd-tab').forEach(tabBtn => {
      tabBtn.addEventListener('click', () => {
        const t = tabBtn.dataset.tab;
        tabs.querySelectorAll('.pd-tab').forEach(b => b.classList.toggle('active', b === tabBtn));
        tabs.querySelectorAll('.pd-tab-panel').forEach(p => {
          p.hidden = p.dataset.panel !== t;
        });
      });
    });

    // Related products
    const related = await getRelatedProducts(product, 4);
    if (related.length) {
      const rGrid = el('div', { class: 'product-grid' });
      related.forEach(p => {
        if (cat) p._category_name = cat.name;
        rGrid.appendChild(window.LH._ProductCard ? window.LH._ProductCard(p) : (() => {
          // fallback: simple card
          const c = el('div', { class: 'pcard' });
          c.innerHTML = `
            <div class="pcard-media">${p.thumbnail_url ? `<img src="${escapeHtml(p.thumbnail_url)}" alt="" loading="lazy">` : ''}</div>
            <div class="pcard-body">
              <div class="pcard-name">${escapeHtml(p.name || '')}</div>
              <div class="pcard-price-row"><span class="pcard-price">${formatCurrency(Number(p.sale_price || p.price) || 0)}</span></div>
            </div>
          `;
          c.addEventListener('click', () => location.hash = `#/product?id=${encodeURIComponent(p.id)}`);
          return c;
        })());
      });
      relatedWrap.appendChild(rGrid);
      if (window.lucide) window.lucide.createIcons({ nodes: [relatedWrap] });
    } else {
      relatedWrap.remove();
    }

    // Update page title
    document.title = (product.name || 'Sản phẩm') + ' — ' + (window.LH.CONFIG?.APP_NAME || 'Liquid Hub');
  }

  function renderSpecsPanel(product) {
    const specs = [];
    if (product.code) specs.push({ k: 'Mã sản phẩm', v: product.code });
    if (product.stock != null) specs.push({ k: 'Tồn kho', v: String(product.stock) });
    if (product.delivery_time) specs.push({ k: 'Thời gian xử lý', v: product.delivery_time });
    if (product.warranty) specs.push({ k: 'Bảo hành', v: product.warranty });
    if (product.category_name) specs.push({ k: 'Danh mục', v: product.category_name });
    if (product.created_at) specs.push({ k: 'Ngày đăng', v: window.LH.formatDate(product.created_at) });
    if (product.attributes && typeof product.attributes === 'object') {
      Object.entries(product.attributes).forEach(([k, v]) => specs.push({ k, v: String(v) }));
    }
    if (!specs.length) {
      return `<div class="empty-state-desc" style="text-align:center;padding:20px;">Chưa có thông số kỹ thuật.</div>`;
    }
    return `<div class="pd-specs">
      ${specs.map(s => `<div class="pd-spec"><span class="pd-spec-key">${escapeHtml(s.k)}</span><span class="pd-spec-val">${escapeHtml(s.v)}</span></div>`).join('')}
    </div>`;
  }

  function renderNotFound(container, msg) {
    container.innerHTML = `
      <div class="pd-notfound">
        <div class="empty-state-icon" style="margin:0 auto 16px;width:72px;height:72px;">
          <i data-lucide="package-x" style="width:32px;height:32px;"></i>
        </div>
        <div class="h3" style="margin-bottom:6px;">Không tìm thấy</div>
        <div class="body" style="margin-bottom:20px;">${escapeHtml(msg || 'Sản phẩm không tồn tại')}</div>
        <a href="#/shop" class="btn btn-primary"><i data-lucide="arrow-left"></i> Về Shop</a>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
  }

  /* ==========================================================
     4.6 GLOBAL SEARCH (header desktop + mobile)
     ========================================================== */
  const GlobalSearch = {
    debouncedRun: null,
    init() {
      const headerInput = document.getElementById('headerSearchInput');
      const dropdown = this.ensureDropdown(headerInput);
      this.debouncedRun = debounce((q) => this.run(q, dropdown, headerInput), 300);

      if (headerInput) {
        headerInput.addEventListener('input', (e) => this.debouncedRun(e.target.value.trim()));
        headerInput.addEventListener('focus', () => {
          if (headerInput.value.trim()) this.debouncedRun(headerInput.value.trim());
        });
        headerInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const q = headerInput.value.trim();
            if (q) {
              this.closeDropdown(dropdown);
              location.hash = `#/shop?q=${encodeURIComponent(q)}`;
            }
          } else if (e.key === 'Escape') {
            this.closeDropdown(dropdown);
            headerInput.blur();
          }
        });
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.header-search')) this.closeDropdown(dropdown);
        });
      }

      // Mobile search
      const mobileInput = document.getElementById('mobileSearchInput');
      const mobileResults = document.getElementById('mobileSearchResults');
      if (mobileInput && mobileResults) {
        const mobileDebounced = debounce((q) => this.runMobile(q, mobileResults), 300);
        mobileInput.addEventListener('input', (e) => mobileDebounced(e.target.value.trim()));
        mobileInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const q = mobileInput.value.trim();
            if (q) {
              document.getElementById('mobileSearch')?.classList.remove('open');
              location.hash = `#/shop?q=${encodeURIComponent(q)}`;
            }
          }
        });
      }
    },
    ensureDropdown(anchor) {
      if (!anchor || !anchor.parentNode) return null;
      let dd = anchor.parentNode.querySelector('.search-dropdown');
      if (!dd) {
        dd = document.createElement('div');
        dd.className = 'search-dropdown';
        anchor.parentNode.appendChild(dd);
      }
      return dd;
    },
    closeDropdown(dd) {
      if (dd) dd.classList.remove('open');
    },
    async run(q, dd, anchor) {
      if (!dd) return;
      if (!q || q.length < 1) { this.closeDropdown(dd); return; }
      dd.innerHTML = `<div class="search-empty"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;margin:0 auto 8px;"></div>Đang tìm…</div>`;
      dd.classList.add('open');

      const { items } = await window.LH.Data.getProducts({ search: q, limit: 6 });
      if (!items.length) {
        dd.innerHTML = `<div class="search-empty">Không tìm thấy "${escapeHtml(q)}"</div>`;
        return;
      }
      dd.innerHTML = '';
      items.forEach(p => {
        const img = p.thumbnail_url || p.image_url || '';
        const price = Number(p.sale_price || p.price) || 0;
        const item = document.createElement('div');
        item.className = 'search-result';
        item.innerHTML = `
          <div class="search-result-img">${img ? `<img src="${escapeHtml(img)}" alt="">` : ''}</div>
          <div class="search-result-body">
            <div class="search-result-name">${escapeHtml(p.name || '')}</div>
            <div class="search-result-price">${formatCurrency(price)}</div>
          </div>
        `;
        item.addEventListener('click', () => {
          this.closeDropdown(dd);
          location.hash = `#/product?id=${encodeURIComponent(p.id)}`;
        });
        dd.appendChild(item);
      });
      const all = document.createElement('div');
      all.className = 'search-result';
      all.style.justifyContent = 'center';
      all.style.color = 'var(--brand-1)';
      all.style.fontWeight = '700';
      all.innerHTML = `<span>Xem tất cả kết quả cho "${escapeHtml(q)}"</span>`;
      all.addEventListener('click', () => {
        this.closeDropdown(dd);
        location.hash = `#/shop?q=${encodeURIComponent(q)}`;
      });
      dd.appendChild(all);
    },
    async runMobile(q, container) {
      if (!container) return;
      if (!q) { container.innerHTML = `<div class="caption text-center" style="margin-top:32px;">Nhập từ khoá để tìm kiếm</div>`; return; }
      container.innerHTML = `<div class="text-center" style="padding:20px;"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
      const { items } = await window.LH.Data.getProducts({ search: q, limit: 12 });
      if (!items.length) {
        container.innerHTML = `<div class="caption text-center" style="margin-top:32px;">Không tìm thấy "${escapeHtml(q)}"</div>`;
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'product-grid';
      items.forEach(p => {
        const c = document.createElement('div');
        c.className = 'pcard';
        const img = p.thumbnail_url || p.image_url || '';
        const price = Number(p.sale_price || p.price) || 0;
        c.innerHTML = `
          <div class="pcard-media">${img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy">` : `<div class="pcard-placeholder"><i data-lucide="image-off"></i></div>`}</div>
          <div class="pcard-body">
            <div class="pcard-name">${escapeHtml(p.name || '')}</div>
            <div class="pcard-price-row"><span class="pcard-price">${formatCurrency(price)}</span></div>
          </div>
        `;
        c.addEventListener('click', () => {
          document.getElementById('mobileSearch')?.classList.remove('open');
          location.hash = `#/product?id=${encodeURIComponent(p.id)}`;
        });
        grid.appendChild(c);
      });
      container.innerHTML = '';
      container.appendChild(grid);
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });
    }
  };
  window.LH.GlobalSearch = GlobalSearch;

  /* ==========================================================
     4.7 SHOP QUERY PARAM (from search + filter)
     ========================================================== */
  // Patch renderShop to accept initial query param — handled by Router (hash includes ?q=)
  // The shop view already reads from URL search? Not yet. Wrap it:
  const origShop = window.LH.Views.shop;
  window.LH.Views.shop = async function (container, hash) {
    await origShop.call(this, container, hash);
    // After render, apply ?q= if present
    const q = parseHashQuery(hash);
    if (q.q) {
      const input = container.querySelector('#shopSearch');
      if (input) {
        input.value = q.q;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  };

  /* ==========================================================
     4.8 REGISTER PRODUCT VIEW
     ========================================================== */
  window.LH.Views = window.LH.Views || {};
  window.LH.Views.product = (container, hash) => renderProductDetail(container, hash);

  /* ==========================================================
     4.9 RE-EXPORT ProductCard for internal use
     ========================================================== */
  // Reference to Part 3's ProductCard wasn't exported. Build a lightweight internal one:
  window.LH._ProductCard = function (p) {
    const card = document.createElement('div');
    card.className = 'pcard';
    const img = p.thumbnail_url || p.image_url || '';
    const sale = p.sale_price != null ? Number(p.sale_price) : null;
    const base = Number(p.price) || 0;
    const price = sale && sale < base ? sale : base;
    card.innerHTML = `
      <div class="pcard-media">
        ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.name || '')}" loading="lazy">` : `<div class="pcard-placeholder"><i data-lucide="image-off"></i></div>`}
      </div>
      <div class="pcard-body">
        ${p._category_name ? `<div class="pcard-cat">${escapeHtml(p._category_name)}</div>` : ''}
        <div class="pcard-name">${escapeHtml(p.name || 'Sản phẩm')}</div>
        <div class="pcard-price-row">
          <span class="pcard-price">${formatCurrency(price)}</span>
          ${sale && sale < base ? `<span class="pcard-price-old">${formatCurrency(base)}</span>` : ''}
        </div>
      </div>
    `;
    card.addEventListener('click', () => location.hash = `#/product?id=${encodeURIComponent(p.id)}`);
    return card;
  };

  /* ==========================================================
     4.10 INIT
     ========================================================== */
  function init() {
    injectCartUI();
    Cart.init();
    ImageViewer.init();
    GlobalSearch.init();

    // Refresh cart badge on state change
    State.on('cart:changed', () => Cart.updateUI());

    if (window.lucide) window.lucide.createIcons();
    console.log('%cPart 4 loaded — Product Detail, Gallery, Image Viewer, Cart, Search', 'color:#ec4899;font-weight:700;');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
