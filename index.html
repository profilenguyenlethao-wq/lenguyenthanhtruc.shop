<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B14">
<title>NovaStore — Premium Digital Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
/* ============================================================
   RESET + VARIABLES (PHONG CÁCH GAMING NEON SUB3SAO)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}

:root{
  --primary:#6366f1;
  --primary-hover:#4f46e5;
  --secondary:#ec4899;
  --accent:#06b6d4;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --bg:#080b14;
  --bg-elev:#111827;
  --bg-soft:rgba(30,41,59,.6);
  --card:rgba(17,24,39,.7);
  --card-hover:rgba(30,41,59,.9);
  --text:#f8fafc;
  --text-muted:#94a3b8;
  --border:rgba(99,102,241,.2);
  --glass:rgba(8,11,20,.8);
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:24px;
  --shadow-glow:0 0 20px rgba(99,102,241,.3);
  --shadow-glow-pink:0 0 20px rgba(236,72,153,.3);
  --transition:.3s cubic-bezier(.4,0,.2,1);
  --header-h:68px;
}
[data-theme="light"]{
  --bg:#f1f5f9;
  --bg-elev:#ffffff;
  --bg-soft:rgba(241,245,249,.8);
  --card:rgba(255,255,255,.8);
  --card-hover:rgba(255,255,255,1);
  --text:#0f172a;
  --text-muted:#64748b;
  --border:rgba(99,102,241,.15);
  --glass:rgba(241,245,249,.85);
}
body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  transition:background .3s,color .3s;
}
[data-theme="dark"] body{
  background: radial-gradient(circle at 15% 10%, rgba(99,102,241,.15), transparent 40%),
              radial-gradient(circle at 85% 20%, rgba(236,72,153,.15), transparent 40%),
              var(--bg);
  background-attachment: fixed;
}
h1,h2,h3,h4,h5{font-family:'Outfit',sans-serif;font-weight:700;line-height:1.2;letter-spacing:-.02em}

/* ============================================================
   ANIMATIONS (HIỆU ỨNG CHUYỂN ĐỘNG)
   ============================================================ */
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes pulse-glow{0%{box-shadow:0 0 10px rgba(99,102,241,.4)}50%{box-shadow:0 0 25px rgba(99,102,241,.8)}100%{box-shadow:0 0 10px rgba(99,102,241,.4)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.animate-fade{animation:fadeInUp .6s cubic-bezier(.4,0,.2,1) forwards}
.animate-float{animation:float 3s ease-in-out infinite}

/* ============================================================
   LAYOUT & UTILS
   ============================================================ */
.container{width:100%;max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.container{padding:0 24px}}
.section{padding:56px 0}
@media(min-width:768px){.section{padding:80px 0}}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-center{display:flex;justify-content:center;align-items:center}
.flex-col{flex-direction:column}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.text-center{text-align:center}.text-muted{color:var(--text-muted)}
.hide{display:none!important}
.section-title{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-bottom:8px}
.gradient-text{background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ============================================================
   HEADER / NAV
   ============================================================ */
.header{position:sticky;top:0;z-index:100;height:var(--header-h);background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:var(--transition);}
.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Outfit',sans-serif;font-weight:800;font-size:1.3rem}
.brand-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-glow);}
.brand-icon svg{width:22px;height:22px}
.nav-desktop{display:none}
@media(min-width:900px){.nav-desktop{display:flex;align-items:center;gap:6px}}
.nav-link{padding:8px 14px;border-radius:10px;color:var(--text-muted);font-weight:600;font-size:.92rem;transition:var(--transition);display:flex;align-items:center;gap:6px;}
.nav-link:hover,.nav-link.active{color:#fff;background:var(--primary);box-shadow:var(--shadow-glow);}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text);background:var(--bg-soft);transition:var(--transition);position:relative;}
.icon-btn:hover{background:var(--primary);color:#fff;box-shadow:var(--shadow-glow)}
.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--secondary);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;box-shadow:var(--shadow-glow-pink)}
.mobile-menu-btn{display:flex}
@media(min-width:900px){.mobile-menu-btn{display:none}}

/* Mobile Drawer */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);background:var(--bg-elev);border-left:1px solid var(--border);z-index:201;padding:20px;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.drawer.open{transform:translateX(0);box-shadow:-10px 0 30px rgba(0,0,0,.5)}
.drawer-nav{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.drawer-nav .nav-link{padding:12px 16px;font-size:1rem}
.drawer-close{position:absolute;top:16px;right:16px}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--radius-sm);font-weight:700;font-size:.92rem;transition:var(--transition);border:1px solid transparent;white-space:nowrap;position:relative;overflow:hidden;}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 15px rgba(99,102,241,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.6);animation:pulse-glow 2s infinite}
.btn-outline{border-color:var(--border);color:var(--text);background:var(--bg-soft)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);box-shadow:var(--shadow-glow)}
.btn-ghost{color:var(--text-muted)}.btn-ghost:hover{color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{box-shadow:0 0 15px rgba(239,68,68,.5)}
.btn-sm{padding:7px 14px;font-size:.82rem}.btn-lg{padding:14px 32px;font-size:1rem}
.btn-block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;animation:none!important}

/* ============================================================
   CARDS (GIAO DIỆN SUB3SAO)
   ============================================================ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(12px);transition:var(--transition);overflow:hidden;position:relative;}
.card-hover:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(0,0,0,.5), var(--shadow-glow);border-color:var(--primary);background:var(--card-hover)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
.badge-primary{background:rgba(99,102,241,.2);color:#a5b4fc;border:1px solid rgba(99,102,241,.3)}
.badge-hot{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;box-shadow:0 0 10px rgba(239,68,68,.5)}
.badge-success{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.badge-warning{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.badge-danger{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3)}

/* ============================================================
   HERO & PROFILE
   ============================================================ */
.hero{position:relative;padding:64px 0 48px;overflow:hidden}
@media(min-width:768px){.hero{padding:96px 0 64px}}
.hero-inner{display:grid;gap:32px;align-items:center}
@media(min-width:1024px){.hero-inner{grid-template-columns:1.15fr .85fr;gap:56px}}
.hero h1{font-size:clamp(2rem,5.2vw,3.75rem);line-height:1.1;margin-bottom:16px;}
.hero p{font-size:clamp(1rem,1.4vw,1.15rem);color:var(--text-muted);max-width:600px;margin-bottom:28px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:32px}
.hero-stats{display:flex;flex-wrap:wrap;gap:32px;padding-top:24px;border-top:1px solid var(--border)}
.hero-stat strong{display:block;font-family:'Outfit',sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stat span{font-size:.85rem;color:var(--text-muted);font-weight:600}
.profile-card-hero{position:relative;padding:32px;border-radius:var(--radius-lg);background:linear-gradient(145deg,rgba(99,102,241,.1),rgba(236,72,153,.1));border:1px solid var(--border);backdrop-filter:blur(20px);overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.profile-card-hero::before{content:'';position:absolute;inset:-40% -20% auto auto;width:280px;height:280px;background:radial-gradient(circle,rgba(236,72,153,.4),transparent 60%);filter:blur(40px);pointer-events:none;}
.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);box-shadow:var(--shadow-glow);animation:float 4s ease-in-out infinite}
.verified-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:rgba(6,182,212,.2);color:var(--accent);border:1px solid rgba(6,182,212,.3);font-size:.72rem;font-weight:700;}
.online-dot{width:10px;height:10px;border-radius:50%;background:var(--success);display:inline-block;box-shadow:0 0 10px var(--success);border:2px solid var(--bg-elev)}

/* ============================================================
   PRODUCT CARD
   ============================================================ */
.product-card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);}
.product-thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-elev)}
.product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.product-card:hover .product-thumb img{transform:scale(1.1)}
.product-badge{position:absolute;top:12px;left:12px;z-index:2}
.product-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;background:linear-gradient(to top, var(--bg-elev), transparent)}
.product-cat{font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.product-name{font-weight:700;font-size:1rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em;transition:var(--transition)}
.product-card:hover .product-name{color:var(--primary)}
.product-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.price-current{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.2rem;color:var(--secondary)}
.price-original{font-size:.85rem;color:var(--text-muted);text-decoration:line-through}
.product-actions{display:flex;gap:8px;margin-top:12px}

/* FILTER BAR */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);margin-bottom:24px;position:sticky;top:calc(var(--header-h) + 12px);z-index:30;backdrop-filter:blur(20px);}
.filter-bar .search-wrap{position:relative;flex:1 1 240px}
.filter-bar .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
.filter-bar .input{padding-left:36px;background:var(--bg-elev);border-color:var(--border);border-radius:8px;}
.filter-cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filter-cats::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);font-size:.85rem;font-weight:600;white-space:nowrap;transition:var(--transition);cursor:pointer;color:var(--text-muted);}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-glow)}

/* ============================================================
   FORM & MODAL & TOAST
   ============================================================ */
.input,.select,.textarea{width:100%;padding:12px 14px;border-radius:var(--radius-sm);background:var(--bg-elev);border:1px solid var(--border);color:var(--text);font-size:.92rem;transition:var(--transition);}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px;color:var(--text)}
.form-group{margin-bottom:16px}

#toast-root{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{min-width:260px;padding:14px 18px;border-radius:10px;background:var(--bg-elev);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px;font-size:.9rem;font-weight:600;transform:translateX(120%);transition:transform .4s cubic-bezier(.4,0,.2,1);pointer-events:auto;}
.toast.show{transform:translateX(0)}
.toast-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.toast.success{border-left:4px solid var(--success)}.toast.success .toast-icon{color:var(--success);background:rgba(16,185,129,.1)}
.toast.error{border-left:4px solid var(--danger)}.toast.error .toast-icon{color:var(--danger);background:rgba(239,68,68,.1)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:1000;display:none;place-items:center;padding:16px;}
.modal-backdrop.open{display:grid}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 25px 50px rgba(0,0,0,.6);animation:fadeInUp .3s cubic-bezier(.4,0,.2,1);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft)}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg-soft)}

/* FOOTER */
.footer{margin-top:64px;padding:56px 0 24px;border-top:1px solid var(--border);background:var(--bg-soft);}
.footer-grid{display:grid;gap:32px;margin-bottom:32px}
@media(min-width:768px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr}}
.footer-col h4{font-size:1rem;margin-bottom:16px;color:var(--text);font-weight:700}
.footer-col a{display:block;color:var(--text-muted);font-size:.88rem;padding:6px 0;transition:var(--transition)}
.footer-col a:hover{color:var(--primary);transform:translateX(4px)}
.footer-bottom{padding-top:24px;border-top:1px solid var(--border);text-align:center;font-size:.85rem;color:var(--text-muted)}
.footer-socials{display:flex;gap:10px;margin-top:16px}
.footer-socials a{width:40px;height:40px;border-radius:10px;background:var(--bg-elev);display:grid;place-items:center;transition:var(--transition);border:1px solid var(--border)}
.footer-socials a:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-glow)}

/* ADMIN GIAO DIỆN */
.admin-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.admin-topbar{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60;}
.admin-body{flex:1;display:flex;min-height:0}
.admin-sidebar{width:250px;flex-shrink:0;padding:16px 12px;border-right:1px solid var(--border);background:var(--bg-elev);position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;}
.admin-sidebar nav{display:flex;flex-direction:column;gap:4px}
.admin-nav-link{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;font-size:.9rem;font-weight:600;color:var(--text-muted);transition:var(--transition);}
.admin-nav-link:hover{color:var(--text);background:var(--bg-soft)}
.admin-nav-link.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-glow)}
.admin-nav-section{font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--text-muted);padding:20px 16px 8px;letter-spacing:.05em}
.admin-content{flex:1;padding:24px;min-width:0;overflow-x:auto}
@media(max-width:900px){.admin-sidebar{position:fixed;top:64px;left:0;bottom:0;z-index:55;transform:translateX(-100%);transition:transform .3s;box-shadow:var(--shadow-glow)}.admin-sidebar.open{transform:translateX(0)}.admin-content{padding:16px}.admin-drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:54;opacity:0;pointer-events:none;transition:opacity .3s}.admin-drawer-bg.open{opacity:1;pointer-events:auto}}
.admin-stat{padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);display:flex;align-items:center;gap:16px;transition:var(--transition);}
.admin-stat:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:var(--shadow-glow)}
.admin-stat-icon{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.admin-stat-info strong{display:block;font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;line-height:1.1}
.admin-stat-info span{font-size:.85rem;color:var(--text-muted);font-weight:600}
.admin-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;overflow-x:auto}
.admin-table{width:100%;border-collapse:collapse;font-size:.9rem}
.admin-table th{text-align:left;padding:14px 16px;font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--text-muted);background:var(--bg-soft);border-bottom:1px solid var(--border);white-space:nowrap;}
.admin-table td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.admin-table tr:hover td{background:var(--bg-soft)}
.admin-table .actions-cell{display:flex;gap:8px;flex-wrap:wrap}

/* AUTH */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%, rgba(99,102,241,.2), transparent 50%), var(--bg);}
.auth-card{width:100%;max-width:400px;padding:40px;border-radius:var(--radius-lg);background:var(--card);border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(20px);animation:fadeInUp .5s ease-out;}
.auth-icon{width:64px;height:64px;border-radius:16px;margin:0 auto 20px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-glow);animation:pulse-glow 3s infinite}
.auth-icon svg{width:32px;height:32px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
/* ============================================================
   DATA SEED & STATE
   ============================================================ */
const LS_KEY = 'novastore_v2';
const SEED = {
  schema: 1,
  settings: { theme: 'dark', primary:'#6366f1', secondary:'#ec4899', radius: 16, siteName: 'NovaStore' },

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeDefaults(obj, defaults){
  const out = Array.isArray(defaults) ? [] : {};
  if (Array.isArray(defaults)) return obj ?? deepClone(defaults);
  for (const k in defaults){
    if (obj && obj[k] !== undefined && typeof defaults[k]==='object' && defaults[k]!==null && !Array.isArray(defaults[k])){ out[k] = mergeDefaults(obj[k], defaults[k]); }
    else if (obj && obj[k] !== undefined){ out[k] = obj[k]; }
    else { out[k] = deepClone(defaults[k]); }
  }
  return out;
}
function loadState(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { state = mergeDefaults(JSON.parse(raw), SEED); return; } } catch(e){}
  state = deepClone(SEED); saveState();
}
let saveTimer = null;
function saveState(immediate = false){
  state.meta.updatedAt = Date.now();
  if (immediate){ localStorage.setItem(LS_KEY, JSON.stringify(state)); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }, 150);
}

function toast(msg, type='success', duration=3000){

const routes = {};
function defineRoute(pattern, handler){
  const keys = [];
  const regex = new RegExp('^' + pattern.replace(/:[^/]+/g, m=>{ keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
  routes[pattern] = { regex, keys, handler };
}
function navigate(path){ location.hash = '#' + path; }
function renderRoute(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const path = hash.split('?')[0];
  for (const key in routes){
    const r = routes[key]; const m = path.match(r.regex);
    if (m){
      const params = {}; r.keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1]));
      try{ r.handler(params); } catch(e){ console.error(e); $('#app').innerHTML = `<div class="container section text-center"><h2>Có lỗi xảy ra</h2><p>${esc(e.message)}</p></div>`; }
      if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
      window.scrollTo({top:0, behavior:'instant'});
      return;
    }
  }
  $('#app').innerHTML = `<div class="container section text-center"><h2>404 - Không tìm thấy trang</h2><br><a href="#/" class="btn btn-primary">Về trang chủ</a></div>`;
  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
}
function parseQuery(hash){
  const qs = (hash.split('?')[1]) || ''; const out = {};
  new URLSearchParams(qs).forEach((v,k)=>{ out[k]=v; }); return out;
}
function setQueryParam(key, val){
  const [path, qs=''] = location.hash.replace(/^#/, '').split('?');
  const p = new URLSearchParams(qs);
  if (val === null || val === '') p.delete(key); else p.set(key, val);
  const newHash = '#' + path + (p.toString()? '?'+p.toString() : '');
  history.replaceState(null, '', newHash);
}

function addToCart(productId, qty=1){
  const product = state.products.find(p=>p.id===productId);
  if (!product || !product.visible) return toast('Sản phẩm không tồn tại','error');
  if (product.stock<=0) return toast('Sản phẩm đã hết hàng','error');
  const existing = state.cart.find(i=>i.productId===productId);
  const newQty = (existing?existing.qty:0) + qty;
  if (newQty > product.stock) return toast(`Chỉ còn ${product.stock} sản phẩm`,'error');
  if (existing) existing.qty = newQty; else state.cart.push({ productId, qty });
  saveState(); updateHeaderBadge(); toast(`Đã thêm vào giỏ`,'success');
}
function updateHeaderBadge(){
  const cartCount = state.cart.reduce((s,i)=>s+i.qty, 0);
  const cartLink = document.querySelector('a[href="#/cart"].icon-btn');
  if (cartLink){
    let badge = cartLink.querySelector('.cart-badge');
    if (cartCount>0){
      if (!badge) { badge = document.createElement('span'); badge.className='cart-badge'; cartLink.appendChild(badge); }
      badge.textContent = cartCount;
    } else if (badge) badge.remove();
  }
}
document.addEventListener('click', (e)=>{
  const addBtn = e.target.closest('[data-add-cart]');
  if (addBtn){ e.preventDefault(); addToCart(addBtn.dataset.addCart); }

defineRoute('/cart', ()=>{

  const subtotal = items.reduce((s,i)=>s + i.product.price*i.qty, 0);
  if (!items.length) return withLayout(`<div class="container section text-center"><h2>Giỏ hàng trống</h2><br><a href="#/shop" class="btn btn-primary">Mua sắm ngay</a></div>`);

      <div>
        ${items.map(i=>`<div class="card flex-between" style="padding:16px;margin-bottom:12px;align-items:center;flex-wrap:wrap;gap:12px"><div class="flex gap-3" style="align-items:center"><img src="${esc(i.product.image)}" style="width:60px;height:60px;border-radius:8px;object-fit:cover"><div><h4 style="font-size:1rem">${esc(i.product.name)}</h4><div class="text-muted" style="font-size:.9rem">${fmt(i.product.price)}</div></div></div><div class="flex gap-3" style="align-items:center"><strong>x${i.qty}</strong><button class="btn btn-danger btn-sm" onclick="state.cart=state.cart.filter(x=>x.productId!=='${i.productId}');saveState();renderRoute()"><i data-lucide="trash-2"></i></button></div></div>`).join('')}
      </div>

        <h3 style="margin-bottom:20px">Tổng đơn hàng</h3>
        <div class="flex-between" style="margin-bottom:12px"><span>Tạm tính</span><strong>${fmt(subtotal)}</strong></div>
        <div class="flex-between" style="margin-bottom:20px;padding-top:16px;border-top:1px solid var(--border);font-size:1.2rem"><strong>Tổng cộng</strong><strong style="color:var(--secondary)">${fmt(subtotal)}</strong></div>

    state.orders.unshift({ id: uid('ord'), code, items: items.map(i=>({name:i.product.name,price:i.product.price,qty:i.qty})), total: subtotal, customer: {name:fd.get('name'), phone:fd.get('phone')}, status:'pending', createdAt: Date.now() });

  openModal({
    title: isEdit ? 'Sửa sản phẩm' : 'Thêm sản phẩm',
    body: `<form id="p-form"><div class="form-group"><label class="label">Tên</label><input class="input" name="name" value="${esc(p.name)}" required></div><div class="form-group"><label class="label">Giá</label><input class="input" type="number" name="price" value="${p.price}" required></div><div class="form-group"><label class="label">Kho</label><input class="input" type="number" name="stock" value="${p.stock}" required></div><div class="form-group"><label class="label">Ảnh (URL)</label><input class="input" name="image" value="${esc(p.image)}"></div><div class="form-group"><label class="label">Mô tả</label><textarea class="input textarea" name="desc">${esc(p.desc)}</textarea></div></form>`,
    footer: `<button class="btn btn-outline" onclick="document.querySelector('#modal-root').innerHTML=''">Hủy</button><button class="btn btn-primary" onclick="saveProd('${id||''}')">Lưu</button>`
  });
};
window.saveProd = (id) => {
  const fd = new FormData($('#p-form')); const data = { name: fd.get('name'), price: parseInt(fd.get('price')), stock: parseInt(fd.get('stock')), image: fd.get('image')||'https://picsum.photos/seed/'+Math.random()+'/600/450', desc: fd.get('desc') };
  if(id){ Object.assign(state.products.find(x=>x.id===id), data); } else { state.products.unshift({ id:uid('p'), ...data, category:'digital', createdAt:Date.now(), visible:true }); }
  saveState(true); document.querySelector('#modal-root').innerHTML=''; renderAdminProducts(); toast('Đã lưu','success');
};
window.delProd = (id) => { confirmDialog('Xóa sản phẩm?', ()=>{ state.products=state.products.filter(x=>x.id!==id); saveState(true); renderAdminProducts(); }, {danger:true}); };

function renderAdminOrders(){
  $('#admin-main').innerHTML = `<h1 style="margin-bottom:24px">Quản lý Đơn hàng</h1><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Mã</th><th>Khách</th><th>Tổng</th><th>Trạng thái</th></tr></thead><tbody>
    ${state.orders.length ? state.orders.map(o=>`<tr><td><strong>${o.code}</strong></td><td>${esc(o.customer.name)}<br><small>${o.customer.phone}</small></td><td style="color:var(--primary)">${fmt(o.total)}</td><td><span class="badge badge-warning">${o.status}</span></td></tr>`).join('') : '<tr><td colspan="4" class="text-center">Chưa có đơn</td></tr>'}
  </tbody></table></div>`;
}

function renderAdminDeposits(){
  $('#admin-main').innerHTML = `<h1 style="margin-bottom:24px">Quản lý Nạp tiền</h1><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Mã</th><th>Số tiền</th><th>Trạng thái</th></tr></thead><tbody>
    ${state.deposits.length ? state.deposits.map(d=>`<tr><td><strong>${d.code}</strong></td><td>${fmt(d.amount)}</td><td><span class="badge badge-warning">${d.status}</span></td></tr>`).join('') : '<tr><td colspan="3" class="text-center">Chưa có yêu cầu</td></tr>'}
  </tbody></table></div>`;
}

function renderAdminSettings(){
  $('#admin-main').innerHTML = `
    <h1 style="margin-bottom:24px">Cài đặt Giao diện</h1>
    <div class="card" style="padding:24px;max-width:600px">
      <div class="form-group"><label class="label">Tên Website</label><input class="input" id="set-name" value="${esc(state.settings.siteName)}"></div>
      <div class="form-group"><label class="label">Màu chủ đạo</label><input type="color" id="set-color" value="${state.settings.primary}" style="width:100%;height:40px;border-radius:8px;cursor:pointer;background:none;border:1px solid var(--border)"></div>
      <button class="btn btn-primary mt-4" onclick="saveSettings()">Lưu thay đổi</button>
    </div>`;
}
window.saveSettings = () => { state.settings.siteName = $('#set-name').value; state.settings.primary = $('#set-color').value; saveState(true); applyTheme(); toast('Đã lưu','success'); renderAdminSettings(); };

function renderAdminBackup(){
  $('#admin-main').innerHTML = `
    <h1 style="margin-bottom:24px">Sao lưu & Khôi phục</h1>
    <div class="card" style="padding:24px;max-width:600px">
      <button class="btn btn-primary" onclick="exportData()" style="margin-bottom:16px"><i data-lucide="download"></i> Tải file sao lưu (JSON)</button>
      <input type="file" id="imp-file" style="margin-bottom:16px" accept=".json"><br>
      <button class="btn btn-outline" onclick="importData()"><i data-lucide="upload"></i> Khôi phục từ file</button>
    </div>`;
  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
}
window.exportData = () => { const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='novastore_backup.json'; a.click(); };
window.importData = () => { const f = $('#imp-file').files[0]; if(!f) return; const r = new FileReader(); r.onload = e => { try{ state = JSON.parse(e.target.result); saveState(true); toast('Khôi phục thành công'); setTimeout(()=>location.reload(),1000); }catch(err){ toast('File lỗi','error'); } }; r.readAsText(f); };

/* BOOT */
function boot(){
  loadState();
  applyTheme();
  window.addEventListener('hashchange', renderRoute);
  renderRoute();
  const tryIcons = ()=>{ if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'}); else setTimeout(tryIcons, 50); };
  tryIcons();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
</html>
