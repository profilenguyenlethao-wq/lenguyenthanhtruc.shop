<style>
/* ============================================================
   PHẦN 1 — DESIGN TOKENS & GLOBAL STYLES
   ============================================================ */

/* ---------- 1.1 RESET ---------- */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
* { margin: 0; padding: 0; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  text-rendering: optimizeLegibility;
}
img, svg, video, canvas { display: block; max-width: 100%; height: auto; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
input, textarea { -webkit-appearance: none; appearance: none; }
input::-ms-reveal, input::-ms-clear { display: none; }
::selection { background: rgba(99,102,241,0.28); color: inherit; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(120,120,140,0.28);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(120,120,140,0.5); }

/* ---------- 1.2 DESIGN TOKENS (LIGHT) ---------- */
:root {
  /* Brand */
  --brand-1: #6366f1;
  --brand-2: #8b5cf6;
  --brand-3: #06b6d4;
  --brand-4: #ec4899;
  --brand-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 45%, #06b6d4 100%);
  --brand-grad-soft: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(139,92,246,0.14) 50%, rgba(6,182,212,0.14));

  /* Surface / Backgrounds */
  --bg-0: #f4f6fb;
  --bg-1: #eef2fa;
  --bg-2: #e6ebf6;
  --surface-1: rgba(255,255,255,0.72);
  --surface-2: rgba(255,255,255,0.55);
  --surface-3: rgba(255,255,255,0.38);
  --surface-solid: #ffffff;
  --surface-hover: rgba(255,255,255,0.88);

  /* Glass */
  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.85);
  --glass-border-soft: rgba(255,255,255,0.55);
  --glass-highlight: rgba(255,255,255,0.95);
  --glass-shadow: 0 8px 32px rgba(31,41,55,0.09), 0 2px 8px rgba(31,41,55,0.05);
  --glass-shadow-lg: 0 20px 60px rgba(31,41,55,0.14), 0 6px 20px rgba(31,41,55,0.06);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -1px 0 rgba(255,255,255,0.28);

  /* Text */
  --text-1: #0f172a;
  --text-2: #334155;
  --text-3: #64748b;
  --text-4: #94a3b8;
  --text-invert: #ffffff;

  /* States */
  --success: #10b981;
  --success-bg: rgba(16,185,129,0.12);
  --warning: #f59e0b;
  --warning-bg: rgba(245,158,11,0.12);
  --danger: #ef4444;
  --danger-bg: rgba(239,68,68,0.12);
  --info: #3b82f6;
  --info-bg: rgba(59,130,246,0.12);

  /* Borders & dividers */
  --border-1: rgba(15,23,42,0.08);
  --border-2: rgba(15,23,42,0.14);
  --divider: rgba(15,23,42,0.06);

  /* Radius */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-2xl: 36px;
  --r-pill: 999px;

  /* Spacing */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;
  --sp-9: 56px; --sp-10: 72px; --sp-11: 96px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(15,23,42,0.06);
  --shadow-sm: 0 2px 8px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 8px 24px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
  --shadow-lg: 0 20px 50px rgba(15,23,42,0.12), 0 6px 16px rgba(15,23,42,0.06);

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 160ms;
  --dur-med: 260ms;
  --dur-slow: 420ms;

  /* Layout */
  --header-h: 64px;
  --bottomnav-h: 68px;
  --sidebar-w: 260px;
  --container-max: 1360px;
  --content-pad: 16px;

  /* Safe area */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  /* Z-index scale */
  --z-bg: 0;
  --z-content: 10;
  --z-header: 100;
  --z-sidebar: 200;
  --z-bottomnav: 150;
  --z-dropdown: 400;
  --z-modal: 1000;
  --z-toast: 1500;
  --z-image-viewer: 2000;
}

/* ---------- 1.3 DARK THEME ---------- */
[data-theme="dark"] {
  --bg-0: #070b14;
  --bg-1: #0c1220;
  --bg-2: #131a2c;
  --surface-1: rgba(22,30,48,0.72);
  --surface-2: rgba(22,30,48,0.55);
  --surface-3: rgba(22,30,48,0.35);
  --surface-solid: #0f1626;
  --surface-hover: rgba(34,44,66,0.85);

  --glass-bg: rgba(22,30,48,0.48);
  --glass-bg-strong: rgba(22,30,48,0.72);
  --glass-border: rgba(120,140,190,0.22);
  --glass-border-soft: rgba(120,140,190,0.12);
  --glass-highlight: rgba(255,255,255,0.10);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.28);
  --glass-shadow-lg: 0 24px 64px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.35);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(255,255,255,0.02);

  --text-1: #f1f5f9;
  --text-2: #cbd5e1;
  --text-3: #94a3b8;
  --text-4: #64748b;
  --text-invert: #0f172a;

  --border-1: rgba(255,255,255,0.06);
  --border-2: rgba(255,255,255,0.12);
  --divider: rgba(255,255,255,0.05);

  --shadow-xs: 0 1px 2px rgba(0,0,0,0.35);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.25);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.6), 0 6px 16px rgba(0,0,0,0.4);
}

/* ---------- 1.4 BODY / APP SHELL ---------- */
body {
  background: var(--bg-0);
  color: var(--text-1);
  transition: background-color var(--dur-med) var(--ease-out), color var(--dur-med) var(--ease-out);
  padding-bottom: calc(var(--bottomnav-h) + var(--safe-bottom));
  overscroll-behavior-y: none;
}
@media (min-width: 1024px) {
  body { padding-bottom: 0; }
}

#app {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  isolation: isolate;
}

/* ---------- 1.5 AMBIENT BACKGROUND ---------- */
#ambientBg {
  position: fixed;
  inset: 0;
  z-index: var(--z-bg);
  pointer-events: none;
  overflow: hidden;
  background: var(--bg-0);
  transition: background-color var(--dur-slow) var(--ease-out);
}
#ambientBg::before,
#ambientBg::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.55;
  will-change: transform;
  animation: ambientFloat 26s var(--ease-in-out) infinite alternate;
}
#ambientBg::before {
  width: 65vmax; height: 65vmax;
  top: -25vmax; left: -20vmax;
  background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.55), transparent 60%);
}
#ambientBg::after {
  width: 70vmax; height: 70vmax;
  bottom: -30vmax; right: -25vmax;
  background: radial-gradient(circle at 70% 70%, rgba(6,182,212,0.45), transparent 60%);
  animation-delay: -12s;
}
[data-theme="dark"] #ambientBg::before { opacity: 0.35; }
[data-theme="dark"] #ambientBg::after  { opacity: 0.3; }

@keyframes ambientFloat {
  0%   { transform: translate3d(0,0,0) scale(1); }
  50%  { transform: translate3d(4vw, 3vh, 0) scale(1.08); }
  100% { transform: translate3d(-3vw, -2vh, 0) scale(0.96); }
}

/* ---------- 1.6 SNOW LAYER ---------- */
#snowLayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
  opacity: 0;
  transition: opacity var(--dur-slow) var(--ease-out);
}
#snowLayer.active { opacity: 1; }
.snow-flake {
  position: absolute;
  top: -20px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 0 4px rgba(255,255,255,0.7);
  animation: snowFall linear infinite;
  will-change: transform;
}
[data-theme="light"] .snow-flake {
  background: rgba(160,180,220,0.75);
  box-shadow: 0 0 4px rgba(160,180,220,0.5);
}
@keyframes snowFall {
  0%   { transform: translate3d(0, -20px, 0) rotate(0deg); }
  100% { transform: translate3d(var(--drift, 0), 110vh, 0) rotate(360deg); }
}

/* ---------- 1.7 LAYOUT PRIMITIVES ---------- */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: max(var(--content-pad), var(--safe-left)) max(var(--content-pad), var(--safe-right));
}
@media (min-width: 768px) { :root { --content-pad: 24px; } }
@media (min-width: 1024px) { :root { --content-pad: 32px; } }

.stack > * + * { margin-top: var(--sp-4); }
.stack-sm > * + * { margin-top: var(--sp-2); }
.stack-lg > * + * { margin-top: var(--sp-6); }

.row { display: flex; align-items: center; gap: var(--sp-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.col { display: flex; flex-direction: column; gap: var(--sp-3); }

.grid { display: grid; gap: var(--sp-4); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) {
  .grid-sm-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-sm-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (min-width: 1024px) {
  .grid-lg-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-lg-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
}

.flex-1 { flex: 1; min-width: 0; }
.flex-wrap { flex-wrap: wrap; }
.hidden { display: none !important; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.w-full { width: 100%; }
.mt-auto { margin-top: auto; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 1.8 TYPOGRAPHY ---------- */
.h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
.h2 { font-size: clamp(22px, 3vw, 32px); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }
.h3 { font-size: clamp(18px, 2.2vw, 22px); font-weight: 700; line-height: 1.3; }
.h4 { font-size: 16px; font-weight: 600; line-height: 1.35; }
.body { font-size: 15px; color: var(--text-2); }
.body-sm { font-size: 13.5px; color: var(--text-3); }
.caption { font-size: 12px; color: var(--text-4); letter-spacing: 0.01em; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.text-gradient {
  background: var(--brand-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

/* ---------- 1.9 GLASS CARD SYSTEM ---------- */
.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  box-shadow: var(--glass-shadow), var(--glass-inner);
  transition: transform var(--dur-med) var(--ease-out),
              box-shadow var(--dur-med) var(--ease-out),
              background-color var(--dur-med) var(--ease-out),
              border-color var(--dur-med) var(--ease-out);
}
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(120deg,
    rgba(255,255,255,0.10) 0%,
    rgba(255,255,255,0) 30%,
    rgba(255,255,255,0) 70%,
    rgba(255,255,255,0.05) 100%);
  opacity: 0.8;
}
.glass-strong {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border-color: var(--glass-highlight);
}
.glass-soft {
  background: var(--surface-3);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-color: var(--glass-border-soft);
}
.glass-interactive { cursor: pointer; }
.glass-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--glass-shadow-lg), var(--glass-inner);
  background: var(--glass-bg-strong);
}
.glass-interactive:active { transform: translateY(0) scale(0.985); }

.card {
  padding: var(--sp-5);
  border-radius: var(--r-lg);
}
.card-lg { padding: var(--sp-6); border-radius: var(--r-xl); }
.card-sm { padding: var(--sp-3); border-radius: var(--r-md); }

/* ---------- 1.10 BUTTONS ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 44px;
  padding: 0 var(--sp-5);
  border-radius: var(--r-pill);
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: 0.005em;
  white-space: nowrap;
  user-select: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform var(--dur-fast) var(--ease-spring),
              box-shadow var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              filter var(--dur-fast) var(--ease-out);
}
.btn:disabled, .btn[aria-disabled="true"] {
  opacity: 0.5; cursor: not-allowed; pointer-events: none;
}
.btn:focus-visible {
  outline: 2px solid var(--brand-2);
  outline-offset: 2px;
}
.btn i, .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

.btn-primary {
  background: var(--brand-grad);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 8px 24px rgba(99,102,241,0.35), inset 0 1px 0 rgba(255,255,255,0.28);
}
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 12px 32px rgba(99,102,241,0.45), inset 0 1px 0 rgba(255,255,255,0.32); }
.btn-primary:active { transform: scale(0.97); }

.btn-glass {
  background: var(--glass-bg);
  color: var(--text-1);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--shadow-sm), var(--glass-inner);
}
.btn-glass:hover { background: var(--glass-bg-strong); transform: translateY(-1px); box-shadow: var(--shadow-md), var(--glass-inner); }
.btn-glass:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--text-1);
  border: 1px solid transparent;
}
.btn-ghost:hover { background: var(--surface-3); border-color: var(--border-1); }

.btn-danger {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  box-shadow: 0 8px 20px rgba(239,68,68,0.35);
}
.btn-danger:hover { filter: brightness(1.06); }

.btn-success {
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  box-shadow: 0 8px 20px rgba(16,185,129,0.32);
}
.btn-success:hover { filter: brightness(1.06); }

.btn-sm { min-height: 36px; padding: 0 var(--sp-4); font-size: 13px; }
.btn-sm i, .btn-sm svg { width: 15px; height: 15px; }

.btn-lg { min-height: 52px; padding: 0 var(--sp-7); font-size: 15.5px; border-radius: var(--r-pill); }
.btn-lg i, .btn-lg svg { width: 20px; height: 20px; }

.btn-icon {
  width: 44px; height: 44px; min-height: 44px; padding: 0;
  border-radius: 50%;
}
.btn-icon.btn-sm { width: 36px; height: 36px; min-height: 36px; }

.btn-block { width: 100%; }

/* Ripple effect */
.btn .ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  background: rgba(255,255,255,0.55);
  pointer-events: none;
  animation: rippleAnim 600ms var(--ease-out);
}
.btn-glass .ripple, .btn-ghost .ripple { background: rgba(99,102,241,0.28); }
@keyframes rippleAnim {
  to { transform: scale(2.6); opacity: 0; }
}

/* ---------- 1.11 INPUTS ---------- */
.field { display: flex; flex-direction: column; gap: var(--sp-2); }
.field-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  padding-left: 4px;
}
.field-hint { font-size: 12px; color: var(--text-3); padding-left: 4px; }
.field-error { font-size: 12px; color: var(--danger); padding-left: 4px; }

.input,
.textarea,
.select {
  width: 100%;
  min-height: 46px;
  padding: 11px 16px;
  border-radius: var(--r-md);
  background: var(--glass-bg-soft, var(--surface-2));
  color: var(--text-1);
  border: 1px solid var(--glass-border-soft);
  backdrop-filter: blur(12px) saturate(150%);
  -webkit-backdrop-filter: blur(12px) saturate(150%);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  font-size: 14.5px;
  transition: border-color var(--dur-fast) var(--ease-out),
              box-shadow var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
}
.textarea { min-height: 110px; resize: vertical; padding: 12px 16px; line-height: 1.55; }
.select {
  cursor: pointer;
  padding-right: 42px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--brand-2);
  box-shadow: 0 0 0 4px rgba(139,92,246,0.18), inset 0 1px 2px rgba(0,0,0,0.03);
}
.input::placeholder, .textarea::placeholder { color: var(--text-4); }
.input:disabled, .textarea:disabled, .select:disabled { opacity: 0.55; cursor: not-allowed; }
.input.invalid, .textarea.invalid { border-color: var(--danger); }

.input-group { position: relative; display: flex; align-items: center; }
.input-group .input { padding-right: 46px; }
.input-group-btn {
  position: absolute;
  right: 6px;
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--text-3);
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.input-group-btn:hover { background: var(--surface-3); color: var(--text-1); }

.checkbox {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
  color: var(--text-2);
}
.checkbox input { display: none; }
.checkbox .box {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--border-2);
  background: var(--surface-2);
  display: grid; place-items: center;
  transition: all var(--dur-fast) var(--ease-out);
}
.checkbox input:checked + .box {
  background: var(--brand-grad);
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(99,102,241,0.35);
}
.checkbox input:checked + .box::after {
  content: "";
  width: 10px; height: 6px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translateY(-1px);
}

.switch {
  position: relative;
  width: 46px; height: 26px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  cursor: pointer;
  transition: all var(--dur-med) var(--ease-out);
  flex-shrink: 0;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.22);
  transition: transform var(--dur-med) var(--ease-spring);
}
.switch[aria-checked="true"] { background: var(--brand-grad); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* ---------- 1.12 BADGE / PILL ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
  background: var(--surface-3);
  border: 1px solid var(--border-1);
  color: var(--text-2);
}
.badge-brand { background: var(--brand-grad-soft); color: var(--brand-1); border-color: transparent; }
[data-theme="dark"] .badge-brand { color: #a5b4fc; }
.badge-success { background: var(--success-bg); color: var(--success); border-color: transparent; }
.badge-warning { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.badge-danger  { background: var(--danger-bg);  color: var(--danger);  border-color: transparent; }
.badge-info    { background: var(--info-bg);    color: var(--info);    border-color: transparent; }
.badge-dot::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
}

/* ---------- 1.13 DIVIDER / SPACER ---------- */
.divider {
  height: 1px;
  width: 100%;
  background: var(--divider);
  border: none;
  margin: var(--sp-4) 0;
}
.divider-y {
  width: 1px;
  height: auto;
  align-self: stretch;
  background: var(--divider);
}

/* ---------- 1.14 MODAL ---------- */
#modalRoot { position: relative; z-index: var(--z-modal); }
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9,12,20,0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity var(--dur-med) var(--ease-out);
  z-index: var(--z-modal);
  padding: var(--sp-4);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}
.modal-backdrop.active { opacity: 1; }
.modal {
  width: 100%;
  max-width: 520px;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-highlight);
  border-radius: var(--r-xl);
  box-shadow: var(--glass-shadow-lg), var(--glass-inner);
  padding: var(--sp-6);
  transform: scale(0.94) translateY(12px);
  opacity: 0;
  transition: transform var(--dur-med) var(--ease-spring), opacity var(--dur-med) var(--ease-out);
}
.modal-backdrop.active .modal { transform: scale(1) translateY(0); opacity: 1; }
.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.modal-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.modal-close {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--text-3);
  transition: all var(--dur-fast) var(--ease-out);
}
.modal-close:hover { background: var(--surface-3); color: var(--text-1); }

/* ---------- 1.15 TOAST ---------- */
#toastRoot {
  position: fixed;
  top: calc(var(--safe-top) + 16px);
  right: 16px;
  left: 16px;
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  max-width: 380px;
  margin-left: auto;
}
@media (max-width: 480px) { #toastRoot { max-width: none; } }
.toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 16px;
  border-radius: var(--r-md);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-highlight);
  box-shadow: var(--glass-shadow-lg), var(--glass-inner);
  transform: translateX(120%);
  opacity: 0;
  transition: transform var(--dur-med) var(--ease-spring), opacity var(--dur-med) var(--ease-out);
  font-size: 14px;
  color: var(--text-1);
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  margin-top: 1px;
}
.toast-success .toast-icon { color: var(--success); }
.toast-error   .toast-icon { color: var(--danger); }
.toast-warning .toast-icon { color: var(--warning); }
.toast-info    .toast-icon { color: var(--info); }
.toast-msg { flex: 1; min-width: 0; line-height: 1.45; word-wrap: break-word; }
.toast-close {
  color: var(--text-4);
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 4px;
  flex-shrink: 0;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.toast-close:hover { background: var(--surface-3); color: var(--text-1); }

/* ---------- 1.16 SKELETON ---------- */
.skeleton {
  background: linear-gradient(90deg,
    var(--surface-2) 0%,
    var(--surface-hover) 50%,
    var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s ease-in-out infinite;
  border-radius: var(--r-sm);
}
@keyframes skeletonShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-text { height: 14px; border-radius: 4px; }
.skeleton-title { height: 22px; border-radius: 6px; width: 60%; }
.skeleton-img { width: 100%; aspect-ratio: 1/1; border-radius: var(--r-md); }
.skeleton-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); }

/* ---------- 1.17 IMAGE VIEWER ---------- */
#imageViewerRoot {
  position: fixed;
  inset: 0;
  z-index: var(--z-image-viewer);
  pointer-events: none;
}
.iv-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  opacity: 0;
  transition: opacity var(--dur-med) var(--ease-out);
  touch-action: none;
}
.iv-backdrop.active { display: flex; opacity: 1; }
.iv-track {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.iv-img {
  max-width: 92vw;
  max-height: 88vh;
  object-fit: contain;
  user-select: none;
  transform-origin: center center;
  transition: transform var(--dur-fast) var(--ease-out);
  will-change: transform;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  border-radius: 8px;
  cursor: grab;
}
.iv-img:active { cursor: grabbing; }
.iv-btn {
  position: absolute;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.14);
  color: #fff;
  backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  transition: all var(--dur-fast) var(--ease-out);
  z-index: 2;
}
.iv-btn:hover { background: rgba(255,255,255,0.24); }
.iv-close { top: calc(var(--safe-top) + 16px); right: 16px; }
.iv-prev { left: 16px; top: 50%; transform: translateY(-50%); }
.iv-next { right: 16px; top: 50%; transform: translateY(-50%); }
.iv-counter {
  position: absolute;
  top: calc(var(--safe-top) + 20px);
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  border-radius: var(--r-pill);
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(12px);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
}

/* ---------- 1.18 ANIMATIONS ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInLeft  { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseSoft {
  0%,100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.anim-fade { animation: fadeIn var(--dur-med) var(--ease-out) both; }
.anim-up { animation: fadeUp var(--dur-med) var(--ease-out) both; }
.anim-down { animation: fadeDown var(--dur-med) var(--ease-out) both; }
.anim-scale { animation: scaleIn var(--dur-med) var(--ease-spring) both; }
.anim-spin { animation: spin 0.9s linear infinite; }

/* Reveal-on-scroll */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
  will-change: opacity, transform;
}
.reveal.in { opacity: 1; transform: translateY(0); }

/* ---------- 1.19 LOADING SPINNER ---------- */
.spinner {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  opacity: 0.85;
}
.spinner-lg { width: 32px; height: 32px; border-width: 3px; }

.page-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg-0);
  display: grid;
  place-items: center;
  transition: opacity var(--dur-med) var(--ease-out);
}
.page-loader.hide { opacity: 0; pointer-events: none; }

/* ---------- 1.20 UTILITY: ASPECT RATIO ---------- */
.ar-square { aspect-ratio: 1/1; }
.ar-9-16   { aspect-ratio: 9/16; }
.ar-16-9   { aspect-ratio: 16/9; }
.ar-4-5    { aspect-ratio: 4/5; }
.ar-3-4    { aspect-ratio: 3/4; }
.ar-2-3    { aspect-ratio: 2/3; }
.ar-21-9   { aspect-ratio: 21/9; }
.img-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-contain { width: 100%; height: 100%; object-fit: contain; display: block; }

/* ---------- 1.21 ACCESSIBILITY ---------- */
.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/* Reduced motion */
[data-reduced-motion="true"] *,
[data-reduced-motion="true"] *::before,
[data-reduced-motion="true"] *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
  scroll-behavior: auto !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* Focus visible */
:focus-visible {
  outline: 2px solid var(--brand-2);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- 1.22 MOBILE FIRST RESPONSIVE FIXES ---------- */
@media (max-width: 374px) {
  :root { --content-pad: 12px; }
  .btn { padding: 0 var(--sp-4); font-size: 14px; }
}
@media (min-width: 768px) {
  .modal { padding: var(--sp-7); }
}
@media (min-width: 1024px) {
  .modal { max-width: 600px; }
  .modal-lg { max-width: 820px; }
  .modal-xl { max-width: 1080px; }
}

/* iOS input zoom fix */
@supports (-webkit-touch-callout: none) {
  @media (max-width: 767px) {
    .input, .textarea, .select { font-size: 16px; }
  }
}

/* Prevent horizontal overflow */
html, body { max-width: 100vw; overflow-x: hidden; }
</style>

      return () => this.off(event, fn);
    },
    off(event, fn) {

      if (s) s.delete(fn);

    emit(event, detail) {

    const date = d instanceof Date ? d : new Date(d);

    const defaultOpts = { day: '2-digit', month: '2-digit', year: 'numeric' };

  const formatDateTime = (d) => {

    const date = d instanceof Date ? d : new Date(d);

  const slugify = (s) => String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/gi, 'd')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const initials = (name) => {
    if (!name) return '?';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  };

  // Async
  const debounce = (fn, wait = 250) => {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  };
  const throttle = (fn, limit = 200) => {
    let inThrottle = false, lastArgs = null;
    return function (...args) {
      if (!inThrottle) {
        fn.apply(this, args);
        inThrottle = true;
        setTimeout(() => {
          inThrottle = false;
          if (lastArgs) { fn.apply(this, lastArgs); lastArgs = null; }
        }, limit);
      } else {
        lastArgs = args;
      }
    };
  };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const retry = async (fn, attempts = 3, delay = 500) => {
    let lastErr;
    for (let i = 0; i < attempts; i++) {
      try { return await fn(); }
      catch (e) { lastErr = e; if (i < attempts - 1) await sleep(delay * (i + 1)); }
    }
    throw lastErr;
  };

  // Storage (LocalStorage)
  const store = {
    get(key, fallback = null) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); return true; }
      catch { return false; }
    },
    remove(key) {
      try { localStorage.removeItem(key); } catch {}
    }
  };

  // UUID
  const uuidv4 = () => {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  };

  // File
  const readFileAsDataURL = (file) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
  const compressImage = (file, maxDim = 1920, quality = 0.85) => new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('Not an image'));
    readFileAsDataURL(file).then(dataUrl => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if (!blob) return reject(new Error('compress failed'));
          blob.name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = dataUrl;
    }).catch(reject);
  });

  // Theme
  const applyTheme = (theme) => {
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#070b14' : '#6366f1');
    State.theme = theme;
    store.set(CONFIG.THEME_KEY, theme);
    State.emit('theme:changed', theme);
  };
  const initTheme = () => {
    const saved = store.get(CONFIG.THEME_KEY);
    if (saved === 'light' || saved === 'dark') return applyTheme(saved);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  };
  const toggleTheme = () => applyTheme(State.theme === 'dark' ? 'light' : 'dark');

  // Reduced motion
  const initReducedMotion = () => {
    const saved = store.get('lh_reduced_motion');
    const prefers = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const on = saved === true || (saved == null && prefers);
    document.documentElement.setAttribute('data-reduced-motion', on ? 'true' : 'false');
    State.reducedMotion = on;
  };

  /* ---------- 1.5 TOAST SYSTEM ---------- */
  const Toast = {
    _icons: {
      success: 'check-circle',
      error: 'alert-circle',
      warning: 'alert-triangle',
      info: 'info'
    },
    show(msg, type = 'info', duration = 3600) {
      const root = document.getElementById('toastRoot');
      if (!root) return;
      const node = document.createElement('div');
      node.className = `toast toast-${type}`;
      node.innerHTML = `
        <i data-lucide="${this._icons[type] || 'info'}" class="toast-icon"></i>
        <div class="toast-msg">${escapeHtml(msg)}</div>
        <button class="toast-close" aria-label="Đóng"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
      `;
      root.appendChild(node);
      if (window.lucide) window.lucide.createIcons({ nodes: [node] });

      requestAnimationFrame(() => node.classList.add('show'));

      const close = () => {
        node.classList.remove('show');
        setTimeout(() => node.remove(), 300);
      };
      node.querySelector('.toast-close').addEventListener('click', close);
      if (duration > 0) setTimeout(close, duration);
    },
    success(m, d) { this.show(m, 'success', d); },
    error(m, d)   { this.show(m, 'error', d); },
    warning(m, d) { this.show(m, 'warning', d); },
    info(m, d)    { this.show(m, 'info', d); }
  };

  /* ---------- 1.6 MODAL SYSTEM ---------- */
  const Modal = {
    open({ title = '', content = '', size = 'md', onMount = null, actions = null, dismissible = true }) {
      const root = document.getElementById('modalRoot');
      if (!root) return null;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      const sizeClass = size === 'lg' ? 'modal-lg' : size === 'xl' ? 'modal-xl' : '';
      backdrop.innerHTML = `
        <div class="modal ${sizeClass}" role="dialog" aria-modal="true">
          <div class="modal-header">
            <h3 class="modal-title">${escapeHtml(title)}</h3>
            <button class="modal-close" aria-label="Đóng"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-actions" style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;"></div>
        </div>
      `;
      const body = backdrop.querySelector('.modal-body');
      if (typeof content === 'string') body.innerHTML = content;
      else if (content instanceof Node) body.appendChild(content);

      const actionBar = backdrop.querySelector('.modal-actions');
      if (actions && Array.isArray(actions)) {
        actions.forEach(a => {
          const btn = document.createElement('button');
          btn.className = 'btn ' + (a.className || 'btn-glass');
          btn.textContent = a.label;
          if (a.onClick) btn.addEventListener('click', () => a.onClick(close));
          actionBar.appendChild(btn);
        });
      } else {
        actionBar.remove();
      }

      root.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add('active'));
      if (window.lucide) window.lucide.createIcons({ nodes: [backdrop] });

      const close = () => {
        backdrop.classList.remove('active');
        setTimeout(() => backdrop.remove(), 250);
        document.removeEventListener('keydown', onKey);
      };
      const onKey = (e) => { if (e.key === 'Escape' && dismissible) close(); };
      document.addEventListener('keydown', onKey);

      backdrop.querySelector('.modal-close').addEventListener('click', close);
      if (dismissible) {
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      }
      if (onMount) onMount(body, close);
      return { close, backdrop, body };
    },
    confirm(msg, { title = 'Xác nhận', okText = 'Đồng ý', cancelText = 'Hủy', danger = false } = {}) {
      return new Promise(resolve => {
        this.open({
          title,
          content: `<p class="body" style="font-size:15px;line-height:1.6;">${escapeHtml(msg)}</p>`,
          actions: [
            { label: cancelText, className: 'btn-glass', onClick: (close) => { close(); resolve(false); } },
            { label: okText, className: danger ? 'btn-danger' : 'btn-primary', onClick: (close) => { close(); resolve(true); } }
          ]
        });
      });
    }
  };

  /* ---------- 1.7 MODULE REGISTRY (for Part 2-10) ---------- */
  window.LH = window.LH || {};
  Object.assign(window.LH, {
    CONFIG, State, supabase, Toast, Modal,
    $, $$, el,
    formatCurrency, parsePrice,
    formatDate, formatDateTime, timeAgo,
    escapeHtml, slugify, initials,
    debounce, throttle, sleep, retry,
    store, uuidv4,
    readFileAsDataURL, compressImage,
    applyTheme, initTheme, toggleTheme, initReducedMotion
  });

  /* ---------- 1.8 RIPPLE EFFECT ---------- */
  document.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 620);
  }, { passive: true });

  /* ---------- 1.9 INIT ---------- */
  initTheme();
  initReducedMotion();

  // Reapply icons when lucide ready
  if (window.lucide) {
    window.addEventListener('load', () => window.lucide.createIcons());
  } else {
    window.addEventListener('load', () => { if (window.lucide) window.lucide.createIcons(); });
  }

  // Hide page loader after DOM ready (Part 2+ will do real boot)
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('pageLoader');
      if (loader) loader.classList.add('hide');
    }, 250);
  });

  console.log(`%c${CONFIG.APP_NAME} v${CONFIG.APP_VERSION} — Part 1 loaded`, 'color:#6366f1;font-weight:700;');
})();
</script>

      <div class="bnav-item" data-nav="shop"><i data-lucide="shopping-bag"></i><span>Shop</span></div>
      <div class="bnav-center" id="bnavCenter"><i data-lucide="zap"></i></div>
      <div class="bnav-item" data-nav="tools"><i data-lucide="wrench"></i><span>Công cụ</span></div>
      <div class="bnav-item" data-nav="account"><i data-lucide="user"></i><span>Tài khoản</span></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [bn] });
    bn.querySelectorAll('.bnav-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.nav;
        const route = NAV_MAIN.concat(NAV_USER).find(n => n.id === id);
        if (route) location.hash = route.path;
      });
    });
    const center = $('#bnavCenter');
    if (center) {
      center.addEventListener('click', () => {
        if (State.user) location.hash = '#/wallet';
        else openLoginPlaceholder();
      });
    }
  }

  /* ---------- 2.3 ROUTER ---------- */
  const Router = {
    current: null,
    init() {
      window.addEventListener('hashchange', () => this.handle());
      // bind nav links
      document.addEventListener('click', (e) => {
        const link = e.target.closest('[data-nav]');
        if (!link) return;
        // header/sidebar links are <a href>; browser handles
      });
      this.handle();
    },
    handle() {
      const hash = location.hash || '#/';
      const [path] = hash.replace(/^#/, '').split('?');
      const viewName = ROUTES[path] || 'home';
      this.navigate(viewName, hash);
    },
    navigate(viewName, rawHash) {
      this.current = viewName;
      State.currentView = viewName;
      State.emit('route:changed', { view: viewName, hash: rawHash });

      // update active nav
      $$('[data-nav]').forEach(el => {
        if (el.dataset.nav === viewName) el.classList.add('active');
        else el.classList.remove('active');
      });

      // Render view placeholder if no module handles it
      const container = $('#viewContainer');
      if (!container) return;

      // Let other modules (Part 3+) claim the view
      if (State.emit && typeof Router._onView === 'function') {
        // no-op
      }
      window.dispatchEvent(new CustomEvent('lh:view', { detail: { view: viewName, hash: rawHash } }));

      // If no listener rendered content, fall back to a stub
      // Part 3+ registers via LH.Views[viewName] = () => {...}
      const custom = (window.LH.Views && window.LH.Views[viewName]);
      if (typeof custom === 'function') {
        try {
          container.innerHTML = '';
          custom(container, rawHash);
        } catch (e) {
          console.error('[Router] view error', viewName, e);
          container.innerHTML = `<div class="glass card"><div class="h3">Không thể tải trang</div><div class="caption">${escapeHtml(e.message || '')}</div></div>`;
        }
      } else {
        container.innerHTML = `
          <div class="glass card anim-fade" style="text-align:center;padding:48px 24px;">
            <div class="h2 text-gradient" style="margin-bottom:8px;">${viewName}</div>
            <div class="body">Trang này sẽ được hoàn thiện ở các phần tiếp theo.</div>
            <a href="#/" class="btn btn-primary" style="margin-top:20px;"><i data-lucide="arrow-left"></i> Về trang chủ</a>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons({ nodes: [container] });
      }

      // Scroll top
      window.scrollTo({ top: 0, behavior: State.reducedMotion ? 'auto' : 'smooth' });
    }
  };
  window.LH.Router = Router;

  /* ---------- 2.4 HEADER SCROLL ---------- */
  let lastScrollY = 0;
  let scrollTicking = false;
  function onScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      const header = $('#appHeader');
      const bnav = $('#bottomNav');
      const y = window.scrollY;
      if (header) header.classList.toggle('scrolled', y > 20);
      if (bnav) {
        if (y > lastScrollY && y > 200) bnav.classList.add('hidden-by-scroll');
        else bnav.classList.remove('hidden-by-scroll');
      }
      lastScrollY = y;
      scrollTicking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ---------- 2.5 SIDEBAR (mobile drawer) ---------- */
  function openMobileSidebar() {
    const sb = $('#appSidebar');
    const ov = $('#sidebarOverlay');
    if (!sb) return;
    sb.classList.add('mobile-open');
    requestAnimationFrame(() => sb.classList.add('visible'));
    if (ov) ov.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeMobileSidebar() {
    const sb = $('#appSidebar');
    const ov = $('#sidebarOverlay');
    if (!sb) return;
    sb.classList.remove('visible');
    setTimeout(() => sb.classList.remove('mobile-open'), 220);
    if (ov) ov.classList.remove('active');
    document.body.style.overflow = '';
  }
  window.LH.openMobileSidebar = openMobileSidebar;
  window.LH.closeMobileSidebar = closeMobileSidebar;

  /* ---------- 2.6 DROPDOWN MANAGEMENT ---------- */
  const Dropdown = {
    openId: null,
    open(id) {
      this.closeAll();
      const node = document.getElementById(id);
      const backdrop = $('#dropdownBackdrop');
      if (!node) return;
      node.classList.add('open');
      if (backdrop) backdrop.classList.add('active');
      this.openId = id;
    },
    closeAll() {
      ['settingsPanel', 'notifPanel', 'userMenu'].forEach(id => {
        const n = document.getElementById(id);
        if (n) n.classList.remove('open');
      });
      const backdrop = $('#dropdownBackdrop');
      if (backdrop) backdrop.classList.remove('active');
      this.openId = null;
    }
  };
  window.LH.Dropdown = Dropdown;

  document.addEventListener('click', (e) => {
    if (e.target.closest('#dropdownBackdrop')) {
      Dropdown.closeAll();
      return;
    }
    // close when clicking data-close
    const closeBtn = e.target.closest('[data-close]');
    if (closeBtn) {
      const id = closeBtn.dataset.close;
      const n = document.getElementById(id);
      if (n) n.classList.remove('open');
      const bd = $('#dropdownBackdrop');
      if (bd) bd.classList.remove('active');
      return;
    }
    // close when clicking outside any panel
    if (Dropdown.openId) {
      const inside = e.target.closest('.settings-panel, .notif-panel, .user-menu, [data-open-panel]');
      if (!inside) {
        Dropdown.closeAll();
      }
    }
  });

  /* ---------- 2.7 THEME / SETTINGS ---------- */
  const Settings = {
    applyState() {
      const dark = State.theme === 'dark';
      const ts = $('#themeSwitch');
      if (ts) ts.setAttribute('aria-checked', dark ? 'true' : 'false');
      const ms = $('#motionSwitch');
      if (ms) ms.setAttribute('aria-checked', State.reducedMotion ? 'true' : 'false');
      const ss = $('#snowSwitch');
      if (ss) ss.setAttribute('aria-checked', State.snowEnabled ? 'true' : 'false');
      const mus = $('#musicSwitch');
      if (mus) mus.setAttribute('aria-checked', State.musicEnabled ? 'true' : 'false');
      // theme toggle icon
      const tb = $('#themeToggleBtn');
      if (tb) {
        tb.innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon'}"></i>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [tb] });
      }
    },
    toggleTheme() {
      applyTheme(State.theme === 'dark' ? 'light' : 'dark');
      this.applyState();
    },
    toggleMotion() {
      State.reducedMotion = !State.reducedMotion;
      document.documentElement.setAttribute('data-reduced-motion', State.reducedMotion ? 'true' : 'false');
      store.set('lh_reduced_motion', State.reducedMotion);
      this.applyState();
    },
    toggleSnow() {
      State.snowEnabled = !State.snowEnabled;
      store.set(CONFIG.SNOW_STATE_KEY, { enabled: State.snowEnabled, density: Snow.density });
      Snow.setEnabled(State.snowEnabled);
      this.applyState();
    },
    toggleMusic() {
      State.musicEnabled = !State.musicEnabled;
      store.set(CONFIG.MUSIC_STATE_KEY, { enabled: State.musicEnabled });
      if (State.musicEnabled) {
        $('#musicDock')?.classList.add('open');
        Music.start();
      } else {
        $('#musicDock')?.classList.remove('open');
        Music.stop();
      }
      this.applyState();
    }
  };
  window.LH.Settings = Settings;

  /* ---------- 2.8 SNOW ENGINE ---------- */
  const Snow = {
    density: 3,
    flakes: [],
    rafId: null,
    enabled: false,
    setEnabled(on) {
      this.enabled = on;
      const layer = $('#snowLayer');
      if (!layer) return;
      if (on) {
        layer.classList.add('active');
        this.spawn();
        this.start();
      } else {
        layer.classList.remove('active');
        this.stop();
        this.cleanup();
      }
    },
    spawn() {
      const layer = $('#snowLayer');
      if (!layer) return;
      this.cleanup();
      const isWeak = this.isWeakDevice();
      const baseCount = isWeak ? 20 : 40;
      const count = baseCount + (this.density - 3) * (isWeak ? 5 : 12);
      const total = Math.max(10, Math.min(120, count));
      for (let i = 0; i < total; i++) {
        const size = (isWeak ? 2 : 3) + Math.random() * (isWeak ? 3 : 5);
        const flake = document.createElement('div');
        flake.className = 'snow-flake';
        flake.style.width = flake.style.height = size + 'px';
        flake.style.left = Math.random() * 100 + '%';
        const dur = 6 + Math.random() * 8;
        const delay = -Math.random() * dur;
        flake.style.animationDuration = dur + 's';
        flake.style.animationDelay = delay + 's';
        flake.style.opacity = 0.4 + Math.random() * 0.5;
        flake.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
        layer.appendChild(flake);
        this.flakes.push(flake);
      }
    },
    isWeakDevice() {
      return navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
    },
    start() { /* CSS animations drive flakes */ },
    stop() { /* Nothing needed */ },
    cleanup() {
      const layer = $('#snowLayer');
      if (layer) layer.innerHTML = '';
      this.flakes = [];
    },
    setDensity(v) {
      this.density = v;
      store.set(CONFIG.SNOW_STATE_KEY, { enabled: this.enabled, density: v });
      if (this.enabled) this.spawn();
      const lbl = $('#snowDensityLabel');
      if (lbl) lbl.textContent = ['Rất thưa','Thưa','Vừa','Dày','Rất dày'][v - 1] || 'Vừa';
    }
  };
  window.LH.Snow = Snow;

  /* ---------- 2.9 MUSIC PLAYER (shell — playlist extended in Part 8) ---------- */
  const Music = {
    playlist: [
      { title: 'Lưu Niên', artist: 'Playlist mặc định', src: '' },
      { title: 'Người Dưng', artist: 'Playlist mặc định', src: '' },
      { title: 'Thương Nhau Đến Thế', artist: 'Playlist mặc định', src: '' },
      { title: 'Ngược Lối Yêu', artist: 'Playlist mặc định', src: '' }
    ],
    index: 0,
    audio: null,
    playing: false,
    init() {
      this.audio = new Audio();
      this.audio.addEventListener('timeupdate', () => this.updateProgress());
      this.audio.addEventListener('ended', () => this.next());
      this.render();
      $('#musicPlay')?.addEventListener('click', () => this.toggle());
      $('#musicNext')?.addEventListener('click', () => this.next());
      $('#musicPrev')?.addEventListener('click', () => this.prev());
      $('#musicClose')?.addEventListener('click', () => {
        $('#musicDock')?.classList.remove('open');
        this.pause();
        State.musicEnabled = false;
        Settings.applyState();
      });
      $('#musicProgress')?.addEventListener('click', (e) => {
        const bar = e.currentTarget;
        const rect = bar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        if (this.audio.duration) {
          this.audio.currentTime = this.audio.duration * pct;
        }
      });
    },
    render() {
      const t = $('#musicTitle');
      const a = $('#musicArtist');
      const cur = this.playlist[this.index];
      if (t) t.textContent = cur.title;
      if (a) a.textContent = cur.artist;
    },
    toggle() {
      if (this.playing) this.pause();
      else this.play();
    },
    play() {
      const cur = this.playlist[this.index];
      if (!cur.src) {
        Toast.info('Playlist nhạc sẽ được cấu hình ở phần Âm nhạc (Phần 8).');
        return;
      }
      this.audio.src = cur.src;
      this.audio.play().then(() => {
        this.playing = true;
        this.updatePlayBtn();
      }).catch(err => {
        Toast.error('Không phát được nhạc: ' + err.message);
      });
    },
    pause() {
      this.audio.pause();
      this.playing = false;
      this.updatePlayBtn();
    },
    stop() { this.pause(); },
    start() { this.play(); },
    next() {
      this.index = (this.index + 1) % this.playlist.length;
      this.render();
      if (this.playing) this.play();
    },
    prev() {
      this.index = (this.index - 1 + this.playlist.length) % this.playlist.length;
      this.render();
      if (this.playing) this.play();
    },
    updatePlayBtn() {
      const btn = $('#musicPlay');
      if (!btn) return;
      btn.innerHTML = `<i data-lucide="${this.playing ? 'pause' : 'play'}"></i>`;
      if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
    },
    updateProgress() {
      if (!this.audio.duration) return;
      const pct = (this.audio.currentTime / this.audio.duration) * 100;
      const bar = $('#musicProgressBar');
      if (bar) bar.style.width = pct + '%';
    }
  };
  window.LH.Music = Music;

  /* ---------- 2.10 USER HEADER STATE ---------- */
  function renderUserState() {
    const chip = $('#userChip');
    const nameEl = $('#userChipName');
    const avatarEl = $('#userChipAvatar');
    const loginBtn = $('#loginBtn');
    const notifBtn = $('#notifBtn');
    if (State.user && State.profile) {
      if (chip) chip.style.display = 'flex';
      if (loginBtn) loginBtn.style.display = 'none';
      if (nameEl) nameEl.textContent = State.profile.display_name || State.profile.username || 'User';
      if (avatarEl) {
        if (State.profile.avatar_url) {
          avatarEl.innerHTML = `<img src="${escapeHtml(State.profile.avatar_url)}" alt="">`;
        } else {
          avatarEl.textContent = initials(State.profile.display_name || State.profile.username);
        }
      }
      if (notifBtn) notifBtn.style.display = 'grid';
    } else {
      if (chip) chip.style.display = 'none';
      if (loginBtn) loginBtn.style.display = 'grid';
      if (notifBtn) notifBtn.style.display = 'none';
    }
    // rebuild user menu
    renderUserMenu();
    // rebuild sidebar (admin section)
    renderSidebar();
  }
  window.LH.renderUserState = renderUserState;

  function renderUserMenu() {
    const menu = $('#userMenu');
    if (!menu) return;
    if (!State.user) {
      menu.innerHTML = `
        <div class="user-menu-item" data-action="login"><i data-lucide="log-in"></i> Đăng nhập</div>
        <div class="user-menu-item" data-action="register"><i data-lucide="user-plus"></i> Đăng ký</div>
      `;
    } else {
      menu.innerHTML = `
        <div class="user-menu-head">
          <div class="user-menu-name">${escapeHtml(State.profile?.display_name || State.profile?.username || 'User')}</div>
          <div class="user-menu-role">${State.isAdmin ? 'Quản trị viên' : 'Thành viên'}</div>
        </div>
        <a class="user-menu-item" href="#/account" data-nav="account"><i data-lucide="user"></i> Tài khoản</a>
        <a class="user-menu-item" href="#/wallet" data-nav="wallet"><i data-lucide="wallet"></i> Ví & nạp tiền</a>
        <a class="user-menu-item" href="#/orders" data-nav="orders"><i data-lucide="package"></i> Đơn hàng</a>
        ${State.isAdmin ? `<a class="user-menu-item" href="#/admin" data-nav="admin"><i data-lucide="shield"></i> Quản trị</a>` : ''}
        <div class="user-menu-sep"></div>
        <div class="user-menu-item danger" data-action="logout"><i data-lucide="log-out"></i> Đăng xuất</div>
      `;
    }
    if (window.lucide) window.lucide.createIcons({ nodes: [menu] });

    menu.querySelectorAll('[data-action="login"]').forEach(n => n.addEventListener('click', () => {
      Dropdown.closeAll();
      if (window.LH.Auth) window.LH.Auth.openLogin();
      else Toast.info('Đăng nhập sẽ khả dụng ở Phần 5.');
    }));
    menu.querySelectorAll('[data-action="register"]').forEach(n => n.addEventListener('click', () => {
      Dropdown.closeAll();
      if (window.LH.Auth) window.LH.Auth.openRegister();
      else Toast.info('Đăng ký sẽ khả dụng ở Phần 5.');
    }));
    menu.querySelectorAll('[data-action="logout"]').forEach(n => n.addEventListener('click', async () => {
      Dropdown.closeAll();
      if (window.LH.Auth && window.LH.Auth.logout) {
        const ok = await window.LH.Modal.confirm('Bạn có chắc muốn đăng xuất?', { okText: 'Đăng xuất', danger: true });
        if (ok) await window.LH.Auth.logout();
      } else {
        Toast.info('Đăng xuất sẽ khả dụng ở Phần 5.');
      }
    }));
  }

  function openLoginPlaceholder() {
    if (window.LH.Auth) window.LH.Auth.openLogin();
    else Toast.info('Đăng nhập sẽ khả dụng ở Phần 5.');
  }

  /* ---------- 2.11 NOTIFICATIONS ---------- */
  function renderNotifications() {
    const list = $('#notifList');
    if (!list) return;
    const items = State.notifications || [];
    if (!items.length) {
      list.innerHTML = `<div class="notif-empty"><i data-lucide="bell-off" style="width:28px;height:28px;opacity:0.5;margin-bottom:8px;"></i><div>Chưa có thông báo</div></div>`;
      if (window.lucide) window.lucide.createIcons({ nodes: [list] });
      return;
    }
    list.innerHTML = items.slice(0, 30).map(n => `
      <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${escapeHtml(n.id || '')}">
        <div class="notif-icon"><i data-lucide="${escapeHtml(n.icon || 'bell')}"></i></div>
        <div class="notif-body">
          <div class="notif-title">${escapeHtml(n.title || '')}</div>
          <div class="notif-desc">${escapeHtml(n.message || n.body || '')}</div>
          <div class="notif-time">${escapeHtml(n.time_label || '')}</div>
        </div>
      </div>
    `).join('');
    if (window.lucide) window.lucide.createIcons({ nodes: [list] });
    updateNotifBadge();
  }
  window.LH.renderNotifications = renderNotifications;

  function updateNotifBadge() {
    const unread = (State.notifications || []).filter(n => !n.read).length;
    const btn = $('#notifBtn');
    if (!btn) return;
    if (unread > 0) {
      btn.classList.add('has-badge');
      btn.dataset.badge = unread > 99 ? '99+' : String(unread);
    } else {
      btn.classList.remove('has-badge');
      btn.removeAttribute('data-badge');
    }
  }

  /* ---------- 2.12 EVENT BINDINGS ---------- */
  function bindHeaderEvents() {
    $('#brandBtn')?.addEventListener('click', () => location.hash = '#/');

    $('#themeToggleBtn')?.addEventListener('click', () => Settings.toggleTheme());

    $('#loginBtn')?.addEventListener('click', () => openLoginPlaceholder());

    $('#userChip')?.addEventListener('click', (e) => {
      e.stopPropagation();
      Dropdown.open('userMenu');
    });

    $('#notifBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      Dropdown.open('notifPanel');
      renderNotifications();
    });

    // Settings panel: opened from sidebar? For now bind a dedicated button later.
    // Attach to a keyboard shortcut and to the theme toggle long-press? Keep simple:
    // Provide through `openSettingsPanel()` in LH API.

    // mobile menu
    const menuToggle = $('#menuToggle');
    if (menuToggle) {
      const mq = window.matchMedia('(max-width: 1023px)');
      const update = () => {
        menuToggle.style.display = mq.matches ? 'grid' : 'none';
        menuToggle.innerHTML = `<i data-lucide="menu"></i>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [menuToggle] });
      };
      update();
      mq.addEventListener('change', update);
      menuToggle.addEventListener('click', openMobileSidebar);
    }
    $('#sidebarOverlay')?.addEventListener('click', closeMobileSidebar);

    // mobile search
    $('#searchMobileBtn')?.addEventListener('click', () => {
      const ms = $('#mobileSearch');
      if (ms) {
        ms.classList.add('open');
        setTimeout(() => $('#mobileSearchInput')?.focus(), 80);
      }
    });
    $('#mobileSearchClose')?.addEventListener('click', () => {
      $('#mobileSearch')?.classList.remove('open');
    });

    // theme switch
    $('#themeSwitch')?.addEventListener('click', () => Settings.toggleTheme());
    $('#themeSwitch')?.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Settings.toggleTheme(); }
    });
    $('#motionSwitch')?.addEventListener('click', () => Settings.toggleMotion());
    $('#motionSwitch')?.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Settings.toggleMotion(); }
    });
    $('#snowSwitch')?.addEventListener('click', () => Settings.toggleSnow());
    $('#snowSwitch')?.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Settings.toggleSnow(); }
    });
    $('#musicSwitch')?.addEventListener('click', () => Settings.toggleMusic());
    $('#musicSwitch')?.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Settings.toggleMusic(); }
    });
    $('#snowDensity')?.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10);
      Snow.setDensity(v);
    });

    // mark all notifications read
    $('#markAllRead')?.addEventListener('click', () => {
      (State.notifications || []).forEach(n => n.read = true);
      renderNotifications();
      State.emit('notifications:read');
      Toast.success('Đã đánh dấu tất cả đã đọc.');
    });
  }

  /* ---------- 2.13 SETTINGS RESTORE ---------- */
  function restoreSettings() {
    const snow = store.get(CONFIG.SNOW_STATE_KEY);
    if (snow && snow.enabled) {
      State.snowEnabled = true;
      Snow.density = snow.density || 3;
      Snow.setEnabled(true);
      const inp = $('#snowDensity');
      if (inp) inp.value = Snow.density;
      Snow.setDensity(Snow.density);
    }
    const mus = store.get(CONFIG.MUSIC_STATE_KEY);
    if (mus && mus.enabled) {
      State.musicEnabled = true;
      // Don't autoplay; just show dock
      $('#musicDock')?.classList.add('open');
    }
    Settings.applyState();
  }

  /* ---------- 2.14 PUBLIC API: SETTINGS PANEL ---------- */
  function openSettingsPanel() {
    Dropdown.open('settingsPanel');
  }
  window.LH.openSettingsPanel = openSettingsPanel;

  /* ---------- 2.15 INIT ---------- */
  function init() {
    renderHeaderNav();
    renderSidebar();
    renderBottomNav();
    renderUserState();
    renderNotifications();
    bindHeaderEvents();
    restoreSettings();
    Music.init();
    Settings.applyState();
    Router.init();

    // expose helper for other modules
    window.LH.Views = window.LH.Views || {};

    if (window.lucide) window.lucide.createIcons();
    console.log('%cPart 2 loaded — Shell, Router, Snow, Settings, Music shell', 'color:#8b5cf6;font-weight:700;');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
