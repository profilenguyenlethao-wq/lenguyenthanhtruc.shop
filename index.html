<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>NovaStore — Premium Digital Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}

:root{
  --primary:#6366f1; --primary-hover:#4f46e5; --secondary:#ec4899; --accent:#06b6d4;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --bg:#0f172a; --bg-elev:#1e293b; --bg-soft:rgba(30,41,59,.6);
  --card:rgba(30,41,59,.55); --card-hover:rgba(30,41,59,.8);
  --text:#e2e8f0; --text-muted:#94a3b8; --border:rgba(148,163,184,.15); --glass:rgba(15,23,42,.6);
  --radius:16px; --radius-sm:10px; --radius-lg:24px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.2); --shadow:0 10px 30px rgba(0,0,0,.3); --shadow-lg:0 20px 60px rgba(0,0,0,.4);
  --transition:.25s cubic-bezier(.4,0,.2,1); --header-h:64px;
}
[data-theme="light"]{
  --bg:#f8fafc; --bg-elev:#ffffff; --bg-soft:rgba(255,255,255,.7);
  --card:rgba(255,255,255,.75); --card-hover:rgba(255,255,255,.95);
  --text:#0f172a; --text-muted:#64748b; --border:rgba(15,23,42,.08); --glass:rgba(248,250,252,.75);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06); --shadow:0 10px 30px rgba(15,23,42,.08); --shadow-lg:0 20px 60px rgba(15,23,42,.12);
}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
[data-theme="dark"] body{background:radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.18), transparent 60%),radial-gradient(900px 500px at 110% 10%, rgba(236,72,153,.14), transparent 60%),var(--bg)}
[data-theme="light"] body{background:radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.10), transparent 60%),radial-gradient(900px 500px at 110% 10%, rgba(236,72,153,.08), transparent 60%),var(--bg)}
h1,h2,h3,h4,h5{font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:1.2;letter-spacing:-.02em}

.container{width:100%;max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.container{padding:0 24px}}
.section{padding:56px 0}
@media(min-width:768px){.section{padding:80px 0}}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.flex-center{display:flex;justify-content:center;align-items:center}.flex-col{flex-direction:column}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
.text-center{text-align:center}.text-muted{color:var(--text-muted)}.hide{display:none!important}
.section-title{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-bottom:8px}
.section-sub{color:var(--text-muted);max-width:640px;margin-bottom:32px}
.gradient-text{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}

.header{position:sticky;top:0;z-index:100;height:var(--header-h);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:var(--transition)}
.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.15rem}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.35)}
.brand-icon svg{width:20px;height:20px}
.nav-desktop{display:none}
@media(min-width:900px){.nav-desktop{display:flex;align-items:center;gap:6px}}
.nav-link{padding:8px 14px;border-radius:10px;color:var(--text-muted);font-weight:500;font-size:.92rem;transition:var(--transition);display:flex;align-items:center;gap:6px}
.nav-link:hover,.nav-link.active{color:var(--text);background:var(--bg-soft)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text);background:transparent;transition:var(--transition);position:relative}
.icon-btn:hover{background:var(--bg-soft)}.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--secondary);color:#fff;font-size:.65rem;font-weight:700;display:grid;place-items:center}
.mobile-menu-btn{display:flex}@media(min-width:900px){.mobile-menu-btn{display:none}}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);background:var(--bg-elev);border-left:1px solid var(--border);z-index:201;padding:20px;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}.drawer.open{transform:translateX(0)}
.drawer-nav{display:flex;flex-direction:column;gap:4px;margin-top:20px}.drawer-nav .nav-link{padding:12px 14px;font-size:1rem}
.drawer-close{position:absolute;top:16px;right:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:.92rem;transition:var(--transition);border:1px solid transparent;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.35)}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,.45)}
.btn-outline{border-color:var(--border);color:var(--text);background:var(--bg-soft)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{color:var(--text-muted)}.btn-ghost:hover{color:var(--text);background:var(--bg-soft)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:7px 12px;font-size:.82rem}.btn-lg{padding:14px 28px;font-size:1rem}.btn-block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:var(--transition);overflow:hidden}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(99,102,241,.35);background:var(--card-hover)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.badge-primary{background:rgba(99,102,241,.15);color:#a5b4fc}.badge-hot{background:linear-gradient(135deg,var(--secondary),#f43f5e);color:#fff}
.badge-success{background:rgba(16,185,129,.15);color:#34d399}.badge-warning{background:rgba(245,158,11,.15);color:#fbbf24}.badge-danger{background:rgba(239,68,68,.15);color:#f87171}

.hero{position:relative;padding:64px 0 48px;overflow:hidden}@media(min-width:768px){.hero{padding:96px 0 64px}}
.hero-inner{display:grid;gap:32px;align-items:center}@media(min-width:1024px){.hero-inner{grid-template-columns:1.15fr .85fr;gap:56px}}
.hero h1{font-size:clamp(2rem,5.2vw,3.75rem);line-height:1.08;margin-bottom:16px;letter-spacing:-.03em}
.hero p{font-size:clamp(1rem,1.4vw,1.15rem);color:var(--text-muted);max-width:600px;margin-bottom:28px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:32px}
.hero-stats{display:flex;flex-wrap:wrap;gap:32px;padding-top:24px;border-top:1px solid var(--border)}
.hero-stat strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stat span{font-size:.85rem;color:var(--text-muted)}
.profile-card-hero{position:relative;padding:32px;border-radius:var(--radius-lg);background:linear-gradient(145deg,rgba(99,102,241,.15),rgba(236,72,153,.10));border:1px solid var(--border);backdrop-filter:blur(20px);overflow:hidden}
.profile-card-hero::before{content:'';position:absolute;inset:-40% -20% auto auto;width:280px;height:280px;background:radial-gradient(circle,rgba(236,72,153,.35),transparent 60%);filter:blur(40px);pointer-events:none}
.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--bg-elev);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.verified-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:rgba(6,182,212,.15);color:var(--accent);font-size:.72rem;font-weight:700}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;box-shadow:0 0 8px var(--success)}
.product-card{position:relative;display:flex;flex-direction:column}
.product-thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-elev)}
.product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.product-card:hover .product-thumb img{transform:scale(1.06)}
.product-badge{position:absolute;top:10px;left:10px}.product-fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}.product-fav svg{width:16px;height:16px}
.product-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.product-cat{font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.product-name{font-weight:600;font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.product-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price-current{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:var(--primary)}
.price-original{font-size:.82rem;color:var(--text-muted);text-decoration:line-through}
.product-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
.section-head h2{font-size:clamp(1.5rem,3vw,2rem)}.section-head p{color:var(--text-muted);margin-top:4px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}@media(min-width:768px){.cat-grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1024px){.cat-grid{grid-template-columns:repeat(8,1fr)}}
.cat-item{padding:20px 12px;text-align:center;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);transition:var(--transition);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.82rem;font-weight:600}
.cat-item:hover{transform:translateY(-3px);border-color:var(--primary);background:var(--card-hover)}
.cat-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(236,72,153,.15));color:var(--primary)}.cat-icon svg{width:22px;height:22px}
.benefit{padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);transition:var(--transition)}.benefit:hover{transform:translateY(-4px);border-color:var(--primary)}
.benefit-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;margin-bottom:16px}.benefit-icon svg{width:24px;height:24px}
.benefit h3{font-size:1.05rem;margin-bottom:8px}.benefit p{color:var(--text-muted);font-size:.9rem}
.process-step{position:relative;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);text-align:center}
.process-step .num{width:44px;height:44px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:700;font-size:1.1rem}
.process-step h4{font-size:1rem;margin-bottom:8px}.process-step p{color:var(--text-muted);font-size:.88rem}
.footer{margin-top:64px;padding:48px 0 24px;border-top:1px solid var(--border);background:var(--bg-soft);backdrop-filter:blur(10px)}
.footer-grid{display:grid;gap:32px;margin-bottom:32px}@media(min-width:768px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr}}
.footer-col h4{font-size:.95rem;margin-bottom:16px;color:var(--text)}.footer-col a{display:block;color:var(--text-muted);font-size:.88rem;padding:5px 0;transition:var(--transition)}.footer-col a:hover{color:var(--primary)}
.footer-socials{display:flex;gap:8px;margin-top:16px}.footer-socials a{width:36px;height:36px;border-radius:10px;background:var(--bg-elev);display:grid;place-items:center;transition:var(--transition)}.footer-socials a:hover{background:var(--primary);color:#fff}
.footer-bottom{padding-top:24px;border-top:1px solid var(--border);text-align:center;font-size:.82rem;color:var(--text-muted)}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{min-width:240px;max-width:340px;padding:12px 16px;border-radius:12px;background:var(--bg-elev);border:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;font-size:.9rem;font-weight:500;transform:translateX(120%);transition:transform .35s cubic-bezier(.4,0,.2,1);pointer-events:auto}.toast.show{transform:translateX(0)}
.toast-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.toast-icon svg{width:16px;height:16px}
.toast.success .toast-icon{background:rgba(16,185,129,.2);color:var(--success)}.toast.error .toast-icon{background:rgba(239,68,68,.2);color:var(--danger)}.toast.info .toast-icon{background:rgba(6,182,212,.2);color:var(--accent)}
@media(max-width:480px){#toast-root{left:16px;right:16px;bottom:16px}.toast{min-width:0;width:100%}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:1000;display:none;place-items:center;padding:16px}.modal-backdrop.open{display:grid}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:modalIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:16px}
.modal-body{padding:24px}.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.input,.select,.textarea{width:100%;padding:11px 14px;border-radius:var(--radius-sm);background:var(--bg-soft);border:1px solid var(--border);color:var(--text);font-size:.92rem;transition:var(--transition)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.textarea{min-height:100px;resize:vertical}.label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--text)}.form-group{margin-bottom:14px}
.skeleton{background:linear-gradient(90deg,var(--bg-soft),var(--bg-elev),var(--bg-soft));background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{padding:64px 24px;text-align:center;color:var(--text-muted)}.empty svg{width:56px;height:56px;margin:0 auto 16px;opacity:.4}.empty h3{color:var(--text);margin-bottom:8px}

/* --- PART 2 CSS --- */
.breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.82rem;color:var(--text-muted);margin-bottom:20px}.breadcrumb a{color:var(--text-muted)}.breadcrumb a:hover{color:var(--primary)}.breadcrumb svg{width:14px;height:14px}
.page-head{padding:32px 0 8px}.page-head h1{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-bottom:8px}.page-head p{color:var(--text-muted);max-width:640px}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);margin-bottom:20px;position:sticky;top:calc(var(--header-h) + 8px);z-index:30;backdrop-filter:blur(20px)}
.filter-bar .search-wrap{position:relative;flex:1 1 240px;min-width:200px}.filter-bar .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}.filter-bar .search-wrap .input{padding-left:36px}
.filter-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.filter-cats::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:20px;background:var(--bg-soft);border:1px solid var(--border);font-size:.85rem;font-weight:500;white-space:nowrap;transition:var(--transition);cursor:pointer}.chip:hover{border-color:var(--primary);color:var(--primary)}.chip.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-color:transparent}
.filter-bar select{min-width:170px;background:var(--bg-soft);border:1px solid var(--border);padding:10px 14px;border-radius:var(--radius-sm);color:var(--text);font-size:.9rem}
.result-count{color:var(--text-muted);font-size:.85rem;margin-bottom:16px}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:32px;flex-wrap:wrap}.pagination a,.pagination span{min-width:40px;height:40px;padding:0 12px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;font-weight:600;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);transition:var(--transition)}.pagination a:hover{border-color:var(--primary);color:var(--primary)}.pagination a.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-color:transparent}
.product-detail{display:grid;gap:32px;margin-top:16px}@media(min-width:900px){.product-detail{grid-template-columns:1fr 1fr}}
.product-gallery{display:flex;flex-direction:column;gap:12px}.gallery-main{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;background:var(--bg-elev);border:1px solid var(--border);position:relative}.gallery-main img{width:100%;height:100%;object-fit:cover}
.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.gallery-thumbs::-webkit-scrollbar{display:none}
.gallery-thumb{flex:0 0 80px;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:var(--transition);background:var(--bg-elev)}.gallery-thumb:hover,.gallery-thumb.active{border-color:var(--primary)}.gallery-thumb img{width:100%;height:100%;object-fit:cover}
.pd-info h1{font-size:clamp(1.4rem,2.6vw,2rem);margin-bottom:12px}
.pd-price{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}.pd-price .price-current{font-size:1.8rem;color:var(--primary);font-family:'Space Grotesk',sans-serif;font-weight:700}.pd-price .price-original{font-size:1rem}.pd-price .discount{background:var(--danger);color:#fff;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px}
.pd-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.pd-meta-item{padding:12px;border-radius:10px;background:var(--bg-soft);border:1px solid var(--border);font-size:.85rem}.pd-meta-item strong{display:block;color:var(--text-muted);font-size:.75rem;font-weight:500;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}

function shade(hex, percent){
  const n = parseInt(hex.replace('#',''), 16);

}

async function copyText(text, successMsg='Đã sao chép'){
  try { if (navigator.clipboard) await navigator.clipboard.writeText(text); else throw new Error('no clipboard'); } catch(e){ const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }
  toast(successMsg, 'success', 1800);
}
function parseQuery(hash){ const qs = (hash.split('?')[1]) || ''; const out = {}; new URLSearchParams(qs).forEach((v,k)=>{ out[k]=v; }); return out; }
function setQueryParam(key, val){
  const [path, qs=''] = location.hash.replace(/^#/, '').split('?');
  const p = new URLSearchParams(qs);
  if (val === null || val === '') p.delete(key); else p.set(key, val);
  const newHash = '#' + path + (p.toString()? '?'+p.toString() : ''); history.replaceState(null, '', newHash);
}
function buildVietQRUrl(amount, content){
  const b = state.bank;
  return `https://img.vietqr.io/image/${b.bankBin}-${b.accountNumber}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(content)}&accountName=${encodeURIComponent(b.accountName)}`;
}
async function downloadImage(url, filename){
  try{ const res = await fetch(url, {mode:'cors'}); const blob = await res.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); toast('Đã tải QR', 'success'); }catch(e){ window.open(url, '_blank'); toast('Đã mở ảnh QR trong tab mới', 'info'); }
}
function genOrderCode(){ return 'DH' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*90+10); }
function genDepositCode(){ return 'NAP' + Date.now().toString(36).toUpperCase().slice(-6) + Math.floor(Math.random()*90+10); }
function genTicketCode(){ return 'LH' + Date.now().toString(36).toUpperCase(); }
function paginationHTML(current, total, baseUrl){
  if (total <= 1) return '';
  const pages = []; for (let i=1; i<=total; i++){ if (i===1 || i===total || Math.abs(i-current)<=1) pages.push(i); else if (pages[pages.length-1] !== '...') pages.push('...'); }
  return `<div class="pagination">${current>1 ? `<a href="${baseUrl}&page=${current-1}">‹</a>` : ''}${pages.map(p => p==='...' ? `<span>…</span>` : `<a href="${baseUrl}&page=${p}" class="${p===current?'active':''}">${p}</a>`).join('')}${current<total ? `<a href="${baseUrl}&page=${current+1}">›</a>` : ''}</div>`;
}

    withLayout(html); bindCartEvents();
  }
  function bindCartEvents(){
    document.querySelectorAll('[data-cart-inc]').forEach(b=>b.onclick = ()=>{ changeQty(b.dataset.cartInc, 1); });
    document.querySelectorAll('[data-cart-dec]').forEach(b=>b.onclick = ()=>{ changeQty(b.dataset.cartDec, -1); });
    document.querySelectorAll('[data-cart-qty]').forEach(inp=>{ inp.onchange = ()=>{ setQty(inp.dataset.cartQty, parseInt(inp.value)||1); }; });
    document.querySelectorAll('[data-cart-del]').forEach(b=>b.onclick = ()=>{ const pid = b.dataset.cartDel; confirmDialog('Xóa sản phẩm khỏi giỏ?', ()=>{ removeCartItem(pid); render(); }, {danger:true, confirmText:'Xóa'}); });

  }
  function changeQty(pid, delta){ const item = state.cart.find(i=>i.productId===pid); if (!item) return; const p = state.products.find(x=>x.id===pid); const nq = item.qty + delta; if (nq < 1) return; if (p && nq > p.stock) return toast(`Chỉ còn ${p.stock}`, 'error'); item.qty = nq; saveState(); updateHeaderBadge(); render(); }
  function setQty(pid, qty){ const item = state.cart.find(i=>i.productId===pid); if (!item) return; const p = state.products.find(x=>x.id===pid); item.qty = Math.max(1, Math.min(p?.stock||9999, qty)); saveState(); updateHeaderBadge(); render(); }
  function removeCartItem(pid){ state.cart = state.cart.filter(i=>i.productId!==pid); saveState(); updateHeaderBadge(); }
  function submitOrder(form){
    const fd = new FormData(form); const customer = { name: (fd.get('name')||'').toString().trim(), email: (fd.get('email')||'').toString().trim(), phone: (fd.get('phone')||'').toString().trim(), note: (fd.get('note')||'').toString().trim() };
    if (!customer.name || !customer.email || !customer.phone) return toast('Vui lòng điền đủ thông tin', 'error');
    const items = state.cart.map(ci=>{ const p = state.products.find(x=>x.id===ci.productId); return p ? { productId: p.id, name: p.name, price: p.price, qty: ci.qty } : null; }).filter(Boolean);
    const subtotal = items.reduce((s,i)=>s+i.price*i.qty, 0);
    const order = { id: uid('order'), code: genOrderCode(), items, subtotal, total: subtotal, customer, status: 'pending', paymentMethod: 'manual', createdAt: Date.now(), updatedAt: Date.now() };

  }
  render();
});

  if (window.crypto?.subtle){
    try{
      const buf = await crypto.subtle.digest('SHA-256', data);
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(_){}
  }
  let h1 = 5381, h2 = 52711;
  const s = salt + '::' + pwd;
  for (let i=0; i<s.length; i++){
    const c = s.charCodeAt(i);
    h1 = ((h1<<5) + h1) ^ c; h2 = ((h2<<5) + h2) ^ (c + i);
  }
  return 'fb_' + (h1>>>0).toString(16) + (h2>>>0).toString(16);
}
function genSalt(){
  const arr = new Uint8Array(16);
  if (window.crypto?.getRandomValues) crypto.getRandomValues(arr);
  else for (let i=0;i<16;i++) arr[i] = Math.floor(Math.random()*256);
  return [...arr].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isAdminLoggedIn(){
  const raw = sessionStorage.getItem(ADMIN_SESSION_KEY);
  if (!raw) return false;
  try{ const s = JSON.parse(raw); return s.exp > Date.now() && state.admin && s.hash === state.admin.hash; }catch(_){ return false; }
}
function setAdminSession(on){
  if (on && state.admin){
    sessionStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ hash: state.admin.hash, exp: Date.now() + 1000*60*60*12 }));
  } else { sessionStorage.removeItem(ADMIN_SESSION_KEY); }
}

        <button type="submit" class="btn btn-primary btn-block btn-lg"><i data-lucide="log-in"></i> Đăng nhập</button>

      </form>
    </div>`;
  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
  $('#login-form').addEventListener('submit', async e=>{
    e.preventDefault(); const errEl = $('#login-error');
    if (loginTracker.lockUntil > Date.now()){
      const sec = Math.ceil((loginTracker.lockUntil - Date.now())/1000);
      errEl.textContent = `Quá nhiều lần thử. Vui lòng đợi ${sec}s.`; errEl.classList.remove('hide'); return;
    }
    const pwd = new FormData(e.target).get('pwd').toString(); const hash = await hashPwd(pwd, state.admin.salt);
    if (hash === state.admin.hash){
      loginTracker = { count: 0, lockUntil: 0 }; setAdminSession(true); toast('Đăng nhập thành công','success'); navigate('/admin');
    } else {
      loginTracker.count++;
      if (loginTracker.count >= ADMIN_LOGIN_MAX_ATTEMPTS){
        loginTracker.lockUntil = Date.now() + ADMIN_LOGIN_LOCK_MS; loginTracker.count = 0;
        errEl.textContent = `Quá nhiều lần thử. Khóa ${ADMIN_LOGIN_LOCK_MS/1000}s.`; errEl.classList.remove('hide');
      } else {
        errEl.textContent = `Sai mật khẩu. Còn ${ADMIN_LOGIN_MAX_ATTEMPTS - loginTracker.count} lần thử.`; errEl.classList.remove('hide');
      }
    }
  });
}

function bindImageUpload(fileSel, prevSel, fieldName){
  const input = document.querySelector(fileSel); if (!input) return;
  input.onchange = ()=>{
    const file = input.files[0]; if (!file) return;
    if (file.size > 1.5*1024*1024) return toast('Ảnh quá lớn (>1.5MB)','error');
    const reader = new FileReader();
    reader.onload = ()=>{ document.querySelector(prevSel).src = reader.result; document.querySelector(`input[name="${fieldName}"]`).value = reader.result; };
    reader.readAsDataURL(file);
  };
}

  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
  $$('[data-view-ct]').forEach(b=>{ b.onclick = ()=>{ const c = state.contacts.find(x=>x.id===b.dataset.viewCt); if (c.status==='new'){ c.status='read'; saveState(); } openModal({ title: 'Liên hệ từ ' + c.name, body: `<div style="margin-bottom:12px"><div style="font-size:.82rem;color:var(--text-muted)">Email: <strong style="color:var(--text)">${esc(c.email)}</strong></div><div style="font-size:.82rem;color:var(--text-muted)">SĐT: <strong style="color:var(--text)">${esc(c.phone)}</strong></div><div style="font-size:.82rem;color:var(--text-muted)">Chủ đề: <strong style="color:var(--text)">${esc(c.subject)}</strong></div></div><div class="card" style="padding:14px;white-space:pre-wrap;font-size:.9rem">${esc(c.message)}</div><div class="form-group" style="margin-top:16px"><label class="label">Trạng thái</label><select class="input" id="ct-status">${Object.entries(CONTACT_STATUS).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v.label}</option>`).join('')}</select></div>`, footer: `<a href="mailto:${esc(c.email)}?subject=Re: ${esc(c.subject)}" class="btn btn-outline"><i data-lucide="mail"></i> Trả lời email</a><button class="btn btn-primary" data-ct-save>Lưu</button>` }); if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'}); document.querySelector('#modal-root [data-ct-save]').onclick = ()=>{ c.status = $('#ct-status').value; saveState(true); document.querySelector('#modal-root').innerHTML = ''; refreshAdmin(); toast('Đã cập nhật','success'); }; }; });
  $$('[data-del-ct]').forEach(b=>b.onclick = ()=>{ confirmDialog('Xóa liên hệ?', ()=>{ state.contacts = state.contacts.filter(x=>x.id!==b.dataset.delCt); saveState(true); refreshAdmin(); toast('Đã xóa','success'); }, {danger:true, confirmText:'Xóa'}); });
}

function renderAdminBank(){
  const b = state.bank; const m = $('#admin-main');
  m.innerHTML = `<div class="admin-page-head"><h1>Ngân hàng</h1><p>Cấu hình thông tin nạp tiền</p></div><form id="bank-form" class="settings-section"><div class="grid grid-2"><div class="form-group"><label class="label">Tên ngân hàng</label><input class="input" name="bankName" value="${esc(b.bankName)}"></div><div class="form-group"><label class="label">Mã BIN (VietQR)</label><input class="input" name="bankBin" value="${esc(b.bankBin)}" placeholder="VD: 970436"></div></div><div class="grid grid-2"><div class="form-group"><label class="label">Số tài khoản</label><input class="input" name="accountNumber" value="${esc(b.accountNumber)}"></div><div class="form-group"><label class="label">Chủ tài khoản</label><input class="input" name="accountName" value="${esc(b.accountName)}" placeholder="NGUYEN VAN A"></div></div><div class="form-group"><label class="label">Tiền nạp tối thiểu</label><input class="input" type="number" name="minDeposit" value="${b.minDeposit}" min="0"></div><div class="form-group"><label class="label">Mệnh giá gợi ý (cách nhau dấu phẩy)</label><input class="input" name="suggestAmounts" value="${(b.suggestAmounts||[]).join(', ')}" placeholder="20000, 50000, 100000"></div><div class="form-group"><label class="label">Ghi chú cho khách</label><textarea class="input textarea" name="note" rows="2">${esc(b.note||'')}</textarea></div><button type="submit" class="btn btn-primary btn-lg"><i data-lucide="save"></i> Lưu thay đổi</button></form>`;
  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
  $('#bank-form').addEventListener('submit', e=>{ e.preventDefault(); const fd = new FormData(e.target); state.bank = { bankName: fd.get('bankName').toString().trim(), bankBin: fd.get('bankBin').toString().trim(), accountNumber: fd.get('accountNumber').toString().trim(), accountName: fd.get('accountName').toString().trim(), minDeposit: parseInt(fd.get('minDeposit'))||10000, suggestAmounts: fd.get('suggestAmounts').toString().split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)&&x>0), note: fd.get('note').toString().trim() }; saveState(true); toast('Đã lưu thông tin ngân hàng','success'); refreshAdmin(); });
}

function renderAdminSettings(){
  const s = state.settings; const m = $('#admin-main');
  m.innerHTML = `<div class="admin-page-head"><h1>Giao diện</h1><p>Tùy chỉnh theme, màu sắc, hiệu ứng</p></div><form id="settings-form"><div class="settings-section"><h3><i data-lucide="palette"></i> Chế độ hiển thị</h3><div class="flex gap-3" style="flex-wrap:wrap"><label class="flex gap-2" style="align-items:center;padding:12px 16px;border-radius:10px;background:var(--bg-soft);border:2px solid ${s.theme==='dark'?'var(--primary)':'transparent'};cursor:pointer"><input type="radio" name="theme" value="dark" ${s.theme==='dark'?'checked':''}><i data-lucide="moon"></i> Dark</label><label class="flex gap-2" style="align-items:center;padding:12px 16px;border-radius:10px;background:var(--bg-soft);border:2px solid ${s.theme==='light'?'var(--primary)':'transparent'};cursor:pointer"><input type="radio" name="theme" value="light" ${s.theme==='light'?'checked':''}><i data-lucide="sun"></i> Light</label></div></div><div class="settings-section"><h3><i data-lucide="droplet"></i> Bảng màu</h3><div class="color-picker-row"><label>Primary<input type="color" name="primary" value="${s.primary}"></label><label>Secondary<input type="color" name="secondary" value="${s.secondary}"></label></div></div><div class="settings-section"><h3><i data-lucide="square"></i> Bo góc</h3><div class="range-row"><input type="range" min="0" max="32" name="radius" value="${s.radius}"><span id="radius-val" style="min-width:44px;text-align:right;font-weight:600">${s.radius}px</span></div></div><div class="settings-section"><h3><i data-lucide="info"></i> Thông tin site</h3><div class="form-group"><label class="label">Tên website</label><input class="input" name="siteName" value="${esc(s.siteName)}"></div></div><button type="submit" class="btn btn-primary btn-lg"><i data-lucide="save"></i> Lưu cài đặt</button><button type="button" class="btn btn-outline btn-lg" id="reset-theme" style="margin-left:8px"><i data-lucide="rotate-ccw"></i> Mặc định</button></form>`;
  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
  $('[name=radius]').oninput = e=>{ $('#radius-val').textContent = e.target.value + 'px'; document.documentElement.style.setProperty('--radius', e.target.value + 'px'); };
  $('[name=primary]').oninput = e=> document.documentElement.style.setProperty('--primary', e.target.value);
  $('[name=secondary]').oninput = e=> document.documentElement.style.setProperty('--secondary', e.target.value);
  $('#reset-theme').onclick = ()=>{ confirmDialog('Khôi phục giao diện mặc định?', ()=>{ state.settings = { ...SEED.settings }; saveState(true); applyTheme(); refreshAdmin(); toast('Đã khôi phục','success'); }, {confirmText:'Khôi phục'}); };
  $('#settings-form').addEventListener('submit', e=>{ e.preventDefault(); const fd = new FormData(e.target); state.settings.theme = fd.get('theme').toString(); state.settings.primary = fd.get('primary').toString(); state.settings.secondary = fd.get('secondary').toString(); state.settings.radius = parseInt(fd.get('radius'))||16; state.settings.siteName = fd.get('siteName').toString().trim() || 'NovaStore'; saveState(true); applyTheme(); toast('Đã lưu cài đặt giao diện','success'); refreshAdmin(); });
}

function renderAdminBackup(){
  const m = $('#admin-main'); const size = (JSON.stringify(state).length / 1024).toFixed(1);
  m.innerHTML = `<div class="admin-page-head"><h1>Sao lưu & Khôi phục</h1><p>Xuất / nhập dữ liệu, reset toàn bộ</p></div><div class="settings-section"><h3><i data-lucide="download"></i> Xuất dữ liệu (JSON)</h3><p class="text-muted" style="font-size:.88rem;margin-bottom:16px">Tải xuống toàn bộ dữ liệu website dưới dạng file JSON. Dùng để sao lưu hoặc chuyển sang thiết bị khác.</p><p class="text-muted" style="font-size:.82rem;margin-bottom:16px">Dung lượng hiện tại: <strong style="color:var(--text)">${size} KB</strong></p><button class="btn btn-primary" id="export-btn"><i data-lucide="download"></i> Tải file sao lưu</button></div><div class="settings-section"><h3><i data-lucide="upload"></i> Nhập dữ liệu</h3><p class="text-muted" style="font-size:.88rem;margin-bottom:16px">Chọn file JSON đã xuất trước đó. <strong style="color:var(--warning)">Dữ liệu hiện tại sẽ bị ghi đè!</strong></p><input type="file" accept="application/json" id="import-file" style="display:block;margin-bottom:12px"><button class="btn btn-outline" id="import-btn"><i data-lucide="upload"></i> Nhập dữ liệu</button></div><div class="settings-section" style="border-color:rgba(239,68,68,.3)"><h3 style="color:var(--danger)"><i data-lucide="alert-triangle"></i> Reset toàn bộ</h3><p class="text-muted" style="font-size:.88rem;margin-bottom:16px">Xóa toàn bộ dữ liệu và đưa về trạng thái ban đầu. <strong style="color:var(--danger)">Không thể hoàn tác!</strong></p><button class="btn btn-danger" id="reset-btn"><i data-lucide="trash-2"></i> Reset toàn bộ dữ liệu</button></div>`;
  if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'});
  $('#export-btn').onclick = ()=>{ const data = { _meta: { schema: state.schema, exportedAt: new Date().toISOString(), siteName: state.settings.siteName }, data: state }; const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `novastore-backup-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(url), 2000); toast('Đã tải file sao lưu','success'); };
  $('#import-btn').onclick = ()=>{ const file = $('#import-file').files[0]; if (!file) return toast('Chọn file JSON trước','error'); const reader = new FileReader(); reader.onload = ()=>{ try{ const raw = JSON.parse(reader.result); const imported = raw.data || raw; if (!imported.settings || !imported.profile || !imported.products) throw new Error('File không hợp lệ'); confirmDialog('Ghi đè toàn bộ dữ liệu hiện tại?', ()=>{ state = mergeDefaults(imported, SEED); saveState(true); applyTheme(); toast('Đã nhập dữ liệu. Đang tải lại...','success'); setTimeout(()=>location.reload(), 800); }, {danger:true, confirmText:'Ghi đè'}); }catch(err){ toast('Lỗi đọc file: '+err.message, 'error', 5000); } }; reader.readAsText(file); };
  $('#reset-btn').onclick = ()=>{ confirmDialog('XÓA TOÀN BỘ dữ liệu và reset về ban đầu?', ()=>{ const pwd = prompt('Nhập mật khẩu admin để xác nhận:'); if (!pwd) return toast('Đã hủy','info'); hashPwd(pwd, state.admin?.salt||'').then(async h=>{ if (state.admin && h !== state.admin.hash) return toast('Sai mật khẩu','error'); localStorage.removeItem(LS_KEY); sessionStorage.removeItem(ADMIN_SESSION_KEY); toast('Đã reset. Đang tải lại...','success'); setTimeout(()=>location.reload(), 800); }); }, {danger:true, confirmText:'Reset'}); };
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  loadState();
  applyTheme();
  window.addEventListener('hashchange', renderRoute);
  renderRoute();
  const tryIcons = ()=>{ if (window.lucide) lucide.createIcons({nameAttr:'data-lucide'}); else setTimeout(tryIcons, 50); };
  tryIcons();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
