<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7c5cff" />
<title>Aurora Digital — Premium Store</title>
<meta name="description" content="Cửa hàng số cao cấp: tài khoản game, dịch vụ MMO, sản phẩm kỹ thuật số." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURORA LIQUID GLASS — DESIGN SYSTEM
   ============================================================ */
:root{
  --primary:#7c5cff;
  --primary-2:#22d3ee;
  --accent:#f472b6;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --bg-1:#f4f2ff;
  --bg-2:#ecfeff;
  --bg-3:#fdf2f8;
  --text:#14102e;
  --text-soft:#4a4466;
  --muted:#8a84a5;
  --glass-bg:rgba(255,255,255,0.55);
  --glass-bg-2:rgba(255,255,255,0.35);
  --glass-border:rgba(255,255,255,0.75);
  --glass-highlight:rgba(255,255,255,0.9);
  --glass-shadow:0 10px 40px rgba(80,60,160,0.14), 0 2px 8px rgba(80,60,160,0.06);
  --radius:22px;
  --radius-sm:14px;
  --radius-lg:28px;
  --radius-xl:36px;
  --blur:22px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --fast:160ms;
  --mid:280ms;
  --slow:420ms;
  --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-head:'Space Grotesk','Inter',sans-serif;
  --max:1240px;
}
[data-theme="dark"]{
  --bg-1:#070520;
  --bg-2:#071022;
  --bg-3:#180a26;
  --text:#efeaff;
  --text-soft:#b5aed9;
  --muted:#7a7399;
  --glass-bg:rgba(24,20,48,0.62);
  --glass-bg-2:rgba(24,20,48,0.35);
  --glass-border:rgba(140,120,220,0.28);
  --glass-highlight:rgba(180,160,255,0.35);
  --glass-shadow:0 10px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);color:var(--text);min-height:100vh;
  overflow-x:hidden;background:var(--bg-1);line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background var(--slow) var(--ease), color var(--slow) var(--ease);
}
img{max-width:100%;display:block;object-fit:cover}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--primary);text-decoration:none;transition:opacity var(--fast) var(--ease)}
a:hover{opacity:.8}
::selection{background:var(--primary);color:#fff}

/* ---- Ambient Background ---- */
#ambient{
  position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 55%,var(--bg-3) 100%);
  transition:background var(--slow) var(--ease);
}
#ambient::before,#ambient::after{
  content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;
  animation:float 22s ease-in-out infinite;
}
#ambient::before{
  width:60vmax;height:60vmax;left:-20vmax;top:-20vmax;
  background:radial-gradient(circle,var(--primary),transparent 65%);
}
#ambient::after{
  width:55vmax;height:55vmax;right:-20vmax;bottom:-20vmax;
  background:radial-gradient(circle,var(--primary-2),transparent 65%);
  animation-delay:-8s;animation-duration:28s;
}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(8vmax,4vmax) scale(1.12)}
}

/* ---- Utility ---- */
.container{max-width:var(--max);margin:0 auto;padding:0 20px;width:100%}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.center{text-align:center}
.hide{display:none !important}
.mono{font-family:'Space Grotesk',monospace}
.muted{color:var(--muted)}
.small{font-size:13px}
.bold{font-weight:700}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.2px;
  background:var(--glass-bg-2);border:1px solid var(--glass-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.pill.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.pill.success{background:rgba(16,185,129,.15);color:var(--success);border-color:rgba(16,185,129,.35)}
.pill.warn{background:rgba(245,158,11,.15);color:var(--warning);border-color:rgba(245,158,11,.35)}
.pill.danger{background:rgba(239,68,68,.15);color:var(--danger);border-color:rgba(239,68,68,.35)}

/* ---- Liquid Glass Material ---- */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  border-radius:var(--radius);
  position:relative;
  overflow:hidden;
}
.glass::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(140deg,rgba(255,255,255,.5) 0%,transparent 35%,transparent 65%,rgba(255,255,255,.15) 100%);
  mix-blend-mode:overlay;
}
[data-theme="dark"] .glass::before{
  background:linear-gradient(140deg,rgba(255,255,255,.08) 0%,transparent 35%,transparent 65%,rgba(180,160,255,.06) 100%);
}
.glass-2{background:var(--glass-bg-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius-sm)}

/* ---- Buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:16px;font-weight:600;font-size:14px;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);position:relative;overflow:hidden;
  transition:transform var(--fast) var(--spring), box-shadow var(--fast) var(--ease), background var(--fast) var(--ease);
  user-select:none;cursor:pointer;white-space:nowrap;
  min-height:44px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,92,255,.22)}
.btn:active{transform:scale(.96)}
.btn.primary{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 8px 24px rgba(124,92,255,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.btn.primary:hover{box-shadow:0 12px 32px rgba(124,92,255,.45), inset 0 1px 0 rgba(255,255,255,.4)}
.btn.accent{
  background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;border-color:transparent;
}
.btn.ghost{background:transparent;border-color:var(--glass-border)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;border-color:transparent}
.btn.sm{padding:8px 14px;font-size:13px;min-height:38px;border-radius:12px}
.btn.lg{padding:16px 30px;font-size:16px;min-height:54px;border-radius:20px}
.btn.icon{padding:10px;width:44px;height:44px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important}

/* ---- Inputs ---- */
.input,.textarea,.select{
  width:100%;padding:12px 16px;border-radius:14px;font-size:14px;
  background:var(--glass-bg-2);border:1px solid var(--glass-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--text);outline:none;
  transition:border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  min-height:46px;
}
.input:focus,.textarea:focus,.select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(124,92,255,.15);
}
.textarea{min-height:110px;resize:vertical;line-height:1.55}
.select{cursor:pointer}
.label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-soft)}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}

/* ---- Grids ---- */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ---- Header ---- */
#header{
  position:sticky;top:0;z-index:50;
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--glass-bg);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--glass-border);
  transition:all var(--mid) var(--ease);
}
#header.scrolled{box-shadow:0 4px 24px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--text)}
.brand-logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:grid;place-items:center;color:#fff;font-weight:800;
  box-shadow:0 6px 16px rgba(124,92,255,.35), inset 0 1px 0 rgba(255,255,255,.4);
  flex-shrink:0;
}
.brand-logo img{width:100%;height:100%;border-radius:11px;object-fit:cover}

/* Desktop nav */
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{
  padding:9px 14px;border-radius:12px;font-size:14px;font-weight:500;
  color:var(--text-soft);transition:all var(--fast) var(--ease);
}
.nav-links a:hover{background:var(--glass-bg-2);color:var(--text);opacity:1}
.nav-links a.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 12px rgba(124,92,255,.3)}

/* Mobile menu */
.hamburger{display:none;width:44px;height:44px;border-radius:12px;background:var(--glass-bg-2);border:1px solid var(--glass-border);align-items:center;justify-content:center}
.mobile-drawer{
  position:fixed;inset:0;z-index:100;display:none;
}
.mobile-drawer.open{display:block}
.mobile-drawer-backdrop{
  position:absolute;inset:0;background:rgba(20,10,50,.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  animation:fadeIn var(--mid) var(--ease);
}
.mobile-drawer-panel{
  position:absolute;top:0;right:0;bottom:0;width:min(88vw,340px);
  background:var(--glass-bg);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-left:1px solid var(--glass-border);
  padding:20px;display:flex;flex-direction:column;gap:6px;
  animation:slideInRight var(--mid) var(--spring);
  overflow-y:auto;
}
.mobile-drawer-panel a{
  padding:14px 16px;border-radius:14px;font-size:15px;font-weight:500;
  color:var(--text-soft);display:flex;align-items:center;gap:10px;
  transition:all var(--fast) var(--ease);
}
.mobile-drawer-panel a:active,.mobile-drawer-panel a.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
}

/* Bottom nav mobile */
#bottomNav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--glass-bg);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid var(--glass-border);
  justify-content:space-around;
}
#bottomNav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;font-size:10px;font-weight:600;color:var(--muted);
  border-radius:12px;transition:all var(--fast) var(--ease);
  min-height:52px;justify-content:center;
}
#bottomNav a.active{color:var(--primary)}
#bottomNav svg{width:22px;height:22px}

@media(max-width:900px){
  .nav-links{display:none}
  .hamburger{display:flex}
  #bottomNav{display:flex}
  main{padding-bottom:80px}
}

/* ---- Main ---- */
main{min-height:60vh}
.page{padding:32px 0 60px;animation:pageIn var(--mid) var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Section headers */
.section{padding:44px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.section-title{font-family:var(--font-head);font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:-.5px;line-height:1.2}
.section-sub{color:var(--muted);font-size:14px;margin-top:6px}
.gradient-text{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* Product card */
.product-card{
  background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--glass-shadow);
  transition:transform var(--mid) var(--spring), box-shadow var(--mid) var(--ease);
  display:flex;flex-direction:column;position:relative;
  cursor:pointer;
}
.product-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(124,92,255,.18)}
.product-card:active{transform:scale(.98)}
.product-thumb{
  aspect-ratio:9/16;background:linear-gradient(135deg,var(--primary)/20,var(--primary-2)/20);
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(34,211,238,.15));
}
.product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform var(--slow) var(--ease)}
.product-card:hover .product-thumb img{transform:scale(1.06)}
.product-badge{
  position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
  background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;
  box-shadow:0 4px 12px rgba(244,114,182,.4);z-index:2;
}
.product-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.product-name{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.product-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price-now{font-weight:800;font-size:15px;color:var(--primary);font-family:var(--font-head)}
.price-old{font-size:12px;color:var(--muted);text-decoration:line-through}
.product-actions{display:flex;gap:6px;margin-top:auto;padding-top:8px}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(90deg,var(--glass-bg-2) 25%,var(--glass-bg) 50%,var(--glass-bg-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px;
}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:90px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(92vw,360px)}
@media(min-width:901px){#toasts{bottom:20px}}
.toast{
  padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;
  background:var(--glass-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  animation:slideUp var(--mid) var(--spring);pointer-events:auto;
  display:flex;align-items:center;gap:10px;
  border-left:3px solid var(--primary);
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed;inset:0;z-index:200;background:rgba(20,10,50,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn var(--mid) var(--ease);
}
.modal{
  width:min(100%,560px);max-height:90vh;overflow-y:auto;
  background:var(--glass-bg);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-border);border-radius:var(--radius-lg);
  box-shadow:0 24px 80px rgba(0,0,0,.35);
  padding:24px;animation:pop var(--mid) var(--spring);
}
.modal h3{font-family:var(--font-head);font-size:20px;margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;background:var(--glass-bg-2);border:1px solid var(--glass-border);display:grid;place-items:center}

/* ---- Footer ---- */
footer{
  padding:48px 0 28px;margin-top:40px;
  border-top:1px solid var(--glass-border);
  background:var(--glass-bg-2);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr 1fr;gap:24px}}
@media(max-width:480px){.footer-grid{grid-template-columns:1fr}}
.footer-col h4{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text)}
.footer-col a{display:block;padding:6px 0;font-size:14px;color:var(--muted)}
.footer-col a:hover{color:var(--primary)}
.footer-bottom{padding-top:20px;border-top:1px solid var(--glass-border);text-align:center;font-size:13px;color:var(--muted)}

/* ---- Empty state ---- */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.4;margin-bottom:16px}
.empty h4{font-size:16px;color:var(--text-soft);margin-bottom:6px}

/* ---- Cart drawer ---- */
#cartDrawer{position:fixed;inset:0;z-index:150;display:none}
#cartDrawer.open{display:block}
.cart-panel{
  position:absolute;top:0;right:0;bottom:0;width:min(94vw,420px);
  background:var(--glass-bg);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-left:1px solid var(--glass-border);
  display:flex;flex-direction:column;
  animation:slideInRight var(--mid) var(--spring);
}
.cart-head{padding:18px 20px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between}
.cart-body{flex:1;overflow-y:auto;padding:16px 20px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--glass-border)}
.cart-item img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0}
.cart-foot{padding:16px 20px;border-top:1px solid var(--glass-border)}
.qty{display:inline-flex;align-items:center;gap:0;background:var(--glass-bg-2);border:1px solid var(--glass-border);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:30px;display:grid;place-items:center;font-weight:700}
.qty span{min-width:32px;text-align:center;font-size:14px;font-weight:600}

/* ---- Admin ---- */
.admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 68px)}
@media(max-width:900px){.admin-shell{grid-template-columns:1fr}}
.admin-side{
  padding:20px 14px;
  background:var(--glass-bg-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);
  display:flex;flex-direction:column;gap:4px;
}
@media(max-width:900px){.admin-side{position:fixed;left:0;top:0;bottom:0;z-index:90;width:260px;transform:translateX(-100%);transition:transform var(--mid) var(--spring);padding-top:70px}}
.admin-side.open{transform:translateX(0)}
.admin-side a{
  padding:11px 14px;border-radius:12px;font-size:14px;font-weight:500;
  color:var(--text-soft);display:flex;align-items:center;gap:10px;cursor:pointer;
  transition:all var(--fast) var(--ease);
}
.admin-side a:hover{background:var(--glass-bg);color:var(--text)}
.admin-side a.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.admin-main{padding:24px}
@media(max-width:600px){.admin-main{padding:16px}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{padding:18px;border-radius:var(--radius);background:var(--glass-bg);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.stat-card .v{font-family:var(--font-head);font-size:26px;font-weight:700;margin-top:4px}
.stat-card .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;margin-bottom:8px}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--glass-border)}
table{width:100%;border-collapse:collapse;background:var(--glass-bg-2);font-size:14px;min-width:600px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--glass-border);vertical-align:middle}
th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:var(--glass-bg-2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(124,92,255,.04)}

/* Auth screen */
.auth-wrap{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:40px 16px}
.auth-card{width:100%;max-width:380px;padding:32px 24px;text-align:center}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.filter-bar .chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--glass-bg-2);border:1px solid var(--glass-border);cursor:pointer;
  transition:all var(--fast) var(--ease);white-space:nowrap;
}
.chip:hover{background:var(--glass-bg)}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}

/* Gallery */
.gallery-main{
  aspect-ratio:9/16;max-height:70vh;background:var(--glass-bg-2);border-radius:var(--radius);
  overflow:hidden;border:1px solid var(--glass-border);position:relative;
}
.gallery-main img{width:100%;height:100%;object-fit:contain;background:#000}
.gallery-thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:6px}
.gallery-thumbs button{
  width:64px;height:90px;border-radius:10px;overflow:hidden;flex-shrink:0;
  border:2px solid transparent;opacity:.7;transition:all var(--fast) var(--ease);
}
.gallery-thumbs button.active{border-color:var(--primary);opacity:1}
.gallery-thumbs img{width:100%;height:100%;object-fit:cover}

/* Responsive tweak */
@media(max-width:520px){
  .section{padding:32px 0}
  #header{padding:8px 12px}
  .brand{font-size:15px}
  .brand-logo{width:34px;height:34px}
  .modal{padding:20px}
  .stat-card{padding:14px}
}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

let State = null;
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){ State = clone(defaultState); saveState(); return; }
    const parsed = JSON.parse(raw);
    State = Object.assign(clone(defaultState), parsed);
    // shallow merge settings
    State.settings = Object.assign(clone(defaultState.settings), parsed.settings||{});
    State.settings.theme = Object.assign(clone(defaultState.settings.theme), (parsed.settings&&parsed.settings.theme)||{});
    State.settings.contact = Object.assign(clone(defaultState.settings.contact), (parsed.settings&&parsed.settings.contact)||{});
    State.settings.bank = Object.assign(clone(defaultState.settings.bank), (parsed.settings&&parsed.settings.bank)||{});
    State.settings.footer = Object.assign(clone(defaultState.settings.footer), (parsed.settings&&parsed.settings.footer)||{});
    State.profile = Object.assign(clone(defaultState.profile), parsed.profile||{});
  }catch(e){ console.warn('loadState error',e); State = clone(defaultState); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(State)); }
  catch(e){
    if(e.name==='QuotaExceededError') toast('Bộ nhớ localStorage đã đầy. Vui lòng xoá bớt ảnh/dữ liệu.','error',5000);
    else console.warn('saveState error',e);
  }
}
function pushActivity(action){
  try{
    const a = JSON.parse(localStorage.getItem('aurora_activity')||'[]');
    a.unshift({action, ts:nowISO()});
    localStorage.setItem('aurora_activity', JSON.stringify(a.slice(0,40)));
  }catch(e){}
}

// ---------- ADMIN AUTH ----------
// Password obfuscated via char codes — không có plaintext trong source.
const _k = () => String.fromCharCode(110,103,117,121,101,110,108,101,116,104,97,111,109,105,115,115,98,111,48,56,48,54);
function verifyAdminPassword(pwd){ return typeof pwd==='string' && pwd === _k(); }
function adminLogin(pwd){
  if(!verifyAdminPassword(pwd)) return false;
  const session = { token: uid('sess'), exp: Date.now()+ADMIN_EXPIRES_MS };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  pushActivity('Admin đăng nhập');
  return true;
}
function adminLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  pushActivity('Admin đăng xuất');
  toast('Đã đăng xuất','success');
  route('#/');
}
function isAdmin(){
  try{
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');
    if(!s) return false;
    if(Date.now()>s.exp){ sessionStorage.removeItem(SESSION_KEY); return false; }
    return true;
  }catch(e){ return false; }
}
function requireAdmin(){
  if(!isAdmin()){ toast('Vui lòng đăng nhập Admin','warn'); route('#/admin'); return false; }
  return true;
}

// ---------- TOAST & MODAL ----------
function toast(msg, type='info', ms=2800){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = (type==='success'?Icon.check:type==='error'?Icon.close:'') + '<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(10px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),300); }, ms);
}

function modal(html, opts={}){
  const wrap = document.createElement('div');
  wrap.className='modal-backdrop';
  wrap.innerHTML = '<div class="modal glass" style="position:relative">'+
    '<button class="modal-close" data-close>'+Icon.close+'</button>'+
    html + '</div>';
  const close = ()=>{ wrap.style.opacity='0'; setTimeout(()=>wrap.remove(),180); };
  wrap.addEventListener('click', e=>{ if(e.target===wrap || e.target.closest('[data-close]')) close(); });
  $('#modals').appendChild(wrap);

}

// ---------- THEME ----------
function applyTheme(){
  const t = State.settings.theme;
  document.documentElement.setAttribute('data-theme', t.mode);
  const root = document.documentElement.style;
  root.setProperty('--primary', t.primary);
  root.setProperty('--primary-2', t.primary2);
  root.setProperty('--accent', t.accent);
  root.setProperty('--radius', t.radius+'px');
  root.setProperty('--blur', t.blur+'px');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.mode==='dark'?'#070520':'#f4f2ff');
}
function toggleTheme(){
  State.settings.theme.mode = State.settings.theme.mode==='dark'?'light':'dark';
  saveState(); applyTheme(); renderHeader();
  toast('Đã chuyển sang '+(State.settings.theme.mode==='dark'?'Dark Mode':'Light Mode'),'success',1500);
}

// ---------- ROUTER ----------
let currentRoute = '';
function route(path){
  if(!path) path = '#/';
  if(location.hash === path){ renderRoute(); return; }
  location.hash = path;
}
function renderRoute(){
  const hash = location.hash || '#/';
  currentRoute = hash;
  const parts = hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const seg0 = parts[0] || 'home';
  window.scrollTo({top:0,behavior:'instant'});
  renderHeader();
  renderBottomNav();
  renderFooter();
  const app = $('#app');

  try{
    if(seg0==='home') app.innerHTML = pageHome();
    else if(seg0==='profile') app.innerHTML = pageProfile();
    else if(seg0==='about') app.innerHTML = pageAbout();
    else if(seg0==='shop') app.innerHTML = pageShop();
    else if(seg0==='product') app.innerHTML = pageProduct(parts[1]);
    else if(seg0==='blog') app.innerHTML = parts[1] ? pageBlogPost(parts[1]) : pageBlog();
    else if(seg0==='contact') app.innerHTML = pageContact();
    else if(seg0==='deposit') app.innerHTML = pageDeposit();
    else if(seg0==='cart') app.innerHTML = pageCartPage();
    else if(seg0==='tools') app.innerHTML = pageTools();
    else if(seg0==='support') app.innerHTML = pageSupport();
    else if(seg0==='terms') app.innerHTML = pageTerms();
    else if(seg0==='privacy') app.innerHTML = pagePrivacy();
    else if(seg0==='admin') app.innerHTML = isAdmin() ? pageAdmin(parts[1]) : pageAdminLogin();
    else app.innerHTML = page404();
  }catch(e){ console.error(e); app.innerHTML = '<div class="page container"><div class="empty"><h4>Có lỗi xảy ra</h4><p>'+esc(e.message)+'</p><a class="btn primary" href="#/">Về trang chủ</a></div></div>'; }

  bindRoute(seg0, parts);
  // Count visit
  try{
    State.visits = (State.visits||0)+1;
    localStorage.setItem('aurora_visits', State.visits);
  }catch(e){}
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('scroll', ()=>{
  const h = $('#header');
  if(h) h.classList.toggle('scrolled', window.scrollY>10);
}, {passive:true});
})();
</script>

<script>

// Query params helper
function getQuery(){
  const q = {};
  const parts = (location.hash.split('?')[1]||'').split('&');
  parts.forEach(p=>{ if(!p) return; const [k,v]=p.split('='); q[k]=decodeURIComponent(v||''); });

}

      '</div>'+
      '<select class="select" id="shopSort" style="max-width:200px">'+

  '</div>';
};

// Render product grid
function renderProductGrid(){
  const st = window.__STATE;
  const q = getQuery();
  const activeCat = q.cat || 'all';
  const search = ($B('#shopSearch')?.value||'').toLowerCase().trim();
  const sort = $B('#shopSort')?.value||'new';
  let items = (st.products||[]).filter(p=>p.visible!==false);
  if(activeCat!=='all') items = items.filter(p=>p.category===activeCat);
  if(search) items = items.filter(p=>(p.name||'').toLowerCase().includes(search) || (p.desc||'').toLowerCase().includes(search));
  items.sort((a,b)=>{
    if(sort==='price-asc') return (a.price||0)-(b.price||0);
    if(sort==='price-desc') return (b.price||0)-(a.price||0);
    if(sort==='name') return (a.name||'').localeCompare(b.name||'');
    return new Date(b.createdAt||0) - new Date(a.createdAt||0);
  });
  const grid = $B('#productGrid');
  if(!grid) return;
  if(!items.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div style="font-size:48px">'+iconB.shop+'</div><h4>Chưa có sản phẩm</h4><p>Không tìm thấy sản phẩm phù hợp</p></div>';
    return;
  }
  grid.innerHTML = items.map(p=>{
    const img = (p.images&&p.images[0]) || '';
    return '<div class="product-card" data-product="'+escB(p.id)+'">'+
      (p.featured?'<div class="product-badge">HOT</div>':'')+
      '<div class="product-thumb">'+(img?'<img src="'+escB(img)+'" loading="lazy" alt="">':'<div style="display:grid;place-items:center;height:100%;color:var(--muted)">'+iconB.shop+'</div>')+'</div>'+
      '<div class="product-info"><div class="product-name">'+escB(p.name)+'</div>'+
        '<div class="product-price"><span class="price-now">'+fmtB(p.price)+'</span>'+(p.oldPrice&&p.oldPrice>p.price?'<span class="price-old">'+fmtB(p.oldPrice)+'</span>':'')+'</div>'+
        '<div class="product-actions"><button class="btn primary sm" data-add-cart="'+escB(p.id)+'" style="flex:1">'+iconB.cart+' Mua</button></div>'+
      '</div>'+
    '</div>';
  }).join('');
}

      '<a href="#/cart" class="btn primary block" onclick="document.getElementById(\'cartDrawer\').classList.remove(\'open\')">Xem giỏ hàng →</a></div>'+
    '</div>';

};

// CART LOGIC
window.addToCart = function(productId, qty=1){
  const st = window.__STATE;
  const p = (st.products||[]).find(x=>x.id===productId);
  if(!p){ toast('Sản phẩm không tồn tại','error'); return; }
  if(p.stock===false){ toast('Sản phẩm đã hết hàng','error'); return; }
  const item = st.cart.find(x=>x.productId===productId);
  if(item){ item.qty += qty; }
  else{ st.cart.push({productId, qty}); }
  window.__saveState();
  toast('Đã thêm vào giỏ hàng','success',1600);
  window.renderHeader();
  if(document.getElementById('cartDrawer').classList.contains('open')) window.openCart();
};
window.cartInc = function(pid){ const st=window.__STATE; const it=st.cart.find(x=>x.productId===pid); if(it){it.qty++; window.__saveState();} refreshCartViews(); };
window.cartDec = function(pid){ const st=window.__STATE; const it=st.cart.find(x=>x.productId===pid); if(it){ it.qty--; if(it.qty<=0) st.cart=st.cart.filter(x=>x.productId!==pid); window.__saveState(); } refreshCartViews(); };
window.cartDel = function(pid){ const st=window.__STATE; st.cart=st.cart.filter(x=>x.productId!==pid); window.__saveState(); refreshCartViews(); toast('Đã xoá khỏi giỏ','success',1400); };

function refreshCartViews(){
  window.renderHeader();
  if(document.getElementById('cartDrawer').classList.contains('open')) window.openCart();
  if(location.hash.startsWith('#/cart')) renderRoute();
  if(location.hash.startsWith('#/shop')) renderProductGrid();
}

// Checkout
window.checkout = function(){
  const st = window.__STATE;
  if(!(st.cart||[]).length){ toast('Giỏ hàng trống','warn'); return; }
  const m = modal(
    '<h3>Xác nhận đặt hàng</h3>'+
    '<p class="small muted" style="margin-bottom:14px">Đơn hàng sẽ được lưu cục bộ. Vui lòng liên hệ admin qua Telegram/Email để hoàn tất thanh toán.</p>'+
    '<div class="field"><label class="label">Họ tên *</label><input class="input" id="cfName" placeholder="Nguyễn Văn A"></div>'+
    '<div class="field"><label class="label">Email/SĐT *</label><input class="input" id="cfContact" placeholder="email@example.com"></div>'+
    '<div class="field"><label class="label">Ghi chú</label><textarea class="textarea" id="cfNote" placeholder="Yêu cầu thêm..."></textarea></div>'+
    '<div class="row" style="justify-content:flex-end;gap:8px"><button class="btn ghost" data-close>Huỷ</button><button class="btn primary" id="cfSubmit">Xác nhận đặt</button></div>'
  );
  $B('#cfSubmit', m.el).onclick = ()=>{
    const name = ($B('#cfName',m.el).value||'').trim();
    const contact = ($B('#cfContact',m.el).value||'').trim();
    if(!name || !contact){ toast('Vui lòng nhập đủ thông tin','error'); return; }
    let total = 0;
    const items = st.cart.map(i=>{
      const p = (st.products||[]).find(x=>x.id===i.productId);
      if(!p) return null;
      total += (p.price||0)*i.qty;
      return {productId:p.id, name:p.name, price:p.price, qty:i.qty};
    }).filter(Boolean);
    const order = {
      id: uid('ord'), items, total, name, contact,
      note: ($B('#cfNote',m.el).value||'').trim(),
      status:'pending', createdAt: nowISO()
    };
    st.orders.push(order);
    st.cart = [];
    window.__saveState();
    pushActivity('Đơn hàng mới #'+order.id);
    m.close();
    toast('Đặt hàng thành công! Mã đơn: '+order.id,'success',3500);
    route('#/deposit');
  };
};

// Bind shop events
document.addEventListener('input', debounce((e)=>{
  if(e.target.id==='shopSearch') renderProductGrid();
},250));
document.addEventListener('change', (e)=>{
  if(e.target.id==='shopSort') renderProductGrid();
});
document.addEventListener('click', (e)=>{
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn && catBtn.parentElement?.id==='catChips'){
    $$B('[data-cat]').forEach(b=>b.classList.remove('active'));
    catBtn.classList.add('active');
    const cat = catBtn.getAttribute('data-cat');
    const newHash = cat==='all' ? '#/shop' : '#/shop?cat='+encodeURIComponent(cat);
    // update hash without re-render triggers re-render of shop page
    if(location.hash !== newHash){ location.hash = newHash; } else { renderProductGrid(); }
    return;
  }
});
})();
</script>

window.openTool = function(id){
  if(id==='uuid'){
    const m = modal('<h3>UUID Generator</h3><div class="field"><label class="label">Số lượng</label><input class="input" id="uuidN" type="number" value="5" min="1" max="50"></div><div class="field"><label class="label">Kết quả</label><textarea class="textarea mono" id="uuidOut" readonly style="min-height:180px"></textarea></div><div class="row" style="gap:8px"><button class="btn primary" id="uuidGen">Tạo</button><button class="btn ghost" id="uuidCopy">Copy</button></div>');
    $C('#uuidGen',m.el).onclick = ()=>{
      const n = Math.max(1, Math.min(50, +$C('#uuidN',m.el).value||5));
      const list = [];
      for(let i=0;i<n;i++){
        const u = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;const v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
        list.push(u);
      }
      $C('#uuidOut',m.el).value = list.join('\n');
    };
    $C('#uuidCopy',m.el).onclick = ()=>{ navigator.clipboard.writeText($C('#uuidOut',m.el).value); toast('Đã copy','success',1500); };
  }
  else if(id==='base64'){
    const m = modal('<h3>Base64 Encode / Decode</h3><div class="field"><label class="label">Input</label><textarea class="textarea" id="b64in"></textarea></div><div class="row" style="gap:8px;margin-bottom:12px"><button class="btn primary" id="b64enc">Encode →</button><button class="btn ghost" id="b64dec">← Decode</button></div><div class="field"><label class="label">Output</label><textarea class="textarea mono" id="b64out" readonly></textarea></div>');
    $C('#b64enc',m.el).onclick = ()=>{ try{ $C('#b64out',m.el).value = btoa(unescape(encodeURIComponent($C('#b64in',m.el).value))); }catch(e){ toast('Lỗi encode: '+e.message,'error'); } };
    $C('#b64dec',m.el).onclick = ()=>{ try{ $C('#b64out',m.el).value = decodeURIComponent(escape(atob($C('#b64in',m.el).value))); }catch(e){ toast('Lỗi decode: '+e.message,'error'); } };
  }
  else if(id==='json'){
    const m = modal('<h3>JSON Formatter</h3><div class="field"><label class="label">JSON</label><textarea class="textarea mono" id="jsIn" placeholder="{\\"a\\":1}"></textarea></div><div class="row" style="gap:8px;margin-bottom:12px"><button class="btn primary" id="jsFmt">Format</button><button class="btn ghost" id="jsMin">Minify</button><button class="btn ghost" id="jsVal">Validate</button></div><div class="field"><label class="label">Kết quả</label><textarea class="textarea mono" id="jsOut" readonly></textarea></div>');
    $C('#jsFmt',m.el).onclick = ()=>{ try{ $C('#jsOut',m.el).value = JSON.stringify(JSON.parse($C('#jsIn',m.el).value), null, 2); }catch(e){ toast('JSON không hợp lệ','error'); } };
    $C('#jsMin',m.el).onclick = ()=>{ try{ $C('#jsOut',m.el).value = JSON.stringify(JSON.parse($C('#jsIn',m.el).value)); }catch(e){ toast('JSON không hợp lệ','error'); } };
    $C('#jsVal',m.el).onclick = ()=>{ try{ JSON.parse($C('#jsIn',m.el).value); toast('JSON hợp lệ ✓','success'); }catch(e){ toast('JSON không hợp lệ: '+e.message,'error',4000); } };
  }
  else if(id==='pwgen'){
    const m = modal('<h3>Password Generator</h3><div class="field"><label class="label">Độ dài</label><input class="input" type="number" id="pwLen" value="16" min="4" max="64"></div><div class="field"><label class="label">Mật khẩu</label><input class="input mono" id="pwOut" readonly></div><div class="row" style="gap:8px"><button class="btn primary" id="pwGen">Tạo</button><button class="btn ghost" id="pwCopy">Copy</button></div>');
    $C('#pwGen',m.el).onclick = ()=>{
      const len = Math.max(4, Math.min(64, +$C('#pwLen',m.el).value||16));
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
      let p = '';
      if(window.crypto&&crypto.getRandomValues){
        const arr = new Uint32Array(len); crypto.getRandomValues(arr);
        for(let i=0;i<len;i++) p += chars[arr[i]%chars.length];
      } else { for(let i=0;i<len;i++) p += chars[Math.floor(Math.random()*chars.length)]; }
      $C('#pwOut',m.el).value = p;
    };
    $C('#pwCopy',m.el).onclick = ()=>{ navigator.clipboard.writeText($C('#pwOut',m.el).value); toast('Đã copy','success',1500); };
  }
  else if(id==='color'){
    const m = modal('<h3>Color Picker</h3><div class="field"><label class="label">Chọn màu</label><input type="color" id="colIn" value="#7c5cff" style="width:100%;height:60px;border-radius:12px;border:1px solid var(--glass-border);cursor:pointer"></div><div class="field"><label class="label">HEX</label><input class="input mono" id="colHex" readonly></div><div class="field"><label class="label">RGB</label><input class="input mono" id="colRgb" readonly></div><div class="row" style="gap:8px"><button class="btn primary" id="colCopy">Copy HEX</button></div>');
    const update = ()=>{ const v = $C('#colIn',m.el).value; $C('#colHex',m.el).value = v; const r=parseInt(v.slice(1,3),16), g=parseInt(v.slice(3,5),16), b=parseInt(v.slice(5,7),16); $C('#colRgb',m.el).value = 'rgb('+r+', '+g+', '+b+')'; };
    $C('#colIn',m.el).addEventListener('input', update); update();
    $C('#colCopy',m.el).onclick = ()=>{ navigator.clipboard.writeText($C('#colHex',m.el).value); toast('Đã copy','success',1500); };
  }
  else if(id==='qrcode'){
    const m = modal('<h3>QR Code Generator</h3><div class="field"><label class="label">Nội dung</label><textarea class="textarea" id="qrIn" placeholder="https://..."></textarea></div><button class="btn primary block" id="qrGen">Tạo QR</button><div style="text-align:center;margin-top:16px"><img id="qrRes" style="max-width:100%;border-radius:12px" alt=""></div>');
    $C('#qrGen',m.el).onclick = ()=>{

// ====== Admin data manipulators exposed globally ======
window.adminLogoutFn = function(){ window.__adminLogout(); };
window.exportData = function(){
  const blob = new Blob([JSON.stringify(window.__STATE, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'aurora-backup-'+Date.now()+'.json';
  a.click();
  toast('Đã xuất dữ liệu','success');
};
window.importData = function(text){
  try{
    const data = JSON.parse(text);
    if(!data.settings || !data.profile) throw new Error('Cấu trúc JSON không hợp lệ');
    confirmDialog('Nhập dữ liệu sẽ ghi đè toàn bộ dữ liệu hiện tại. Tiếp tục?', ()=>{
      window.__setState(data);
      toast('Đã nhập dữ liệu. Trang sẽ tải lại.','success',2000);
      setTimeout(()=>location.reload(), 800);
    });
  }catch(e){ toast('Lỗi: '+e.message,'error',4000); }
};
window.resetData = function(){
  confirmDialog('Xoá TOÀN BỘ dữ liệu website? Hành động không thể hoàn tác!', ()=>{
    localStorage.removeItem('aurora_store_v1');
    localStorage.removeItem('aurora_activity');
    localStorage.removeItem('aurora_visits');
    sessionStorage.clear();
    toast('Đã reset. Đang tải lại...','success',1500);
    setTimeout(()=>location.reload(), 800);
  });
};

// ====== Product editor ======
window.openProductEditor = function(prodId){
  const st = window.__STATE;
  const p = prodId ? st.products.find(x=>x.id===prodId) : null;
  const isNew = !p;
  const data = p || {id:uid('prod'), name:'', price:0, oldPrice:0, desc:'', category:(st.categories[0]||{}).id||'', stock:true, featured:false, visible:true, images:[], createdAt:nowISO()};
  const m = modal(
    '<h3>'+(isNew?'Thêm':'Sửa')+' sản phẩm</h3>'+
    '<div class="field"><label class="label">Tên</label><input class="input" id="edName" value="'+escD(data.name)+'"></div>'+
    '<div class="field-row"><div class="field"><label class="label">Giá</label><input class="input" type="number" id="edPrice" value="'+(data.price||0)+'"></div><div class="field"><label class="label">Giá gốc</label><input class="input" type="number" id="edOld" value="'+(data.oldPrice||0)+'"></div></div>'+
    '<div class="field"><label class="label">Danh mục</label><select class="select" id="edCat">'+st.categories.map(c=>'<option value="'+escD(c.id)+'"'+(c.id===data.category?' selected':'')+'>'+escD(c.name)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label class="label">Mô tả</label><textarea class="textarea" id="edDesc">'+escD(data.desc||'')+'</textarea></div>'+
    '<div class="field-row"><div class="field"><label class="label">Còn hàng</label><select class="select" id="edStock"><option value="1"'+((data.stock!==false)?' selected':'')+'>Có</option><option value="0"'+((data.stock===false)?' selected':'')+'>Không</option></select></div><div class="field"><label class="label">Nổi bật</label><select class="select" id="edFeat"><option value="0"'+((!data.featured)?' selected':'')+'>Không</option><option value="1"'+((data.featured)?' selected':'')+'>Có</option></select></div></div>'+
    '<div class="field"><label class="label">Hiển thị</label><select class="select" id="edVis"><option value="1"'+((data.visible!==false)?' selected':'')+'>Có</option><option value="0"'+((data.visible===false)?' selected':'')+'>Ẩn</option></select></div>'+
    '<div class="field"><label class="label">Ảnh (tối đa 10, tự nén)</label><input class="input" type="file" id="edImgs" accept="image/*" multiple></div>'+
    '<div class="row" id="edImgPreview" style="gap:6px;flex-wrap:wrap;margin-bottom:12px">'+((data.images||[]).map((im,i)=>'<div style="position:relative;width:60px;height:80px;border-radius:8px;overflow:hidden"><img src="'+escD(im)+'" style="width:100%;height:100%;object-fit:cover"><button class="img-del" data-i="'+i+'" style="position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border-radius:4px;width:16px;height:16px;font-size:11px;display:grid;place-items:center;border:none">×</button></div>').join('')+'</div>'+
    '<div class="row" style="justify-content:flex-end;gap:8px"><button class="btn ghost" data-close>Huỷ</button><button class="btn primary" id="edSave">Lưu</button></div>'
  );
  let imgs = (data.images||[]).slice();
  const renderImgs = ()=>{ $D('#edImgPreview',m.el).innerHTML = imgs.map((im,i)=>'<div style="position:relative;width:60px;height:80px;border-radius:8px;overflow:hidden"><img src="'+escD(im)+'" style="width:100%;height:100%;object-fit:cover"><button class="img-del" data-i="'+i+'" style="position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border-radius:4px;width:16px;height:16px;font-size:11px;display:grid;place-items:center;border:none;cursor:pointer">×</button></div>').join(''); };
  $D('#edImgPreview',m.el).addEventListener('click', e=>{ const b = e.target.closest('.img-del'); if(b){ imgs.splice(+b.dataset.i,1); renderImgs(); } });
  $D('#edImgs',m.el).addEventListener('change', e=>{
    const files = Array.from(e.target.files).slice(0, 10-imgs.length);
    let pending = files.length;
    if(!pending) return;
    files.forEach(f=>{
      const reader = new FileReader();
      reader.onload = ev=>{
        // compress
        const img = new Image();
        img.onload = ()=>{
          const maxW = 720, maxH = 1280;
          let w=img.width, h=img.height;
          const ratio = Math.min(maxW/w, maxH/h, 1);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
          const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img, 0,0, w,h);
          imgs.push(cv.toDataURL('image/jpeg', 0.75));
          renderImgs();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    });
  });
  $D('#edSave',m.el).onclick = ()=>{
    const name = $D('#edName',m.el).value.trim();
    if(!name){ toast('Vui lòng nhập tên','error'); return; }
    const obj = {
      id: data.id, name,
      price: +$D('#edPrice',m.el).value||0,
      oldPrice: +$D('#edOld',m.el).value||0,
      desc: $D('#edDesc',m.el).value,
      category: $D('#edCat',m.el).value,
      stock: $D('#edStock',m.el).value==='1',
      featured: $D('#edFeat',m.el).value==='1',
      visible: $D('#edVis',m.el).value==='1',
      images: imgs,
      createdAt: data.createdAt
    };
    if(isNew) st.products.push(obj);
    else{ const i = st.products.findIndex(x=>x.id===prodId); st.products[i]=obj; }
    window.__saveState();
    pushActivity((isNew?'Thêm':'Sửa')+' sản phẩm: '+name);
    toast('Đã lưu sản phẩm','success');
    m.close();
    renderAdminTabRefresh('products');
  };
};

// Refresh current admin tab content
function renderAdminTabRefresh(tab){
  const c = document.getElementById('adminContent');
  if(c) c.innerHTML = renderAdminTab(tab);
}
window.renderAdminTabRefresh = renderAdminTabRefresh;

// Bind admin events (delegated)
document.addEventListener('click', e=>{
  // login handled in bindRoute for its own form
  const t = e.target;
  if(!window.__isAdmin || !window.__isAdmin()) return;
  if(t.closest('#addProduct')){ e.preventDefault(); window.openProductEditor(null); }
  else if(t.closest('[data-edit-prod]')){ e.preventDefault(); window.openProductEditor(t.closest('[data-edit-prod]').dataset.editProd); }
  else if(t.closest('[data-del-prod]')){ e.preventDefault(); const id = t.closest('[data-del-prod]').dataset.delProd; confirmDialog('Xoá sản phẩm này?', ()=>{ window.__STATE.products = window.__STATE.products.filter(x=>x.id!==id); window.__saveState(); toast('Đã xoá','success'); renderAdminTabRefresh('products'); }); }
  else if(t.closest('#addCategory')){ e.preventDefault(); window.openCategoryEditor(null); }
  else if(t.closest('[data-edit-cat]')){ e.preventDefault(); window.openCategoryEditor(t.closest('[data-edit-cat]').dataset.editCat); }
  else if(t.closest('[data-del-cat]')){ e.preventDefault(); const id = t.closest('[data-del-cat]').dataset.delCat; confirmDialog('Xoá danh mục này?', ()=>{ window.__STATE.categories = window.__STATE.categories.filter(x=>x.id!==id); window.__saveState(); toast('Đã xoá','success'); renderAdminTabRefresh('categories'); }); }
  else if(t.closest('#addPost')){ e.preventDefault(); window.openPostEditor(null); }
  else if(t.closest('[data-edit-post]')){ e.preventDefault(); window.openPostEditor(t.closest('[data-edit-post]').dataset.editPost); }
  else if(t.closest('[data-del-post]')){ e.preventDefault(); const id = t.closest('[data-del-post]').dataset.delPost; confirmDialog('Xoá bài viết?', ()=>{ window.__STATE.posts = window.__STATE.posts.filter(x=>x.id!==id); window.__saveState(); toast('Đã xoá','success'); renderAdminTabRefresh('blog'); }); }
  else if(t.closest('#addBanner')){ e.preventDefault(); window.openBannerEditor(null); }
  else if(t.closest('[data-edit-banner]')){ e.preventDefault(); window.openBannerEditor(t.closest('[data-edit-banner]').dataset.editBanner); }
  else if(t.closest('[data-del-banner]')){ e.preventDefault(); const id = t.closest('[data-del-banner]').dataset.delBanner; confirmDialog('Xoá banner?', ()=>{ window.__STATE.banners = window.__STATE.banners.filter(x=>x.id!==id); window.__saveState(); toast('Đã xoá','success'); renderAdminTabRefresh('banners'); }); }
  else if(t.closest('#addFaq')){ e.preventDefault(); window.openFaqEditor(-1); }
  else if(t.closest('[data-edit-faq]')){ e.preventDefault(); window.openFaqEditor(+t.closest('[data-edit-faq]').dataset.editFaq); }

      const contact = {
        id: uid('ct'),
        name: fd.get('name'), email: fd.get('email'),
        phone: fd.get('phone'), subject: fd.get('subject'),
        message: fd.get('message'),
        createdAt: nowISO()
      };
      State.contacts.push(contact);
      saveState();
      pushActivity('Liên hệ mới từ '+contact.name);
      toast('Đã gửi liên hệ! Chúng tôi sẽ phản hồi sớm.','success',3000);
      e.target.reset();
    }
  });
  // Deposit interactions (delegated)
  document.addEventListener('click', handleDepositClick);
  // Product detail
  document.addEventListener('click', handleProductClicks);
  // Cart drawer
  document.addEventListener('click', handleCartClicks);
}

function handleGlobalClick(e){
  const t = e.target;

  // Product card → navigate
  const pcard = t.closest('.product-card[data-product]');
  if(pcard && !t.closest('button')){
    route('#/product/'+pcard.dataset.product);
    return;
  }
  // Add to cart
  const addBtn = t.closest('[data-add-cart]');
  if(addBtn){ e.preventDefault(); addToCart(addBtn.dataset.addCart); return; }
  // Profile copy/share
  if(t.closest('#copyProfile')){
    const p = State.profile;
    const text = p.name+' · '+p.username+'\n'+p.bio;
    navigator.clipboard.writeText(text).then(()=>toast('Đã copy thông tin','success'));
    return;
  }
  if(t.closest('#shareProfile')){
    if(navigator.share){
      navigator.share({title:State.settings.siteName, text:State.profile.bio, url:location.origin+location.pathname}).catch(()=>{});
    } else {
      navigator.clipboard.writeText(location.href);
      toast('Đã copy link profile','success');
    }
    return;
  }
  // Checkout button
  if(t.closest('#checkoutBtn')){ e.preventDefault(); checkout(); return; }
  // Back to home on errors
  // theme toggle (also handled in header render, but this is fallback)
  // Admin menu toggle
  if(t.closest('#adminMenuToggle')){
    const s = document.getElementById('adminSide'); if(s) s.classList.toggle('open');
    return;
  }
  // Logout
  if(t.closest('[onclick*="adminLogoutFn"]')){ e.preventDefault(); adminLogout(); return; }
  if(t.closest('#logoutBtn')){ e.preventDefault(); adminLogout(); return; }
}

function handleCartClicks(e){
  const t = e.target;
  const inc = t.closest('[data-cart-inc]');
  const dec = t.closest('[data-cart-dec]');
  const del = t.closest('[data-cart-del]');
  if(inc){ e.preventDefault(); cartInc(inc.dataset.cartInc); return; }
  if(dec){ e.preventDefault(); cartDec(dec.dataset.cartDec); return; }
  if(del){ e.preventDefault(); cartDel(del.dataset.cartDel); return; }
}

function handleProductClicks(e){
  const t = e.target;
  // Gallery thumbnails
  const thumb = t.closest('#galThumbs button');
  if(thumb){
    const i = +thumb.dataset.img;
    const imgs = (State.products.find(p=>p.id===currentProductIdFromHash())||{}).images||[];
    const main = document.getElementById('mainImg');
    if(main && imgs[i]) main.src = imgs[i];
    document.querySelectorAll('#galThumbs button').forEach(b=>b.classList.remove('active'));
    thumb.classList.add('active');
    return;
  }
  // Buy now
  if(t.closest('#buyNow')){
    e.preventDefault();
    const id = currentProductIdFromHash();
    if(id){ addToCart(id); route('#/cart'); }
    return;
  }
  if(t.closest('#addCartBtn')){
    e.preventDefault();
    const id = currentProductIdFromHash();
    if(id) addToCart(id);
    return;
  }
}

function currentProductIdFromHash(){
  const h = location.hash;
  const m = h.match(/#\/product\/([^/?]+)/);
  return m ? m[1] : null;
}

function handleDepositClick(e){
  const t = e.target;
  // Suggestion chips
  const amtBtn = t.closest('[data-amt]');
  if(amtBtn){
    const amt = +amtBtn.dataset.amt;
    const inp = document.getElementById('depAmount');
    if(inp) inp.value = amt;
    return;
  }
  if(t.closest('#genQR')){
    e.preventDefault();
    generateQR();
    return;
  }
  if(t.closest('#copyAcc')){ e.preventDefault(); navigator.clipboard.writeText(State.settings.bank.accountNo); toast('Đã copy STK','success',1500); return; }
  if(t.closest('#copyAmt')){ e.preventDefault(); const a = document.getElementById('depAmount').value; navigator.clipboard.writeText(a); toast('Đã copy số tiền','success',1500); return; }
  if(t.closest('#copyCode')){ e.preventDefault(); const c = document.getElementById('depCode').textContent; navigator.clipboard.writeText(c); toast('Đã copy nội dung','success',1500); return; }
  if(t.closest('#dlQR')){
    e.preventDefault();
    const img = document.getElementById('qrImg');
    if(img){ const a = document.createElement('a'); a.href = img.src; a.download = 'vietqr.png'; a.click(); }
    return;
  }
  if(t.closest('#reqConfirm')){
    e.preventDefault();
    submitDepositRequest();
    return;
  }
}

function generateQR(){
  const amount = +document.getElementById('depAmount').value || 0;
  const min = State.settings.bank.minDeposit || 20000;
  if(amount < min){ toast('Số tiền tối thiểu '+fmt(min),'error'); return; }
  const code = 'NAP'+Date.now().toString().slice(-8).toUpperCase();
  const bank = State.settings.bank;
  const qrUrl = 'https://img.vietqr.io/image/'+encodeURIComponent(bank.bankBin)+'-'+encodeURIComponent(bank.accountNo)+'-'+encodeURIComponent(bank.template||'compact2')+'.png?amount='+amount+'&addInfo='+encodeURIComponent(code)+'&accountName='+encodeURIComponent(bank.accountName);
  document.getElementById('qrImg').src = qrUrl;
  document.getElementById('qrImg').onerror = ()=>{ document.getElementById('qrImg').alt = 'Không tải được QR. Vui lòng kiểm tra thông tin ngân hàng.'; };
  document.getElementById('depCode').textContent = code;
  document.getElementById('depAmtText').textContent = fmt(amount);
  document.getElementById('accNo').textContent = bank.accountNo;
  document.getElementById('qrResult').classList.remove('hide');
  // Store pending deposit draft in memory
  window.__pendingDeposit = {code, amount, createdAt:nowISO()};
}

function submitDepositRequest(){
  if(!window.__pendingDeposit){ toast('Vui lòng tạo QR trước','warn'); return; }
  const d = window.__pendingDeposit;
  const contact = prompt('Nhập email/số điện thoại để admin liên hệ xác nhận:');
  if(!contact){ toast('Cần thông tin liên hệ','warn'); return; }
  State.deposits.push({
    id: uid('dep'),
    code: d.code,
    amount: d.amount,
    contact: contact.trim(),
    status: 'pending',
    createdAt: nowISO()
  });
  saveState();
  pushActivity('Yêu cầu nạp tiền '+d.code);
  toast('Đã gửi yêu cầu! Admin sẽ kiểm tra và xác nhận.','success',3500);
  document.getElementById('qrResult').classList.add('hide');
  window.__pendingDeposit = null;
}

// Expose global bindings
window.generateQR = generateQR;
window.submitDepositRequest = submitDepositRequest;

// Add missing bindings for header buttons (theme etc) as globals
window.openCart = window.openCart || function(){};
window.toggleTheme = window.__toggleTheme;
})();
</script>
