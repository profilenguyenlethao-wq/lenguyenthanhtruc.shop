function adminData() {
  return `
    <h2 class="admin-section-title">Quản lý dữ liệu</h2>
    <p class="admin-section-desc">Dữ liệu được lưu trên trình duyệt (LocalStorage). Không đồng bộ giữa các thiết bị.</p>
    <div class="card mb-4">
      <h3 class="text-lg fw-800 mb-3">Sao lưu & khôi phục</h3>
      <div class="flex wrap mb-4" style="gap:8px">
        <button class="btn btn-primary" onclick="exportData()">${ICO.download} Xuất JSON</button>
        <label class="btn" style="cursor:pointer">${ICO.upload} Nhập JSON<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
      </div>
      <p class="text-sm text-muted">Xuất dữ liệu để sao lưu. Nhập lại khi cần khôi phục.</p>
    </div>
    <div class="card">
      <h3 class="text-lg fw-800 mb-3" style="color:var(--danger)">Reset dữ liệu</h3>
      <p class="text-sm text-muted mb-3">Xóa toàn bộ dữ liệu và khôi phục về mặc định. Không thể hoàn tác!</p>
      <button class="btn btn-danger" onclick="resetData()">${ICO.trash} Reset toàn bộ</button>
    </div>`;
}
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lumina-backup-${Date.now()}.json`;
  a.click();
  toast('Đã xuất dữ liệu!', 'success');
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (confirm('Ghi đè dữ liệu hiện tại?')) {
        DB = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DB)), data);
        saveDB();
        applySettings();
        render();
        toast('Đã nhập dữ liệu!', 'success');
      }
    } catch (err) { toast('File không hợp lệ!', 'error'); }
  };
  reader.readAsText(file);
}
function resetData() {
  if (!confirm('XÓA TOÀN BỘ DỮ LIỆU và khôi phục mặc định?')) return;
  if (!confirm('Xác nhận lần nữa?')) return;
  DB = JSON.parse(JSON.stringify(DEFAULT_DB));
  saveDB();
  applySettings();
  render();
  toast('Đã reset!', 'success');
}

/* ═══════════════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');
  const hash = location.hash || '#/';
  const path = hash.split('?')[0];
  let content = '';
  
  try {
    if (path === '#/' || path === '#') content = renderHome();
    else if (path === '#/profile') content = renderProfile();
    else if (path === '#/shop') content = renderShop();
    else if (path.startsWith('#/product/')) content = renderProductDetail(path.split('/')[2]);
    else if (path === '#/blog') content = renderBlogList();
    else if (path.startsWith('#/blog/')) content = renderBlogDetail(path.split('/')[2]);
    else if (path === '#/contact') content = renderContact();
    else if (path === '#/deposit') content = renderDeposit();
    else if (path === '#/support') content = `<div class="page"><div class="container section"><div class="breadcrumb"><a href="#/">Trang chủ</a><span class="sep">/</span><span>Hỗ trợ</span></div><div class="card"><h1 class="text-3xl fw-900 mb-4">Trung tâm hỗ trợ</h1><div class="blog-content">${DB.pages.support || ''}</div></div></div></div>`;
    else if (path === '#/terms') content = `<div class="page"><div class="container section"><div class="breadcrumb"><a href="#/">Trang chủ</a><span class="sep">/</span><span>Điều khoản</span></div><div class="card"><div class="blog-content">${DB.pages.terms || ''}</div></div></div></div>`;
    else if (path === '#/privacy') content = `<div class="page"><div class="container section"><div class="breadcrumb"><a href="#/">Trang chủ</a><span class="sep">/</span><span>Bảo mật</span></div><div class="card"><div class="blog-content">${DB.pages.privacy || ''}</div></div></div></div>`;
    else if (path === '#/admin') content = renderAdmin();
    else content = `<div class="page"><div class="container section"><div class="empty-state"><h3>404 - Không tìm thấy trang</h3><a href="#/" class="btn btn-primary mt-4">Về trang chủ</a></div></div></div>`;
  } catch (err) {
    console.error('Render error:', err);
    content = `<div class="page"><div class="container section"><div class="empty-state"><h3>Đã xảy ra lỗi</h3><p class="text-sm">${escapeHtml(err.message)}</p></div></div></div>`;
  }
  
  app.innerHTML = content;
  renderNav();
  updateCartBadge();
  
  // Post-render event listeners
  requestAnimationFrame(() => {
    // Shop search
    const searchInput = document.getElementById('shopSearch');
    if (searchInput) {
      searchInput.addEventListener('input', debounce(e => {
        const q = e.target.value.trim();
        const cat = new URLSearchParams((location.hash.split('?')[1]||'')).get('cat') || 'all';
        location.hash = `#/shop?cat=${cat}&q=${encodeURIComponent(q)}`;
      }, 400));
    }
    const sortSel = document.getElementById('shopSort');
    if (sortSel) {
      sortSel.addEventListener('change', e => {
        const cat = new URLSearchParams((location.hash.split('?')[1]||'')).get('cat') || 'all';
        const q = new URLSearchParams((location.hash.split('?')[1]||'')).get('q') || '';
        location.hash = `#/shop?cat=${cat}&q=${encodeURIComponent(q)}&sort=${e.target.value}`;
      });
    }
    // Gallery swipe tracking
    const track = document.getElementById('galleryTrack');
    if (track) {
      _galleryIdx = 0;
      let scrollTimer;
      track.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const w = track.clientWidth;
          _galleryIdx = Math.round(track.scrollLeft / w);
          _updateGalleryUI(_galleryIdx);
        }, 100);
      }, {passive: true});
    }
    // Reveal animations
    if (DB.settings.animations) {
      const reveals = document.querySelectorAll('.section, .sec-head, .card, .product-card, .blog-card');
      // IntersectionObserver
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              en.target.style.opacity = '1';
              en.target.style.transform = 'translateY(0)';
              io.unobserve(en.target);
            }
          });
        }, {threshold: 0.05});
        reveals.forEach(el => {
          if (!el.dataset.revealed) {
            el.dataset.revealed = '1';
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'opacity .7s cubic-bezier(0.16,1,0.3,1), transform .7s cubic-bezier(0.16,1,0.3,1)';
            io.observe(el);
          }
        });
      }
    }
  });
  
  window.scrollTo({top: 0, behavior: 'auto'});
  closeMobileMenu();
}

/* ═══════════════════════════════════════════════════════════════════
   INIT & EVENTS
   ═══════════════════════════════════════════════════════════════════ */
function closeMobileMenu() {
  const d = document.getElementById('mobileDrawer');
  if (d) d.classList.remove('open');
}

function init() {
  loadDB();
  applySettings();
  renderFooter();
  render();
  updateCartBadge();
  
  // Route change
  window.addEventListener('hashchange', render);
  
  // Theme toggle
  document.getElementById('themeToggle')?.addEventListener('click', () => {
    DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark';
    saveDB();
    applySettings();
  });
  
  // Cart toggle
  document.getElementById('cartToggle')?.addEventListener('click', openCart);
  document.getElementById('cartClose')?.addEventListener('click', closeCart);
  document.getElementById('cartDrawer')?.addEventListener('click', e => {
    if (e.target.id === 'cartDrawer') closeCart();
  });
  
  // Mobile menu
  document.getElementById('mobileToggle')?.addEventListener('click', () => {
    document.getElementById('mobileDrawer').classList.add('open');
    document.body.style.overflow = 'hidden';
  });
  document.getElementById('mobileClose')?.addEventListener('click', () => {
    closeMobileMenu();
    document.body.style.overflow = '';
  });
  document.getElementById('mobileDrawer')?.addEventListener('click', e => {
    if (e.target.id === 'mobileDrawer') {
      closeMobileMenu();
      document.body.style.overflow = '';
    }
  });
  document.getElementById('mobileNav')?.addEventListener('click', e => {
    if (e.target.closest('a')) {
      closeMobileMenu();
      document.body.style.overflow = '';
    }
  });
  
  // Modal close
  document.getElementById('modalOverlay')?.addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal();
      closeCart();
      closeMobileMenu();
    }
  });
  
  // DB updates across tabs
  window.addEventListener('storage', e => {
    if (e.key === LS_KEY) {
      loadDB();
      applySettings();
      renderFooter();
      render();
    }
    if (e.key === CART_KEY) updateCartBadge();
  });
  
  // Magnetic buttons (subtle)
  document.addEventListener('mousemove', e => {
    const btn = e.target.closest('.btn');
    if (btn && btn.offsetWidth) {
      const r = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      btn.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    }
  }, {passive: true});
  
  console.log('%c⚡ LUMINA v1.0', 'color:#6366f1;font-size:20px;font-weight:900');
  console.log('%cLiquid Glass Digital Store ready!', 'color:#8b5cf6;font-size:12px');
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('error', e => {
  console.error('Runtime error:', e.error);
});
