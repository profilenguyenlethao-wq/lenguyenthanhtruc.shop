<script>
/* ============================================================
   PART 8 — WALLET LOGIC
   ============================================================ */
(function () {
  'use strict';
  const { State, supabase, $, el, CONFIG, Toast, Modal, escapeHtml, formatCurrency, formatDate, formatDateTime, store } = window.LH;

  if (!supabase) return;

  /* 8.1 WALLET HELPERS */
  async function fetchWallet() {
    if (!State.user) return;
    try {
      const { data, error } = await supabase.from('wallets').select('*').eq('user_id', State.user.id).maybeSingle();
      if (error) throw error;
      if (!data) {
        const { data: created } = await supabase.from('wallets').insert({ user_id: State.user.id, balance: 0 }).select().single();
        State.wallet = created;
      } else {
        State.wallet = data;
      }
    } catch (e) {
      console.warn('Fetch wallet error:', e);
      State.wallet = { balance: 0, total_deposited: 0, total_spent: 0 };
    }
  }

  async function uploadReceipt(file) {
    if (!State.user) throw new Error('Chưa đăng nhập');
    const ext = file.name.split('.').pop();
    const path = `${State.user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error } = await supabase.storage.from('receipt-images').upload(path, file);
    if (error) throw new Error('Lỗi upload ảnh: ' + error.message);
    const { data } = supabase.storage.from('receipt-images').getPublicUrl(path);
    return data.publicUrl;
  }

  /* 8.2 WALLET VIEW RENDERER */
  async function renderWallet(container) {
    if (!State.user) {
      container.innerHTML = `<div class="empty-state" style="margin-top:40px;"><div class="empty-title">Cần đăng nhập</div><button class="btn btn-primary" onclick="window.LH.Auth.openLogin()" style="margin-top:16px;">Đăng nhập</button></div>`;
      return;
    }

    container.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
    await fetchWallet();

    const w = State.wallet;
    container.innerHTML = `
      <!-- HERO -->
      <div class="wallet-hero anim-up">
        <div class="wallet-balance-label">Số dư khả dụng</div>
        <div class="wallet-balance-amount">${formatCurrency(w.balance || 0)}</div>
        <div class="wallet-stats">
          <div class="wallet-stat-item">
            <div class="wallet-stat-label">Tổng nạp</div>
            <div class="wallet-stat-value">${formatCurrency(w.total_deposited || 0)}</div>
          </div>
          <div class="wallet-stat-item">
            <div class="wallet-stat-label">Tổng chi</div>
            <div class="wallet-stat-value">${formatCurrency(w.total_spent || 0)}</div>
          </div>
        </div>
      </div>

      <div class="deposit-section">
        <!-- CỘT TRÁI: FORM NẠP TIỀN -->
        <div class="deposit-card anim-up">
          <h3 class="h3" style="margin-bottom:16px;"><i data-lucide="plus-circle" style="vertical-align:-3px;color:var(--brand-1);"></i> Nạp tiền</h3>
          
          <div class="deposit-method-tabs">
            <div class="deposit-method-tab active" data-method="bank"><i data-lucide="landmark"></i> Ngân hàng</div>
            <div class="deposit-method-tab" data-method="bitcoin"><i data-lucide="bitcoin"></i> Bitcoin</div>
          </div>

          <div id="bankInfoBox">
            <div class="bank-info-row">
              <div><div class="bank-info-label">Ngân hàng</div><div class="bank-info-value" id="bankName">Đang tải...</div></div>
            </div>
            <div class="bank-info-row">
              <div><div class="bank-info-label">Số tài khoản</div><div class="bank-info-value" id="bankAcc">—</div></div>
              <div class="copy-btn" onclick="window.LH.copyToClipboard(document.getElementById('bankAcc').innerText)"><i data-lucide="copy"></i></div>
            </div>
            <div class="bank-info-row">
              <div><div class="bank-info-label">Chủ tài khoản</div><div class="bank-info-value" id="bankOwner">—</div></div>
            </div>
            <div class="bank-info-row" style="background:var(--brand-grad-soft);border-color:var(--brand-1);">
              <div><div class="bank-info-label" style="color:var(--brand-1);">Nội dung chuyển khoản</div><div class="bank-info-value" id="depositCode" style="color:var(--brand-1);">NAP${Date.now().toString().slice(-6)}</div></div>
              <div class="copy-btn" onclick="window.LH.copyToClipboard(document.getElementById('depositCode').innerText)"><i data-lucide="copy"></i></div>
            </div>
          </div>

          <div id="btcInfoBox" style="display:none;">
            <div class="bank-info-row">
              <div><div class="bank-info-label">Mạng</div><div class="bank-info-value">Bitcoin (BTC)</div></div>
            </div>
            <div class="bank-info-row">
              <div><div class="bank-info-label">Địa chỉ ví</div><div class="bank-info-value" id="btcAddress" style="font-size:12px;">Đang tải...</div></div>
            </div>
            <div class="alert" style="margin-top:8px;padding:8px;border-radius:8px;background:var(--warning-bg);color:var(--warning);font-size:12px;">Chỉ gửi BTC, không gửi mạng khác.</div>
          </div>

          <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--divider);">
            <div class="field" style="margin-bottom:12px;">
              <label class="field-label">Số tiền nạp (VND) <span style="color:var(--danger);">*</span></label>
              <input type="number" class="input" id="depositAmount" placeholder="VD: 100000" min="10000" step="1000">
            </div>
            
            <div class="field" style="margin-bottom:12px;">
              <label class="field-label">Mã giao dịch / TXID (nếu có)</label>
              <input type="text" class="input" id="depositTxId" placeholder="Nhập mã giao dịch...">
            </div>

            <div class="field" style="margin-bottom:16px;">
              <label class="field-label">Ảnh chứng minh <span style="color:var(--danger);">*</span></label>
              <div class="upload-box" id="uploadBox" onclick="document.getElementById('receiptFile').click()">
                <i data-lucide="image-plus" style="width:24px;height:24px;color:var(--text-4);margin-bottom:8px;"></i>
                <div class="body-sm">Nhấn để chọn ảnh chụp màn hình</div>
              </div>
              <input type="file" id="receiptFile" hidden accept="image/*">
              <div class="upload-preview" id="receiptPreview"></div>
            </div>

            <button class="btn btn-primary btn-block" id="btnSubmitDeposit">Gửi yêu cầu nạp</button>
          </div>
        </div>

        <!-- CỘT PHẢI: LỊCH SỬ -->
        <div class="deposit-card anim-up" style="animation-delay:0.1s;">
          <h3 class="h3" style="margin-bottom:16px;"><i data-lucide="history" style="vertical-align:-3px;color:var(--brand-1);"></i> Lịch sử giao dịch</h3>
          <div id="txHistoryList" style="max-height:500px;overflow-y:auto;">
            <div style="text-align:center;padding:20px;"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // --- Logic Xử lý nạp tiền ---
    let selectedMethod = 'bank';
    let receiptUrl = null;

    // Lấy config ngân hàng
    try {
      const { data } = await supabase.from('website_settings').select('*').eq('key', 'bank_config').single();
      if (data && data.value) {
        document.getElementById('bankName').innerText = data.value.bank_name || 'MB Bank';
        document.getElementById('bankAcc').innerText = data.value.account_no || 'Chưa cấu hình';
        document.getElementById('bankOwner').innerText = data.value.account_name || 'Chưa cấu hình';
      } else {
        document.getElementById('bankName').innerText = 'Chưa cấu hình';
      }
      const { data: btcData } = await supabase.from('website_settings').select('*').eq('key', 'bitcoin_config').single();
      if (btcData && btcData.value) document.getElementById('btcAddress').innerText = btcData.value.address || 'Chưa cấu hình';
    } catch (e) {
      document.getElementById('bankName').innerText = 'Chưa cấu hình';
    }

    // Tab switching
    container.querySelectorAll('.deposit-method-tab').forEach(tab => {
      tab.onclick = () => {
        container.querySelectorAll('.deposit-method-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        selectedMethod = tab.dataset.method;
        document.getElementById('bankInfoBox').style.display = selectedMethod === 'bank' ? 'block' : 'none';
        document.getElementById('btcInfoBox').style.display = selectedMethod === 'bitcoin' ? 'block' : 'none';
      };
    });

    // Upload ảnh
    document.getElementById('receiptFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const preview = document.getElementById('receiptPreview');
      preview.innerHTML = '<div style="font-size:12px;color:var(--brand-1);">Đang tải ảnh lên...</div>';
      try {
        receiptUrl = await uploadReceipt(file);
        preview.innerHTML = `<img src="${receiptUrl}" alt="receipt">`;
      } catch (err) {
        Toast.error(err.message);
        preview.innerHTML = '';
      }
    };

    // Submit
    document.getElementById('btnSubmitDeposit').onclick = async () => {
      const amount = parseFloat(document.getElementById('depositAmount').value);
      const txId = document.getElementById('depositTxId').value.trim();
      if (!amount || amount < 10000) return Toast.warning('Số tiền tối thiểu là 10.000đ');
      if (!receiptUrl) return Toast.warning('Vui lòng tải lên ảnh chứng minh');

      const btn = document.getElementById('btnSubmitDeposit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Đang gửi...';

      try {
        const code = document.getElementById('depositCode').innerText;
        const { error } = await supabase.from('deposit_requests').insert({
          user_id: State.user.id,
          code,
          amount,
          method: selectedMethod,
          tx_code: txId || null,
          receipt_url: receiptUrl,
          status: 'pending'
        });
        if (error) throw error;
        
        Toast.success('Đã gửi yêu cầu nạp tiền. Vui lòng chờ Admin duyệt!');
        document.getElementById('depositAmount').value = '';
        document.getElementById('depositTxId').value = '';
        document.getElementById('receiptPreview').innerHTML = '';
        receiptUrl = null;
        loadHistory();
      } catch (err) {
        Toast.error('Lỗi: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Gửi yêu cầu nạp';
      }
    };

    // Load lịch sử
    async function loadHistory() {
      const list = document.getElementById('txHistoryList');
      try {
        const { data, error } = await supabase
          .from('wallet_transactions')
          .select('*')
          .eq('user_id', State.user.id)
          .order('created_at', { ascending: false })
          .limit(30);
        
        if (error) throw error;
        
        if (!data || data.length === 0) {
          list.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-title">Chưa có giao dịch</div></div>';
          return;
        }

        list.innerHTML = data.map(tx => {
          const isIn = tx.amount > 0;
          return `
            <div class="tx-item">
              <div class="tx-icon ${isIn ? 'in' : 'out'}">
                <i data-lucide="${isIn ? 'arrow-down-left' : 'arrow-up-right'}"></i>
              </div>
              <div class="tx-body">
                <div class="tx-title">${escapeHtml(tx.reason || tx.type)}</div>
                <div class="tx-meta">${formatDateTime(tx.created_at)}</div>
              </div>
              <div>
                <div class="tx-amount ${isIn ? 'in' : 'out'}">${isIn ? '+' : ''}${formatCurrency(tx.amount)}</div>
                <div class="tx-meta" style="text-align:right;">Số dư: ${formatCurrency(tx.balance_after)}</div>
              </div>
            </div>
          `;
        }).join('');
        if (window.lucide) window.lucide.createIcons({ nodes: [list] });
      } catch (err) {
        list.innerHTML = `<div class="empty-state" style="padding:20px;"><div class="empty-desc">Lỗi tải lịch sử: ${err.message}</div></div>`;
      }
    }
    loadHistory();
  }
  window.LH.Views.wallet = renderWallet;

  // Copy to clipboard helper
  window.LH.copyToClipboard = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      Toast.success('Đã sao chép!');
    } catch {
      Toast.error('Không thể sao chép');
    }
  };

  console.log('%cPart 8 loaded — Wallet, Deposit, History', 'color:#06b6d4;font-weight:700;');
})();
</script>
<style>
/* ============================================================
   PART 9 — ADMIN PANEL CSS
   ============================================================ */

/* 9.1 Admin Layout */
.admin-container {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 100px);
}
@media (min-width: 1024px) {
  .admin-container { flex-direction: row; gap: 24px; }
}

/* Sidebar Admin */
.admin-sidebar {
  width: 100%;
  flex-shrink: 0;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  padding: 12px;
  display: flex;
  overflow-x: auto;
  gap: 8px;
  margin-bottom: 16px;
}
@media (min-width: 1024px) {
  .admin-sidebar { width: 240px; flex-direction: column; overflow-x: visible; margin-bottom: 0; height: fit-content; position: sticky; top: 80px; }
}
.admin-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  transition: 0.2s;
}
.admin-nav-btn:hover { background: var(--surface-3); }
.admin-nav-btn.active { background: var(--brand-grad); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }

/* Main Area */
.admin-main { flex: 1; min-width: 0; }
.admin-tab-content { display: none; animation: fadeIn 0.3s ease; }
.admin-tab-content.active { display: block; }

/* 9.2 Dashboard Stats */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
@media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
.stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 8px; }
.stat-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.stat-value { font-size: 24px; font-weight: 800; color: var(--text-1); }
.stat-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }

/* 9.3 Admin Tables */
.table-responsive { overflow-x: auto; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--r-lg); }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
.admin-table th { background: var(--surface-3); padding: 14px 16px; font-weight: 700; color: var(--text-2); white-space: nowrap; border-bottom: 1px solid var(--divider); }
.admin-table td { padding: 14px 16px; border-bottom: 1px solid var(--divider); vertical-align: middle; color: var(--text-1); }
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tr:hover { background: var(--surface-2); }

/* Badges */
.badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge-pending { background: var(--warning-bg); color: var(--warning); }
.badge-success { background: rgba(16,185,129,0.15); color: var(--success); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }

/* 9.4 Product Image Uploader */
.img-uploader-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
@media (min-width: 640px) { .img-uploader-grid { grid-template-columns: repeat(6, 1fr); } }
.img-slot { aspect-ratio: 1/1; border-radius: var(--r-md); border: 1px dashed var(--border-2); display: grid; place-items: center; position: relative; overflow: hidden; background: var(--surface-3); cursor: pointer; }
.img-slot img { width: 100%; height: 100%; object-fit: cover; }
.img-slot-rm { position: absolute; top: 4px; right: 4px; background: rgba(239,68,68,0.9); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; cursor: pointer; }
</style>

<script>
/* ============================================================
   PART 9 — ADMIN LOGIC (DASHBOARD, DEPOSITS, USERS, PRODUCTS)
   ============================================================ */
(function () {
  'use strict';
  const { State, supabase, $, el, CONFIG, Toast, Modal, escapeHtml, formatCurrency, formatDate, formatDateTime, compressImage } = window.LH;

  if (!supabase) return;

  /* 9.1 ADMIN INITIALIZATION */
  async function renderAdmin(container) {
    if (!State.user) {
      container.innerHTML = `<div class="empty-state" style="margin-top:40px;"><div class="empty-title">Vui lòng đăng nhập</div><button class="btn btn-primary" onclick="window.LH.Auth.openLogin()">Đăng nhập</button></div>`;
      return;
    }

    // Double-check admin role
    if (!State.isAdmin) {
      const { data } = await supabase.from('user_roles').select('role').eq('user_id', State.user.id).maybeSingle();
      if (data && (data.role === 'admin' || data.role === 'super_admin')) {
        State.isAdmin = true;
      } else {
        container.innerHTML = `<div class="empty-state" style="margin-top:40px;"><div class="empty-icon" style="background:var(--danger-bg);color:var(--danger);"><i data-lucide="shield-x"></i></div><div class="empty-title">Không có quyền truy cập</div><div class="empty-desc">Tài khoản của bạn không phải là Quản trị viên.</div><a href="#/" class="btn btn-primary" style="margin-top:16px;">Về trang chủ</a></div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [container] });
        return;
      }
    }

    container.innerHTML = `
      <div class="admin-container anim-fade">
        <aside class="admin-sidebar">
          <div class="admin-nav-btn active" data-target="tab-dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</div>
          <div class="admin-nav-btn" data-target="tab-deposits"><i data-lucide="wallet"></i> Duyệt nạp tiền</div>
          <div class="admin-nav-btn" data-target="tab-users"><i data-lucide="users"></i> Người dùng</div>
          <div class="admin-nav-btn" data-target="tab-products"><i data-lucide="package"></i> Sản phẩm</div>
        </aside>
        <main class="admin-main">
          <div class="admin-tab-content active" id="tab-dashboard"></div>
          <div class="admin-tab-content" id="tab-deposits"></div>
          <div class="admin-tab-content" id="tab-users"></div>
          <div class="admin-tab-content" id="tab-products"></div>
        </main>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // Bind Tabs
    container.querySelectorAll('.admin-nav-btn').forEach(btn => {
      btn.onclick = () => {
        container.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        container.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
        const target = container.querySelector(`#${btn.dataset.target}`);
        target.classList.add('active');
        
        // Load data lazily
        if (btn.dataset.target === 'tab-dashboard') loadDashboard(target);
        if (btn.dataset.target === 'tab-deposits') loadDeposits(target);
        if (btn.dataset.target === 'tab-users') loadUsers(target);
        if (btn.dataset.target === 'tab-products') loadProducts(target);
      };
    });

    // Load initial tab
    loadDashboard(container.querySelector('#tab-dashboard'));
  }
  window.LH.Views.admin = renderAdmin;

  /* 9.2 DASHBOARD */
  async function loadDashboard(target) {
    target.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
    try {
      const [users, orders, products, deposits, revenueData] = await Promise.all([
        supabase.from('profiles').select('*', { count: 'exact', head: true }),
        supabase.from('orders').select('*', { count: 'exact', head: true }),
        supabase.from('products').select('*', { count: 'exact', head: true }),
        supabase.from('deposit_requests').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
        supabase.from('orders').select('total_amount').eq('status', 'completed')
      ]);

      const totalRevenue = (revenueData.data || []).reduce((sum, o) => sum + Number(o.total_amount || 0), 0);

      target.innerHTML = `
        <h2 class="h2" style="margin-bottom:20px;">Tổng quan hệ thống</h2>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(99,102,241,0.15);color:var(--brand-1);"><i data-lucide="users"></i></div>
            <div class="stat-value">${users.count || 0}</div>
            <div class="stat-label">Người dùng</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(16,185,129,0.15);color:var(--success);"><i data-lucide="shopping-bag"></i></div>
            <div class="stat-value">${orders.count || 0}</div>
            <div class="stat-label">Đơn hàng</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(245,158,11,0.15);color:var(--warning);"><i data-lucide="clock"></i></div>
            <div class="stat-value">${deposits.count || 0}</div>
            <div class="stat-label">Chờ duyệt nạp</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(239,68,68,0.15);color:var(--danger);"><i data-lucide="trending-up"></i></div>
            <div class="stat-value">${formatCurrency(totalRevenue)}</div>
            <div class="stat-label">Doanh thu</div>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [target] });
    } catch (e) {
      target.innerHTML = `<div class="empty-desc">Lỗi tải Dashboard: ${e.message}</div>`;
    }
  }

  /* 9.3 DUYỆT NẠP TIỀN */
  async function loadDeposits(target) {
    target.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
    try {
      const { data, error } = await supabase.from('deposit_requests').select('*').order('created_at', { ascending: false }).limit(50);
      if (error) throw error;

      if (!data || data.length === 0) {
        target.innerHTML = '<div class="empty-state"><div class="empty-title">Không có yêu cầu nạp nào</div></div>';
        return;
      }

      target.innerHTML = `
        <h2 class="h2" style="margin-bottom:20px;">Quản lý nạp tiền</h2>
        <div class="table-responsive">
          <table class="admin-table">
            <thead><tr><th>Mã GD</th><th>User ID</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${data.map(r => `
                <tr>
                  <td class="mono">${escapeHtml(r.code)}</td>
                  <td class="mono">${r.user_id.slice(0, 8)}...</td>
                  <td style="font-weight:700;color:var(--danger);">${formatCurrency(r.amount)}</td>
                  <td><span class="badge badge-${r.status === 'pending' ? 'pending' : r.status === 'approved' ? 'success' : 'danger'}">${r.status}</span></td>
                  <td>${formatDateTime(r.created_at)}</td>
                  <td>
                    ${r.status === 'pending' ? `<button class="btn btn-sm btn-primary" onclick="window.LH.AdminAction.viewDeposit('${r.id}')">Xem & Duyệt</button>` : `<button class="btn btn-sm btn-glass" onclick="window.LH.AdminAction.viewDeposit('${r.id}')">Chi tiết</button>`}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch (e) {
      target.innerHTML = `<div class="empty-desc">Lỗi: ${e.message}</div>`;
    }
  }

  /* 9.4 QUẢN LÝ USERS */
  async function loadUsers(target) {
    target.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
    try {
      const { data, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: false }).limit(50);
      if (error) throw error;

      target.innerHTML = `
        <h2 class="h2" style="margin-bottom:20px;">Quản lý người dùng</h2>
        <div class="table-responsive">
          <table class="admin-table">
            <thead><tr><th>Username</th><th>Tên hiển thị</th><th>ID</th><th>Tham gia</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${data.map(u => `
                <tr>
                  <td style="font-weight:700;">@${escapeHtml(u.username || '—')}</td>
                  <td>${escapeHtml(u.display_name || '—')}</td>
                  <td class="mono">${u.id.slice(0, 8)}...</td>
                  <td>${formatDate(u.created_at)}</td>
                  <td>
                    <button class="btn btn-sm btn-glass" onclick="window.LH.AdminAction.adjustBalance('${u.id}', '${escapeHtml(u.username)}')"><i data-lucide="wallet"></i> Ví</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [target] });
    } catch (e) {
      target.innerHTML = `<div class="empty-desc">Lỗi: ${e.message}</div>`;
    }
  }

  /* 9.5 QUẢN LÝ SẢN PHẨM */
  async function loadProducts(target) {
    target.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
    try {
      const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false }).limit(50);
      if (error) throw error;

      target.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h2 class="h2">Quản lý sản phẩm</h2>
          <button class="btn btn-primary" onclick="window.LH.AdminAction.editProduct()"><i data-lucide="plus"></i> Thêm mới</button>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead><tr><th>Ảnh</th><th>Tên SP</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${data.map(p => `
                <tr>
                  <td><div style="width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--surface-3);">${p.thumbnail_url ? `<img src="${p.thumbnail_url}" style="width:100%;height:100%;object-fit:cover;">` : ''}</div></td>
                  <td style="font-weight:600;">${escapeHtml(p.name)}</td>
                  <td style="color:var(--danger);font-weight:700;">${formatCurrency(p.price)}</td>
                  <td>${p.stock || 0}</td>
                  <td><span class="badge ${p.is_visible ? 'badge-success' : 'badge-danger'}">${p.is_visible ? 'Hiện' : 'Ẩn'}</span></td>
                  <td>
                    <button class="btn btn-sm btn-glass" onclick="window.LH.AdminAction.editProduct('${p.id}')"><i data-lucide="edit-2"></i> Sửa</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [target] });
    } catch (e) {
      target.innerHTML = `<div class="empty-desc">Lỗi: ${e.message}</div>`;
    }
  }

  /* 9.6 ADMIN ACTIONS (Duyệt nạp, Chỉnh ví, Sửa SP) */
  window.LH.AdminAction = {
    async viewDeposit(id) {
      const { data: r, error } = await supabase.from('deposit_requests').select('*').eq('id', id).single();
      if (error || !r) return Toast.error('Không tìm thấy yêu cầu');

      const body = document.createElement('div');
      body.innerHTML = `
        <div class="acc-info-row"><span>Mã GD:</span><strong>${escapeHtml(r.code)}</strong></div>
        <div class="acc-info-row"><span>User ID:</span><strong class="mono">${r.user_id}</strong></div>
        <div class="acc-info-row"><span>Số tiền:</span><strong style="color:var(--danger);font-size:16px;">${formatCurrency(r.amount)}</strong></div>
        <div class="acc-info-row"><span>Phương thức:</span><strong>${r.method}</strong></div>
        <div class="acc-info-row"><span>TXID:</span><strong>${escapeHtml(r.tx_code || '—')}</strong></div>
        ${r.receipt_url ? `<div style="margin-top:16px;"><img src="${r.receipt_url}" style="max-width:100%;border-radius:8px;"></div>` : ''}
      `;

      const actions = [
        { label: 'Đóng', className: 'btn-glass', onClick: (close) => close() }
      ];

      if (r.status === 'pending') {
        actions.push({
          label: 'Từ chối',
          className: 'btn-danger',
          onClick: async (close) => {
            try {
              await supabase.from('deposit_requests').update({ status: 'rejected' }).eq('id', id);
              Toast.success('Đã từ chối');
              close();
              loadDeposits(document.getElementById('tab-deposits'));
            } catch (e) { Toast.error(e.message); }
          }
        });
        actions.push({
          label: 'Duyệt & Cộng tiền',
          className: 'btn-success',
          onClick: async (close) => {
            const confirm = await Modal.confirm(`Cộng ${formatCurrency(r.amount)} cho user này?`);
            if (!confirm) return;
            close();
            try {
              // 1. Cập nhật trạng thái
              await supabase.from('deposit_requests').update({ status: 'approved' }).eq('id', id);
              // 2. Cộng tiền vào ví
              const { error: rpcErr } = await supabase.rpc('wallet_adjust', {
                p_user_id: r.user_id,
                p_amount: r.amount,
                p_type: 'deposit',
                p_reason: 'Duyệt nạp ' + r.code
              });
              if (rpcErr) {
                // Fallback nếu chưa có RPC: gọi trực tiếp (yêu cầu quyền admin)
                const { data: w } = await supabase.from('wallets').select('balance').eq('user_id', r.user_id).single();
                if (w) {
                  await supabase.from('wallets').update({ balance: w.balance + Number(r.amount) }).eq('user_id', r.user_id);
                  await supabase.from('wallet_transactions').insert({
                    user_id: r.user_id, amount: r.amount, type: 'deposit',
                    reason: 'Duyệt nạp ' + r.code, balance_after: w.balance + Number(r.amount)
                  });
                }
              }
              Toast.success('Đã duyệt và cộng tiền!');
              loadDeposits(document.getElementById('tab-deposits'));
            } catch (e) { Toast.error(e.message); }
          }
        });
      }

      Modal.open({ title: 'Chi tiết nạp tiền', content: body, actions });
    },

    async adjustBalance(userId, username) {
      const body = document.createElement('div');
      body.innerHTML = `
        <p class="body-sm" style="margin-bottom:16px;">Điều chỉnh số dư cho: <strong>@${username}</strong></p>
        <div class="field" style="margin-bottom:12px;">
          <label class="field-label">Số tiền (+ để cộng, - để trừ)</label>
          <input type="number" class="input" id="adjAmount" placeholder="VD: 50000 hoặc -20000">
        </div>
        <div class="field">
          <label class="field-label">Lý do</label>
          <input type="text" class="input" id="adjReason" placeholder="VD: Thưởng sự kiện..." value="Admin điều chỉnh">
        </div>
      `;
      Modal.open({
        title: 'Điều chỉnh số dư',
        content: body,
        actions: [
          { label: 'Hủy', className: 'btn-glass', onClick: (c) => c() },
          { label: 'Xác nhận', className: 'btn-primary', onClick: async (close) => {
            const amount = parseFloat(document.getElementById('adjAmount').value);
            const reason = document.getElementById('adjReason').value;
            if (!amount || isNaN(amount)) return Toast.error('Số tiền không hợp lệ');
            try {
              await supabase.rpc('wallet_adjust', {
                p_user_id: userId, p_amount: amount, p_type: 'admin_adjust', p_reason: reason
              });
              Toast.success('Đã điều chỉnh số dư');
              close();
            } catch (e) { Toast.error(e.message); }
          }}
        ]
      });
    },

    async editProduct(productId = null) {
      let p = { name: '', price: 0, sale_price: '', stock: 0, description: '', is_visible: true };
      if (productId) {
        const { data } = await supabase.from('products').select('*').eq('id', productId).single();
        if (data) p = data;
      }

      const body = document.createElement('div');
      body.innerHTML = `
        <div class="field" style="margin-bottom:12px;">
          <label class="field-label">Tên sản phẩm</label>
          <input type="text" class="input" id="epName" value="${escapeHtml(p.name)}">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
          <div class="field">
            <label class="field-label">Giá gốc</label>
            <input type="number" class="input" id="epPrice" value="${p.price}">
          </div>
          <div class="field">
            <label class="field-label">Giá sale (nếu có)</label>
            <input type="number" class="input" id="epSalePrice" value="${p.sale_price || ''}">
          </div>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label class="field-label">Tồn kho</label>
          <input type="number" class="input" id="epStock" value="${p.stock || 0}">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label class="field-label">Mô tả ngắn</label>
          <textarea class="textarea" id="epDesc" style="min-height:80px;">${escapeHtml(p.description || '')}</textarea>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label class="field-label">Ảnh đại diện (URL)</label>
          <input type="url" class="input" id="epImage" value="${escapeHtml(p.thumbnail_url || '')}" placeholder="https://...">
        </div>
        <label class="checkbox" style="margin-top:8px;"><input type="checkbox" id="epVisible" ${p.is_visible ? 'checked' : ''}><span class="box"></span><span>Hiển thị công khai</span></label>
      `;

      Modal.open({
        title: productId ? 'Sửa sản phẩm' : 'Thêm sản phẩm',
        content: body,
        size: 'lg',
        actions: [
          { label: 'Hủy', className: 'btn-glass', onClick: (c) => c() },
          { label: 'Lưu', className: 'btn-primary', onClick: async (close) => {
            const payload = {
              name: document.getElementById('epName').value.trim(),
              price: parseFloat(document.getElementById('epPrice').value) || 0,
              sale_price: parseFloat(document.getElementById('epSalePrice').value) || null,
              stock: parseInt(document.getElementById('epStock').value) || 0,
              description: document.getElementById('epDesc').value.trim(),
              thumbnail_url: document.getElementById('epImage').value.trim(),
              is_visible: document.getElementById('epVisible').checked
            };
            if (!payload.name) return Toast.warning('Nhập tên sản phẩm');
            try {
              if (productId) {
                await supabase.from('products').update(payload).eq('id', productId);
              } else {
                await supabase.from('products').insert({ ...payload, slug: payload.name.toLowerCase().replace(/\s+/g, '-') });
              }
              Toast.success('Đã lưu sản phẩm');
              close();
              loadProducts(document.getElementById('tab-products'));
            } catch (e) { Toast.error(e.message); }
          }}
        ]
      });
    }
  };

  console.log('%cPart 9 loaded — Admin Dashboard, Deposits, Users, Products', 'color:#ec4899;font-weight:700;');
})();
</script>

<script>
/* ============================================================
   PART 10 — 10 MMO TOOLS LOGIC
   ============================================================ */
(function () {
  'use strict';
  const { State, $, el, Toast, Modal, escapeHtml, copyToClipboard } = window.LH;

  // Danh sách 10 công cụ mới
  const TOOLS_LIST = [
    { id: 'json', name: 'JSON Formatter', desc: 'Định dạng & kiểm tra JSON', icon: 'braces', color: 'blue' },
    { id: 'base64', name: 'Base64', desc: 'Mã hóa / Giải mã Base64', icon: 'binary', color: 'green' },
    { id: 'url', name: 'URL Encode/Decode', desc: 'Mã hóa chuỗi URL', icon: 'link', color: 'purple' },
    { id: 'hash', name: 'Hash Generator', desc: 'Tạo mã băm SHA-256', icon: 'hash', color: 'orange' },
    { id: 'text', name: 'Text Toolkit', desc: 'Đếm từ, ký tự, xóa trùng', icon: 'type', color: 'rose' },
    { id: 'minifier', name: 'Minifier', desc: 'Thu gọn HTML/CSS/JS', icon: 'file-code', color: 'slate' },
    { id: 'regex', name: 'Regex Tester', desc: 'Kiểm tra biểu thức chính quy', icon: 'regex', color: 'cyan' },
    { id: 'timestamp', name: 'Timestamp', desc: 'Chuyển đổi Unix Time', icon: 'clock', color: 'indigo' },
    { id: 'color', name: 'Color Converter', desc: 'HEX / RGB / HSL', icon: 'palette', color: 'pink' },
    { id: 'ua', name: 'User-Agent', desc: 'Phân tích trình duyệt', icon: 'monitor', color: 'teal' }
  ];

  /* 10.1 RENDER TOOLS VIEW */
  function renderTools(container) {
    container.innerHTML = `
      <div class="section-head" style="margin-top:0;">
        <div>
          <div class="section-eyebrow">Tiện ích</div>
          <div class="section-title">10 Công cụ MMO Mới</div>
          <div class="section-sub">Xử lý dữ liệu trực tiếp trên trình duyệt</div>
        </div>
      </div>
      <div class="tools-grid" id="toolsGrid"></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const grid = container.querySelector('#toolsGrid');
    TOOLS_LIST.forEach(t => {
      const card = document.createElement('div');
      card.className = 'tool-card';
      card.innerHTML = `
        <div class="tool-card-icon" style="background:var(--brand-grad);"><i data-lucide="${t.icon}"></i></div>
        <div class="tool-card-name">${t.name}</div>
        <div class="tool-card-desc">${t.desc}</div>
      `;
      card.onclick = () => openTool(t.id);
      grid.appendChild(card);
    });
    if (window.lucide) window.lucide.createIcons({ nodes: [grid] });
  }
  window.LH.Views.tools = renderTools;

  /* 10.2 TOOL OPENER */
  function openTool(id) {
    const t = TOOLS_LIST.find(x => x.id === id);
    if (!t) return;

    const body = document.createElement('div');
    body.className = 'tool-modal-content';

    switch (id) {
      case 'json': setupJsonTool(body); break;
      case 'base64': setupBase64Tool(body); break;
      case 'url': setupUrlTool(body); break;
      case 'hash': setupHashTool(body); break;
      case 'text': setupTextTool(body); break;
      case 'minifier': setupMinifierTool(body); break;
      case 'regex': setupRegexTool(body); break;
      case 'timestamp': setupTimestampTool(body); break;
      case 'color': setupColorTool(body); break;
      case 'ua': setupUaTool(body); break;
    }

    Modal.open({
      title: t.name,
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
      }
    });
  }

  /* 10.3 TOOL: JSON FORMATTER */
  function setupJsonTool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Nhập JSON</label>
        <textarea class="tool-textarea" id="jsonInput" placeholder='{"name":"Liquid Hub","version":2}'></textarea>
      </div>
      <div class="tool-btn-row">
        <button class="btn btn-primary" id="btnFormatJson"><i data-lucide="align-left"></i> Format (Làm đẹp)</button>
        <button class="btn btn-glass" id="btnMinifyJson"><i data-lucide="minimize-2"></i> Minify</button>
      </div>
      <div class="tool-input-group">
        <label>Kết quả</label>
        <div class="tool-result-box" id="jsonResult" style="display:none;">
          <i data-lucide="copy" class="copy-icon" onclick="window.LH.copyToClipboard(document.getElementById('jsonResultText').innerText)"></i>
          <pre id="jsonResultText" style="margin:0;white-space:pre-wrap;"></pre>
        </div>
      </div>
    `;
    const input = body.querySelector('#jsonInput');
    const resultBox = body.querySelector('#jsonResult');
    const resultText = body.querySelector('#jsonResultText');

    const process = (minify) => {
      try {
        const obj = JSON.parse(input.value);
        const str = minify ? JSON.stringify(obj) : JSON.stringify(obj, null, 2);
        resultText.textContent = str;
        resultBox.style.display = 'block';
        Toast.success('Xử lý thành công');
      } catch (e) {
        Toast.error('JSON không hợp lệ: ' + e.message);
        resultBox.style.display = 'none';
      }
    };

    body.querySelector('#btnFormatJson').onclick = () => process(false);
    body.querySelector('#btnMinifyJson').onclick = () => process(true);
  }

  /* 10.4 TOOL: BASE64 */
  function setupBase64Tool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Nội dung</label>
        <textarea class="tool-textarea" id="b64Input" placeholder="Nhập text cần mã hóa hoặc giải mã..."></textarea>
      </div>
      <div class="tool-btn-row">
        <button class="btn btn-primary" id="btnEncodeB64"><i data-lucide="lock"></i> Mã hóa (Encode)</button>
        <button class="btn btn-glass" id="btnDecodeB64"><i data-lucide="unlock"></i> Giải mã (Decode)</button>
      </div>
      <div class="tool-input-group">
        <label>Kết quả</label>
        <div class="tool-result-box" id="b64Result" style="display:none;">
          <i data-lucide="copy" class="copy-icon" onclick="window.LH.copyToClipboard(document.getElementById('b64ResultText').innerText)"></i>
          <div id="b64ResultText"></div>
        </div>
      </div>
    `;
    const input = body.querySelector('#b64Input');
    const resultBox = body.querySelector('#b64Result');
    const resultText = body.querySelector('#b64ResultText');

    body.querySelector('#btnEncodeB64').onclick = () => {
      if (!input.value) return Toast.warning('Nhập nội dung');
      try {
        resultText.textContent = btoa(unescape(encodeURIComponent(input.value)));
        resultBox.style.display = 'block';
        Toast.success('Mã hóa thành công');
      } catch (e) { Toast.error(e.message); }
    };

    body.querySelector('#btnDecodeB64').onclick = () => {
      if (!input.value) return Toast.warning('Nhập nội dung');
      try {
        resultText.textContent = decodeURIComponent(escape(atob(input.value.trim())));
        resultBox.style.display = 'block';
        Toast.success('Giải mã thành công');
      } catch (e) { Toast.error('Chuỗi Base64 không hợp lệ'); }
    };
  }

  /* 10.5 TOOL: URL ENCODE/DECODE */
  function setupUrlTool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Chuỗi URL / Text</label>
        <textarea class="tool-textarea" id="urlInput" placeholder="https://example.com/search?q=tiếng việt"></textarea>
      </div>
      <div class="tool-btn-row">
        <button class="btn btn-primary" id="btnEncodeUrl"><i data-lucide="link"></i> Encode</button>
        <button class="btn btn-glass" id="btnDecodeUrl"><i data-lucide="link-2"></i> Decode</button>
      </div>
      <div class="tool-input-group">
        <label>Kết quả</label>
        <div class="tool-result-box" id="urlResult" style="display:none;">
          <i data-lucide="copy" class="copy-icon" onclick="window.LH.copyToClipboard(document.getElementById('urlResultText').innerText)"></i>
          <div id="urlResultText"></div>
        </div>
      </div>
    `;
    const input = body.querySelector('#urlInput');
    const resultBox = body.querySelector('#urlResult');
    const resultText = body.querySelector('#urlResultText');

    body.querySelector('#btnEncodeUrl').onclick = () => {
      try {
        resultText.textContent = encodeURIComponent(input.value);
        resultBox.style.display = 'block';
      } catch (e) { Toast.error(e.message); }
    };

    body.querySelector('#btnDecodeUrl').onclick = () => {
      try {
        resultText.textContent = decodeURIComponent(input.value);
        resultBox.style.display = 'block';
      } catch (e) { Toast.error('Chuỗi URL Encode không hợp lệ'); }
    };
  }

  /* 10.6 TOOL: HASH GENERATOR */
  function setupHashTool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Văn bản cần băm</label>
        <textarea class="tool-textarea" id="hashInput" placeholder="Nhập text..."></textarea>
      </div>
      <div class="tool-btn-row">
        <button class="btn btn-primary" id="btnHashSha256"><i data-lucide="shield"></i> SHA-256</button>
      </div>
      <div class="tool-input-group">
        <label>Kết quả (SHA-256)</label>
        <div class="tool-result-box" id="hashResult" style="display:none;">
          <i data-lucide="copy" class="copy-icon" onclick="window.LH.copyToClipboard(document.getElementById('hashResultText').innerText)"></i>
          <div id="hashResultText" class="mono"></div>
        </div>
      </div>
    `;
    const input = body.querySelector('#hashInput');
    const resultBox = body.querySelector('#hashResult');
    const resultText = body.querySelector('#hashResultText');

    body.querySelector('#btnHashSha256').onclick = async () => {
      if (!input.value) return Toast.warning('Nhập văn bản');
      try {
        const msgBuffer = new TextEncoder().encode(input.value);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        resultText.textContent = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        resultBox.style.display = 'block';
        Toast.success('Băm thành công');
      } catch (e) { Toast.error(e.message); }
    };
  }

  /* 10.7 TOOL: TEXT TOOLKIT */
  function setupTextTool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Văn bản đầu vào</label>
        <textarea class="tool-textarea" id="textInput" placeholder="Dán văn bản vào đây..."></textarea>
      </div>
      <div class="tool-btn-row">
        <button class="btn btn-glass" id="btnCountText">Thống kê</button>
        <button class="btn btn-glass" id="btnRemoveSpaces">Xóa khoảng trắng</button>
        <button class="btn btn-glass" id="btnRemoveDups">Xóa dòng trùng</button>
      </div>
      <div class="tool-input-group">
        <label>Kết quả</label>
        <div class="tool-result-box" id="textResult" style="display:none;">
          <i data-lucide="copy" class="copy-icon" onclick="window.LH.copyToClipboard(document.getElementById('textResultText').innerText)"></i>
          <div id="textResultText" style="white-space:pre-wrap;"></div>
        </div>
      </div>
    `;
    const input = body.querySelector('#textInput');
    const resultBox = body.querySelector('#textResult');
    const resultText = body.querySelector('#textResultText');

    const showResult = (txt) => {
      resultText.textContent = txt;
      resultBox.style.display = 'block';
    };

    body.querySelector('#btnCountText').onclick = () => {
      const v = input.value;
      const chars = v.length;
      const words = v.trim() ? v.trim().split(/\s+/).length : 0;
      const lines = v.split('\n').length;
      showResult(`Ký tự: ${chars}\nTừ: ${words}\nDòng: ${lines}`);
    };

    body.querySelector('#btnRemoveSpaces').onclick = () => {
      showResult(input.value.replace(/\s+/g, ' ').trim());
    };

    body.querySelector('#btnRemoveDups').onclick = () => {
      const lines = input.value.split('\n');
      showResult([...new Set(lines)].join('\n'));
    };
  }

  /* 10.8 TOOL: MINIFIER */
  function setupMinifierTool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Mã nguồn (HTML/CSS/JS)</label>
        <textarea class="tool-textarea" id="minInput" placeholder="<div> <p> Hello </p> </div>"></textarea>
      </div>
      <button class="btn btn-primary" id="btnMinify"><i data-lucide="file-code"></i> Thu gọn (Minify)</button>
      <div class="tool-input-group">
        <label>Kết quả</label>
        <div class="tool-result-box" id="minResult" style="display:none;">
          <i data-lucide="copy" class="copy-icon" onclick="window.LH.copyToClipboard(document.getElementById('minResultText').innerText)"></i>
          <div id="minResultText" class="mono"></div>
        </div>
      </div>
    `;
    const input = body.querySelector('#minInput');
    const resultBox = body.querySelector('#minResult');
    const resultText = body.querySelector('#minResultText');

    body.querySelector('#btnMinify').onclick = () => {
      if (!input.value) return;
      let str = input.value;
      // Xóa comment HTML/CSS/JS (đơn giản)
      str = str.replace(/<!--[\s\S]*?-->/g, '');
      str = str.replace(/\/\*[\s\S]*?\*\//g, '');
      // Xóa khoảng trắng thừa
      str = str.replace(/\s+/g, ' ');
      str = str.replace(/>\s+</g, '><');
      resultText.textContent = str.trim();
      resultBox.style.display = 'block';
      Toast.success('Đã thu gọn');
    };
  }

  /* 10.9 TOOL: REGEX TESTER */
  function setupRegexTool(body) {
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Biểu thức (Regex)</label>
        <input type="text" class="input" id="regexPattern" placeholder="VD: [a-z]+" value="\\d+">
      </div>
      <div class="tool-input-group">
        <label>Văn bản kiểm tra</label>
        <textarea class="tool-textarea" id="regexText" placeholder="Nhập text để test...">Có 123 con gà và 45 con vịt.</textarea>
      </div>
      <button class="btn btn-primary" id="btnTestRegex">Kiểm tra</button>
      <div class="tool-result-box" id="regexResult" style="display:none;font-family:inherit;"></div>
    `;
    const pattern = body.querySelector('#regexPattern');
    const text = body.querySelector('#regexText');
    const result = body.querySelector('#regexResult');

    body.querySelector('#btnTestRegex').onclick = () => {
      try {
        const re = new RegExp(pattern.value, 'g');
        const str = text.value;
        const matches = [...str.matchAll(re)];
        
        if (matches.length === 0) {
          result.innerHTML = '<span style="color:var(--warning);">Không có kết quả khớp.</span>';
        } else {
          let html = `<div style="margin-bottom:8px;">Tìm thấy <strong>${matches.length}</strong> kết quả:</div>`;
          html += matches.map(m => `<div>Khớp: <strong style="color:var(--success);">${escapeHtml(m[0])}</strong> tại vị trí ${m.index}</div>`).join('');
          result.innerHTML = html;
        }
        result.style.display = 'block';
      } catch (e) {
        Toast.error('Regex không hợp lệ: ' + e.message);
      }
    };
  }

  /* 10.10 TOOL: TIMESTAMP CONVERTER */
  function setupTimestampTool(body) {
    const now = Math.floor(Date.now() / 1000);
    body.innerHTML = `
      <div class="tool-input-group">
        <label>Unix Timestamp (giây)</label>
        <div style="display:flex;gap:8px;">
          <input type="number" class="input" id="tsInput" value="${now}">
          <button class="btn btn-glass" onclick="document.getElementById('tsInput').value = Math.floor(Date.now()/1000)">Hiện tại</button>
        </div>
      </div>
      <button class="btn btn-primary" id="btnConvertTs"><i data-lucide="clock"></i> Chuyển sang Ngày giờ</button>
      <div class="tool-result-box" id="tsResult" style="display:none;font-size:15px;text-align:center;font-weight:700;">
        —
      </div>
    `;
    const input = body.querySelector('#tsInput');
    const result = body.querySelector('#tsResult');

    body.querySelector('#btnConvertTs').onclick = () => {
      const ts = parseInt(input.value);
      if (isNaN(ts)) return Toast.error('Timestamp không hợp lệ');
      const d = new Date(ts * 1000);
      result.innerHTML = `
        <div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">Kết quả:</div>
        ${d.toLocaleString('vi-VN')}
      `;
      result.style.display = 'block';
    };
  }

  /* 10.11 TOOL: COLOR CONVERTER */
  function setupColorTool(body) {
    body.innerHTML = `
      <div class="color-preview" id="colorPreview" style="background:#6366f1;"></div>
      <div class="tool-input-group">
        <label>Mã màu (HEX)</label>
        <input type="text" class="input" id="hexInput" value="#6366f1">
      </div>
      <button class="btn btn-primary" id="btnConvertColor">Chuyển đổi</button>
      <div class="tool-result-box" id="colorResult" style="display:none;display:flex;flex-direction:column;gap:8px;">
        <div><strong>HEX:</strong> <span id="outHex"></span></div>
        <div><strong>RGB:</strong> <span id="outRgb"></span></div>
        <div><strong>HSL:</strong> <span id="outHsl"></span></div>
      </div>
    `;
    const input = body.querySelector('#hexInput');
    const preview = body.querySelector('#colorPreview');
    const result = body.querySelector('#colorResult');

    const hexToRgb = (hex) => {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    };

    body.querySelector('#btnConvertColor').onclick = () => {
      let hex = input.value.trim();
      if (!hex.startsWith('#')) hex = '#' + hex;
      const rgb = hexToRgb(hex);
      if (!rgb) return Toast.error('Mã HEX không hợp lệ');

      preview.style.background = hex;
      body.querySelector('#outHex').textContent = hex.toUpperCase();
      body.querySelector('#outRgb').textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      
      // Chuyển RGB sang HSL
      let r = rgb.r / 255, g = rgb.g / 255, b = rgb.b / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) { h = s = 0; }
      else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      body.querySelector('#outHsl').textContent = `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
      
      result.style.display = 'flex';
    };
  }

  /* 10.12 TOOL: USER-AGENT ANALYZER */
  function setupUaTool(body) {
    const ua = navigator.userAgent;
    const isMobile = /Mobi|Android|iPhone/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const isChrome = /Chrome/i.test(ua) && !/Edge/i.test(ua);
    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua);
    const isFirefox = /Firefox/i.test(ua);
    const isEdge = /Edge|Edg/i.test(ua);

    let browser = 'Không xác định';
    if (isChrome) browser = 'Google Chrome';
    else if (isSafari) browser = 'Safari';
    else if (isFirefox) browser = 'Mozilla Firefox';
    else if (isEdge) browser = 'Microsoft Edge';

    let os = 'Không xác định';
    if (isIOS) os = 'iOS (iPhone/iPad)';
    else if (isAndroid) os = 'Android';
    else if (/Windows/i.test(ua)) os = 'Windows';
    else if (/Mac OS/i.test(ua)) os = 'macOS';
    else if (/Linux/i.test(ua)) os = 'Linux';

    body.innerHTML = `
      <div class="tool-result-box" style="display:flex;flex-direction:column;gap:12px;font-family:inherit;">
        <div><strong>Thiết bị:</strong> ${isMobile ? '📱 Di động' : '💻 Máy tính'}</div>
        <div><strong>Hệ điều hành:</strong> ${os}</div>
        <div><strong>Trình duyệt:</strong> ${browser}</div>
        <div style="padding-top:12px;border-top:1px solid var(--border-1);">
          <strong>User-Agent gốc:</strong>
          <div style="font-family:'JetBrains Mono', monospace;font-size:11px;color:var(--text-3);margin-top:4px;word-break:break-all;">${escapeHtml(ua)}</div>
        </div>
      </div>
    `;
  }

  console.log('%cPart 10 loaded — 10 MMO Tools (JSON, Base64, Hash, Regex, Timestamp...)', 'color:#06b6d4;font-weight:700;');
})();
</script>

<script>
/* ============================================================
   PART 11 — WEATHER & BLOG LOGIC
   ============================================================ */
(function () {
  'use strict';
  const { State, supabase, $, el, Toast, escapeHtml, formatDate, formatDateTime, debounce } = window.LH;

  /* 11.1 WEATHER WIDGET */
  const WEATHER_CODES = {
    0: { icon: 'sun', label: 'Trời quang' },
    1: { icon: 'sun', label: 'Chủ yếu quang' },
    2: { icon: 'cloud-sun', label: 'Có mây một phần' },
    3: { icon: 'cloud', label: 'U ám' },
    45: { icon: 'cloud-fog', label: 'Sương mù' },
    48: { icon: 'cloud-fog', label: 'Sương mù đóng băng' },
    51: { icon: 'cloud-drizzle', label: 'Mưa phùn nhẹ' },
    53: { icon: 'cloud-drizzle', label: 'Mưa phùn' },
    55: { icon: 'cloud-drizzle', label: 'Mưa phùn nặng' },
    61: { icon: 'cloud-rain', label: 'Mưa nhẹ' },
    63: { icon: 'cloud-rain', label: 'Mưa vừa' },
    65: { icon: 'cloud-rain', label: 'Mưa to' },
    71: { icon: 'cloud-snow', label: 'Tuyết nhẹ' },
    73: { icon: 'cloud-snow', label: 'Tuyết vừa' },
    75: { icon: 'cloud-snow', label: 'Tuyết to' },
    80: { icon: 'cloud-rain', label: 'Mưa rào' },
    95: { icon: 'cloud-lightning', label: 'Giông bão' }
  };

  function getWeatherInfo(code) {
    return WEATHER_CODES[code] || { icon: 'cloud', label: 'Không rõ' };
  }

  async function renderWeather(container) {
    container.innerHTML = `
      <div class="section-head" style="margin-top:0;">
        <div>
          <div class="section-eyebrow">Thời tiết</div>
          <div class="section-title">Dự báo thời tiết</div>
        </div>
        <button class="btn btn-glass btn-sm" id="btnRefreshWeather"><i data-lucide="refresh-cw"></i> Làm mới</button>
      </div>
      <div id="weatherContent">
        <div style="text-align:center;padding:40px;">
          <div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;width:32px;height:32px;"></div>
          <div class="body-sm" style="margin-top:12px;">Đang xác định vị trí...</div>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const content = container.querySelector('#weatherContent');
    container.querySelector('#btnRefreshWeather').onclick = () => loadWeather(content);

    loadWeather(content);
  }

  async function loadWeather(content) {
    content.innerHTML = `<div style="text-align:center;padding:40px;"><div class="spinner"></div><div class="body-sm" style="margin-top:12px;">Đang tải dữ liệu...</div></div>`;
    try {
      // 1. Lấy vị trí (Ưu tiên IP để tránh xin quyền GPS làm phiền)
      let lat = 21.0278, lon = 105.8342, city = 'Hà Nội'; // Default
      try {
        const ipRes = await fetch('https://ipapi.co/json/');
        const ipData = await ipRes.json();
        if (ipData.latitude && ipData.longitude) {
          lat = ipData.latitude;
          lon = ipData.longitude;
          city = ipData.city || ipData.region || 'Vị trí của bạn';
        }
      } catch (e) {
        console.warn('IP Geolocation failed, using default.');
      }

      // 2. Gọi API Open-Meteo
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
      
      const res = await fetch(url);
      const data = await res.json();
      
      if (!data.current) throw new Error('Không lấy được dữ liệu thời tiết');

      const cur = data.current;
      const daily = data.daily;
      const hourly = data.hourly;
      const wi = getWeatherInfo(cur.weather_code);

      // Format giờ
      const now = new Date();
      const hoursHTML = hourly.time.slice(0, 12).map((t, i) => {
        const h = new Date(t).getHours() + 'h';
        const hwi = getWeatherInfo(hourly.weather_code[i]);
        return `
          <div class="weather-forecast-item">
            <div class="wf-time">${h}</div>
            <div class="wf-icon"><i data-lucide="${hwi.icon}"></i></div>
            <div class="wf-temp">${Math.round(hourly.temperature_2m[i])}°</div>
          </div>
        `;
      }).join('');

      // Format ngày
      const daysHTML = daily.time.map((t, i) => {
        const d = new Date(t);
        const dayName = i === 0 ? 'Hôm nay' : ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()];
        const dwi = getWeatherInfo(daily.weather_code[i]);
        return `
          <div class="weather-forecast-item">
            <div class="wf-time">${dayName}</div>
            <div class="wf-icon"><i data-lucide="${dwi.icon}"></i></div>
            <div class="wf-temp">${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°</div>
          </div>
        `;
      }).join('');

      content.innerHTML = `
        <div class="weather-hero anim-fade">
          <div class="weather-loc"><i data-lucide="map-pin"></i> ${escapeHtml(city)}</div>
          <div class="caption" style="color:rgba(255,255,255,0.8);">${now.toLocaleString('vi-VN')}</div>
          
          <div class="weather-main">
            <div class="weather-icon-big"><i data-lucide="${wi.icon}"></i></div>
            <div>
              <div class="weather-temp">${Math.round(cur.temperature_2m)}°</div>
              <div class="weather-desc">${wi.label} · Cảm giác ${Math.round(cur.apparent_temperature)}°</div>
            </div>
          </div>

          <div class="weather-metrics">
            <div class="weather-metric">
              <div class="weather-metric-label">Độ ẩm</div>
              <div class="weather-metric-value">${cur.relative_humidity_2m}%</div>
            </div>
            <div class="weather-metric">
              <div class="weather-metric-label">Gió</div>
              <div class="weather-metric-value">${Math.round(cur.wind_speed_10m)} km/h</div>
            </div>
            <div class="weather-metric">
              <div class="weather-metric-label">Mưa</div>
              <div class="weather-metric-value">${cur.precipitation} mm</div>
            </div>
            <div class="weather-metric">
              <div class="weather-metric-label">Nguồn</div>
              <div class="weather-metric-value" style="font-size:12px;">Open-Meteo</div>
            </div>
          </div>
        </div>

        <div class="section" style="margin-top:24px;">
          <div class="h4" style="margin-bottom:12px;">Dự báo 12 giờ tới</div>
          <div class="weather-forecast-row">${hoursHTML}</div>
        </div>

        <div class="section" style="margin-top:24px;">
          <div class="h4" style="margin-bottom:12px;">Dự báo 7 ngày</div>
          <div class="weather-forecast-row">${daysHTML}</div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [content] });

    } catch (err) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon" style="background:var(--danger-bg);color:var(--danger);"><i data-lucide="cloud-off"></i></div>
          <div class="empty-title">Không tải được thời tiết</div>
          <div class="empty-desc">${escapeHtml(err.message || 'Lỗi kết nối mạng')}</div>
          <button class="btn btn-primary" onclick="document.getElementById('btnRefreshWeather').click()" style="margin-top:16px;">Thử lại</button>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [content] });
    }
  }
  window.LH.Views.weather = renderWeather;

  /* 11.2 BLOG LIST VIEW (FIX FAILED TO FETCH) */
  async function renderBlog(container) {
    container.innerHTML = `
      <div class="section-head" style="margin-top:0;align-items:center;">
        <div>
          <div class="section-eyebrow">Blog & Tin tức</div>
          <div class="section-title">Bài viết mới nhất</div>
        </div>
      </div>
      <div id="blogGridContent" class="blog-grid">
        <div style="text-align:center;padding:40px;grid-column:1/-1;"><div class="spinner"></div></div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const grid = container.querySelector('#blogGridContent');

    try {
      // FIX: Bọc trong try/catch, xử lý lỗi rõ ràng
      if (!supabase) throw new Error('Chưa kết nối Supabase');

      const { data, error } = await supabase
        .from('posts')
        .select('id, title, excerpt, cover_url, category, created_at')
        .eq('is_published', true)
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        // Nếu bảng chưa tồn tại hoặc RLS chặn
        if (error.code === '42P01') throw new Error('Bảng "posts" chưa được tạo trong Database.');
        if (error.code === '42501') throw new Error('Quyền truy cập bị từ chối (RLS).');
        throw new Error(error.message);
      }

      if (!data || data.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon"><i data-lucide="newspaper"></i></div><div class="empty-title">Chưa có bài viết nào</div><div class="empty-desc">Các bài viết mới sẽ xuất hiện tại đây.</div></div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [grid] });
        return;
      }

      grid.innerHTML = data.map(p => `
        <div class="blog-card" onclick="location.hash='#/post?id=${p.id}'">
          <div class="blog-card-cover">
            ${p.cover_url ? `<img src="${p.cover_url}" loading="lazy" alt="${escapeHtml(p.title)}">` : `<div style="width:100%;height:100%;display:grid;place-items:center;background:var(--surface-3);color:var(--text-4);"><i data-lucide="image-off"></i></div>`}
          </div>
          <div class="blog-card-body">
            <div class="blog-card-cat">${escapeHtml(p.category || 'Tin tức')}</div>
            <div class="blog-card-title">${escapeHtml(p.title)}</div>
            <div class="blog-card-excerpt">${escapeHtml(p.excerpt || '')}</div>
            <div class="blog-card-meta">
              <i data-lucide="calendar" style="width:14px;height:14px;"></i>
              ${formatDate(p.created_at)}
            </div>
          </div>
        </div>
      `).join('');
      
      if (window.lucide) window.lucide.createIcons({ nodes: [grid] });

    } catch (err) {
      // FIX: Hiển thị lỗi thân thiện thay vì màn hình trắng
      console.error('[Blog API Error]', err);
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-icon" style="background:var(--danger-bg);color:var(--danger);"><i data-lucide="alert-circle"></i></div>
          <div class="empty-title">Không thể tải bài viết</div>
          <div class="empty-desc" style="max-width:400px;word-break:break-word;">Lỗi: ${escapeHtml(err.message)}</div>
          <button class="btn btn-primary" onclick="location.reload()" style="margin-top:16px;"><i data-lucide="refresh-cw"></i> Tải lại trang</button>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [grid] });
    }
  }
  window.LH.Views.blog = renderBlog;

  /* 11.3 POST DETAIL VIEW */
  async function renderPost(container, hash) {
    const qIndex = hash.indexOf('?');
    const params = new URLSearchParams(qIndex >= 0 ? hash.slice(qIndex + 1) : '');
    const postId = params.get('id');

    if (!postId) {
      container.innerHTML = `<div class="empty-state" style="margin-top:40px;"><div class="empty-title">Không tìm thấy bài viết</div><a href="#/blog" class="btn btn-primary" style="margin-top:16px;">Về Blog</a></div>`;
      return;
    }

    container.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';

    try {
      const { data: post, error } = await supabase
        .from('posts')
        .select('*')
        .eq('id', postId)
        .eq('is_published', true)
        .single();

      if (error || !post) throw new Error('Bài viết không tồn tại hoặc đã bị ẩn.');

      container.innerHTML = `
        <div class="post-wrap anim-fade">
          <a href="#/blog" class="btn btn-glass btn-sm" style="margin-bottom:16px;"><i data-lucide="arrow-left"></i> Quay lại</a>
          
          <div class="blog-card-cat">${escapeHtml(post.category || 'Tin tức')}</div>
          <h1 class="post-title-main">${escapeHtml(post.title)}</h1>
          
          <div class="row" style="color:var(--text-3);font-size:13px;margin-bottom:16px;">
            <div class="row" style="gap:6px;"><i data-lucide="calendar" style="width:14px;height:14px;"></i> ${formatDate(post.created_at)}</div>
            <div class="row" style="gap:6px;"><i data-lucide="user" style="width:14px;height:14px;"></i> Admin</div>
          </div>

          ${post.cover_url ? `<img src="${post.cover_url}" class="post-cover-img" alt="${escapeHtml(post.title)}">` : ''}
          
          ${post.excerpt ? `<div style="font-size:16px;font-style:italic;color:var(--text-2);padding:16px;background:var(--surface-3);border-left:4px solid var(--brand-1);border-radius:0 8px 8px 0;margin-bottom:24px;">${escapeHtml(post.excerpt)}</div>` : ''}

          <div class="post-content-body">${escapeHtml(post.content)}</div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    } catch (err) {
      container.innerHTML = `
        <div class="empty-state" style="margin-top:40px;">
          <div class="empty-icon" style="background:var(--danger-bg);color:var(--danger);"><i data-lucide="file-x"></i></div>
          <div class="empty-title">Lỗi tải bài viết</div>
          <div class="empty-desc">${escapeHtml(err.message)}</div>
          <a href="#/blog" class="btn btn-primary" style="margin-top:16px;">Về trang Blog</a>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });
    }
  }
  window.LH.Views.post = renderPost;

  console.log('%cPart 11 loaded — Weather (Open-Meteo) & Blog (Fixed)', 'color:#10b981;font-weight:700;');
})();
</script>
<style>
/* ============================================================
   PART 12 — ADMIN BLOG & SETTINGS CSS
   ============================================================ */
.post-editor-area {
  width: 100%;
  min-height: 250px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface-3);
  border: 1px solid var(--border-1);
  font-size: 14.5px;
  line-height: 1.6;
  resize: vertical;
}
.post-editor-area:focus {
  outline: none;
  border-color: var(--brand-1);
  background: var(--surface-solid);
}

.upload-cover-box {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: var(--r-md);
  border: 2px dashed var(--border-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  background: var(--surface-3);
}
.upload-cover-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.upload-cover-box .upload-hint {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.4);
  color: #fff;
  opacity: 0;
  transition: 0.2s;
}
.upload-cover-box:hover .upload-hint { opacity: 1; }

.settings-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 768px) {
  .settings-grid { grid-template-columns: 1fr 1fr; }
}
.settings-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  padding: 24px;
}
.color-picker-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.color-picker-row input[type="color"] {
  width: 50px;
  height: 50px;
  padding: 4px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-1);
  cursor: pointer;
  background: var(--surface-solid);
}
</style>

<script>
/* ============================================================
   PART 12 — ADMIN BLOG & SETTINGS LOGIC
   ============================================================ */
(function () {
  'use strict';
  const { State, supabase, $, el, CONFIG, Toast, Modal, escapeHtml, compressImage, uuidv4, formatDate, formatDateTime } = window.LH;

  if (!supabase || !window.LH.AdminAction) return;

  // Mở rộng module AdminAction từ Part 9
  const AdminAction = window.LH.AdminAction;

  /* 12.1 QUẢN LÝ BÀI VIẾT (BLOG) */
  
  // Hàm load danh sách bài viết cho Admin
  window.LH.AdminLoaders = window.LH.AdminLoaders || {};
  window.LH.AdminLoaders.loadPosts = async function(target) {
    target.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
    try {
      const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
      if (error) throw error;

      target.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h2 class="h2">Quản lý Bài viết</h2>
          <button class="btn btn-primary" onclick="window.LH.AdminAction.editPost()"><i data-lucide="plus"></i> Viết bài mới</button>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead><tr><th>Ảnh</th><th>Tiêu đề</th><th>Danh mục</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${(!data || data.length === 0) ? '<tr><td colspan="6" style="text-align:center;padding:20px;">Chưa có bài viết nào</td></tr>' : 
                data.map(p => `
                <tr>
                  <td><div style="width:60px;height:40px;border-radius:6px;overflow:hidden;background:var(--surface-2);">${p.cover_url ? `<img src="${p.cover_url}" style="width:100%;height:100%;object-fit:cover;">` : ''}</div></td>
                  <td style="font-weight:600;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.title)}</td>
                  <td>${escapeHtml(p.category || '—')}</td>
                  <td><span class="badge ${p.is_published ? 'badge-success' : 'badge-pending'}">${p.is_published ? 'Đã đăng' : 'Bản nháp'}</span></td>
                  <td>${formatDate(p.created_at)}</td>
                  <td>
                    <button class="btn btn-sm btn-glass" onclick="window.LH.AdminAction.editPost('${p.id}')" style="margin-right:4px;"><i data-lucide="edit-2"></i></button>
                    <button class="btn btn-sm btn-danger" onclick="window.LH.AdminAction.deletePost('${p.id}')"><i data-lucide="trash-2"></i></button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [target] });
    } catch (e) {
      target.innerHTML = `<div class="empty-desc">Lỗi tải danh sách bài viết: ${e.message}</div>`;
    }
  };

  // Hàm tạo/sửa bài viết
  AdminAction.editPost = async function(postId = null) {
    let post = { title: '', category: '', excerpt: '', content: '', cover_url: '', is_published: false };
    if (postId) {
      const { data } = await supabase.from('posts').select('*').eq('id', postId).single();
      if (data) post = data;
    }

    const body = document.createElement('div');
    body.innerHTML = `
      <div class="field" style="margin-bottom:12px;">
        <label class="field-label">Tiêu đề bài viết <span style="color:var(--danger);">*</span></label>
        <input type="text" class="input" id="postTitle" value="${escapeHtml(post.title)}" placeholder="Nhập tiêu đề...">
      </div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div class="field">
          <label class="field-label">Danh mục</label>
          <input type="text" class="input" id="postCategory" value="${escapeHtml(post.category || '')}" placeholder="VD: Tin tức, Hướng dẫn...">
        </div>
        <div class="field">
          <label class="field-label">Trạng thái</label>
          <select class="select" id="postStatus">
            <option value="false" ${!post.is_published ? 'selected' : ''}>Lưu nháp</option>
            <option value="true" ${post.is_published ? 'selected' : ''}>Xuất bản công khai</option>
          </select>
        </div>
      </div>

      <div class="field" style="margin-bottom:12px;">
        <label class="field-label">Ảnh bìa (Cover)</label>
        <div class="upload-cover-box" id="postCoverBox" onclick="document.getElementById('postCoverInput').click()">
          ${post.cover_url ? `<img src="${post.cover_url}" id="postCoverPreview">` : `<i data-lucide="image-plus" style="width:32px;height:32px;color:var(--text-4);"></i>`}
          <div class="upload-hint"><i data-lucide="camera"></i> Thay đổi ảnh</div>
        </div>
        <input type="file" id="postCoverInput" hidden accept="image/*">
      </div>

      <div class="field" style="margin-bottom:12px;">
        <label class="field-label">Mô tả ngắn (Excerpt)</label>
        <textarea class="input" id="postExcerpt" style="min-height:60px;padding-top:10px;">${escapeHtml(post.excerpt || '')}</textarea>
      </div>

      <div class="field" style="margin-bottom:12px;">
        <label class="field-label">Nội dung bài viết <span style="color:var(--danger);">*</span></label>
        <textarea class="post-editor-area" id="postContent" placeholder="Viết nội dung...">${escapeHtml(post.content || '')}</textarea>
        <div class="field-hint">Hỗ trợ văn bản thuần hoặc HTML cơ bản.</div>
      </div>
    `;

    let currentCoverUrl = post.cover_url;

    // Xử lý upload ảnh
    body.querySelector('#postCoverInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const box = body.querySelector('#postCoverBox');
      const originalHtml = box.innerHTML;
      box.innerHTML = '<div class="spinner"></div>';

      try {
        const compressed = await compressImage(file, 1200, 0.8);
        const path = `posts/${uuidv4()}.jpg`;
        const { error } = await supabase.storage.from(CONFIG.STORAGE_BUCKETS.POSTS).upload(path, compressed);
        if (error) throw error;
        
        const { data: pub } = supabase.storage.from(CONFIG.STORAGE_BUCKETS.POSTS).getPublicUrl(path);
        currentCoverUrl = pub.publicUrl;
        
        box.innerHTML = `<img src="${currentCoverUrl}" id="postCoverPreview"><div class="upload-hint"><i data-lucide="camera"></i> Thay đổi ảnh</div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [box] });
      } catch (err) {
        Toast.error('Lỗi upload ảnh: ' + err.message);
        box.innerHTML = originalHtml;
      }
    };

    // Mở Modal
    Modal.open({
      title: postId ? 'Sửa bài viết' : 'Viết bài mới',
      content: body,
      size: 'lg',
      actions: [
