<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#eef3ff">
<meta name="description" content="LUMINA - Premium Digital Store & Profile Platform">
<title>LUMINA · Digital Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   LUMINA LIQUID GLASS DESIGN SYSTEM v1.0
   ═══════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root{
  --primary:#6366f1;
  --primary-2:#8b5cf6;
  --accent:#06b6d4;
  --accent-2:#f472b6;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --bg-1:#eef3ff;
  --bg-2:#f5f0ff;
  --bg-3:#e0f7ff;
  --bg-4:#fdf2ff;
  --text:#0b1225;
  --text-2:#475569;
  --text-3:#94a3b8;
  --glass-bg:rgba(255,255,255,0.55);
  --glass-bg-2:rgba(255,255,255,0.38);
  --glass-bg-3:rgba(255,255,255,0.72);
  --glass-border:rgba(255,255,255,0.75);
  --glass-border-2:rgba(255,255,255,0.4);
  --glass-shadow:0 8px 32px rgba(31,38,135,0.10);
  --glass-shadow-lg:0 20px 60px rgba(31,38,135,0.18);
  --glass-blur:20px;
  --radius:24px;
  --radius-sm:14px;
  --radius-xs:10px;
  --radius-lg:32px;
  --radius-full:999px;
  --font-main:'Be Vietnam Pro','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --spring-2:cubic-bezier(0.68,-0.55,0.265,1.55);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --anim-speed:1;
  --header-h:72px;
  --max-w:1280px;
}
[data-theme="dark"]{
  --bg-1:#080d1f;
  --bg-2:#0f0a24;
  --bg-3:#041a26;
  --bg-4:#1a0a26;
  --text:#f1f5f9;
  --text-2:#94a3b8;
  --text-3:#64748b;
  --glass-bg:rgba(30,41,59,0.55);
  --glass-bg-2:rgba(30,41,59,0.38);
  --glass-bg-3:rgba(30,41,59,0.78);
  --glass-border:rgba(255,255,255,0.14);
  --glass-border-2:rgba(255,255,255,0.08);
  --glass-shadow:0 8px 32px rgba(0,0,0,0.35);
  --glass-shadow-lg:0 20px 60px rgba(0,0,0,0.6);
}
[data-anim="off"] *{transition:none!important;animation:none!important}
[data-anim="off"]{--anim-speed:0}

body{
  font-family:var(--font-main);
  color:var(--text);
  background:var(--bg-1);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(900px 700px at 10% 5%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 60%),
    radial-gradient(800px 600px at 92% 20%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
    radial-gradient(1000px 800px at 50% 100%,color-mix(in srgb,var(--primary-2) 20%,transparent),transparent 65%),
    linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3));
  background-attachment:fixed;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,0.5),transparent),
    radial-gradient(2px 2px at 60% 70%,rgba(255,255,255,0.4),transparent),
    radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,0.6),transparent),
    radial-gradient(1px 1px at 40% 90%,rgba(255,255,255,0.5),transparent);
  background-size:200% 200%;
  opacity:.4;
  animation:starDrift 60s linear infinite;
}
@keyframes starDrift{from{background-position:0 0}to{background-position:200% 200%}}

/* ─────── LIQUID GLASS CORE ─────── */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,0.6),inset 0 -1px 0 rgba(0,0,0,0.03);
  border-radius:var(--radius);
  position:relative;
  isolation:isolate;
}
.glass::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:
    linear-gradient(135deg,rgba(255,255,255,0.5) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.15) 100%);
  opacity:.9;
  z-index:-1;
}
[data-theme="dark"] .glass::before{
  background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 40%,transparent 70%,rgba(255,255,255,0.04) 100%);
}
.glass-2{background:var(--glass-bg-2);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.glass-3{background:var(--glass-bg-3);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%)}
.glass-hover{transition:transform .4s var(--spring),box-shadow .4s var(--ease),border-color .3s var(--ease)}
.glass-hover:hover{transform:translateY(-4px);box-shadow:var(--glass-shadow-lg),inset 0 1px 0 rgba(255,255,255,0.7)}

/* ─────── RESET EXTRAS ─────── */
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
img{max-width:100%;display:block}
ul,ol{list-style:none}
h1,h2,h3,h4,h5,h6{line-height:1.2;font-weight:800;letter-spacing:-.02em}
::selection{background:color-mix(in srgb,var(--primary) 30%,transparent);color:var(--text)}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--primary) 40%,transparent);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--primary) 60%,transparent);background-clip:padding-box}

/* ─────── LAYOUT ─────── */
.container{width:100%;max-width:var(--max-w);margin:0 auto;padding:0 20px}
.section{padding:72px 0}
.section-sm{padding:48px 0}
.flex{display:flex;align-items:center;gap:12px}
.flex-col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.center{justify-content:center;align-items:center}
.wrap{flex-wrap:wrap}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.text-center{text-align:center}
.text-muted{color:var(--text-2)}
.text-xs{font-size:12px}.text-sm{font-size:14px}
.text-lg{font-size:18px}.text-xl{font-size:22px}
.text-2xl{font-size:28px}.text-3xl{font-size:36px}
.text-4xl{font-size:44px}
.fw-600{font-weight:600}.fw-700{font-weight:700}.fw-800{font-weight:800}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mb-8{margin-bottom:32px}
.hide{display:none!important}
.w-full{width:100%}
.relative{position:relative}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ─────── GRADIENTS ─────── */
.grad-text{
  background:linear-gradient(135deg,var(--primary),var(--accent),var(--primary-2));
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:gradShift 6s ease infinite;
}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ─────── BUTTONS ─────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;
  font-weight:600;font-size:14px;
  border-radius:var(--radius-full);
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:0 4px 14px rgba(31,38,135,0.10),inset 0 1px 0 rgba(255,255,255,0.7);
  color:var(--text);
  transition:transform .3s var(--spring),box-shadow .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease);
  position:relative;
  overflow:hidden;
  user-select:none;
  min-height:44px;
  white-space:nowrap;
}
.btn::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,0.4),transparent 40%);
  opacity:0;transition:opacity .3s;
  pointer-events:none;
}
.btn:hover::after{opacity:1}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(31,38,135,0.16),inset 0 1px 0 rgba(255,255,255,0.8)}
.btn:active{transform:scale(.96) translateY(0)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  border-color:rgba(255,255,255,0.25);
  box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 40%,transparent),inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn-primary:hover{box-shadow:0 12px 32px color-mix(in srgb,var(--primary) 50%,transparent),inset 0 1px 0 rgba(255,255,255,0.5)}
.btn-accent{
  background:linear-gradient(135deg,var(--accent),var(--primary-2));
  color:#fff;
  border-color:rgba(255,255,255,0.25);
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn-ghost{background:transparent;border-color:var(--glass-border-2);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.btn-ghost:hover{background:var(--glass-bg-2);border-color:var(--glass-border)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(239,68,68,0.35)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(16,185,129,0.35)}
.btn-sm{padding:8px 14px;font-size:12px;min-height:36px;border-radius:10px}
.btn-lg{padding:16px 32px;font-size:16px;min-height:52px}
.btn-block{width:100%}
.btn-icon{padding:0;width:44px;height:44px;min-height:44px;border-radius:50%}
.btn-icon-sm{width:36px;height:36px;min-height:36px;border-radius:10px;padding:0}
.btn[disabled],.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ─────── INPUTS ─────── */
.input,.textarea,.select{
  width:100%;
  padding:12px 16px;
  font-size:14px;
  background:var(--glass-bg-2);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  color:var(--text);
  transition:border-color .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease);
  outline:none;
  min-height:44px;
}
.input:focus,.textarea:focus,.select:focus{
  border-color:var(--primary);
  background:var(--glass-bg);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent);
}
.textarea{resize:vertical;min-height:100px;padding:12px 16px}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.field .hint{font-size:11px;color:var(--text-3)}

/* ─────── CARDS ─────── */
.card{padding:24px;border-radius:var(--radius);background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.card-sm{padding:16px;border-radius:var(--radius-sm)}
.card-lg{padding:32px;border-radius:var(--radius-lg)}

/* ─────── HEADER ─────── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--header-h);
  display:flex;align-items:center;
  background:var(--glass-bg-3);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--glass-border-2);
  transition:background .3s var(--ease);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:var(--max-w);margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2),var(--accent));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:18px;
  box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 45%,transparent),inset 0 1px 0 rgba(255,255,255,0.4);
  position:relative;overflow:hidden;
}
.logo-mark::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.5),transparent 60%);opacity:.6}
.logo-mark span{position:relative;z-index:1}
.logo-img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.nav-desktop{display:flex;align-items:center;gap:4px}
.nav-link{
  padding:10px 16px;border-radius:var(--radius-full);font-size:14px;font-weight:500;
  color:var(--text-2);transition:color .25s var(--ease),background .25s var(--ease);
  display:inline-flex;align-items:center;gap:6px;
}
.nav-link:hover{color:var(--text);background:var(--glass-bg-2)}
.nav-link.active{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);font-weight:600}
.header-actions{display:flex;align-items:center;gap:8px}

/* ─────── MOBILE MENU ─────── */
.mobile-toggle{display:none}
.mobile-drawer{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,14,39,0.35);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease);
}
.mobile-drawer.open{opacity:1;pointer-events:auto}
.mobile-panel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(340px,88vw);
  background:var(--glass-bg-3);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-left:1px solid var(--glass-border);
  padding:24px 20px;
  transform:translateX(100%);
  transition:transform .5s var(--spring);
  display:flex;flex-direction:column;gap:6px;
  overflow-y:auto;
  z-index:201;
}
.mobile-drawer.open .mobile-panel{transform:translateX(0)}
.mobile-panel .nav-link{
  padding:14px 18px;font-size:15px;border-radius:var(--radius-sm);
  width:100%;justify-content:flex-start;
}
.mobile-panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--glass-border-2);margin-bottom:12px}

@media(max-width:900px){
  .nav-desktop{display:none}
  .mobile-toggle{display:flex}
}

/* ─────── MAIN ─────── */
main{padding-top:var(--header-h);min-height:calc(100vh - var(--header-h))}

/* ─────── PAGE TRANSITION ─────── */
.page{animation:pageIn .5s var(--ease-out)}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
/* ─────── HERO ─────── */
.hero{padding:80px 0 64px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:var(--radius-full);
  background:var(--glass-bg-2);
  backdrop-filter:blur(14px);
  border:1px solid var(--glass-border);
  font-size:13px;font-weight:600;color:var(--text-2);
  margin-bottom:20px;
}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}
.hero-title{font-size:clamp(32px,5vw,60px);font-weight:900;letter-spacing:-.03em;line-height:1.08;margin-bottom:20px}
.hero-subtitle{font-size:clamp(15px,1.6vw,18px);color:var(--text-2);max-width:560px;margin-bottom:32px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.hero-stats{display:flex;gap:32px;flex-wrap:wrap}
.hero-stat{display:flex;flex-direction:column;gap:4px}
.hero-stat-num{font-size:28px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stat-lbl{font-size:12px;color:var(--text-2);font-weight:500}
.hero-visual{position:relative;display:flex;justify-content:center;align-items:center}
.hero-card{
  width:100%;max-width:380px;aspect-ratio:9/16;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--glass-bg),var(--glass-bg-2));
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow-lg);
  overflow:hidden;position:relative;
  animation:floaty 6s ease-in-out infinite;
}
.hero-card img{width:100%;height:100%;object-fit:cover}
.hero-card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.35));z-index:1}
.hero-card-info{position:absolute;bottom:20px;left:20px;right:20px;z-index:2;color:#fff}
.hero-card-tag{display:inline-block;padding:4px 10px;background:rgba(255,255,255,0.25);backdrop-filter:blur(10px);border-radius:99px;font-size:11px;font-weight:700;margin-bottom:8px}
.hero-card-title{font-size:18px;font-weight:800;line-height:1.3}
.hero-card-price{font-size:22px;font-weight:900;margin-top:6px;color:#fbbf24}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
.hero-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;z-index:-1}
.hero-orb-1{width:400px;height:400px;background:var(--primary);top:-100px;left:-100px;animation:orbFloat 12s ease-in-out infinite}
.hero-orb-2{width:300px;height:300px;background:var(--accent);bottom:-80px;right:-50px;animation:orbFloat 15s ease-in-out infinite reverse}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .hero{padding:40px 0 32px}
  .hero-visual{order:-1;max-width:280px;margin:0 auto}
  .hero-card{max-width:280px}
}

/* ─────── SECTION HEADER ─────── */
.sec-head{text-align:center;max-width:680px;margin:0 auto 48px}
.sec-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:99px;
  background:color-mix(in srgb,var(--primary) 12%,transparent);
  color:var(--primary);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:14px;
}
.sec-title{font-size:clamp(26px,3.2vw,40px);font-weight:900;letter-spacing:-.03em;margin-bottom:12px}
.sec-sub{font-size:15px;color:var(--text-2);max-width:560px;margin:0 auto}

/* ─────── PROFILE CARD ─────── */
.profile-hero{position:relative;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px}
.profile-cover{height:200px;background:linear-gradient(135deg,var(--primary),var(--primary-2),var(--accent));position:relative;background-size:cover;background-position:center}
.profile-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.35))}
.profile-body{padding:0 24px 24px;position:relative;background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.profile-avatar-wrap{position:relative;margin-top:-60px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.profile-avatar{width:120px;height:120px;border-radius:50%;border:4px solid var(--glass-bg-3);box-shadow:0 12px 32px rgba(31,38,135,0.2);object-fit:cover;background:var(--glass-bg);position:relative}
.profile-status{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--success);border:3px solid var(--glass-bg-3);box-shadow:0 0 12px var(--success)}
.profile-status.offline{background:var(--text-3);box-shadow:none}
.profile-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.badge.verified{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff}
.badge.gold{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}
.profile-info{padding:16px 0 0}
.profile-name{font-size:26px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.profile-username{color:var(--text-2);font-size:14px;margin-top:2px}
.profile-title{color:var(--primary);font-size:14px;font-weight:600;margin-top:4px}
.profile-bio{margin-top:12px;color:var(--text-2);font-size:14px;line-height:1.7}
.profile-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.profile-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--glass-bg-2);border:1px solid var(--glass-border);font-size:13px;font-weight:500;transition:all .25s var(--ease)}
.profile-link:hover{background:var(--glass-bg);transform:translateY(-2px);border-color:var(--primary);color:var(--primary)}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.pstat{padding:14px;border-radius:var(--radius-sm);background:var(--glass-bg-2);border:1px solid var(--glass-border);text-align:center}
.pstat-num{font-size:20px;font-weight:900;color:var(--primary)}
.pstat-lbl{font-size:11px;color:var(--text-2);font-weight:600;margin-top:2px}

/* ─────── PRODUCT CARDS (9:16) ─────── */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.product-card{
  display:flex;flex-direction:column;
  border-radius:var(--radius);
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  overflow:hidden;
  transition:transform .4s var(--spring),box-shadow .3s var(--ease);
  cursor:pointer;
  position:relative;
}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--glass-shadow-lg)}
.product-media{position:relative;aspect-ratio:9/16;background:var(--glass-bg-2);overflow:hidden}
.product-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.product-card:hover .product-media img{transform:scale(1.06)}
.product-badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;gap:6px;flex-wrap:wrap}
.product-badge{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.product-badge.hot{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff}
.product-badge.new{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff}
.product-badge.featured{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}
.product-badge.out{background:rgba(0,0,0,0.7);color:#fff}
.product-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.product-cat{font-size:11px;color:var(--text-3);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.product-name{font-size:15px;font-weight:700;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.product-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
.price-now{font-size:18px;font-weight:900;color:var(--primary)}
.price-old{font-size:12px;color:var(--text-3);text-decoration:line-through}
.product-actions{display:flex;gap:6px;margin-top:8px}
.product-actions .btn{flex:1;min-height:38px;font-size:12px;padding:8px 12px}

/* ─────── CATEGORY PILLS ─────── */
.cat-pills{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cat-pill{
  flex-shrink:0;padding:10px 20px;border-radius:99px;
  background:var(--glass-bg-2);border:1px solid var(--glass-border);
  font-size:13px;font-weight:600;color:var(--text-2);
  cursor:pointer;transition:all .25s var(--ease);white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.cat-pill:hover{color:var(--text);background:var(--glass-bg);transform:translateY(-1px)}
.cat-pill.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 40%,transparent)}

/* ─────── FEATURES / WHY US ─────── */
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.feature-card{
  padding:28px 24px;border-radius:var(--radius);
  background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  transition:transform .4s var(--spring),box-shadow .3s var(--ease);
}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--glass-shadow-lg)}
.feature-icon{
  width:56px;height:56px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 20%,transparent),color-mix(in srgb,var(--accent) 20%,transparent));
  color:var(--primary);margin-bottom:16px;
}
.feature-title{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.feature-desc{font-size:14px;color:var(--text-2);line-height:1.6}

/* ─────── STEPS ─────── */
.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;position:relative}
.step-card{padding:24px 20px;border-radius:var(--radius);background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);text-align:center;position:relative}
.step-num{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 40%,transparent)}
.step-title{font-size:15px;font-weight:700;margin-bottom:6px}
.step-desc{font-size:13px;color:var(--text-2)}

/* ─────── BANNER ─────── */
.banner-cta{padding:48px 32px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--primary),var(--primary-2),var(--accent));background-size:200% 200%;animation:gradShift 8s ease infinite;position:relative;overflow:hidden;color:#fff;text-align:center}
.banner-cta::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.3),transparent 50%),radial-gradient(circle at 70% 70%,rgba(255,255,255,0.2),transparent 50%);pointer-events:none}
.banner-cta h2{font-size:clamp(24px,3vw,36px);margin-bottom:12px;position:relative}
.banner-cta p{font-size:15px;opacity:.95;margin-bottom:24px;max-width:540px;margin-left:auto;margin-right:auto;position:relative}
.banner-cta .btn{background:rgba(255,255,255,0.95);color:var(--primary);box-shadow:0 8px 24px rgba(0,0,0,0.15);position:relative}

/* ─────── TESTIMONIALS ─────── */
.testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.testi-card{padding:24px;border-radius:var(--radius);background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.testi-stars{color:#fbbf24;font-size:14px;letter-spacing:2px;margin-bottom:12px}
.testi-text{font-size:14px;color:var(--text-2);line-height:1.7;margin-bottom:16px;font-style:italic}
.testi-user{display:flex;align-items:center;gap:12px}
.testi-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.testi-name{font-size:14px;font-weight:700}
.testi-role{font-size:12px;color:var(--text-3)}

/* ─────── FAQ ─────── */
.faq-item{border:1px solid var(--glass-border);border-radius:var(--radius-sm);background:var(--glass-bg-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:10px;overflow:hidden;transition:all .3s var(--ease)}
.faq-item[open]{background:var(--glass-bg);box-shadow:var(--glass-shadow)}
.faq-item summary{padding:18px 22px;font-size:15px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:'+';font-size:24px;font-weight:400;color:var(--primary);transition:transform .3s var(--ease);line-height:1}
.faq-item[open] summary::after{transform:rotate(45deg)}
.faq-item p{padding:0 22px 20px;color:var(--text-2);font-size:14px;line-height:1.7}
/* ─────── SHOP TOOLBAR ─────── */
.shop-toolbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  padding:16px;border-radius:var(--radius);
  background:var(--glass-bg);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  margin-bottom:24px;
  position:sticky;top:calc(var(--header-h) + 8px);z-index:20;
}
.shop-search{flex:1;min-width:200px;position:relative}
.shop-search input{padding-left:44px}
.shop-search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.shop-select{min-width:160px;max-width:220px}
@media(max-width:640px){
  .shop-toolbar{position:static}
  .shop-select{max-width:none;width:calc(50% - 6px)}
}

/* ─────── PRODUCT DETAIL ─────── */
.product-detail-grid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:36px;align-items:start}
@media(max-width:900px){.product-detail-grid{grid-template-columns:1fr;gap:24px}}
.gallery-wrap{position:sticky;top:calc(var(--header-h) + 16px)}
.gallery-main{position:relative;aspect-ratio:9/16;border-radius:var(--radius-lg);overflow:hidden;background:var(--glass-bg-2);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow-lg)}
.gallery-track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-slide{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative}
.gallery-slide img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111;box-shadow:0 4px 14px rgba(0,0,0,0.2);transition:transform .2s var(--ease);z-index:2}
.gallery-nav:hover{transform:translateY(-50%) scale(1.08)}
.gallery-nav.prev{left:12px}
.gallery-nav.next{right:12px}
.gallery-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.gallery-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer;transition:all .25s var(--ease)}
.gallery-dot.active{background:#fff;width:22px;border-radius:99px}
.gallery-thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.gallery-thumb{flex:0 0 64px;aspect-ratio:9/16;border-radius:var(--radius-xs);overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.6;transition:all .25s var(--ease);background:var(--glass-bg-2)}
.gallery-thumb img{width:100%;height:100%;object-fit:cover}
.gallery-thumb:hover{opacity:.9}
.gallery-thumb.active{border-color:var(--primary);opacity:1}

.product-info-panel{padding:8px 0}
.product-detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.product-detail-title{font-size:clamp(22px,2.6vw,32px);font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
.product-detail-price{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.product-detail-price .price-now{font-size:32px;color:var(--primary)}
.product-detail-price .price-old{font-size:16px}
.product-detail-price .discount-badge{padding:4px 10px;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;border-radius:99px;font-size:12px;font-weight:800}
.product-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0;padding:20px;border-radius:var(--radius-sm);background:var(--glass-bg-2);border:1px solid var(--glass-border)}
.product-meta-item{font-size:13px}
.product-meta-item .lbl{color:var(--text-3);font-weight:500;margin-bottom:2px}
.product-meta-item .val{font-weight:700;color:var(--text)}
.qty-row{display:flex;align-items:center;gap:12px;margin:20px 0}
.qty-control{display:flex;align-items:center;border:1px solid var(--glass-border);border-radius:var(--radius-full);background:var(--glass-bg-2);overflow:hidden}
.qty-control button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--text);transition:background .2s}
.qty-control button:hover{background:var(--glass-bg)}
.qty-control input{width:56px;text-align:center;border:none;background:transparent;font-weight:700;font-size:15px;outline:none}
.product-cta{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.product-cta .btn{flex:1;min-width:140px}
.product-tabs{margin-top:32px}
.tabs-nav{display:flex;gap:4px;border-bottom:1px solid var(--glass-border-2);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 20px;font-size:14px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .25s var(--ease);cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-panel{display:none;animation:fadeIn .3s var(--ease)}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.tab-content{font-size:14px;color:var(--text-2);line-height:1.8}
.tab-content p{margin-bottom:12px}
.tab-content ul{padding-left:20px;list-style:disc;margin-bottom:12px}
.tab-content li{margin-bottom:6px}

/* ─────── BLOG ─────── */
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.blog-card{border-radius:var(--radius);background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);overflow:hidden;transition:transform .4s var(--spring),box-shadow .3s var(--ease);cursor:pointer;display:flex;flex-direction:column}
.blog-card:hover{transform:translateY(-4px);box-shadow:var(--glass-shadow-lg)}
.blog-thumb{aspect-ratio:16/9;background:var(--glass-bg-2);overflow:hidden}
.blog-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.blog-card:hover .blog-thumb img{transform:scale(1.05)}
.blog-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:10px}
.blog-cat{font-size:11px;color:var(--primary);text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.blog-title{font-size:17px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blog-excerpt{font-size:13px;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blog-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-3);margin-top:auto;padding-top:12px;border-top:1px solid var(--glass-border-2)}

.blog-detail{max-width:820px;margin:0 auto}
.blog-detail-thumb{aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;margin-bottom:24px;box-shadow:var(--glass-shadow-lg)}
.blog-detail-thumb img{width:100%;height:100%;object-fit:cover}
.blog-detail-title{font-size:clamp(24px,3.5vw,40px);font-weight:900;letter-spacing:-.02em;margin-bottom:16px}
.blog-detail-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--text-3);font-size:13px;padding-bottom:20px;border-bottom:1px solid var(--glass-border-2);margin-bottom:24px}
.blog-content{font-size:15px;line-height:1.8;color:var(--text-2)}
.blog-content h2{font-size:22px;color:var(--text);margin:24px 0 12px}
.blog-content h3{font-size:18px;color:var(--text);margin:20px 0 10px}
.blog-content p{margin-bottom:14px}
.blog-content ul,.blog-content ol{padding-left:22px;margin-bottom:14px}
.blog-content li{margin-bottom:6px}
.blog-content img{border-radius:var(--radius-sm);margin:16px 0}
.blog-content a{color:var(--primary);text-decoration:underline}
.blog-content code{background:var(--glass-bg-2);padding:2px 6px;border-radius:6px;font-family:monospace;font-size:.9em}

/* ─────── CONTACT ─────── */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr}}
.contact-channels{display:grid;gap:12px}
.channel-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius-sm);background:var(--glass-bg-2);border:1px solid var(--glass-border);transition:all .25s var(--ease);cursor:pointer}
.channel-card:hover{background:var(--glass-bg);transform:translateX(4px);border-color:var(--primary)}
.channel-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.channel-info h4{font-size:14px;font-weight:700}
.channel-info p{font-size:12px;color:var(--text-2)}

/* ─────── TABLES ─────── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--glass-border);background:var(--glass-bg-2)}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.data-table th{padding:12px 16px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);background:var(--glass-bg);border-bottom:1px solid var(--glass-border)}
table.data-table td{padding:12px 16px;border-bottom:1px solid var(--glass-border-2);vertical-align:middle}
table.data-table tr:last-child td{border-bottom:none}
table.data-table tr:hover{background:var(--glass-bg-2)}
.status-badge{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.status-pending{background:rgba(245,158,11,0.15);color:#d97706}
.status-confirmed{background:rgba(16,185,129,0.15);color:#059669}
.status-rejected{background:rgba(239,68,68,0.15);color:#dc2626}
.status-processing{background:rgba(59,130,246,0.15);color:#2563eb}
.status-completed{background:rgba(16,185,129,0.15);color:#059669}
.status-cancelled{background:rgba(100,116,139,0.15);color:#475569}
/* ─────── MODAL ─────── */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(10,14,39,0.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease);
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  padding:28px;border-radius:var(--radius-lg);
  background:var(--glass-bg-3);backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow-lg);
  transform:scale(.92) translateY(20px);
  transition:transform .5s var(--spring);
}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-lg{max-width:900px}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.modal-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.modal-close{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-bg-2);border:1px solid var(--glass-border);transition:all .2s var(--ease);cursor:pointer}
.modal-close:hover{background:var(--glass-bg);transform:rotate(90deg)}
.modal-body{margin-bottom:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ─────── TOAST ─────── */
.toast-container{position:fixed;top:calc(var(--header-h) + 16px);right:16px;z-index:1100;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;border-radius:var(--radius-sm);
  background:var(--glass-bg-3);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow-lg);
  font-size:13px;font-weight:600;
  min-width:260px;max-width:400px;
  pointer-events:auto;
  transform:translateX(120%);
  transition:transform .5s var(--spring),opacity .3s;
  opacity:0;
}
.toast.show{transform:translateX(0);opacity:1}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--accent)}
.toast-icon{width:20px;height:20px;flex-shrink:0}
.toast.success .toast-icon{color:var(--success)}
.toast.error .toast-icon{color:var(--danger)}
.toast.info .toast-icon{color:var(--accent)}

/* ─────── DRAWER (CART) ─────── */
.drawer-overlay{position:fixed;inset:0;z-index:900;background:rgba(10,14,39,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer-panel{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:901;
  background:var(--glass-bg-3);backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-left:1px solid var(--glass-border);
  transform:translateX(100%);transition:transform .5s var(--spring);
  display:flex;flex-direction:column;
}
.drawer-overlay.open .drawer-panel{transform:translateX(0)}
.drawer-header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--glass-border-2)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-footer{padding:20px;border-top:1px solid var(--glass-border-2);background:var(--glass-bg-2)}

.cart-item{display:flex;gap:12px;padding:12px;border-radius:var(--radius-sm);background:var(--glass-bg-2);border:1px solid var(--glass-border);margin-bottom:10px}
.cart-item-img{width:64px;height:80px;border-radius:var(--radius-xs);object-fit:cover;flex-shrink:0;background:var(--glass-bg)}
.cart-item-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cart-item-name{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cart-item-price{font-size:14px;font-weight:800;color:var(--primary)}
.cart-item-ctrl{display:flex;align-items:center;gap:8px;margin-top:4px}
.cart-item-ctrl button{width:26px;height:26px;border-radius:8px;background:var(--glass-bg);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all .2s}
.cart-item-ctrl button:hover{background:var(--primary);color:#fff}
.cart-item-ctrl span{font-size:12px;font-weight:700;min-width:20px;text-align:center}
.cart-item-remove{color:var(--danger);padding:4px;align-self:flex-start;cursor:pointer}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:14px;background:var(--glass-bg-2);border-radius:var(--radius-sm);border:1px solid var(--glass-border)}
.cart-total-lbl{font-size:13px;color:var(--text-2);font-weight:600}
.cart-total-val{font-size:20px;font-weight:900;color:var(--primary)}

/* ─────── DEPOSIT ─────── */
.deposit-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media(max-width:900px){.deposit-grid{grid-template-columns:1fr}}
.amount-suggestions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.amount-btn{padding:10px 16px;border-radius:var(--radius-sm);background:var(--glass-bg-2);border:1px solid var(--glass-border);font-size:13px;font-weight:700;cursor:pointer;transition:all .25s var(--ease)}
.amount-btn:hover{background:var(--glass-bg);border-color:var(--primary);color:var(--primary)}
.amount-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.qr-box{padding:20px;background:var(--glass-bg-2);border-radius:var(--radius);border:1px solid var(--glass-border);text-align:center}
.qr-box img{width:100%;max-width:280px;margin:0 auto 12px;border-radius:var(--radius-sm);background:#fff}
.bank-info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--glass-border-2);gap:12px}
.bank-info-row:last-child{border-bottom:none}
.bank-info-row .lbl{font-size:12px;color:var(--text-2);font-weight:600}
.bank-info-row .val{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;flex:1;justify-content:flex-end}
.bank-info-row .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{padding:4px;cursor:pointer;color:var(--primary);border-radius:4px;transition:background .2s;flex-shrink:0}
.copy-btn:hover{background:color-mix(in srgb,var(--primary) 15%,transparent)}

.deposit-code{display:inline-block;padding:8px 16px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-family:monospace;font-weight:800;font-size:14px;letter-spacing:.05em;cursor:pointer}

/* ─────── FOOTER ─────── */
.footer{
  margin-top:60px;padding:56px 0 24px;
  background:var(--glass-bg-2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border-2);
}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:40px}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;gap:24px}}
@media(max-width:560px){.footer-grid{grid-template-columns:1fr}}
.footer-col h4{font-size:14px;font-weight:800;margin-bottom:16px;text-transform:uppercase;letter-spacing:.05em}
.footer-col a,.footer-col p{display:block;font-size:13px;color:var(--text-2);margin-bottom:10px;transition:color .2s}
.footer-col a:hover{color:var(--primary)}
.footer-bottom{padding-top:24px;border-top:1px solid var(--glass-border-2);text-align:center;font-size:12px;color:var(--text-3)}
.footer-socials{display:flex;gap:8px;margin-top:12px}
.footer-socials a{width:38px;height:38px;border-radius:10px;background:var(--glass-bg-2);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease);margin:0}
.footer-socials a:hover{background:var(--primary);color:#fff;transform:translateY(-2px)}

/* ─────── ADMIN ─────── */
.admin-wrap{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - var(--header-h));margin-top:0}
@media(max-width:900px){.admin-wrap{grid-template-columns:1fr}}
.admin-sidebar{
  background:var(--glass-bg-2);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border-2);
  padding:24px 16px;
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;
}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .2s var(--ease);margin-bottom:2px;width:100%;text-align:left}
.admin-nav-item:hover{background:var(--glass-bg-2);color:var(--text)}
.admin-nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 30%,transparent)}
.admin-content{padding:28px}
@media(max-width:900px){.admin-content{padding:16px;padding-top:0}}
.admin-section-title{font-size:22px;font-weight:900;margin-bottom:6px;letter-spacing:-.02em}
.admin-section-desc{font-size:13px;color:var(--text-2);margin-bottom:24px}
.stat-card{padding:20px;border-radius:var(--radius);background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.stat-num{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.stat-lbl{font-size:12px;color:var(--text-2);font-weight:600;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}

.admin-login{max-width:420px;margin:80px auto;padding:32px;border-radius:var(--radius-lg);background:var(--glass-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow-lg)}
.admin-login-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 20px;box-shadow:0 12px 32px color-mix(in srgb,var(--primary) 40%,transparent)}

/* ─────── MISC ─────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-state svg{width:64px;height:64px;color:var(--text-3);margin:0 auto 16px;opacity:.6}
.empty-state h3{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)}
.empty-state p{font-size:13px}

.loading-spinner{width:32px;height:32px;border:3px solid var(--glass-border-2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.divider{height:1px;background:var(--glass-border-2);margin:20px 0}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease-out),transform .8s var(--ease-out)}
.reveal.in{opacity:1;transform:translateY(0)}

/* Breadcrumb */
.breadcrumb{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-3);margin-bottom:16px;flex-wrap:wrap}
.breadcrumb a:hover{color:var(--primary)}
.breadcrumb .sep{opacity:.5}

/* Print hide */
@media print{.header,.footer,.btn,.mobile-drawer{display:none!important}}

/* Responsive tweaks */
@media(max-width:640px){
  .container{padding:0 16px}
  .section{padding:48px 0}
  .section-sm{padding:32px 0}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .product-body{padding:10px}
  .product-name{font-size:13px;min-height:34px}
  .price-now{font-size:15px}
  .product-actions .btn{font-size:11px;padding:6px 8px;min-height:32px}
  .toast-container{left:16px;right:16px}
  .toast{max-width:none;min-width:0}
  .modal{padding:20px}
  .hero-stats{gap:20px}
  .hero-stat-num{font-size:22px}
  .profile-avatar{width:90px;height:90px;margin-top:-50px}
  .profile-name{font-size:20px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .product-detail-price .price-now{font-size:26px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header" id="header">
  <div class="header-inner">
    <a href="#/" class="logo" id="siteLogo">
      <div class="logo-mark"><span>L</span></div>
      <span class="logo-text">LUMINA</span>
    </a>
    <nav class="nav-desktop" id="navDesktop"></nav>
    <div class="header-actions">
      <button class="btn btn-icon btn-ghost" id="themeToggle" title="Chế độ sáng/tối" aria-label="Toggle theme"></button>
      <button class="btn btn-icon btn-ghost" id="cartToggle" title="Giỏ hàng" aria-label="Cart" style="position:relative">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="cartCount" class="cart-badge" style="position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--glass-bg-3)">0</span>
      </button>
      <button class="btn btn-icon btn-ghost mobile-toggle" id="mobileToggle" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- MOBILE DRAWER -->
<div class="mobile-drawer" id="mobileDrawer">
  <div class="mobile-panel">
    <div class="mobile-panel-header">
      <div class="logo"><div class="logo-mark"><span>L</span></div><span class="logo-text">LUMINA</span></div>
      <button class="modal-close" id="mobileClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <nav id="mobileNav" style="display:flex;flex-direction:column;gap:4px"></nav>
  </div>
</div>

<!-- MAIN -->
<main id="app"></main>

<!-- FOOTER -->
<footer class="footer" id="footer"></footer>

<!-- CART DRAWER -->
<div class="drawer-overlay" id="cartDrawer">
  <div class="drawer-panel">
    <div class="drawer-header">
      <h3 style="font-size:18px;font-weight:800">Giỏ hàng</h3>
      <button class="modal-close" id="cartClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-footer" id="cartFooter"></div>
  </div>
</div>

<!-- MODAL CONTAINER -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

/* ─────── STORAGE ─────── */
let DB = null;
function deepMerge(target, source) {
  for (const k in source) {
    if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k]) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
      target[k] = deepMerge(target[k], source[k]);
    } else {
      target[k] = source[k];
    }
  }
  return target;
}
function loadDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      DB = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DB)), JSON.parse(raw));
    } else {
      DB = JSON.parse(JSON.stringify(DEFAULT_DB));
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
    }
  } catch (e) {
    console.error('Load DB error', e);
    DB = JSON.parse(JSON.stringify(DEFAULT_DB));
  }
}
function saveDB() {

    window.dispatchEvent(new Event('db-updated'));

/* ─────── CART ─────── */
const CART_KEY = 'lumina_cart';
function getCart() {
  try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch { return []; }
}
function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCartBadge();
}
function addToCart(productId, qty = 1) {
  const cart = getCart();
  const item = cart.find(i => i.id === productId);
  if (item) item.qty += qty;
  else cart.push({ id: productId, qty });
  saveCart(cart);
  toast('Đã thêm vào giỏ hàng!', 'success');
}
function removeFromCart(productId) {
  saveCart(getCart().filter(i => i.id !== productId));
}
function updateCartQty(productId, qty) {
  const cart = getCart();
  const item = cart.find(i => i.id === productId);
  if (item) {
    item.qty = Math.max(1, qty);
    saveCart(cart);
  }
}
function updateCartBadge() {
  const cart = getCart();
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('cartCount');
  if (badge) {
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
  }
}
function cartTotal() {
  return getCart().reduce((sum, item) => {
    const p = DB.products.find(x => x.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);
}

/* ─────── UTILS ─────── */
function formatVND(n) {
  return new Intl.NumberFormat('vi-VN').format(Math.round(n || 0)) + '₫';
}
function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('vi-VN', {year:'numeric',month:'2-digit',day:'2-digit'}); } catch { return ''; }
}
function formatDateTime(iso) {
  try { return new Date(iso).toLocaleString('vi-VN'); } catch { return ''; }
}
function genId(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slugify(str) {
  return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
}
function debounce(fn, ms = 300) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function toast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="toast-icon">${type === 'success' ? ICO.check : type === 'error' ? ICO.x : ICO.info}</span><span>${escapeHtml(msg)}</span>`;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, duration);
}
function openModal(html) {
  const ov = document.getElementById('modalOverlay');
  const mc = document.getElementById('modalContent');
  mc.innerHTML = html;
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('Đã sao chép!', 'success')).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Đã sao chép!', 'success'); } catch { toast('Không thể sao chép', 'error'); }
  ta.remove();
}

/* ─────── PASSWORD CHECK ─────── */
function checkPassword(pw) {
  if (!pw || pw.length !== _PW_LEN) return false;
  for (let i = 0; i < _PW_LEN; i++) {
    if ((pw.charCodeAt(i) ^ 42) !== _PW_ENC[i]) return false;
  }
  return true;
}
function isAuthed() {
  return sessionStorage.getItem(SESSION_KEY) === 'ok';
}
function setAuth(ok) {
  if (ok) sessionStorage.setItem(SESSION_KEY, 'ok');
  else sessionStorage.removeItem(SESSION_KEY);
}

/* ─────── APPLY THEME / SETTINGS ─────── */
function applySettings() {
  const s = DB.settings;
  const root = document.documentElement;
  root.setAttribute('data-theme', s.theme === 'dark' ? 'dark' : 'light');
  root.setAttribute('data-anim', s.animations ? 'on' : 'off');
  root.style.setProperty('--primary', s.primaryColor);
  root.style.setProperty('--primary-2', s.primaryColor2 || s.primaryColor);
  root.style.setProperty('--accent', s.accentColor);
  root.style.setProperty('--radius', s.radius + 'px');
  root.style.setProperty('--radius-sm', Math.max(8, s.radius - 10) + 'px');
  root.style.setProperty('--radius-lg', (s.radius + 8) + 'px');
  root.style.setProperty('--font-main', s.fontFamily);
  document.title = s.siteName + ' · ' + s.tagline;
  document.querySelectorAll('.logo-text').forEach(el => el.textContent = s.siteName);
  document.querySelectorAll('.logo-mark span').forEach(el => el.textContent = s.siteInitial || 'L');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', s.theme === 'dark' ? '#080d1f' : '#eef3ff');
  // Logo
  if (s.logo) {
    document.querySelectorAll('.logo-mark').forEach(el => {
      el.outerHTML = `<img src="${escapeHtml(s.logo)}" class="logo-img" alt="logo">`;
    });
  }
  // Favicon
  if (s.favicon) {
    let link = document.querySelector('link[rel="icon"]');
    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
    link.href = s.favicon;
  }
  // Theme toggle icon
  const tt = document.getElementById('themeToggle');
  if (tt) tt.innerHTML = s.theme === 'dark' ? ICO.sun : ICO.moon;
}

function renderShop() {
  const params = new URLSearchParams((location.hash.split('?')[1] || ''));
  const cat = params.get('cat') || 'all';
  const search = params.get('q') || '';
  const sort = params.get('sort') || 'featured';
  
  let products = DB.products.filter(p => p.visible !== false);
  if (cat !== 'all') products = products.filter(p => p.category === cat);
  if (search) {
    const q = search.toLowerCase();
    products = products.filter(p => p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q));
  }
  if (sort === 'price_asc') products.sort((a, b) => a.price - b.price);
  else if (sort === 'price_desc') products.sort((a, b) => b.price - a.price);
  else if (sort === 'newest') products.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  else products.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  
  return `

          <option value="newest" ${sort === 'newest' ? 'selected' : ''}>Mới nhất</option>
          <option value="price_asc" ${sort === 'price_asc' ? 'selected' : ''}>Giá thấp → cao</option>
          <option value="price_desc" ${sort === 'price_desc' ? 'selected' : ''}>Giá cao → thấp</option>
        </select>

let _galleryIdx = 0;
function galleryNav(dir) {
  const track = document.getElementById('galleryTrack');
  if (!track) return;
  const slides = track.querySelectorAll('.gallery-slide');
  _galleryIdx = Math.max(0, Math.min(slides.length - 1, _galleryIdx + dir));
  slides[_galleryIdx].scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'start'});
  _updateGalleryUI(_galleryIdx);
}
function galleryGoto(i) {
  const track = document.getElementById('galleryTrack');
  if (!track) return;
  const slides = track.querySelectorAll('.gallery-slide');
  if (slides[i]) {
    _galleryIdx = i;
    slides[i].scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'start'});
    _updateGalleryUI(i);
  }
}
function _updateGalleryUI(idx) {
  document.querySelectorAll('.gallery-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  document.querySelectorAll('.gallery-thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
}
function detailQtyChange(dir) {
  const inp = document.getElementById('detailQty');
  if (!inp) return;
  const max = parseInt(inp.max) || 999;
  inp.value = Math.max(1, Math.min(max, (parseInt(inp.value) || 1) + dir));
}
function buyNow(id) {
  const qty = parseInt(document.getElementById('detailQty')?.value) || 1;
  addToCart(id, qty);
  openCart();
}
function switchTab(e, id) {
  const wrap = e.target.closest('.product-tabs');
  wrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  wrap.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  wrap.querySelector('#' + id).classList.add('active');
}

function setDepAmount(amount) {
  const inp = document.getElementById('depAmount');
  if (inp) inp.value = amount;

}

function generateDeposit() {
  const amount = parseInt(document.getElementById('depAmount').value);
  if (!amount || amount < DB.bank.minDeposit) {
    return toast(`Số tiền tối thiểu là ${formatVND(DB.bank.minDeposit)}`, 'error');
  }
  const code = 'NAP' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();
  const dep = {
    id: genId('dep'),
    code: code,
    amount: amount,
    status: 'pending',
    createdAt: new Date().toISOString()
  };
  DB.deposits.unshift(dep);
  saveDB();
  renderDepositQR(dep);
  toast('Đã tạo mã nạp tiền!', 'success');
}

   CART DRAWER
   ═══════════════════════════════════════════════════════════════════ */
function openCart() {
  document.getElementById('cartDrawer').classList.add('open');
  renderCartDrawer();
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.body.style.overflow = '';
}
function renderCartDrawer() {
  const cart = getCart();
  const body = document.getElementById('cartBody');
  const footer = document.getElementById('cartFooter');
  if (!body || !footer) return;
  if (!cart.length) {
    body.innerHTML = `<div class="empty-state">${ICO.cart}<h3>Giỏ hàng trống</h3><p>Hãy thêm sản phẩm vào giỏ</p></div>`;
    footer.innerHTML = '';
    return;
  }
  body.innerHTML = cart.map(item => {
    const p = DB.products.find(x => x.id === item.id);
    if (!p) return '';
    return `
      <div class="cart-item">
        <img src="${escapeHtml(p.images[0] || '')}" alt="" class="cart-item-img">
        <div class="cart-item-info">
          <div class="cart-item-name">${escapeHtml(p.name)}</div>
          <div class="cart-item-price">${formatVND(p.price)}</div>
          <div class="cart-item-ctrl">
            <button onclick="updateCartQty('${p.id}', ${item.qty - 1});renderCartDrawer()">${ICO.minus}</button>
            <span>${item.qty}</span>
            <button onclick="updateCartQty('${p.id}', ${item.qty + 1});renderCartDrawer()">${ICO.plus}</button>
          </div>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart('${p.id}');renderCartDrawer()">${ICO.trash}</button>
      </div>`;
  }).join('');
  footer.innerHTML = `
    <div class="cart-total">
      <span class="cart-total-lbl">Tổng cộng:</span>
      <span class="cart-total-val">${formatVND(cartTotal())}</span>
    </div>
    <button class="btn btn-primary btn-block btn-lg" onclick="checkout()">${ICO.order} Đặt hàng</button>
  `;
}

function checkout() {
  const cart = getCart();
  if (!cart.length) return toast('Giỏ hàng trống', 'error');
  openModal(`
    <div class="modal-header"><h3 class="modal-title">Thông tin đặt hàng</h3><button class="modal-close" onclick="closeModal()">${ICO.x}</button></div>
    <form onsubmit="submitOrder(event)">
      <div class="modal-body">
        <div class="field mb-3"><label>Họ tên *</label><input class="input" name="name" required></div>
        <div class="field mb-3"><label>Email *</label><input type="email" class="input" name="email" required></div>
        <div class="field mb-3"><label>Số điện thoại *</label><input class="input" name="phone" required></div>
        <div class="field mb-3"><label>Ghi chú</label><textarea class="textarea" name="note" placeholder="Yêu cầu thêm..."></textarea></div>
        <div class="cart-total"><span class="cart-total-lbl">Tổng cộng:</span><span class="cart-total-val">${formatVND(cartTotal())}</span></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Hủy</button>
        <button type="submit" class="btn btn-primary">${ICO.check} Xác nhận đặt hàng</button>
      </div>
    </form>
  `);
}

function submitOrder(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const cart = getCart();
  const items = cart.map(item => {
    const p = DB.products.find(x => x.id === item.id);
    return {id: p.id, name: p.name, price: p.price, qty: item.qty, image: p.images[0] || ''};
  });
  const order = {
    id: 'ORD' + Date.now().toString(36).toUpperCase(),
    items: items,
    total: cartTotal(),
    customer: {name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone')},
    note: fd.get('note'),
    status: 'pending',
    createdAt: new Date().toISOString()
  };
  DB.orders.unshift(order);
  // decrease stock
  cart.forEach(item => {
    const p = DB.products.find(x => x.id === item.id);
    if (p) p.stock = Math.max(0, (p.stock || 0) - item.qty);
  });
  saveDB();
  saveCart([]);
  closeModal();
  closeCart();
  openModal(`
    <div class="modal-header"><h3 class="modal-title">✅ Đặt hàng thành công</h3><button class="modal-close" onclick="closeModal()">${ICO.x}</button></div>
    <div class="modal-body">
      <p class="text-sm text-muted mb-3">Mã đơn hàng: <b style="font-family:monospace;color:var(--primary)">${order.id}</b></p>
      <p class="text-sm text-muted">Chúng tôi sẽ liên hệ xác nhận và hướng dẫn thanh toán trong thời gian sớm nhất.</p>
    </div>
    <div class="modal-footer"><a href="#/contact" class="btn btn-primary" onclick="closeModal()">Liên hệ ngay</a></div>
  `);
}

function saveProduct(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const images = (fd.get('images') || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 10);
  const data = {
    name: fd.get('name'),
    images: images.length ? images : ['https://picsum.photos/seed/' + Date.now() + '/540/960'],
    price: parseInt(fd.get('price')),
    originalPrice: parseInt(fd.get('originalPrice')) || 0,
    category: fd.get('category'),
    stock: parseInt(fd.get('stock')),
    desc: fd.get('desc'),
    detail: fd.get('detail'),
    featured: fd.get('featured') === 'on',
    visible: fd.get('visible') === 'on',
    hot: fd.get('hot') === 'on',
  };
  if (id) {
    const idx = DB.products.findIndex(x => x.id === id);
    DB.products[idx] = {...DB.products[idx], ...data};
    toast('Đã cập nhật sản phẩm!', 'success');
  } else {
    DB.products.unshift({id: genId('p'), ...data, createdAt: Date.now()});
    toast('Đã thêm sản phẩm!', 'success');
  }
  saveDB();
  closeModal();
  renderAdmin();
}

function deleteProduct(id) {
  if (!confirm('Xóa sản phẩm này?')) return;
  DB.products = DB.products.filter(x => x.id !== id);
  saveDB();
  renderAdmin();
  toast('Đã xóa sản phẩm', 'success');
}

      ${DB.faqs.map((f, i) => `<div class="card-sm card mb-2" style="padding:12px"><div class="flex between"><div style="flex:1"><div class="fw-600 text-sm">${escapeHtml(f.q)}</div><div class="text-xs text-muted">${escapeHtml(f.a).slice(0,80)}...</div></div><button class="btn btn-sm btn-ghost" onclick="editFaq(${i})">${ICO.edit}</button><button class="btn btn-sm btn-ghost" style="color:var(--danger)" onclick="deleteFaq(${i})">${ICO.trash}</button></div></div>`).join('')}

      <div class="flex between mb-3"><h3 class="text-lg fw-800">Testimonials</h3><button class="btn btn-sm btn-primary" onclick="editTesti()">${ICO.plus} Thêm</button></div>

    </div>`;
}

}
function editFaq(i) {
  const f = i !== undefined ? DB.faqs[i] : {q:'', a:''};
  openModal(`<div class="modal-header"><h3 class="modal-title">${i!==undefined?'Sửa':'Thêm'} FAQ</h3><button class="modal-close" onclick="closeModal()">${ICO.x}</button></div>
    <form onsubmit="saveFaq(event, ${i!==undefined?i:'null'})"><div class="modal-body">

}
function deleteFaq(i) { if (confirm('Xóa FAQ?')) { DB.faqs.splice(i, 1); saveDB(); renderAdmin(); } }
function editTesti() {

    <form onsubmit="saveTesti(event)"><div class="modal-body">
      <div class="grid grid-2 mb-3"><div class="field"><label>Tên</label><input class="input" name="name" required></div><div class="field"><label>Số sao (1-5)</label><input type="number" class="input" name="rating" value="5" min="1" max="5"></div></div>

function saveTesti(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  DB.testimonials.push({name: fd.get('name'), role: fd.get('role'), text: fd.get('text'), rating: parseInt(fd.get('rating'))||5, avatar:''});

}
