      <div class="tool-row">
        <button class="btn btn-primary" id="pwdGenBtn"><i data-lucide="refresh-cw"></i>Tạo mới</button>
        <button class="btn btn-glass" id="pwdCopyBtn"><i data-lucide="copy"></i>Sao chép</button>
      </div>
      <div class="small-text">Mật khẩu được tạo cục bộ bằng Web Crypto API — không gửi lên server.</div>
    `;

    Modal.open({
      title: 'Tạo mật khẩu',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const lenInput = mountBody.querySelector('#pwdLen');
        const lenVal = mountBody.querySelector('#pwdLenVal');
        const display = mountBody.querySelector('#pwdDisplay');
        let current = '';

        lenInput.addEventListener('input', () => { lenVal.textContent = lenInput.value; });

        const gen = () => {
          const len = parseInt(lenInput.value, 10);
          const upper = mountBody.querySelector('#pwdUpper').checked;
          const lower = mountBody.querySelector('#pwdLower').checked;
          const nums = mountBody.querySelector('#pwdNumbers').checked;
          const syms = mountBody.querySelector('#pwdSymbols').checked;
          let chars = '';
          if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
          if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
          if (nums) chars += '0123456789';
          if (syms) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
          if (!chars) { Toast.warning('Chọn ít nhất một loại ký tự'); return; }
          const arr = new Uint32Array(len);
          crypto.getRandomValues(arr);
          current = Array.from(arr).map(v => chars[v % chars.length]).join('');
          display.textContent = current;
        };

        mountBody.querySelector('#pwdGenBtn').addEventListener('click', gen);
        mountBody.querySelector('#pwdCopyBtn').addEventListener('click', () => {
          if (!current) return;
          window.LH.copyToClipboard(current);
        });
        gen();
      }
    });
  }

      </div>
      <button class="btn btn-primary btn-block" id="uuidGenBtn"><i data-lucide="refresh-cw"></i>Tạo</button>
    `;

    Modal.open({
      title: 'Tạo UUID / Random String',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const typeInput = mountBody.querySelector('#uuidType');
        const lenField = mountBody.querySelector('#uuidLenField');
        const lenInput = mountBody.querySelector('#uuidLen');
        const lenVal = mountBody.querySelector('#uuidLenVal');
        const textEl = mountBody.querySelector('#uuidText');

        typeInput.addEventListener('change', () => {
          lenField.style.display = typeInput.value === 'uuid' ? 'none' : 'block';
        });
        lenInput.addEventListener('input', () => lenVal.textContent = lenInput.value);

        const gen = () => {
          const type = typeInput.value;
          if (type === 'uuid') {
            textEl.textContent = uuidv4();
            return;
          }
          const len = parseInt(lenInput.value, 10);
          let chars = '';
          if (type === 'hex') chars = '0123456789abcdef';
          else if (type === 'alnum') chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          else if (type === 'numeric') chars = '0123456789';
          const arr = new Uint32Array(len);
          crypto.getRandomValues(arr);
          textEl.textContent = Array.from(arr).map(v => chars[v % chars.length]).join('');
        };

        mountBody.querySelector('#uuidGenBtn').addEventListener('click', gen);
        mountBody.querySelector('#uuidCopy').addEventListener('click', (e) => {
          const val = textEl.textContent;
          if (val && !val.startsWith('Nhấn')) window.LH.copyToClipboard(val, e.currentTarget);
        });
        gen();
      }
    });
  }

  function toolImage() {
    const body = document.createElement('div');
    body.className = 'tool-body';
    body.innerHTML = `

        </select>
      </div>
      <div class="field">
        <label class="field-label">Chất lượng: <span id="imgQVal">85</span>%</label>
        <input type="range" id="imgQ" min="10" max="100" value="85" style="width:100%;">
      </div>
      <div class="field">
        <label class="field-label">Kích thước tối đa (px, 0 = giữ nguyên)</label>
        <input type="number" class="input" id="imgMaxDim" value="0" min="0" step="100">
      </div>
      <button class="btn btn-primary btn-block" id="imgConvBtn"><i data-lucide="image"></i>Chuyển đổi</button>
      <div id="imgResult"></div>
    `;

    Modal.open({
      title: 'Chuyển đổi ảnh',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const qInput = mountBody.querySelector('#imgQ');
        const qVal = mountBody.querySelector('#imgQVal');
        qInput.addEventListener('input', () => qVal.textContent = qInput.value);

        mountBody.querySelector('#imgConvBtn').addEventListener('click', async () => {
          const file = mountBody.querySelector('#imgFile').files[0];
          if (!file) { Toast.error('Chọn ảnh'); return; }
          if (!file.type.startsWith('image/')) { Toast.error('File không phải ảnh'); return; }
          const format = mountBody.querySelector('#imgFormat').value;
          const quality = parseInt(qInput.value, 10) / 100;
          const maxDim = parseInt(mountBody.querySelector('#imgMaxDim').value, 10) || 0;
          const result = mountBody.querySelector('#imgResult');
          result.innerHTML = `<div class="text-center" style="padding:20px;"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onload = () => resolve(r.result);
              r.onerror = reject;
              r.readAsDataURL(file);
            });
            const img = await new Promise((resolve, reject) => {
              const i = new Image();
              i.onload = () => resolve(i);
              i.onerror = reject;
              i.src = dataUrl;
            });
            let { width, height } = img;
            if (maxDim > 0 && (width > maxDim || height > maxDim)) {
              if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
              else { width = Math.round(width * maxDim / height); height = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const outUrl = canvas.toDataURL(format, quality);
            const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[format];
            const sizeKb = Math.round((outUrl.length * 3 / 4) / 1024);
            result.innerHTML = `
              <div class="qr-result" style="background:var(--surface-3);"><img src="${outUrl}" style="max-height:220px;"></div>
              <div class="small-text" style="text-align:center;margin:8px 0;">Kích thước: ${width} × ${height} · ~${sizeKb} KB</div>
              <a class="btn btn-primary" href="${outUrl}" download="converted.${ext}" style="width:100%;"><i data-lucide="download"></i>Tải xuống</a>
            `;
            if (window.lucide) window.lucide.createIcons({ nodes: [result] });
          } catch (e) {
            result.innerHTML = `<div class="small-text" style="color:var(--danger);">Lỗi: ${escapeHtml(e.message)}</div>`;
          }
        });
      }
    });
  }

        <label class="field-label">Góc xoay</label>
        <select class="select" id="pdfRotateAngle">

          <option value="180">180°</option>
          <option value="270">270° (trái)</option>
        </select>

      <button class="btn btn-primary btn-block" id="pdfRunBtn"><i data-lucide="file-text"></i>Xử lý</button>

    `;

    Modal.open({
      title: 'Công cụ PDF',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const opInput = mountBody.querySelector('#pdfOp');
        const rotateField = mountBody.querySelector('#pdfRotateField');
        const filesHint = mountBody.querySelector('#pdfFilesHint');
        const filesInput = mountBody.querySelector('#pdfFiles');

        opInput.addEventListener('change', () => {
          const op = opInput.value;
          rotateField.style.display = op === 'rotate' ? 'block' : 'none';
          if (op === 'images') {
            filesInput.accept = 'image/*';
            filesHint.textContent = 'Chọn một hoặc nhiều ảnh (sẽ gộp thành PDF nhiều trang)';
          } else {
            filesInput.accept = 'application/pdf';
            filesHint.textContent = op === 'merge' ? 'Chọn nhiều file PDF để gộp' : 'Chọn 1 file PDF để xoay';
          }
          filesInput.multiple = op !== 'rotate';
        });

        mountBody.querySelector('#pdfRunBtn').addEventListener('click', async () => {
          const files = Array.from(filesInput.files || []);
          if (!files.length) { Toast.error('Chọn file'); return; }
          const result = mountBody.querySelector('#pdfResult');
          result.innerHTML = `<div class="text-center" style="padding:20px;"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
          const btn = mountBody.querySelector('#pdfRunBtn');
          btn.disabled = true;
          try {
            const { PDFDocument, degrees } = await loadPdfLib();
            const op = opInput.value;
            let outBytes, outName;

            if (op === 'merge') {
              const merged = await PDFDocument.create();
              for (const f of files) {
                const buf = await f.arrayBuffer();
                const doc = await PDFDocument.load(buf);
                const pages = await merged.copyPages(doc, doc.getPageIndices());
                pages.forEach(p => merged.addPage(p));
              }
              outBytes = await merged.save();
              outName = 'merged.pdf';
            } else if (op === 'rotate') {
              const f = files[0];
              const buf = await f.arrayBuffer();
              const doc = await PDFDocument.load(buf);
              const angle = parseInt(mountBody.querySelector('#pdfRotateAngle').value, 10);
              doc.getPages().forEach(p => {
                const cur = p.getRotation().angle;
                p.setRotation(degrees((cur + angle) % 360));
              });
              outBytes = await doc.save();
              outName = 'rotated.pdf';
            } else if (op === 'images') {
              const doc = await PDFDocument.create();
              for (const f of files) {
                const dataUrl = await new Promise((res, rej) => {
                  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f);
                });
                const imgBytes = await fetch(dataUrl).then(r => r.arrayBuffer());
                let image;
                if (f.type === 'image/png') image = await doc.embedPng(imgBytes);
                else image = await doc.embedJpg(imgBytes);
                const page = doc.addPage([image.width, image.height]);
                page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
              }
              outBytes = await doc.save();
              outName = 'images.pdf';
            }

            const blob = new Blob([outBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const sizeKb = Math.round(blob.size / 1024);
            result.innerHTML = `
              <div class="tool-output">
                <div class="tool-output-text">${escapeHtml(outName)} · ${sizeKb} KB</div>
              </div>
              <a class="btn btn-primary btn-block" href="${url}" download="${outName}" style="margin-top:10px;"><i data-lucide="download"></i>Tải PDF</a>
            `;
            if (window.lucide) window.lucide.createIcons({ nodes: [result] });
          } catch (e) {
            result.innerHTML = `<div class="small-text" style="color:var(--danger);">Lỗi: ${escapeHtml(e.message)}</div>`;
          } finally {
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="file-text"></i>Xử lý`;
            if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
          }
        });
      }
    });
  }

  /* ---------- Tool 8: TOTP ---------- */
  function base32Decode(input) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    input = input.toUpperCase().replace(/[^A-Z2-7]/g, '');
    const len = input.length;
    const bits = [];
    for (let i = 0; i < len; i++) {
      const val = alphabet.indexOf(input[i]);
      if (val === -1) throw new Error('Invalid base32');
      bits.push(val.toString(2).padStart(5, '0'));
    }
    const bytes = [];
    const bitsStr = bits.join('');
    for (let i = 0; i + 8 <= bitsStr.length; i += 8) {
      bytes.push(parseInt(bitsStr.slice(i, i + 8), 2));
    }
    return new Uint8Array(bytes);
  }

  async function generateTOTP(secret, period = 30, digits = 6) {
    const key = base32Decode(secret);
    const counter = Math.floor(Date.now() / 1000 / period);
    const counterBuf = new ArrayBuffer(8);
    const view = new DataView(counterBuf);
    view.setUint32(0, 0, false);
    view.setUint32(4, counter, false);

    const cryptoKey = await crypto.subtle.importKey(
      'raw', key,
      { name: 'HMAC', hash: 'SHA-1' },
      false, ['sign']
    );
    const signature = new Uint8Array(
      await crypto.subtle.sign('HMAC', cryptoKey, counterBuf)
    );
    const offset = signature[signature.length - 1] & 0xf;
    const code = ((signature[offset] & 0x7f) << 24) |
                 ((signature[offset + 1] & 0xff) << 16) |
                 ((signature[offset + 2] & 0xff) << 8) |
                 (signature[offset + 3] & 0xff);
    return String(code % Math.pow(10, digits)).padStart(digits, '0');
  }

  function toolTotp() {
    const body = document.createElement('div');
    body.className = 'tool-body';
    body.innerHTML = `
      <div class="field">
        <label class="field-label">Secret key (Base32)</label>
        <input type="text" class="input" id="totpSecret" placeholder="VD: JBSWY3DPEHPK3PXP" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-family:'JetBrains Mono',monospace;">
        <div class="small-text">Lấy từ Google Authenticator, Authy, hoặc khi bật 2FA. KHÔNG chia sẻ secret với ai.</div>
      </div>
      <div class="totp-display">
        <div class="totp-code" id="totpCode">------</div>
        <div class="totp-timer">
          <div class="totp-progress"><div class="totp-progress-bar" id="totpBar" style="width:100%;"></div></div>
          <span id="totpRemain">30s</span>
        </div>
      </div>
      <button class="btn btn-glass btn-block" id="totpCopyBtn"><i data-lucide="copy"></i>Sao chép mã</button>
      <div class="small-text" style="text-align:center;">Mã làm mới mỗi 30 giây · Xử lý hoàn toàn trên trình duyệt</div>
    `;

    Modal.open({
      title: 'TOTP / 2FA Code',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const secretInput = mountBody.querySelector('#totpSecret');
        const codeEl = mountBody.querySelector('#totpCode');
        const barEl = mountBody.querySelector('#totpBar');
        const remainEl = mountBody.querySelector('#totpRemain');
        let interval = null;

        const update = async () => {
          const secret = secretInput.value.trim();
          if (!secret) {
            codeEl.textContent = '------';
            barEl.style.width = '100%';
            remainEl.textContent = '30s';
            return;
          }
          try {
            const code = await generateTOTP(secret, 30, 6);
            codeEl.textContent = code.slice(0, 3) + ' ' + code.slice(3);
            const remain = 30 - (Math.floor(Date.now() / 1000) % 30);
            barEl.style.width = (remain / 30 * 100) + '%';
            remainEl.textContent = remain + 's';
          } catch (e) {
            codeEl.textContent = 'ERROR';
            remainEl.textContent = '—';
          }
        };

        secretInput.addEventListener('input', debounce(update, 300));

        // ticker
        const tick = () => {
          if (!secretInput.value.trim()) return;
          const remain = 30 - (Math.floor(Date.now() / 1000) % 30);
          barEl.style.width = (remain / 30 * 100) + '%';
          remainEl.textContent = remain + 's';
          if (remain === 30) update();
        };
        interval = setInterval(tick, 1000);
        update();

        // cleanup on modal close (best effort)
        const observer = new MutationObserver(() => {
          if (!document.body.contains(mountBody)) {
            clearInterval(interval);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        mountBody.querySelector('#totpCopyBtn').addEventListener('click', () => {
          const code = codeEl.textContent.replace(/\s/g, '');
          if (code && code !== '------') window.LH.copyToClipboard(code);
        });
      }
    });
  }

  async function toolNotes() {
    const body = document.createElement('div');
    body.className = 'tool-body';
    body.innerHTML = `
      <div class="notes-toolbar">
        <input type="search" class="input" id="noteSearch" placeholder="Tìm ghi chú…" style="flex:1;">

    `;

    Modal.open({
      title: 'Ghi chú',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const listEl = mountBody.querySelector('#noteList');
        const searchEl = mountBody.querySelector('#noteSearch');
        let notes = [];

        const loadLocal = () => store.get('lh_notes', []) || [];
        const saveLocal = (n) => store.set('lh_notes', n);

        const loadFromServer = async () => {
          if (!State.user) return null;
          try {
            const { data, error } = await supabase
              .from('notes')
              .select('*')
              .eq('user_id', State.user.id)
              .order('updated_at', { ascending: false });
            if (error) return null;
            return data;
          } catch { return null; }
        };

        const render = (filter = '') => {
          const items = notes.filter(n =>
            (n.title || '').toLowerCase().includes(filter.toLowerCase()) ||
            (n.content || '').toLowerCase().includes(filter.toLowerCase())
          );
          if (!items.length) {
            listEl.innerHTML = `<div class="small-text" style="text-align:center;padding:20px;">${filter ? 'Không tìm thấy' : 'Chưa có ghi chú nào'}</div>`;
            return;
          }
          listEl.innerHTML = items.map(n => `
            <div class="note-card" data-note-id="${escapeHtml(n.id)}">
              <div class="note-title">${escapeHtml(n.title || 'Không tiêu đề')}</div>
              <div class="note-preview">${escapeHtml((n.content || '').slice(0, 120))}</div>
              <div class="note-meta">${formatDateTime(n.updated_at || n.updated)}</div>
              <button class="note-del" data-del-id="${escapeHtml(n.id)}"><i data-lucide="trash-2"></i></button>
            </div>
          `).join('');
          if (window.lucide) window.lucide.createIcons({ nodes: [listEl] });

          listEl.querySelectorAll('.note-card').forEach(card => {
            card.addEventListener('click', (e) => {
              if (e.target.closest('.note-del')) return;
              openNoteEditor(card.dataset.noteId);
            });
          });
          listEl.querySelectorAll('.note-del').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const id = btn.dataset.delId;
              const ok = await Modal.confirm('Xoá ghi chú?', { okText: 'Xoá', danger: true });
              if (!ok) return;
              notes = notes.filter(n => n.id !== id);
              if (State.user) {
                try { await supabase.from('notes').delete().eq('id', id); } catch {}
              }
              saveLocal(notes.filter(n => !n.id.startsWith('srv-')));
              render(searchEl.value);
            });
          });
        };

        const openNoteEditor = (id = null) => {
          const existing = id ? notes.find(n => n.id === id) : null;
          const editorBody = document.createElement('div');
          editorBody.innerHTML = `
            <div class="field">
              <label class="field-label">Tiêu đề</label>
              <input type="text" class="input" id="noteEditTitle" value="${escapeHtml(existing?.title || '')}">
            </div>
            <div class="field">
              <label class="field-label">Nội dung</label>
              <textarea class="textarea" id="noteEditContent" style="min-height:200px;">${escapeHtml(existing?.content || '')}</textarea>
            </div>
          `;
          Modal.open({
            title: id ? 'Sửa ghi chú' : 'Ghi chú mới',
            content: editorBody,
            actions: [
              { label: 'Huỷ', className: 'btn-glass', onClick: (c) => c() },
              { label: 'Lưu', className: 'btn-primary', onClick: async (close) => {
                const title = editorBody.querySelector('#noteEditTitle').value.trim();
                const content = editorBody.querySelector('#noteEditContent').value.trim();
                if (!title && !content) { Toast.error('Nhập tiêu đề hoặc nội dung'); return; }
                const now = new Date().toISOString();
                if (State.user) {
                  try {
                    if (id && id.startsWith('srv-')) {
                      const realId = id.replace('srv-', '');
                      await supabase.from('notes').update({ title, content, updated_at: now }).eq('id', realId);
                    } else if (existing && existing.id && !existing.id.startsWith('local-')) {
                      await supabase.from('notes').update({ title, content, updated_at: now }).eq('id', existing.id);
                    } else {
                      const { data } = await supabase.from('notes').insert({ user_id: State.user.id, title, content, updated_at: now }).select().maybeSingle();
                      if (data) id = 'srv-' + data.id;
                    }
                  } catch (e) { Toast.error('Sync lỗi: ' + (e.message || '')); }
                }
                // local
                const localNotes = notes.filter(n => !n.id.startsWith('srv-'));
                if (existing && !existing.id.startsWith('srv-')) {
                  existing.title = title; existing.content = content; existing.updated_at = now;
                } else if (!existing) {
                  notes.unshift({ id: 'local-' + uuidv4().slice(0, 8), title, content, updated_at: now });
                }
                saveLocal(notes.filter(n => !n.id.startsWith('srv-')));
                // reload
                await reloadAll();
                close();
                render(searchEl.value);
              }}
            ]
          });
        };

        const reloadAll = async () => {
          let localNotes = loadLocal();
          let serverNotes = [];
          if (State.user) {
            const srv = await loadFromServer();
            if (srv) serverNotes = srv.map(n => ({ ...n, id: 'srv-' + n.id, updated_at: n.updated_at }));
          }
          notes = [...serverNotes, ...localNotes].sort((a, b) =>
            new Date(b.updated_at || 0) - new Date(a.updated_at || 0)
          );
        };

        mountBody.querySelector('#noteAddBtn').addEventListener('click', () => openNoteEditor(null));
        searchEl.addEventListener('input', (e) => render(e.target.value));

        reloadAll().then(() => render());
      }
    });
  }

  async function getLocation() {
    // Try GPS first
    try {
      const pos = await new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('no geolocation'));
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 6000, maximumAge: 300000 });
      });
      return { lat: pos.coords.latitude, lon: pos.coords.longitude, source: 'GPS' };
    } catch {}
    // Fallback: IP
    try {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      if (data.latitude && data.longitude) {
        return { lat: data.latitude, lon: data.longitude, city: data.city, region: data.region, country: data.country_name, source: 'IP' };
      }
    } catch {}
    // Default Hanoi
    return { lat: 21.0278, lon: 105.8342, city: 'Hà Nội', country: 'Việt Nam', source: 'default' };
  }

          <div class="empty-state-title">Không tải được thời tiết</div>
          <div class="empty-state-desc">${escapeHtml(e.message || '')}. Kiểm tra kết nối mạng hoặc thử lại.</div>
          <button class="btn btn-primary" id="weatherRetry"><i data-lucide="refresh-cw"></i>Thử lại</button>
        </div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [container] });
        container.querySelector('#weatherRetry')?.addEventListener('click', () => renderWeather(container));
      }
    };

    container.querySelector('#weatherRefresh')?.addEventListener('click', () => renderWeather(container));
    load();
  }

  function renderWeatherUI(container, data, loc) {
    const cur = data.current;
    const daily = data.daily;
    const hourly = data.hourly;
    const wi = getWeatherInfo(cur.weather_code);
    const locName = loc.city
      ? `${loc.city}${loc.country ? ', ' + loc.country : ''} (nguồn: ${loc.source})`
      : `Vĩ độ ${loc.lat.toFixed(2)}, Kinh độ ${loc.lon.toFixed(2)} (nguồn: ${loc.source})`;
    const now = new Date();
    const updatedAt = data.current.time ? new Date(data.current.time) : now;

    // Wind direction label
    const windDirs = ['B', 'ĐB', 'Đ', 'ĐN', 'N', 'TN', 'T', 'TB'];
    const windDir = windDirs[Math.round(((cur.wind_direction_10m || 0) % 360) / 45) % 8];

    // Build hourly (next 24h from now)
    const hourlyItems = [];
    const curHourIdx = hourly.time.findIndex(t => new Date(t) >= now);
    const startIdx = curHourIdx >= 0 ? curHourIdx : 0;
    for (let i = startIdx; i < Math.min(startIdx + 24, hourly.time.length); i++) {
      const t = new Date(hourly.time[i]);
      hourlyItems.push({
        hour: t.getHours() + 'h',
        temp: Math.round(hourly.temperature_2m[i]),
        code: hourly.weather_code[i],
        rain: hourly.precipitation_probability[i]
      });
    }

    // Build daily (7 days)
    const dailyItems = [];
    const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    for (let i = 0; i < daily.time.length; i++) {
      const d = new Date(daily.time[i]);
      const name = i === 0 ? 'Hôm nay' : dayNames[d.getDay()];
      dailyItems.push({
        day: name,
        date: d,
        min: Math.round(daily.temperature_2m_min[i]),
        max: Math.round(daily.temperature_2m_max[i]),
        code: daily.weather_code[i]
      });
    }

    const sunrise = daily.sunrise?.[0] ? new Date(daily.sunrise[0]).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '—';
    const sunset = daily.sunset?.[0] ? new Date(daily.sunset[0]).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '—';
    const uvNow = daily.uv_index_max?.[0] ?? '—';

    container.innerHTML = `
      <div class="weather-hero anim-up">
        <div class="weather-loc"><i data-lucide="map-pin"></i>${escapeHtml(locName)}</div>
        <div class="weather-time">${now.toLocaleString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
        <div class="weather-main">
          <div class="weather-icon-big"><i data-lucide="${wi.icon}"></i></div>
          <div>
            <div class="weather-temp">${Math.round(cur.temperature_2m)}°</div>
            <div class="weather-desc">${escapeHtml(wi.label)} · Cảm giác như ${Math.round(cur.apparent_temperature)}°</div>
          </div>
        </div>
        <div class="weather-metrics">
          <div class="weather-metric">
            <div class="weather-metric-label">Độ ẩm</div>
            <div class="weather-metric-value">${cur.relative_humidity_2m}%</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">Gió</div>
            <div class="weather-metric-value">${Math.round(cur.wind_speed_10m)} km/h ${windDir}</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">UV max</div>
            <div class="weather-metric-value">${uvNow}</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">Mây che</div>
            <div class="weather-metric-value">${cur.cloud_cover}%</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">Áp suất</div>
            <div class="weather-metric-value">${Math.round(cur.pressure_msl)} hPa</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">Mưa</div>
            <div class="weather-metric-value">${cur.precipitation} mm</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">Bình minh</div>
            <div class="weather-metric-value" style="font-size:13px;">${sunrise}</div>
          </div>
          <div class="weather-metric">
            <div class="weather-metric-label">Hoàng hôn</div>
            <div class="weather-metric-value" style="font-size:13px;">${sunset}</div>
          </div>
        </div>
      </div>

      <div class="section" style="margin-top:var(--sp-5);">
        <div class="section-head" style="margin-bottom:10px;">
          <div class="section-title-wrap">
            <div class="section-title" style="font-size:15px;">Dự báo 24 giờ tới</div>
          </div>
        </div>
        <div class="weather-hourly">
          ${hourlyItems.map(h => {
            const hi = getWeatherInfo(h.code);
            return `<div class="wh-item">
              <div class="wh-hour">${h.hour}</div>
              <div class="wh-icon"><i data-lucide="${hi.icon}"></i></div>
              <div class="wh-temp">${h.temp}°</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="section" style="margin-top:var(--sp-4);">
        <div class="section-head" style="margin-bottom:10px;">
          <div class="section-title-wrap">
            <div class="section-title" style="font-size:15px;">Dự báo 7 ngày</div>
          </div>
        </div>
        <div class="weather-daily">
          ${dailyItems.map(d => {
            const di = getWeatherInfo(d.code);
            return `<div class="wd-item">
              <div class="wd-day">${d.day}</div>
              <div class="wd-icon"><i data-lucide="${di.icon}"></i></div>
              <div class="wd-temps"><span class="max">${d.max}°</span> · <span class="min">${d.min}°</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="weather-note">
        <i data-lucide="info"></i>
        <span>Cảnh báo thiên tai chỉ khả dụng ở khu vực có cơ quan khí tượng cung cấp API cảnh báo (hiện chưa tích hợp). Open-Meteo không cung cấp alerts tại Việt Nam — vui lòng theo dõi trang của Trung tâm Dự báo Khí tượng Thủy văn Quốc gia.</span>
      </div>

      <div class="weather-updated">
        <i data-lucide="refresh-cw"></i>
        Dữ liệu: Open-Meteo.com · Cập nhật: ${formatDateTime(updatedAt)}
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
  }

  /* ==========================================================
     8.10 REGISTER VIEWS
     ========================================================== */
  window.LH.Views = window.LH.Views || {};
  window.LH.Views.tools = (container) => renderTools(container);
  window.LH.Views.weather = (container) => renderWeather(container);

  console.log('%cPart 8/2 loaded — 10 MMO tools + Weather (real Open-Meteo)', 'color:#f59e0b;font-weight:700;');
})();
</script>

 <!-- ============================================================
     PART 9 — REALTIME SYNC · CACHE · ERROR BOUNDARY · PERFORMANCE
     ============================================================ -->

<script>
/* ============================================================
   PART 9 — Supabase runtime integration
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, store, CONFIG,
    Toast, escapeHtml
  } = window.LH;

  if (!supabase) { console.error('[Part9] Supabase missing'); return; }

  /* ==========================================================
     9.1 CACHE LAYER (in-memory + TTL, plus sessionStorage)
     ========================================================== */
  const Cache = {
    mem: new Map(),
    async get(key, fetcher, ttlMs = 60000) {
      const now = Date.now();
      const hit = this.mem.get(key);
      if (hit && now - hit.at < ttlMs) return hit.value;
      try {
        const value = await fetcher();
        this.mem.set(key, { value, at: now });
        return value;
      } catch (e) {
        // return stale if available
        if (hit) return hit.value;
        throw e;
      }
    },
    set(key, value) { this.mem.set(key, { value, at: Date.now() }); },
    invalidate(key) {
      if (key == null) this.mem.clear();
      else this.mem.delete(key);
    },
    invalidatePrefix(prefix) {
      for (const k of Array.from(this.mem.keys())) {
        if (k.startsWith(prefix)) this.mem.delete(k);
      }
    }
  };
  window.LH.Cache = Cache;

  /* ==========================================================
     9.2 SETTINGS CACHE (website_settings) — applied on boot
     ========================================================== */
  const SiteSettings = {
    async load(force = false) {
      if (!force && State.settings) return State.settings;
      try {
        const { data, error } = await supabase.from('website_settings').select('*');
        if (error) throw error;
        const map = {};
        (data || []).forEach(r => { map[r.key] = r.value; });
        State.settings = map;
        this.apply(map);
        Cache.set('site_settings', map);
        return map;
      } catch (e) {
        console.warn('[SiteSettings.load]', e.message);
        // fallback from cache
        const cached = Cache.mem.get('site_settings');
        if (cached) {
          State.settings = cached.value;
          this.apply(cached.value);
        }
        return State.settings || {};
      }
    },
    apply(map) {
      if (!map) return;
      // Brand
      const brandName = document.getElementById('brandName');
      const brandTag = document.getElementById('brandTag');
      const brandLogo = document.getElementById('brandLogo');
      if (brandName && map.site_name) brandName.textContent = map.site_name;
      if (brandTag && map.site_tagline) brandTag.textContent = map.site_tagline;
      if (brandLogo && map.site_logo_url) {
        brandLogo.innerHTML = `<img src="${escapeHtml(map.site_logo_url)}" alt="">`;
      }
      // Title
      if (map.site_name) document.title = map.site_name;
      // Colors
      if (map.primary_color) {
        document.documentElement.style.setProperty('--brand-1', map.primary_color);
      }
      if (map.secondary_color) {
        document.documentElement.style.setProperty('--brand-2', map.secondary_color);
      }
      // Favicon
      if (map.site_favicon_url) {
        let fav = document.querySelector('link[rel="icon"]');
        if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
        fav.href = map.site_favicon_url;
      }
    },
    invalidate() {
      Cache.invalidate('site_settings');
      State.settings = null;
    }
  };
  window.LH.SiteSettings = SiteSettings;

  /* ==========================================================
     9.3 REALTIME SYNC MANAGER
     ========================================================== */
  const Realtime = {
    channels: new Map(),

    subscribeAll() {
      if (!supabase) return;
      this.subscribeSettings();
      this.subscribeProducts();
      this.subscribeProfile();
      this.subscribeNotifications();
      this.subscribeWallet();
    },

    _mkChannel(name, config) {
      if (this.channels.has(name)) return this.channels.get(name);
      try {
        const ch = supabase.channel(name);
        Object.entries(config).forEach(([type, handler]) => {
          ch.on('postgres_changes', type, handler);
        });
        ch.subscribe();
        this.channels.set(name, ch);
        return ch;
      } catch (e) {
        console.warn('[Realtime] subscribe fail', name, e);
        return null;
      }
    },

    subscribeSettings() {
      this._mkChannel('rt:settings', {
        'UPDATE': { schema: 'public', table: 'website_settings' }
      }).on && this.channels.get('rt:settings')?.on?.('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'website_settings' }, (payload) => {
        // Reload full map on any settings change
        SiteSettings.load(true);
        Toast.info('Cài đặt website vừa được cập nhật', 3000);
      });
      // Simpler alt: attach handler after channel creation
    },

    subscribeProducts() {
      this._mkChannel('rt:products', {
        '*': { schema: 'public', table: 'products' }
      });
      const ch = this.channels.get('rt:products');
      if (ch) {
        ch.on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, (payload) => {
          Cache.invalidatePrefix('products:');
          // refresh current view if on shop/home/product
          const v = State.currentView;
          if (['home', 'shop', 'product'].includes(v)) {
            window.LH.refreshCurrentView?.();
          }
        });
      }
    },

    subscribeProfile() {
      if (!State.user) return;
      const id = State.user.id;
      this._mkChannel('rt:profile:' + id, {});
      const ch = this.channels.get('rt:profile:' + id);
      if (ch) {
        ch.on('postgres_changes', {
          event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${id}`
        }, (payload) => {
          if (payload.new) {
            State.profile = { ...State.profile, ...payload.new };
            window.LH.renderUserState?.();
          }
        });
      }
    },

    subscribeNotifications() {
      // Already handled by Part 8 Notifications module
    },

    subscribeWallet() {
      if (!State.user) return;
      const id = State.user.id;
      this._mkChannel('rt:wallet:' + id, {});
      const ch = this.channels.get('rt:wallet:' + id);
      if (ch) {
        ch.on('postgres_changes', {
          event: 'UPDATE', schema: 'public', table: 'wallets', filter: `user_id=eq.${id}`
        }, (payload) => {
          if (payload.new) {
            State.wallet = { ...State.wallet, ...payload.new };
            // refresh balance displays
            const balEl = document.getElementById('walletBalance');
            if (balEl && payload.new.balance != null) {
              balEl.textContent = window.LH.formatCurrency(Number(payload.new.balance));
            }
          }
        });
      }
    },

    unsubscribeAll() {
      for (const ch of this.channels.values()) {
        try { supabase.removeChannel(ch); } catch {}
      }
      this.channels.clear();
    }
  };
  window.LH.Realtime = Realtime;

  /* ==========================================================
     9.4 REALTIME HOOKS to auth state
     ========================================================== */
  State.on('auth:login', () => {
    SiteSettings.load(false);
    Realtime.subscribeAll();
  });
  State.on('auth:logout', () => {
    Realtime.unsubscribeAll();
  });

  /* ==========================================================
     9.5 ERROR BOUNDARY
     ========================================================== */
  const ErrorBoundary = {
    init() {
      window.addEventListener('error', (e) => {
        console.error('[Global error]', e.error || e.message);
        // Don't show toast for every minor error to avoid spam
        if (e.error && /network|fetch|supabase|Failed/i.test(String(e.error))) {
          Toast.error('Lỗi kết nối, vui lòng thử lại');
        }
      });
      window.addEventListener('unhandledrejection', (e) => {
        console.error('[Unhandled promise]', e.reason);
        if (e.reason && /network|fetch|supabase/i.test(String(e.reason))) {
          Toast.error('Lỗi xử lý, vui lòng thử lại');
        }
      });
    }
  };

  /* ==========================================================
     9.6 SAFE FETCH WRAPPER (retry + timeout)
     ========================================================== */
  async function safeFetch(fn, { retries = 2, delay = 400, timeoutMs = 15000 } = {}) {
    let lastErr;
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const result = await Promise.race([
          fn(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), timeoutMs))
        ]);
        return result;
      } catch (e) {
        lastErr = e;
        if (attempt < retries) await new Promise(r => setTimeout(r, delay * (attempt + 1)));
      }
    }
    throw lastErr;
  }
  window.LH.safeFetch = safeFetch;

  /* ==========================================================
     9.7 PERFORMANCE — request dedupe
     ========================================================== */
  const inFlight = new Map();
  async function dedupe(key, fn) {
    if (inFlight.has(key)) return inFlight.get(key);
    const p = (async () => {
      try { return await fn(); }
      finally { inFlight.delete(key); }
    })();
    inFlight.set(key, p);
    return p;
  }
  window.LH.dedupe = dedupe;

  /* ==========================================================
     9.8 BOOT SEQUENCE
     ========================================================== */
  async function boot() {
    ErrorBoundary.init();

    // 1. Load site settings (needed for brand/colors)
    await SiteSettings.load(false);

    // 2. Wait for Auth to restore session
    if (window.LH.Auth) {
      try { await window.LH.Auth.restoreSession(); } catch {}
    }

    // 3. Subscribe realtime (auth events also re-trigger this)
    if (State.user) Realtime.subscribeAll();

    // 4. Boot page loader off
    setTimeout(() => {
      const loader = document.getElementById('pageLoader');
      if (loader) loader.classList.add('hide');
    }, 150);

    // 5. Clear stale cache periodically
    setInterval(() => {
      Cache.invalidatePrefix('products:');
      Cache.invalidate('site_settings');
    }, 5 * 60 * 1000);

    console.log('%cPart 9 loaded — Realtime + Cache + ErrorBoundary + Boot', 'color:#10b981;font-weight:700;');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

    display: none !important;
  }
  body { background: #fff !important; color: #000 !important; }
  .glass, .glass-strong {
    background: #fff !important;
    border: 1px solid #ddd !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
  }
  a { color: #000 !important; text-decoration: underline !important; }
  .container { max-width: none !important; padding: 0 !important; }
}

/* ---------- 10.3 FINAL TOUCH ---------- */
/* Loading overlay cleanup */
.page-loader.hide {
  display: none;
}

/* Smooth transitions between views */
#viewContainer {
  animation: viewEnter 320ms var(--ease-out) both;
}

/* Fix floating UI clipping */
#app { overflow-x: clip; }

/* Offline banner */
.offline-banner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 8px 16px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  background: var(--warning);
  color: #fff;
  z-index: 9999;
  transform: translateY(-100%);
  transition: transform var(--dur-med) var(--ease-out);
  padding-top: calc(8px + var(--safe-top));
}
.offline-banner.show { transform: translateY(0); }

/* Version badge in footer */
.app-version-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--border-1);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* Empty state for unsupported browser */
.browser-warning {
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--warning-bg);
  color: var(--warning);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  display: flex;
  gap: 10px;
  margin: var(--sp-4);
}
</style>

<script>
/* ============================================================
   PART 10 — FINAL BOOTSTRAP · A11Y · PWA · CLEANUP
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, store, CONFIG,
    Toast, escapeHtml
  } = window.LH;

  /* ==========================================================
     10.1 OFFLINE DETECTOR
     ========================================================== */
  function initOfflineDetector() {
    const banner = document.createElement('div');
    banner.className = 'offline-banner';
    banner.id = 'offlineBanner';
    banner.innerHTML = '<i data-lucide="wifi-off" style="width:14px;height:14px;display:inline;vertical-align:-2px;margin-right:6px;"></i>Bạn đang ngoại tuyến — một số chức năng có thể không khả dụng';
    document.body.appendChild(banner);

    const update = () => {
      if (!navigator.onLine) {
        banner.classList.add('show');
      } else {
        banner.classList.remove('show');
        // Refetch current view if it failed offline
        window.LH.refreshCurrentView?.();
      }
    };
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  }

  /* ==========================================================
     10.2 PWA MANIFEST (inject dynamically, no external file)
     ========================================================== */
  function initPWA() {
    if (!document.querySelector('link[rel="manifest"]')) {
      const manifest = {
        name: CONFIG.APP_NAME || 'Liquid Hub',
        short_name: 'LiquidHub',
        description: 'Profile Bio + Shop + MMO Platform',
        start_url: './',
        display: 'standalone',
        background_color: '#f4f6fb',
        theme_color: '#6366f1',
        orientation: 'portrait-primary',
        icons: []
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    }
    // Apple touch icon (skip if not available)
    if (!document.querySelector('link[rel="apple-touch-icon"]')) {
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><rect width="180" height="180" fill="%236366f1" rx="36"/><text x="50%" y="54%" font-size="80" fill="white" text-anchor="middle" font-family="Arial" font-weight="bold">LH</text></svg>';
      document.head.appendChild(link);
    }
  }

  /* ==========================================================
     10.3 BROWSER COMPATIBILITY CHECK
     ========================================================== */
  function checkBrowser() {
    const issues = [];
    if (typeof fetch !== 'function') issues.push('fetch API');
    if (typeof Promise !== 'function') issues.push('Promise');
    if (typeof localStorage === 'undefined') issues.push('localStorage');
    if (!window.crypto || !window.crypto.subtle) issues.push('Web Crypto');
    if (!document.documentElement.style.backdropFilter &&
        !document.documentElement.style.webkitBackdropFilter) {
      // Not fatal — just reduced glass effect
      console.warn('[Compat] backdrop-filter không được hỗ trợ — hiệu ứng kính sẽ giảm');
    }
    if (issues.length) {
      const warn = document.createElement('div');
      warn.className = 'browser-warning';
      warn.innerHTML = `
        <i data-lucide="alert-triangle" style="width:18px;height:18px;flex-shrink:0;"></i>
        <div>
          <div style="font-weight:700;margin-bottom:2px;">Trình duyệt không được hỗ trợ đầy đủ</div>
          <div style="font-size:12px;font-weight:500;">Thiếu: ${escapeHtml(issues.join(', '))}. Vui lòng dùng Chrome, Edge, Firefox hoặc Safari phiên bản mới.</div>
        </div>
      `;
      const viewContainer = document.getElementById('viewContainer');
      if (viewContainer) viewContainer.prepend(warn);
      if (window.lucide) window.lucide.createIcons({ nodes: [warn] });
    }
  }

  /* ==========================================================
     10.4 SCROLL RESTORATION
     ========================================================== */
  function initScrollRestore() {
    // Save on route change
    let lastHash = location.hash;
    window.addEventListener('hashchange', () => {
      const key = 'lh_scroll_' + lastHash;
      store.set(key, window.scrollY);
      lastHash = location.hash;
      // Restore target
      setTimeout(() => {
        const saved = store.get('lh_scroll_' + location.hash, 0);
        if (saved > 0) window.scrollTo({ top: saved, behavior: State.reducedMotion ? 'auto' : 'instant' });
      }, 100);
    });
  }

  /* ==========================================================
     10.5 GLOBAL KEYBOARD SHORTCUTS
     ========================================================== */
  function initKeyboardShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Skip when typing in input/textarea
      const tag = (e.target.tagName || '').toLowerCase();
      const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

      // Ctrl/Cmd + K → focus search
      if ((e.ctrlKey || e.metaKey) && e.key === 'k' && !isTyping) {
        e.preventDefault();
        const searchInput = document.getElementById('headerSearchInput');
        const mobileBtn = document.getElementById('searchMobileBtn');
        if (window.innerWidth < 1280 && mobileBtn) {
          mobileBtn.click();
        } else if (searchInput) {
          searchInput.focus();
        }
      }
      // Ctrl/Cmd + / → open settings
      if ((e.ctrlKey || e.metaKey) && e.key === '/' && !isTyping) {
        e.preventDefault();
        window.LH.openSettingsPanel?.();
      }
      // Ctrl/Cmd + B → toggle cart
      if ((e.ctrlKey || e.metaKey) && e.key === 'b' && !isTyping) {
        e.preventDefault();
        if (window.LH.Cart) window.LH.Cart.open();
      }
      // ? → show shortcuts
      if (e.key === '?' && !isTyping && e.shiftKey) {
        e.preventDefault();
        showShortcutsModal();
      }
      // Esc → close mobile sidebar
      if (e.key === 'Escape') {
        if (document.getElementById('appSidebar')?.classList.contains('mobile-open')) {
          window.LH.closeMobileSidebar?.();
        }
      }
    });
  }

  function showShortcutsModal() {
    const body = document.createElement('div');
    body.innerHTML = `
      <div class="checkout-summary">
        <div class="checkout-row"><span><kbd style="padding:2px 8px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border-1);font-family:monospace;font-size:11px;">Ctrl / ⌘ + K</kbd></span><span>Tìm kiếm</span></div>
        <div class="checkout-row"><span><kbd style="padding:2px 8px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border-1);font-family:monospace;font-size:11px;">Ctrl / ⌘ + B</kbd></span><span>Mở giỏ hàng</span></div>
        <div class="checkout-row"><span><kbd style="padding:2px 8px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border-1);font-family:monospace;font-size:11px;">Ctrl / ⌘ + /</kbd></span><span>Mở cài đặt</span></div>
        <div class="checkout-row"><span><kbd style="padding:2px 8px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border-1);font-family:monospace;font-size:11px;">?</kbd></span><span>Hiện bảng phím tắt</span></div>
        <div class="checkout-row"><span><kbd style="padding:2px 8px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border-1);font-family:monospace;font-size:11px;">Esc</kbd></span><span>Đóng modal / sidebar</span></div>
      </div>
    `;
    window.LH.Modal.open({
      title: 'Phím tắt',
      content: body,
      size: 'sm'
    });
  }

  /* ==========================================================
     10.6 LAZY ICON RE-RENDER
     ========================================================== */
  // Re-scan icons when new views render
  const iconObserver = new MutationObserver((mutations) => {
    // Debounced
    if (iconObserver._t) clearTimeout(iconObserver._t);
    iconObserver._t = setTimeout(() => {
      if (window.lucide) {
        try { window.lucide.createIcons(); } catch {}
      }
    }, 80);
  });
  iconObserver.observe(document.body, { childList: true, subtree: true });

  /* ==========================================================
     10.7 IMAGE LAZY LOADING FALLBACK
     ========================================================== */
  function initImageFallback() {
    document.addEventListener('error', (e) => {
      if (e.target.tagName === 'IMG' && !e.target.dataset.fallback) {
        e.target.dataset.fallback = '1';
        const parent = e.target.parentElement;
        if (parent && !parent.querySelector('.img-fallback-shown')) {
          const fb = document.createElement('div');
          fb.className = 'img-fallback-shown';
          fb.style.cssText = 'width:100%;height:100%;display:grid;place-items:center;background:var(--surface-3);color:var(--text-4);';
          fb.innerHTML = '<i data-lucide="image-off" style="width:24px;height:24px;"></i>';
          e.target.style.display = 'none';
          parent.appendChild(fb);
          if (window.lucide) window.lucide.createIcons({ nodes: [fb] });
        }
      }
    }, true);
  }

  /* ==========================================================
     10.8 CLEANUP ON UNLOAD
     ========================================================== */
  function initCleanup() {
    window.addEventListener('beforeunload', () => {
      try { window.LH.Realtime?.unsubscribeAll?.(); } catch {}
    });
    // Auto cleanup cache every 5 minutes
    setInterval(() => {
      try { window.LH.Cache?.invalidatePrefix?.('products:'); } catch {}
    }, 5 * 60 * 1000);
  }

  /* ==========================================================
     10.9 INJECT SKIP LINK + VERSION FOOTER
     ========================================================== */
  function injectA11yAndFooter() {
    // Skip link
    if (!document.querySelector('.skip-link')) {
      const skip = document.createElement('a');
      skip.href = '#appMain';
      skip.className = 'skip-link';
      skip.textContent = 'Bỏ qua điều hướng';
      document.body.insertBefore(skip, document.body.firstChild);
    }
    // Version badge in footer of each page (append to viewContainer after render)
    // Will be added on route change
    window.addEventListener('lh:view', () => {
      setTimeout(() => {
        const vc = document.getElementById('viewContainer');
        if (!vc || vc.querySelector('.app-version-badge')) return;
        const badge = document.createElement('div');
        badge.style.cssText = 'text-align:center;margin-top:var(--sp-8);padding-top:var(--sp-4);border-top:1px solid var(--divider);';
        badge.innerHTML = `<span class="app-version-badge"><i data-lucide="sparkles" style="width:10px;height:10px;"></i>v${CONFIG.APP_VERSION} · Liquid Hub</span>`;
        vc.appendChild(badge);
        if (window.lucide) window.lucide.createIcons({ nodes: [badge] });
      }, 500);
    });
  }

  /* ==========================================================
     10.10 FINAL BOOT
     ========================================================== */
  function finalBoot() {
    initOfflineDetector();
    initPWA();
    checkBrowser();
    initScrollRestore();
    initKeyboardShortcuts();
    initImageFallback();
    initCleanup();
    injectA11yAndFooter();

    // Welcome toast on first visit
    if (!store.get('lh_visited_v1')) {
      setTimeout(() => {
        Toast.success('Chào mừng đến với Liquid Hub!');
        store.set('lh_visited_v1', true);
      }, 1500);
    }

    // Final icon render
    if (window.lucide) window.lucide.createIcons();

    console.log(
      '%c🚀 Liquid Hub v' + CONFIG.APP_VERSION + ' — Ready',
      'background:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;'
    );
    console.log('%cTất cả 10 phần đã tải thành công.', 'color:#10b981;font-weight:600;');
    console.log('%cGõ "?" để xem phím tắt, "Ctrl+K" để tìm kiếm nhanh.', 'color:#64748b;font-size:11px;');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(finalBoot, 100));
  } else {
    setTimeout(finalBoot, 100);
  }
})();
</script>
</body>
</html>
