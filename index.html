<script>
/* ============================================================
   PART 7 (Part 1/2) — ADMIN: shell, dashboard, users, wallet, deposits
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, el, store, CONFIG,
    formatCurrency, formatDate, formatDateTime, timeAgo,
    escapeHtml, Toast, Modal, debounce
  } = window.LH;

  if (!supabase) { console.error('[Admin] Supabase required'); return; }

  /* ==========================================================
     7.1 ADMIN GUARD
     ========================================================== */
  async function checkAdmin() {
    if (!State.user) return false;
    if (State.isAdmin) return true;
    // Re-check
    try {
      const { data } = await supabase
        .from('user_roles')
        .select('role')
        .eq('user_id', State.user.id)
        .maybeSingle();
      if (data && (data.role === 'admin' || data.role === 'super_admin')) {
        State.isAdmin = true;
        return true;
      }
    } catch {}
    return false;
  }

  /* ==========================================================
     7.2 ADMIN MODULE
     ========================================================== */
  const Admin = {
    currentTab: 'dashboard',
    container: null,

    async render(container) {
      this.container = container;
      container.innerHTML = `<div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div>Đang kiểm tra quyền truy cập…</div>`;

      const ok = await checkAdmin();
      if (!ok) {
        container.innerHTML = `
          <div class="admin-denied anim-up">
            <div class="admin-denied-icon"><i data-lucide="shield-x"></i></div>
            <div class="admin-denied-title">Không có quyền truy cập</div>
            <div class="admin-denied-desc">Bạn cần đăng nhập bằng tài khoản quản trị viên để vào khu vực này.</div>
            <button class="btn btn-primary" id="adminGoHome"><i data-lucide="home"></i>Về trang chủ</button>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons({ nodes: [container] });
        container.querySelector('#adminGoHome').addEventListener('click', () => location.hash = '#/');
        return;
      }

      container.innerHTML = `
        <div class="admin-shell">
          <aside class="admin-sidebar" id="adminSidebar"></aside>
          <div class="admin-main">
            <div class="admin-mobile-tabs" id="adminMobileTabs"></div>
            <div id="adminPanelWrap"></div>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });

      this._renderNav();
      // Route from hash
      const hash = location.hash || '';
      const match = hash.match(/admin\/([a-z_-]+)/i);
      const initial = match ? match[1] : 'dashboard';
      this.navigate(initial);
    },

    _renderNav() {
      const tabs = [
        { group: 'Tổng quan', items: [
          { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' }
        ]},
        { group: 'Bán hàng', items: [
          { id: 'products', label: 'Sản phẩm', icon: 'package' },
          { id: 'services', label: 'Dịch vụ', icon: 'briefcase' },
          { id: 'categories', label: 'Danh mục', icon: 'tags' },
          { id: 'orders', label: 'Đơn hàng', icon: 'shopping-bag' }
        ]},
        { group: 'Người dùng', items: [
          { id: 'users', label: 'Người dùng', icon: 'users' },
          { id: 'wallets', label: 'Ví & nạp tiền', icon: 'wallet', badge: 'deposits' }
        ]},
        { group: 'Nội dung', items: [
          { id: 'profile', label: 'Profile Bio', icon: 'user' },
          { id: 'website', label: 'Website', icon: 'palette' },
          { id: 'payment', label: 'Thanh toán', icon: 'credit-card' },
          { id: 'posts', label: 'Bài viết', icon: 'newspaper' }
        ]},
        { group: 'Hệ thống', items: [
          { id: 'audit', label: 'Audit Logs', icon: 'list-checks' },
          { id: 'settings', label: 'Cài đặt', icon: 'settings' }
        ]}
      ];

      const sidebar = document.getElementById('adminSidebar');
      if (sidebar) {
        sidebar.innerHTML = tabs.map(g => `
          <div class="admin-sidebar-title">${g.group}</div>
          ${g.items.map(it => `
            <div class="admin-nav-item" data-tab="${it.id}">
              <i data-lucide="${it.icon}"></i>
              <span>${it.label}</span>
              ${it.badge ? `<span class="badge-count" data-badge="${it.badge}">0</span>` : ''}
            </div>
          `).join('')}
        `).join('');
      }

      const mobile = document.getElementById('adminMobileTabs');
      if (mobile) {
        const allItems = tabs.flatMap(g => g.items);
        mobile.innerHTML = allItems.map(it => `
          <button class="admin-mobile-tab" data-tab="${it.id}">
            <i data-lucide="${it.icon}"></i>
            <span>${it.label}</span>
          </button>
        `).join('');
      }

      // bind
      document.querySelectorAll('[data-tab]').forEach(n => {
        n.addEventListener('click', () => this.navigate(n.dataset.tab));
      });

      // load badge counts
      this._loadBadges();
    },

    async _loadBadges() {
      try {
        const { count } = await supabase
          .from('deposit_requests')
          .select('id', { count: 'exact', head: true })
          .eq('status', 'pending');
        document.querySelectorAll('[data-badge="deposits"]').forEach(el => {
          el.textContent = String(count || 0);
          el.style.display = (count || 0) > 0 ? 'inline-block' : 'none';
        });
      } catch {}
    },

    navigate(tab) {
      this.currentTab = tab;
      document.querySelectorAll('[data-tab]').forEach(n => {
        n.classList.toggle('active', n.dataset.tab === tab);
      });
      const wrap = document.getElementById('adminPanelWrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div>Đang tải…</div>`;

      // Update URL hash without triggering route re-render
      const newHash = '#/admin/' + tab;
      if (location.hash !== newHash) {
        history.replaceState(null, '', newHash);
      }

      const renderers = {
        dashboard: () => this._renderDashboard(wrap),
        products: () => this._renderProducts(wrap),
        services: () => this._renderServices(wrap),
        categories: () => this._renderCategories(wrap),
        orders: () => this._renderOrders(wrap),
        users: () => this._renderUsers(wrap),
        wallets: () => this._renderWallets(wrap),
        profile: () => this._renderProfile(wrap),
        website: () => this._renderWebsite(wrap),
        payment: () => this._renderPayment(wrap),
        posts: () => this._renderPosts(wrap),
        audit: () => this._renderAudit(wrap),
        settings: () => this._renderSettings(wrap)
      };
      const fn = renderers[tab] || renderers.dashboard;
      fn().catch(err => {
        console.error('[Admin.navigate]', tab, err);
        wrap.innerHTML = `<div class="empty-state">
          <div class="empty-state-icon"><i data-lucide="alert-circle"></i></div>
          <div class="empty-state-title">Lỗi tải trang</div>
          <div class="empty-state-desc">${escapeHtml(err.message || 'unknown')}</div>
        </div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [wrap] });
      });
    },

    /* ==========================================================
       7.3 DASHBOARD
       ========================================================== */
    async _renderDashboard(wrap) {
      wrap.innerHTML = `
        <div class="section-head">
          <div class="section-title-wrap">
            <div class="section-eyebrow">Quản trị</div>
            <div class="section-title">Dashboard tổng quan</div>
            <div class="section-sub">Số liệu kinh doanh theo thời gian thực</div>
          </div>
        </div>
        <div class="admin-stats-grid" id="dashStats">
          ${this._skeletonStat()}${this._skeletonStat()}${this._skeletonStat()}${this._skeletonStat()}
        </div>
        <div class="admin-table-wrap" style="margin-top:var(--sp-5);">
          <div class="admin-table-toolbar">
            <div class="h4" style="flex:1;">Đơn hàng gần đây</div>
            <button class="btn btn-glass btn-sm" onclick="window.LH.Admin.navigate('orders')">Xem tất cả <i data-lucide="arrow-right"></i></button>
          </div>
          <div id="dashOrders"><div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div></div>
        </div>
        <div class="admin-table-wrap" style="margin-top:var(--sp-4);">
          <div class="admin-table-toolbar">
            <div class="h4" style="flex:1;">Yêu cầu nạp tiền chờ duyệt</div>
            <button class="btn btn-glass btn-sm" onclick="window.LH.Admin.navigate('wallets')">Duyệt ngay <i data-lucide="arrow-right"></i></button>
          </div>
          <div id="dashDeposits"><div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div></div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [wrap] });

      // Fetch stats
      const [usersCount, ordersCount, productsCount, pendingCount, totalRevenueRes, recentOrders, pendingDeposits] = await Promise.all([
        supabase.from('profiles').select('id', { count: 'exact', head: true }),
        supabase.from('orders').select('id', { count: 'exact', head: true }),
        supabase.from('products').select('id', { count: 'exact', head: true }),
        supabase.from('deposit_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
        supabase.from('orders').select('total_amount').eq('status', 'completed'),
        supabase.from('orders').select('*').order('created_at', { ascending: false }).limit(5),
        supabase.from('deposit_requests').select('*').eq('status', 'pending').order('created_at', { ascending: false }).limit(5)
      ]);

      const totalRevenue = (totalRevenueRes.data || []).reduce((s, o) => s + (Number(o.total_amount) || 0), 0);

      const stats = [
        { label: 'Tổng người dùng', value: usersCount.count || 0, icon: 'users', cls: '' },
        { label: 'Tổng đơn hàng', value: ordersCount.count || 0, icon: 'shopping-bag', cls: 'green' },
        { label: 'Tổng sản phẩm', value: productsCount.count || 0, icon: 'package', cls: '' },

    /* ==========================================================
       7.4 USERS
       ========================================================== */
    async _renderUsers(wrap) {
      wrap.innerHTML = `
        <div class="section-head">
          <div class="section-title-wrap">
            <div class="section-eyebrow">Quản lý</div>
            <div class="section-title">Người dùng</div>
            <div class="section-sub">Xem, chỉnh sửa, khoá/mở khoá và quản lý số dư</div>
          </div>
        </div>
        <div class="admin-table-wrap">
          <div class="admin-table-toolbar">
            <input type="search" class="input" id="adminUserSearch" placeholder="Tìm theo username, email hoặc ID…" style="flex:1;max-width:380px;">
            <button class="btn btn-glass btn-sm" id="adminUserRefresh"><i data-lucide="refresh-cw"></i>Làm mới</button>
          </div>
          <div id="adminUsersTable" class="admin-table-scroll">
            <div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>
          </div>
          <div class="admin-table-pagination" id="adminUsersPagination"></div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [wrap] });

      const state = { search: '', page: 0, limit: 20 };
      const tableWrap = document.getElementById('adminUsersTable');
      const pagWrap = document.getElementById('adminUsersPagination');

      const load = async () => {
        tableWrap.innerHTML = `<div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
        let q = supabase.from('profiles').select('*', { count: 'exact' }).order('created_at', { ascending: false });
        if (state.search) {
          q = q.or(`username.ilike.%${state.search}%,display_name.ilike.%${state.search}%,id.ilike.%${state.search}%`);
        }
        const from = state.page * state.limit;
        q = q.range(from, from + state.limit - 1);
        const { data, error, count } = await q;
        if (error) {
          tableWrap.innerHTML = `<div class="admin-table-empty">Lỗi: ${escapeHtml(error.message)}</div>`;
          return;
        }
        const items = data || [];
        if (!items.length) {
          tableWrap.innerHTML = `<div class="admin-table-empty">Không có người dùng</div>`;
          pagWrap.innerHTML = '';
          return;
        }
        tableWrap.innerHTML = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>Người dùng</th>
                <th>Username</th>
                <th>Trạng thái</th>
                <th>Ngày đăng ký</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(u => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px;">
                      <div style="width:32px;height:32px;border-radius:50%;background:var(--brand-grad);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;overflow:hidden;">
                        ${u.avatar_url ? `<img src="${escapeHtml(u.avatar_url)}" style="width:100%;height:100%;object-fit:cover;">` : escapeHtml((u.display_name || u.username || 'U').slice(0,2).toUpperCase())}
                      </div>
                      <div>
                        <div style="font-weight:600;color:var(--text-1);font-size:13px;">${escapeHtml(u.display_name || u.username || 'User')}</div>
                        <div style="font-size:10.5px;color:var(--text-4);font-family:'JetBrains Mono',monospace;">${escapeHtml(u.id.slice(0, 12))}…</div>
                      </div>
                    </div>
                  </td>
                  <td>@${escapeHtml(u.username || '—')}</td>
                  <td>${u.is_banned ? `<span class="badge badge-danger">Bị khoá</span>` : `<span class="badge badge-success">Hoạt động</span>`}</td>
                  <td>${u.created_at ? formatDate(u.created_at) : '—'}</td>
                  <td>
                    <div class="cell-actions">
                      <button class="btn-mini" title="Xem chi tiết" data-action="view" data-id="${escapeHtml(u.id)}"><i data-lucide="eye"></i></button>
                      <button class="btn-mini" title="Điều chỉnh số dư" data-action="wallet" data-id="${escapeHtml(u.id)}"><i data-lucide="wallet"></i></button>
                      <button class="btn-mini ${u.is_banned ? '' : 'danger'}" title="${u.is_banned ? 'Mở khoá' : 'Khoá tài khoản'}" data-action="toggle-ban" data-id="${escapeHtml(u.id)}" data-banned="${u.is_banned ? '1' : '0'}"><i data-lucide="${u.is_banned ? 'lock-open' : 'lock'}"></i></button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        // Bind actions
        tableWrap.querySelectorAll('[data-action="view"]').forEach(b => b.addEventListener('click', () => viewUserDetail(b.dataset.id)));
        tableWrap.querySelectorAll('[data-action="wallet"]').forEach(b => b.addEventListener('click', () => openWalletAdjustModal(b.dataset.id)));
        tableWrap.querySelectorAll('[data-action="toggle-ban"]').forEach(b => b.addEventListener('click', () => toggleBan(b.dataset.id, b.dataset.banned === '1')));

        // pagination
        const totalPages = Math.ceil((count || 0) / state.limit);
        pagWrap.innerHTML = '';
        if (totalPages > 1) {
          for (let i = 0; i < totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = 'page-btn' + (i === state.page ? ' active' : '');
            btn.textContent = i + 1;
            btn.addEventListener('click', () => { state.page = i; load(); });
            pagWrap.appendChild(btn);
          }
        }
      };

      const viewUserDetail = async (id) => {
        const { data: u } = await supabase.from('profiles').select('*').eq('id', id).maybeSingle();
        const { data: w } = await supabase.from('wallets').select('*').eq('user_id', id).maybeSingle();
        const { data: orders } = await supabase.from('orders').select('id', { count: 'exact', head: true }).eq('user_id', id);
        const body = document.createElement('div');
        body.innerHTML = `
          <div class="checkout-summary">
            <div class="checkout-row"><span>ID</span><span class="mono" style="font-size:11px;">${escapeHtml(id)}</span></div>
            <div class="checkout-row"><span>Username</span><span>@${escapeHtml(u?.username || '—')}</span></div>
            <div class="checkout-row"><span>Tên hiển thị</span><span>${escapeHtml(u?.display_name || '—')}</span></div>
            <div class="checkout-row"><span>Số dư ví</span><span style="font-weight:700;color:var(--success);">${formatCurrency(w?.balance || 0)}</span></div>
            <div class="checkout-row"><span>Ngày đăng ký</span><span>${u?.created_at ? formatDateTime(u.created_at) : '—'}</span></div>
            <div class="checkout-row"><span>Trạng thái</span><span>${u?.is_banned ? '<span class="badge badge-danger">Bị khoá</span>' : '<span class="badge badge-success">Hoạt động</span>'}</span></div>
          </div>
        `;
        Modal.open({
          title: 'Chi tiết người dùng',
          content: body,
          actions: [
            { label: 'Đóng', className: 'btn-glass', onClick: (close) => close() },
            { label: 'Điều chỉnh số dư', className: 'btn-primary', onClick: (close) => { close(); openWalletAdjustModal(id); } }
          ]
        });
      };

      const toggleBan = async (id, isBanned) => {
        const ok = await Modal.confirm(
          isBanned ? 'Mở khoá tài khoản này?' : 'Khoá tài khoản này? Người dùng sẽ không đăng nhập được.',
          { okText: isBanned ? 'Mở khoá' : 'Khoá', danger: !isBanned }
        );
        if (!ok) return;
        try {
          const { error } = await supabase.from('profiles').update({
            is_banned: !isBanned,
            updated_at: new Date().toISOString()
          }).eq('id', id);
          if (error) throw error;
          await logAudit('user.ban_toggle', 'user', id, { banned: !isBanned });
          Toast.success(isBanned ? 'Đã mở khoá' : 'Đã khoá tài khoản');
          load();
        } catch (e) {
          Toast.error('Lỗi: ' + (e.message || ''));
        }
      };

      const openWalletAdjustModal = async (id) => {
        const { data: w } = await supabase.from('wallets').select('*').eq('user_id', id).maybeSingle();
        const balance = Number(w?.balance) || 0;
        const body = document.createElement('div');
        body.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="checkout-summary">
              <div class="checkout-row"><span>Số dư hiện tại</span><span style="font-weight:800;color:var(--success);">${formatCurrency(balance)}</span></div>
            </div>
            <div class="field">
              <label class="field-label">Loại điều chỉnh</label>
              <select class="select" id="adjType">
                <option value="credit">Cộng tiền (+)</option>
                <option value="debit">Trừ tiền (-)</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label">Số tiền (VND)</label>
              <input type="number" class="input" id="adjAmount" placeholder="0" min="1" step="1000">
            </div>
            <div class="field">
              <label class="field-label">Lý do (bắt buộc)</label>
              <textarea class="textarea" id="adjReason" placeholder="VD: Hoàn tiền đơn ORD..., Thưởng sự kiện..." style="min-height:70px;"></textarea>
            </div>
          </div>
        `;
        Modal.open({
          title: 'Điều chỉnh số dư',
          content: body,
          actions: [
            { label: 'Huỷ', className: 'btn-glass', onClick: (c) => c() },
            { label: 'Xác nhận', className: 'btn-primary', onClick: async (close) => {
              const type = body.querySelector('#adjType').value;
              const amt = parseFloat(body.querySelector('#adjAmount').value);
              const reason = body.querySelector('#adjReason').value.trim();
              if (!amt || amt <= 0) { Toast.error('Nhập số tiền hợp lệ'); return; }
              if (!reason) { Toast.error('Vui lòng nhập lý do'); return; }
              const delta = type === 'credit' ? amt : -amt;
              try {
                await window.LH.Wallet.adjust(id, delta, { type: 'admin_adjust', reason, refId: State.user.id });
                await logAudit('wallet.adjust', 'user', id, { delta, reason });
                Toast.success('Đã cập nhật số dư');
                close();
                load();
              } catch (e) {
                Toast.error('Lỗi: ' + (e.message || ''));
              }
            }}
          ]
        });
      };

      const searchInput = document.getElementById('adminUserSearch');
      searchInput.addEventListener('input', debounce((e) => {
        state.search = e.target.value.trim();
        state.page = 0;
        load();
      }, 320));

      document.getElementById('adminUserRefresh').addEventListener('click', () => load());

      load();
    },

    /* ==========================================================
       7.5 WALLETS & DEPOSIT APPROVAL
       ========================================================== */
    async _renderWallets(wrap) {
      wrap.innerHTML = `
        <div class="section-head">
          <div class="section-title-wrap">
            <div class="section-eyebrow">Tài chính</div>
            <div class="section-title">Yêu cầu nạp tiền</div>
            <div class="section-sub">Duyệt / từ chối yêu cầu và cộng tiền thủ công</div>
          </div>
        </div>
        <div class="admin-table-wrap">
          <div class="admin-table-toolbar">
            <select class="select" id="depositStatusFilter" style="min-height:38px;max-width:180px;">
              <option value="pending">Chờ duyệt</option>
              <option value="approved">Đã duyệt</option>
              <option value="rejected">Đã từ chối</option>
              <option value="">Tất cả</option>
            </select>
            <button class="btn btn-glass btn-sm" id="depositRefresh"><i data-lucide="refresh-cw"></i>Làm mới</button>
          </div>
          <div id="depositsTable" class="admin-table-scroll">
            <div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [wrap] });

      const filter = document.getElementById('depositStatusFilter');
      const tableEl = document.getElementById('depositsTable');

      const load = async () => {
        tableEl.innerHTML = `<div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
        let q = supabase.from('deposit_requests').select('*').order('created_at', { ascending: false }).limit(50);
        if (filter.value) q = q.eq('status', filter.value);
        const { data, error } = await q;
        if (error) {
          tableEl.innerHTML = `<div class="admin-table-empty">Lỗi: ${escapeHtml(error.message)}</div>`;
          return;
        }
        const items = data || [];
        if (!items.length) {
          tableEl.innerHTML = `<div class="admin-table-empty">Không có yêu cầu</div>`;
          return;
        }
        tableEl.innerHTML = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>Mã</th>
                <th>User</th>
                <th>Phương thức</th>
                <th>Số tiền</th>
                <th>Trạng thái</th>
                <th>Ngày</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${items.map(r => `
                <tr>
                  <td><strong>${escapeHtml(r.code || '')}</strong></td>
                  <td class="mono" style="font-size:11px;">${escapeHtml((r.user_id || '').slice(0, 10))}…</td>
                  <td>${r.method === 'bitcoin' ? '<span class="badge badge-warning">Bitcoin</span>' : '<span class="badge badge-info">Bank</span>'}</td>
                  <td style="font-weight:700;">${formatCurrency(r.amount || 0)}</td>
                  <td><span class="order-status ${r.status === 'approved' ? 'completed' : r.status === 'rejected' ? 'cancelled' : 'pending'}">${escapeHtml(r.status || 'pending')}</span></td>
                  <td>${formatDateTime(r.created_at)}</td>
                  <td>
                    <div class="cell-actions">
                      <button class="btn-mini" title="Xem chi tiết" data-action="view" data-id="${escapeHtml(r.id)}"><i data-lucide="eye"></i></button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        if (window.lucide) window.lucide.createIcons({ nodes: [tableEl] });

        tableEl.querySelectorAll('[data-action="view"]').forEach(b => {
          b.addEventListener('click', () => viewDeposit(b.dataset.id));
        });
      };

      const viewDeposit = async (id) => {
        const { data: r } = await supabase.from('deposit_requests').select('*').eq('id', id).maybeSingle();
        if (!r) { Toast.error('Không tìm thấy'); return; }

        const body = document.createElement('div');
        body.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="checkout-summary">
              <div class="checkout-row"><span>Mã</span><span class="mono" style="font-weight:700;">${escapeHtml(r.code || '')}</span></div>
              <div class="checkout-row"><span>User ID</span><span class="mono" style="font-size:11px;">${escapeHtml(r.user_id)}</span></div>
              <div class="checkout-row"><span>Phương thức</span><span>${escapeHtml(r.method || 'bank')}</span></div>
              <div class="checkout-row"><span>Số tiền</span><span style="font-weight:800;color:var(--danger);">${formatCurrency(r.amount || 0)}</span></div>
              <div class="checkout-row"><span>Mã GD/TXID</span><span class="mono" style="font-size:11px;">${escapeHtml(r.tx_code || '—')}</span></div>
              <div class="checkout-row"><span>Ngày</span><span>${formatDateTime(r.created_at)}</span></div>
              <div class="checkout-row"><span>Trạng thái</span><span class="order-status ${r.status === 'approved' ? 'completed' : r.status === 'rejected' ? 'cancelled' : 'pending'}">${escapeHtml(r.status)}</span></div>
            </div>
            ${r.receipt_url ? `
              <div>
                <div class="caption" style="margin-bottom:6px;">Ảnh chứng minh:</div>
                <div style="border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-1);">
                  <img src="${escapeHtml(r.receipt_url)}" alt="receipt" style="width:100%;display:block;max-height:340px;object-fit:contain;background:var(--surface-3);">
                </div>
              </div>
            ` : ''}
            ${r.status === 'pending' ? `
              <div class="field">
                <label class="field-label">Ghi chú admin (nếu từ chối)</label>
                <textarea class="textarea" id="adminNote" placeholder="Lý do từ chối…" style="min-height:70px;"></textarea>
              </div>
            ` : r.admin_note ? `<div class="caption">Ghi chú admin: ${escapeHtml(r.admin_note)}</div>` : ''}
          </div>
        `;

        const actions = [{ label: 'Đóng', className: 'btn-glass', onClick: (c) => c() }];
        if (r.status === 'pending') {
          actions.push({
            label: 'Từ chối',
            className: 'btn-danger',
            onClick: async (close) => {
              const note = body.querySelector('#adminNote').value.trim() || 'Không có lý do';
              await updateDepositStatus(r, 'rejected', note);
              close();
              load();
            }
          });
          actions.push({
            label: 'Duyệt & Cộng tiền',
            className: 'btn-success',
            onClick: async (close) => {
              const ok = await Modal.confirm(`Duyệt nạp ${formatCurrency(r.amount)} cho user này?`, { okText: 'Duyệt', danger: false });
              if (!ok) return;
              await approveDeposit(r);
              close();
              load();
            }
          });
        }

        Modal.open({ title: 'Chi tiết yêu cầu nạp', content: body, size: 'md', actions });
      };

      const updateDepositStatus = async (r, status, note) => {
        try {
          await supabase.from('deposit_requests').update({
            status,
            admin_note: note,
            updated_at: new Date().toISOString(),
            processed_by: State.user.id,
            processed_at: new Date().toISOString()
          }).eq('id', r.id);
          await logAudit('deposit.reject', 'deposit', r.id, { amount: r.amount, note });
          Toast.success('Đã từ chối yêu cầu');
        } catch (e) { Toast.error('Lỗi: ' + (e.message || '')); }
      };

      const approveDeposit = async (r) => {
        try {
          // 1) Try RPC atomic
          try {
            const { error: rpcErr } = await supabase.rpc('approve_deposit', { p_deposit_id: r.id });
            if (!rpcErr) {
              await logAudit('deposit.approve', 'deposit', r.id, { amount: r.amount });
              Toast.success('Đã duyệt và cộng tiền');
              return;
            }
            console.warn('[approveDeposit RPC]', rpcErr.message);
          } catch {}

          // 2) Fallback: mark + credit
          await supabase.from('deposit_requests').update({
            status: 'approved',
            updated_at: new Date().toISOString(),
            processed_by: State.user.id,
            processed_at: new Date().toISOString()
          }).eq('id', r.id);

          await window.LH.Wallet.adjust(r.user_id, Number(r.amount), {
            type: 'deposit',
            reason: `Duyệt nạp ${r.code || r.id}`,
            refId: r.id
          });
          await logAudit('deposit.approve', 'deposit', r.id, { amount: r.amount });
          Toast.success('Đã duyệt và cộng tiền');
        } catch (e) { Toast.error('Lỗi: ' + (e.message || '')); }
      };

      filter.addEventListener('change', load);
      document.getElementById('depositRefresh').addEventListener('click', load);
      load();
    }
  };

  /* ==========================================================

(function () {
  'use strict';
  const {
    State, supabase, $, $$, el, store, CONFIG,
    formatCurrency, formatDate, formatDateTime,
    escapeHtml, Toast, Modal, compressImage, uuidv4, debounce, slugify

  if (!window.LH.Admin) { console.error('[Admin Part2] Admin not initialized'); return; }
  const Admin = window.LH.Admin;

  /* ==========================================================
     7A. IMAGE UPLOADER (max 30 ảnh, drag/drop, set primary, reorder)
     ========================================================== */
  const ImageUploader = {
    /**
     * @param {Object} opts
     * @param {string} opts.bucket - Supabase bucket
     * @param {string} opts.prefix - path prefix (e.g. productId)
     * @param {Array<string>} opts.initial - URLs ban đầu
     * @param {number} opts.max - default 30
     * @param {Function} opts.onChange - callback(urls[])
     */
    mount(container, opts) {
      const { bucket, prefix, initial = [], max = 30, onChange = null } = opts;
      let items = initial.map(url => ({ url, isPrimary: false }));
      if (items.length) items[0].isPrimary = true;
      let uploading = 0;

      container.innerHTML = `
        <div class="img-uploader" id="uploaderGrid"></div>
        <input type="file" id="uploaderInput" accept="image/*" multiple hidden>
        <div class="caption" style="margin-top:8px;font-size:11px;">
          Tối đa ${max} ảnh · Nhấn ⭐ để chọn ảnh đại diện · Kéo để sắp xếp
        </div>
      `;
      const grid = container.querySelector('#uploaderGrid');
      const input = container.querySelector('#uploaderInput');

      const render = () => {
        grid.innerHTML = '';
        items.forEach((item, i) => {
          const t = document.createElement('div');
          t.className = 'img-thumb' + (item.isPrimary ? ' primary' : '');
          t.draggable = true;
          t.dataset.idx = i;
          t.innerHTML = `
            <img src="${escapeHtml(item.url)}" alt="" loading="lazy">
            ${item.isPrimary ? `<div class="img-thumb-badge">ẢNH CHÍNH</div>` : ''}
            <button type="button" class="img-thumb-remove" title="Xoá"><i data-lucide="x"></i></button>
            ${!item.isPrimary ? `<button type="button" class="img-thumb-primary" title="Đặt làm ảnh chính"><i data-lucide="star"></i></button>` : ''}
          `;
          t.querySelector('.img-thumb-remove').addEventListener('click', () => {
            items.splice(i, 1);
            if (items.length && !items.some(x => x.isPrimary)) items[0].isPrimary = true;
            render();
            emit();
          });
          t.querySelector('.img-thumb-primary')?.addEventListener('click', () => {
            items.forEach(x => x.isPrimary = false);
            items[i].isPrimary = true;
            render();
            emit();
          });
          // Drag
          t.addEventListener('dragstart', (e) => { e.dataTransfer.effectAllowed = 'move'; t.classList.add('dragging'); });
          t.addEventListener('dragend', () => t.classList.remove('dragging'));
          t.addEventListener('dragover', (e) => e.preventDefault());
          t.addEventListener('drop', (e) => {
            e.preventDefault();
            const from = parseInt(document.querySelector('.img-thumb.dragging')?.dataset.idx, 10);
            if (isNaN(from) || from === i) return;
            const [moved] = items.splice(from, 1);
            items.splice(i, 0, moved);
            render();
            emit();
          });
          grid.appendChild(t);
        });

        if (items.length < max) {
          const add = document.createElement('button');
          add.type = 'button';
          add.className = 'img-add';
          add.innerHTML = uploading > 0
            ? `<div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div><span>Đang tải ${uploading}…</span>`
            : `<i data-lucide="image-plus"></i><span>Thêm ảnh</span>`;
          add.addEventListener('click', () => input.click());
          grid.appendChild(add);
        }
        if (window.lucide) window.lucide.createIcons({ nodes: [grid] });
      };

      const emit = () => {
        if (onChange) onChange(items.map(x => x.url));
      };

      const handleFiles = async (files) => {
        const list = Array.from(files).slice(0, max - items.length - uploading);
        if (!list.length) return;
        uploading += list.length;
        render();
        for (const file of list) {
          try {
            if (!file.type.startsWith('image/')) throw new Error('Chỉ hỗ trợ ảnh');
            if (file.size > 8 * 1024 * 1024) throw new Error('Ảnh tối đa 8MB');
            const blob = await compressImage(file, 1600, 0.82);
            const ext = (blob.name || 'img.jpg').split('.').pop();
            const path = `${prefix}/${uuidv4().slice(0, 8)}_${Date.now()}.${ext}`;
            const { error } = await supabase.storage.from(bucket).upload(path, blob, {
              cacheControl: '3600', upsert: false, contentType: blob.type || 'image/jpeg'
            });
            if (error) throw new Error(error.message);
            const { data: pub } = supabase.storage.from(bucket).getPublicUrl(path);
            items.push({ url: pub.publicUrl, path, isPrimary: items.length === 0 });
            render();
            emit();
          } catch (e) {
            console.error('[upload]', e);
            Toast.error('Upload lỗi: ' + (e.message || ''));
          } finally {
            uploading--;
            render();
          }
        }
      };

      input.addEventListener('change', (e) => { handleFiles(e.target.files); input.value = ''; });
      container.addEventListener('dragover', (e) => e.preventDefault());
      container.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files);
      });

      render();
      return {
        getUrls: () => items.map(x => x.url),
        getPrimary: () => (items.find(x => x.isPrimary) || items[0])?.url || null,
        setUrls: (urls) => { items = urls.map((url, i) => ({ url, isPrimary: i === 0 })); render(); emit(); }
      };
    }
  };

        <button class="btn btn-primary" style="margin-top:16px;" id="saveBtcBtn"><i data-lucide="save"></i>Lưu Bitcoin</button>

  Admin._renderPosts = async function (wrap) {
    wrap.innerHTML = `
      <div class="section-head">
        <div class="section-title-wrap">
          <div class="section-eyebrow">Nội dung</div>
          <div class="section-title">Bài viết</div>
          <div class="section-sub">Tạo, sửa, xuất bản bài viết blog</div>
        </div>
        <button class="btn btn-primary btn-sm" id="addPostBtn"><i data-lucide="plus"></i>Thêm bài viết</button>
      </div>
      <div class="admin-table-wrap">
        <div id="postsTable" class="admin-table-scroll">
          <div class="admin-loading"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [wrap] });

    const tableEl = document.getElementById('postsTable');

    const load = async () => {
      const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false }).limit(50);
      if (error) { tableEl.innerHTML = `<div class="admin-table-empty">Lỗi: ${escapeHtml(error.message)}</div>`; return; }
      const items = data || [];
      if (!items.length) { tableEl.innerHTML = `<div class="admin-table-empty">Chưa có bài viết</div>`; return; }
      tableEl.innerHTML = `<table class="admin-table">
        <thead><tr><th>Tiêu đề</th><th>Danh mục</th><th>Trạng thái</th><th>Ngày</th><th>Thao tác</th></tr></thead>
        <tbody>
          ${items.map(p => `<tr>
            <td><strong>${escapeHtml(p.title || '')}</strong></td>
            <td>${escapeHtml(p.category || '—')}</td>
            <td>${p.is_published ? '<span class="badge badge-success">Đã đăng</span>' : '<span class="badge badge-warning">Nháp</span>'}</td>
            <td>${formatDate(p.created_at)}</td>
            <td><div class="cell-actions">
              <button class="btn-mini" data-action="edit" data-id="${escapeHtml(p.id)}"><i data-lucide="edit-3"></i></button>
              <button class="btn-mini danger" data-action="delete" data-id="${escapeHtml(p.id)}"><i data-lucide="trash-2"></i></button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
      if (window.lucide) window.lucide.createIcons({ nodes: [tableEl] });
      tableEl.querySelectorAll('[data-action="edit"]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.id)));
      tableEl.querySelectorAll('[data-action="delete"]').forEach(b => b.addEventListener('click', () => del(b.dataset.id)));
    };

    const openEditor = async (id) => {
      let p = { title: '', excerpt: '', content: '', cover_url: '', category: '', is_published: false, is_featured: false };
      if (id) {
        const { data } = await supabase.from('posts').select('*').eq('id', id).maybeSingle();
        if (data) p = data;
      }
      const body = document.createElement('div');
      body.innerHTML = `
        <div class="admin-form-grid">
          <div class="field full"><label class="field-label">Tiêu đề *</label>
            <input type="text" class="input" id="postTitle" value="${escapeHtml(p.title || '')}"></div>
          <div class="field"><label class="field-label">Danh mục</label>
            <input type="text" class="input" id="postCategory" value="${escapeHtml(p.category || '')}"></div>
          <div class="field"><label class="field-label">Ảnh bìa URL</label>
            <input type="url" class="input" id="postCover" value="${escapeHtml(p.cover_url || '')}"></div>
          <div class="field full"><label class="field-label">Tóm tắt</label>
            <textarea class="textarea" id="postExcerpt" style="min-height:60px;">${escapeHtml(p.excerpt || '')}</textarea></div>
          <div class="field full"><label class="field-label">Nội dung</label>
            <textarea class="textarea" id="postContent" style="min-height:200px;">${escapeHtml(p.content || '')}</textarea></div>
          <div class="field full">
            <label class="checkbox"><input type="checkbox" id="postPublished" ${p.is_published ? 'checked' : ''}><span class="box"></span><span>Xuất bản</span></label>
            <label class="checkbox" style="margin-top:8px;"><input type="checkbox" id="postFeatured" ${p.is_featured ? 'checked' : ''}><span class="box"></span><span>Nổi bật</span></label>
          </div>
        </div>
      `;
      Modal.open({
        title: id ? 'Sửa bài viết' : 'Thêm bài viết',
        content: body,
        size: 'lg',
        actions: [
          { label: 'Huỷ', className: 'btn-glass', onClick: (c) => c() },
          { label: 'Lưu', className: 'btn-primary', onClick: async (close) => {
            const patch = {
              title: body.querySelector('#postTitle').value.trim(),
              category: body.querySelector('#postCategory').value.trim() || null,
              cover_url: body.querySelector('#postCover').value.trim() || null,
              excerpt: body.querySelector('#postExcerpt').value.trim() || null,
              content: body.querySelector('#postContent').value.trim() || null,
              is_published: body.querySelector('#postPublished').checked,
              is_featured: body.querySelector('#postFeatured').checked,
              updated_at: new Date().toISOString()
            };
            if (!patch.title) { Toast.error('Nhập tiêu đề'); return; }
            try {
              if (id) await supabase.from('posts').update(patch).eq('id', id);
              else {
                patch.slug = slugify(patch.title) + '-' + Date.now().toString(36).slice(-4);
                patch.created_at = new Date().toISOString();
                await supabase.from('posts').insert(patch);
              }
              await logAudit(id ? 'post.update' : 'post.create', 'post', id);
              Toast.success('Đã lưu');
              close();
              load();
            } catch (e) { Toast.error('Lỗi: ' + (e.message || '')); }
          }}
        ]
      });
    };

    const del = async (id) => {
      const ok = await Modal.confirm('Xoá bài viết?', { okText: 'Xoá', danger: true });
      if (!ok) return;
      try {
        await supabase.from('posts').delete().eq('id', id);
        await logAudit('post.delete', 'post', id);
        Toast.success('Đã xoá');
        load();
      } catch (e) { Toast.error('Lỗi: ' + (e.message || '')); }
    };

    document.getElementById('addPostBtn').addEventListener('click', () => openEditor(null));
    load();
  };

              <button class="btn btn-glass btn-sm" id="clearLocalCacheBtn" style="width:100%;margin-bottom:8px;"><i data-lucide="refresh-cw"></i>Xoá cache localStorage (giữ session)</button>
              <button class="btn btn-danger btn-sm" id="clearAllLocalBtn" style="width:100%;"><i data-lucide="trash-2"></i>Xoá toàn bộ localStorage (đăng xuất)</button>

          </div>
        </div>
      </div>
    `;

    document.getElementById('clearLocalCacheBtn').addEventListener('click', () => {
      const session = localStorage.getItem(CONFIG.SESSION_STORAGE_KEY);
      const theme = localStorage.getItem(CONFIG.THEME_KEY);
      localStorage.clear();
      if (session) localStorage.setItem(CONFIG.SESSION_STORAGE_KEY, session);
      if (theme) localStorage.setItem(CONFIG.THEME_KEY, theme);
      Toast.success('Đã xoá cache (giữ session & theme)');
    });

    document.getElementById('clearAllLocalBtn').addEventListener('click', async () => {
      const ok = await Modal.confirm('Xoá toàn bộ localStorage và đăng xuất?', { okText: 'Xoá & Đăng xuất', danger: true });
      if (!ok) return;
      localStorage.clear();
      await window.LH.Auth?.logout();
      location.hash = '#/';
    });

<script>
/* ============================================================
   PART 8/1 — BLOG · NOTIFICATIONS · MUSIC
   ============================================================ */
(function () {
  'use strict';
  const {
    State, supabase, $, $$, el, store, CONFIG,
    formatDate, formatDateTime, timeAgo,
    escapeHtml, Toast, Modal, debounce
  } = window.LH;

  /* ==========================================================
     8.1 BLOG — LIST VIEW
     ========================================================== */
  async function renderBlog(container) {
    container.innerHTML = `
      <div class="blog-hero anim-fade">
        <div class="section-head" style="margin-bottom:0;">
          <div class="section-title-wrap">
            <div class="section-eyebrow">Bài viết</div>
            <div class="section-title">Blog & Tin tức</div>
            <div class="section-sub">Kiến thức MMO, thủ thuật, đánh giá sản phẩm</div>
          </div>
        </div>
      </div>

      <div class="shop-toolbar" style="margin-bottom:var(--sp-5);">
        <div class="shop-search-wrap">
          <i data-lucide="search" class="search-icon"></i>
          <input type="search" class="input" id="blogSearch" placeholder="Tìm bài viết…" autocomplete="off">
        </div>
        <select class="select" id="blogCategoryFilter" style="min-height:46px;max-width:200px;">
          <option value="">Tất cả danh mục</option>
        </select>
      </div>

      <div id="blogContent">
        <div class="text-center" style="padding:40px;">
          <div class="spinner spinner-lg" style="border-color:var(--brand-1);border-right-color:transparent;"></div>
        </div>
      </div>
      <div id="blogPagination" class="pagination" style="margin-top:var(--sp-6);"></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const state = { search: '', category: '', page: 0, limit: 9 };
    const contentEl = container.querySelector('#blogContent');
    const pagEl = container.querySelector('#blogPagination');
    const catFilter = container.querySelector('#blogCategoryFilter');

    // Load categories dynamically
    const { data: catData } = await supabase
      .from('posts')
      .select('category')
      .not('category', 'is', null);
    const uniqCats = Array.from(new Set((catData || []).map(x => x.category).filter(Boolean)));
    uniqCats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      catFilter.appendChild(opt);
    });

    const load = async () => {
      contentEl.innerHTML = `<div class="text-center" style="padding:40px;"><div class="spinner spinner-lg" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;
      try {
        let q = supabase
          .from('posts')
          .select('*', { count: 'exact' })
          .eq('is_published', true);
        if (state.search) q = q.ilike('title', `%${state.search}%`);
        if (state.category) q = q.eq('category', state.category);
        q = q.order('is_featured', { ascending: false })
             .order('created_at', { ascending: false });
        const from = state.page * state.limit;
        q = q.range(from, from + state.limit - 1);

        const { data, error, count } = await q;
        if (error) throw error;

        const items = data || [];
        if (!items.length) {
          contentEl.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon"><i data-lucide="newspaper"></i></div>
            <div class="empty-state-title">Chưa có bài viết</div>
            <div class="empty-state-desc">Bài viết sẽ xuất hiện khi admin xuất bản.</div>
          </div>`;
          if (window.lucide) window.lucide.createIcons({ nodes: [contentEl] });
          pagEl.innerHTML = '';
          return;
        }

        // First item featured if on page 0 and no search/filter
        const showFeatured = state.page === 0 && !state.search && !state.category && items[0]?.is_featured;
        const featured = showFeatured ? items[0] : null;
        const rest = showFeatured ? items.slice(1) : items;

        let html = '';
        if (featured) {
          html += `
            <div class="blog-featured">
              <div class="blog-featured-card" data-post-id="${escapeHtml(featured.id)}">
                ${featured.cover_url ? `<img src="${escapeHtml(featured.cover_url)}" alt="">` : ''}
                <div class="blog-featured-content">
                  ${featured.category ? `<span class="blog-featured-cat"><i data-lucide="star"></i>${escapeHtml(featured.category)}</span>` : ''}
                  <div class="blog-featured-title">${escapeHtml(featured.title || '')}</div>
                  ${featured.excerpt ? `<div class="blog-featured-excerpt">${escapeHtml(featured.excerpt)}</div>` : ''}
                  <div class="blog-featured-meta">
                    <span><i data-lucide="calendar" style="width:12px;height:12px;display:inline;"></i> ${formatDate(featured.created_at)}</span>
                    <span>Nổi bật</span>
                  </div>
                </div>
              </div>
              <div class="col" style="gap:12px;">
                ${rest.slice(0, 2).map(p => blogCardHTML(p)).join('')}
              </div>
            </div>
          `;
          const remaining = rest.slice(2);
          if (remaining.length) {
            html += `<div class="blog-list-grid">${remaining.map(p => blogCardHTML(p)).join('')}</div>`;
          }
        } else {
          html = `<div class="blog-list-grid">${rest.map(p => blogCardHTML(p)).join('')}</div>`;
        }

        contentEl.innerHTML = html;
        if (window.lucide) window.lucide.createIcons({ nodes: [contentEl] });

        // bind clicks
        contentEl.querySelectorAll('[data-post-id]').forEach(card => {
          card.addEventListener('click', () => {
            location.hash = `#/post?id=${encodeURIComponent(card.dataset.postId)}`;
          });
        });

        // pagination
        const totalPages = Math.ceil((count || 0) / state.limit);
        pagEl.innerHTML = '';
        if (totalPages > 1) {
          for (let i = 0; i < totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = 'page-btn' + (i === state.page ? ' active' : '');
            btn.textContent = i + 1;
            btn.addEventListener('click', () => {
              state.page = i;
              load();
              window.scrollTo({ top: 0, behavior: State.reducedMotion ? 'auto' : 'smooth' });
            });
            pagEl.appendChild(btn);
          }
        }
      } catch (e) {
        contentEl.innerHTML = `<div class="empty-state">
          <div class="empty-state-icon"><i data-lucide="alert-circle"></i></div>
          <div class="empty-state-title">Lỗi tải bài viết</div>
          <div class="empty-state-desc">${escapeHtml(e.message || '')}</div>
        </div>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [contentEl] });
      }
    };

    function blogCardHTML(p) {
      return `
        <div class="blog-card" data-post-id="${escapeHtml(p.id)}">
          <div class="blog-card-img">
            ${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="" loading="lazy">` : ''}
          </div>
          <div class="blog-card-body">
            ${p.category ? `<div class="blog-card-cat">${escapeHtml(p.category)}</div>` : ''}
            <div class="blog-card-title">${escapeHtml(p.title || '')}</div>
            ${p.excerpt ? `<div class="blog-card-excerpt">${escapeHtml(p.excerpt)}</div>` : ''}
            <div class="blog-card-meta">
              <span><i data-lucide="calendar" style="width:11px;height:11px;display:inline;vertical-align:middle;"></i> ${formatDate(p.created_at)}</span>
            </div>
          </div>
        </div>
      `;
    }

    container.querySelector('#blogSearch').addEventListener('input', debounce((e) => {
      state.search = e.target.value.trim(); state.page = 0; load();
    }, 320));

    catFilter.addEventListener('change', () => {
      state.category = catFilter.value; state.page = 0; load();
    });

    load();
  }

  /* ==========================================================
     8.2 BLOG — POST DETAIL
     ========================================================== */
  async function renderPost(container, hash) {
    const qIndex = (hash || '').indexOf('?');
    const params = new URLSearchParams(qIndex >= 0 ? hash.slice(qIndex + 1) : '');
    const postId = params.get('id');

    if (!postId) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-title">Bài viết không tồn tại</div><a href="#/blog" class="btn btn-primary"><i data-lucide="arrow-left"></i>Về Blog</a></div>`;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });
      return;
    }

    container.innerHTML = `<div class="text-center" style="padding:40px;"><div class="spinner spinner-lg" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>`;

    const { data: post, error } = await supabase.from('posts').select('*').eq('id', postId).eq('is_published', true).maybeSingle();
    if (error || !post) {
      container.innerHTML = `<div class="empty-state">
        <div class="empty-state-icon"><i data-lucide="file-x"></i></div>
        <div class="empty-state-title">Không tìm thấy bài viết</div>
        <a href="#/blog" class="btn btn-primary"><i data-lucide="arrow-left"></i>Về Blog</a>
      </div>`;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });
      return;
    }

    document.title = (post.title || 'Bài viết') + ' — ' + (CONFIG.APP_NAME || 'Liquid Hub');

    container.innerHTML = `
      <div class="post-wrap anim-fade">
        <div class="post-breadcrumb">
          <a href="#/">Trang chủ</a>
          <i data-lucide="chevron-right"></i>
          <a href="#/blog">Blog</a>
          ${post.category ? `<i data-lucide="chevron-right"></i><span>${escapeHtml(post.category)}</span>` : ''}
        </div>

        <div class="post-header">
          <h1 class="post-title">${escapeHtml(post.title || '')}</h1>
          <div class="post-meta">
            ${post.category ? `<span class="badge badge-brand"><i data-lucide="tag" style="width:11px;height:11px;"></i>${escapeHtml(post.category)}</span>` : ''}
            <span><i data-lucide="calendar" style="width:13px;height:13px;display:inline;vertical-align:middle;"></i> ${formatDate(post.created_at)}</span>
            ${post.updated_at && post.updated_at !== post.created_at ? `<span>Cập nhật ${timeAgo(post.updated_at)}</span>` : ''}
          </div>
        </div>

        ${post.cover_url ? `<img src="${escapeHtml(post.cover_url)}" alt="" class="post-cover">` : ''}

        ${post.excerpt ? `<div style="font-size:16px;font-style:italic;color:var(--text-2);padding:14px 18px;background:var(--surface-3);border-left:3px solid var(--brand-1);border-radius:0 var(--r-md) var(--r-md) 0;margin-bottom:var(--sp-4);">${escapeHtml(post.excerpt)}</div>` : ''}

        <div class="post-content">${formatPostContent(post.content || '')}</div>

        <div class="post-share">
          <span style="font-size:12.5px;font-weight:600;color:var(--text-3);margin-right:6px;">Chia sẻ:</span>
          <button class="post-share-btn" data-share="facebook"><i data-lucide="facebook"></i>Facebook</button>
          <button class="post-share-btn" data-share="twitter"><i data-lucide="twitter"></i>Twitter</button>
          <button class="post-share-btn" data-share="telegram"><i data-lucide="send"></i>Telegram</button>
          <button class="post-share-btn" data-share="copy"><i data-lucide="link"></i>Sao chép</button>
        </div>

        <div style="margin-top:var(--sp-6);padding-top:var(--sp-5);border-top:1px solid var(--divider);">
          <div class="section-title" style="font-size:16px;margin-bottom:12px;">Bài viết khác</div>
          <div id="postRelated" class="blog-list-grid"></div>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // Share handlers
    const url = window.location.href;
    container.querySelectorAll('[data-share]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const kind = btn.dataset.share;
        const text = post.title || '';
        let shareUrl = '';
        if (kind === 'facebook') shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
        else if (kind === 'twitter') shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
        else if (kind === 'telegram') shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
        else if (kind === 'copy') {
          await window.LH.copyToClipboard(url, btn);
          return;
        }
        window.open(shareUrl, '_blank', 'noopener,noreferrer');
      });
    });

    // Related posts
    try {
      let relQ = supabase.from('posts').select('*').eq('is_published', true).neq('id', post.id).limit(3);
      if (post.category) relQ = relQ.eq('category', post.category);
      const { data: related } = await relQ;
      const relWrap = container.querySelector('#postRelated');
      if (related && related.length) {
        relWrap.innerHTML = related.map(p => `
          <div class="blog-card" data-post-id="${escapeHtml(p.id)}">
            <div class="blog-card-img">${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="">` : ''}</div>
            <div class="blog-card-body">
              <div class="blog-card-title">${escapeHtml(p.title || '')}</div>
              <div class="blog-card-meta">${formatDate(p.created_at)}</div>
            </div>
          </div>
        `).join('');
        if (window.lucide) window.lucide.createIcons({ nodes: [relWrap] });
        relWrap.querySelectorAll('[data-post-id]').forEach(card => {
          card.addEventListener('click', () => location.hash = `#/post?id=${encodeURIComponent(card.dataset.postId)}`);
        });
      } else {
        relWrap.parentElement.remove();
      }
    } catch {}
  }

  function formatPostContent(content) {
    // Escape and preserve line breaks, allow basic HTML tags (from admin)
    if (!content) return '';
    // Admin is trusted — allow raw HTML for rich content (admin panel is protected)
    return content;
  }

  /* ==========================================================
     8.3 NOTIFICATIONS REALTIME
     ========================================================== */
  const Notifications = {
    channel: null,
    loaded: false,

    async init() {
      if (!supabase) return;
      // Subscribe to user's notifications channel
      State.on('auth:login', () => this.reload());
      State.on('auth:logout', () => { State.notifications = []; this.render(); });

      if (State.user) this.reload();
    },

    async reload() {
      if (!State.user) {
        State.notifications = [];
        this.render();
        return;
      }
      try {
        const { data, error } = await supabase
          .from('notifications')
          .select('*')
          .eq('user_id', State.user.id)
          .order('created_at', { ascending: false })
          .limit(50);
        if (error) throw error;
        State.notifications = (data || []).map(n => ({
          ...n,
          read: n.is_read === true || n.read === true,
          time_label: timeAgo(n.created_at),
          message: n.message || n.body || ''
        }));
        this.render();
        this.subscribeRealtime();
      } catch (e) {
        console.warn('[Notifications.reload]', e.message);
      }
    },

    subscribeRealtime() {
      if (!State.user || this.channel) return;
      try {
        this.channel = supabase
          .channel('notifications:' + State.user.id)
          .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'notifications',
            filter: `user_id=eq.${State.user.id}`
          }, (payload) => {
            const n = payload.new;
            if (!n) return;
            State.notifications.unshift({
              ...n,
              read: false,
              time_label: 'vừa xong',
              message: n.message || n.body || ''
            });
            this.render();
            Toast.info(n.title || 'Bạn có thông báo mới');
            // play subtle sound? skip
          })
          .subscribe();
      } catch (e) {
        console.warn('[Notifications.subscribeRealtime]', e);
      }
    },

    unsubscribe() {
      if (this.channel) {
        try { supabase.removeChannel(this.channel); } catch {}
        this.channel = null;
      }
    },

    render() {
      if (window.LH.renderNotifications) window.LH.renderNotifications();
    },

    async markAllRead() {
      if (!State.user) return;
      try {
        await supabase
          .from('notifications')
          .update({ is_read: true })
          .eq('user_id', State.user.id)
          .eq('is_read', false);
        State.notifications.forEach(n => n.read = true);
        this.render();
        Toast.success('Đã đánh dấu đã đọc');
      } catch (e) {
        Toast.error('Lỗi: ' + (e.message || ''));
      }
    },

    async markRead(id) {
      if (!id || !State.user) return;
      try {
        await supabase.from('notifications').update({ is_read: true }).eq('id', id);
        const n = State.notifications.find(x => x.id === id);
        if (n) n.read = true;
        this.render();
      } catch {}
    }
  };
  window.LH.Notifications = Notifications;

  /* ==========================================================
     8.4 MUSIC — full player with playlist
     ========================================================== */
  const MusicPlayer = {
    playlist: [],
    index: 0,
    audio: null,
    playing: false,
    volume: 0.6,

    async init() {
      this.audio = new Audio();
      this.audio.volume = this.volume;
      this.audio.addEventListener('timeupdate', () => this.updateProgress());
      this.audio.addEventListener('ended', () => this.next());
      this.audio.addEventListener('error', (e) => {
        console.warn('[Music] error', e);
        if (this.playlist[this.index] && this.playlist[this.index].src) {
          Toast.warning('Không phát được bài này');
        }
      });
      await this.loadPlaylist();
      this.bindUI();
      this.restoreState();
    },

    async loadPlaylist() {
      // Load from website_settings key `music_playlist` — array of {title, artist, src}
      try {
        const { data } = await supabase
          .from('website_settings')
          .select('value')
          .eq('key', 'music_playlist')
          .maybeSingle();
        if (data && Array.isArray(data.value) && data.value.length) {
          this.playlist = data.value;
        }
      } catch {}
      // Fallback defaults (no src — informational)
      if (!this.playlist.length) {
        this.playlist = [
          { title: 'Lưu Niên', artist: 'Nhạc Việt', src: '' },
          { title: 'Người Dưng', artist: 'Nhạc Việt', src: '' },
          { title: 'Thương Nhau Đến Thế', artist: 'Nhạc Việt', src: '' },
          { title: 'Ngược Lối Yêu', artist: 'Nhạc Việt', src: '' }
        ];
      }
      this.render();
    },

    bindUI() {
      const playBtn = document.getElementById('musicPlay');
      const nextBtn = document.getElementById('musicNext');
      const prevBtn = document.getElementById('musicPrev');
      const closeBtn = document.getElementById('musicClose');
      const progressEl = document.getElementById('musicProgress');

      playBtn?.addEventListener('click', () => this.toggle());
      nextBtn?.addEventListener('click', () => this.next());
      prevBtn?.addEventListener('click', () => this.prev());
      closeBtn?.addEventListener('click', () => {
        document.getElementById('musicDock')?.classList.remove('open');
        this.pause();
        State.musicEnabled = false;
        window.LH.Settings?.applyState();
      });

      progressEl?.addEventListener('click', (e) => {
        if (!this.audio.duration) return;
        const rect = progressEl.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        this.audio.currentTime = this.audio.duration * pct;
      });

      // Add playlist toggle + volume to dock
      this.injectEnhancedUI();
    },

    injectEnhancedUI() {
      const dock = document.getElementById('musicDock');
      if (!dock || dock.dataset.enhanced) return;
      dock.dataset.enhanced = '1';

      // Playlist toggle button (above dock)
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'music-playlist-toggle';
      toggleBtn.id = 'musicPlaylistToggle';
      toggleBtn.innerHTML = '<i data-lucide="list-music"></i> Danh sách';
      dock.appendChild(toggleBtn);

      // Playlist panel
      const panel = document.createElement('div');
      panel.className = 'music-playlist-panel';
      panel.id = 'musicPlaylistPanel';
      dock.appendChild(panel);

      // Volume
      const volRow = document.createElement('div');
      volRow.className = 'music-volume';
      volRow.innerHTML = `
        <i data-lucide="volume-2"></i>
        <input type="range" min="0" max="1" step="0.05" value="${this.volume}" id="musicVolume">
        <i data-lucide="volume-x"></i>
      `;
      dock.appendChild(volRow);

      toggleBtn.addEventListener('click', () => {
        panel.classList.toggle('open');
      });

      volRow.querySelector('#musicVolume').addEventListener('input', (e) => {
        this.volume = parseFloat(e.target.value);
        this.audio.volume = this.volume;
      });

      if (window.lucide) window.lucide.createIcons({ nodes: [dock] });
    },

    render() {
      // Update main dock
      const cur = this.playlist[this.index];
      const titleEl = document.getElementById('musicTitle');
      const artistEl = document.getElementById('musicArtist');
      if (titleEl && cur) titleEl.textContent = cur.title || '—';
      if (artistEl && cur) artistEl.textContent = cur.artist || '—';

      // Update playlist panel
      const panel = document.getElementById('musicPlaylistPanel');
      if (panel) {
        panel.innerHTML = this.playlist.map((t, i) => `
          <div class="music-playlist-item ${i === this.index ? 'active' : ''}" data-idx="${i}">
            <div class="music-playlist-idx">${i === this.index && this.playing ? '<i data-lucide="volume-2" style="width:12px;height:12px;color:var(--brand-1);"></i>' : (i + 1)}</div>
            <div style="flex:1;min-width:0;">
              <div class="music-playlist-name">${escapeHtml(t.title || '')}</div>
              <div class="music-playlist-artist">${escapeHtml(t.artist || '')}</div>
            </div>
          </div>
        `).join('');

        if (window.lucide) window.lucide.createIcons({ nodes: [panel] });

        panel.querySelectorAll('[data-idx]').forEach(item => {
          item.addEventListener('click', () => {
            this.index = parseInt(item.dataset.idx, 10);
            this.render();
            this.playCurrent();
          });
        });
      }
    },

    toggle() {
      if (this.playing) this.pause();
      else this.playCurrent();
    },

    playCurrent() {
      const cur = this.playlist[this.index];
      if (!cur) return;
      if (!cur.src) {
        Toast.info(`Chưa cấu hình file nhạc cho "${cur.title}". Admin có thể thêm URL file vào website_settings key "music_playlist".`);
        return;
      }
      this.audio.src = cur.src;
      this.audio.volume = this.volume;
      this.audio.play().then(() => {
        this.playing = true;
        this.updatePlayBtn();
        this.render();
        document.getElementById('musicDock')?.classList.add('open');
      }).catch(err => {
        Toast.error('Không phát được: ' + (err.message || 'autoplay bị chặn'));
      });
    },

    pause() {
      this.audio.pause();
      this.playing = false;
      this.updatePlayBtn();
      this.render();
    },

    next() {
      if (!this.playlist.length) return;
      this.index = (this.index + 1) % this.playlist.length;
      this.render();
      if (this.playing) this.playCurrent();
    },

    prev() {
      if (!this.playlist.length) return;
      this.index = (this.index - 1 + this.playlist.length) % this.playlist.length;
      this.render();
      if (this.playing) this.playCurrent();
    },

    updatePlayBtn() {
      const btn = document.getElementById('musicPlay');
      if (!btn) return;
      btn.innerHTML = `<i data-lucide="${this.playing ? 'pause' : 'play'}"></i>`;
      if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
    },

    updateProgress() {
      if (!this.audio.duration) return;
      const pct = (this.audio.currentTime / this.audio.duration) * 100;
      const bar = document.getElementById('musicProgressBar');
      if (bar) bar.style.width = pct + '%';
    },

    restoreState() {
      const saved = store.get(CONFIG.MUSIC_STATE_KEY);
      if (saved && saved.enabled) {
        State.musicEnabled = true;
        document.getElementById('musicDock')?.classList.add('open');
        window.LH.Settings?.applyState();
      }
      // Restore playlist index
      if (saved && typeof saved.index === 'number') {
        this.index = Math.min(saved.index, this.playlist.length - 1);
        this.render();
      }
    },

    saveState() {
      store.set(CONFIG.MUSIC_STATE_KEY, { enabled: State.musicEnabled, index: this.index });
    }
  };
  window.LH.MusicPlayer = MusicPlayer;

  // Override the placeholder LH.Music from Part 2
  window.LH.Music = {
    init: () => MusicPlayer.init(),
    start: () => MusicPlayer.playCurrent(),
    stop: () => MusicPlayer.pause(),
    playlist: [] // updated dynamically
  };

  /* ==========================================================
     8.5 HOOK NOTIFICATIONS BUTTON
     ========================================================== */
  function hookNotifButton() {
    const notifBtn = document.getElementById('notifBtn');
    if (!notifBtn || notifBtn.dataset.hooked) return;
    notifBtn.dataset.hooked = '1';

    // Add tab structure to notif panel
    const panel = document.getElementById('notifPanel');
    if (panel && !panel.querySelector('.notif-tabs')) {
      const tabs = document.createElement('div');
      tabs.className = 'notif-tabs';
      tabs.innerHTML = `
        <div class="notif-tab active" data-filter="all">Tất cả</div>
        <div class="notif-tab" data-filter="unread">Chưa đọc</div>
      `;
      panel.insertBefore(tabs, panel.querySelector('.notif-list'));

      let filter = 'all';
      tabs.querySelectorAll('.notif-tab').forEach(t => {
        t.addEventListener('click', () => {
          tabs.querySelectorAll('.notif-tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          filter = t.dataset.filter;
          applyFilter(filter);
        });
      });

      function applyFilter(f) {
        const list = document.getElementById('notifList');
        if (!list) return;
        list.querySelectorAll('.notif-item').forEach(item => {
          item.style.display = (f === 'unread' && !item.classList.contains('unread')) ? 'none' : 'flex';
        });
      }
      notifBtn._filter = applyFilter;
    }

    // Wire mark all read
    const markAll = document.getElementById('markAllRead');
    if (markAll && !markAll.dataset.hooked) {
      markAll.dataset.hooked = '1';
      // Rebind to use Notifications module
      const clone = markAll.cloneNode(true);
      markAll.parentNode.replaceChild(clone, markAll);
      clone.addEventListener('click', () => Notifications.markAllRead());
    }

    // Bind click on notif items
    const list = document.getElementById('notifList');
    if (list) {
      list.addEventListener('click', (e) => {
        const item = e.target.closest('.notif-item');
        if (!item || !item.classList.contains('unread')) return;
        const id = item.dataset.id;
        if (id) Notifications.markRead(id);
        item.classList.remove('unread');
      });
    }
  }

  /* ==========================================================
     8.6 REGISTER VIEWS
     ========================================================== */
  window.LH.Views = window.LH.Views || {};
  window.LH.Views.blog = (container, hash) => renderBlog(container, hash);
  window.LH.Views.post = (container, hash) => renderPost(container, hash);

  /* ==========================================================
     8.7 INIT
     ========================================================== */
  function init() {
    Notifications.init();
    MusicPlayer.init().catch(e => console.warn('[Music init]', e));
    hookNotifButton();
    console.log('%cPart 8/1 loaded — Blog, Notifications realtime, Music player', 'color:#06b6d4;font-weight:700;');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  function toolShorten() {
    const body = document.createElement('div');
    body.className = 'tool-body';
    body.innerHTML = `
      <div class="field">
        <label class="field-label">URL dài cần rút gọn</label>
        <input type="url" class="input" id="shortenInput" placeholder="https://example.com/path?query=…" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-block" id="shortenBtn"><i data-lucide="link-2"></i>Rút gọn</button>
      <div id="shortenResult"></div>
      <div class="small-text" style="margin-top:8px;">Sử dụng dịch vụ miễn phí is.gd · Không lưu trữ nội dung của bạn ngoài URL.</div>
    `;

    Modal.open({
      title: 'Rút gọn link',
      content: body,
      size: 'md',
      onMount: (mountBody) => {
        if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });
        const input = mountBody.querySelector('#shortenInput');
        const result = mountBody.querySelector('#shortenResult');
        const btn = mountBody.querySelector('#shortenBtn');

        const doShorten = async () => {
          const url = input.value.trim();
          if (!url) { Toast.error('Nhập URL'); return; }
          try {
            new URL(url);
          } catch {
            Toast.error('URL không hợp lệ');
            return;
          }
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;"></span> Đang xử lý…`;
          result.innerHTML = '';
          try {
            const api = `https://is.gd/create.php?format=json&url=${encodeURIComponent(url)}`;
            const res = await fetch(api);
            const data = await res.json();
            if (data.errorcode) throw new Error(data.errormessage || 'API error');
            const shortUrl = data.shorturl;
            result.innerHTML = `
              <div class="tool-output">
                <div class="tool-output-text">${escapeHtml(shortUrl)}</div>
                <button class="tool-copy-btn" id="copyShort"><i data-lucide="copy"></i></button>
              </div>
              <div class="tool-row" style="margin-top:8px;">
                <a class="btn btn-glass" href="${escapeHtml(shortUrl)}" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link"></i>Mở</a>
              </div>
            `;
            if (window.lucide) window.lucide.createIcons({ nodes: [result] });
            result.querySelector('#copyShort').addEventListener('click', (e) => {
              window.LH.copyToClipboard(shortUrl, e.currentTarget);
            });
            // save history
            const hist = store.get('lh_short_history', []) || [];
            hist.unshift({ long: url, short: shortUrl, at: Date.now() });
            store.set('lh_short_history', hist.slice(0, 30));
          } catch (e) {
            result.innerHTML = `<div class="small-text" style="color:var(--danger);">Lỗi: ${escapeHtml(e.message)}</div>`;
          } finally {
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="link-2"></i>Rút gọn`;
            if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
          }
        };

        btn.addEventListener('click', doShorten);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doShorten(); });
      }
    });
  }

  /* ---------- Tool 3: Currency Converter ---------- */
  let currencyCache = null;
  async function fetchRates() {
    const now = Date.now();
    if (currencyCache && now - currencyCache.at < 30 * 60 * 1000) return currencyCache;
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    if (data.result !== 'success') throw new Error('Không lấy được tỷ giá');
    currencyCache = { rates: data.rates, at: now, updated: data.time_last_update_utc };
    return currencyCache;
  }

        <label class="checkbox"><input type="checkbox" id="pwdNumbers" checked><span class="box"></span><span>Số (0-9)</span></label>

      </div>
