<style>
/* ============================================================
   PART 1 — DESIGN TOKENS & GLOBAL STYLES (FIXED)
   ============================================================ */

/* 1.1 Reset */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
* { margin: 0; padding: 0; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  text-rendering: optimizeLegibility;
  background: var(--bg-0);
  color: var(--text-1);
  transition: background-color var(--dur-med) var(--ease-out), color var(--dur-med) var(--ease-out);
  padding-bottom: calc(var(--bottomnav-h) + var(--safe-bottom));
  overscroll-behavior-y: none;
}
img, svg, video, canvas { display: block; max-width: 100%; height: auto; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
input, textarea { -webkit-appearance: none; appearance: none; }
::selection { background: rgba(99,102,241,0.28); color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(120,120,140,0.28); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(120,120,140,0.5); }

/* 1.2 Design Tokens (Light) */
:root {
  --brand-1: #6366f1;
  --brand-2: #8b5cf6;
  --brand-3: #06b6d4;
  --brand-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 45%, #06b6d4 100%);
  --brand-grad-soft: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(139,92,246,0.14) 50%, rgba(6,182,212,0.14));

  --bg-0: #f4f6fb;
  --bg-1: #eef2fa;
  --bg-2: #e6ebf6;
  --surface-1: rgba(255,255,255,0.72);
  --surface-2: rgba(255,255,255,0.55);
  --surface-3: rgba(255,255,255,0.38);
  --surface-solid: #ffffff;
  --surface-hover: rgba(255,255,255,0.88);

  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.85);
  --glass-border-soft: rgba(255,255,255,0.55);
  --glass-highlight: rgba(255,255,255,0.95);
  --glass-shadow: 0 8px 32px rgba(31,41,55,0.09), 0 2px 8px rgba(31,41,55,0.05);
  --glass-shadow-lg: 0 20px 60px rgba(31,41,55,0.14), 0 6px 20px rgba(31,41,55,0.06);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -1px 0 rgba(255,255,255,0.28);

  --text-1: #0f172a;
  --text-2: #334155;
  --text-3: #64748b;
  --text-4: #94a3b8;

  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;

  --border-1: rgba(15,23,42,0.08);
  --border-2: rgba(15,23,42,0.14);
  --divider: rgba(15,23,42,0.06);

  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-2xl: 36px; --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 56px; --sp-10: 72px;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 160ms; --dur-med: 260ms; --dur-slow: 420ms;

  --header-h: 64px;
  --bottomnav-h: 68px;
  --sidebar-w: 260px;
  --container-max: 1360px;
  --content-pad: 16px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --z-bg: 0; --z-content: 10; --z-header: 100; --z-sidebar: 200; --z-bottomnav: 150; --z-dropdown: 400; --z-modal: 1000; --z-toast: 1500; --z-image-viewer: 2000;
}

/* 1.3 Dark Theme */
[data-theme="dark"] {
  --bg-0: #070b14; --bg-1: #0c1220; --bg-2: #131a2c;
  --surface-1: rgba(22,30,48,0.72); --surface-2: rgba(22,30,48,0.55); --surface-3: rgba(22,30,48,0.35);
  --surface-solid: #0f1626; --surface-hover: rgba(34,44,66,0.85);
  --glass-bg: rgba(22,30,48,0.48); --glass-bg-strong: rgba(22,30,48,0.72);
  --glass-border: rgba(120,140,190,0.22); --glass-border-soft: rgba(120,140,190,0.12);
  --glass-highlight: rgba(255,255,255,0.10);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.28);
  --glass-shadow-lg: 0 24px 64px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.35);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(255,255,255,0.02);
  --text-1: #f1f5f9; --text-2: #cbd5e1; --text-3: #94a3b8; --text-4: #64748b;
  --border-1: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.12); --divider: rgba(255,255,255,0.05);
}

/* 1.4 Typography & Layout */
.h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
.h2 { font-size: clamp(22px, 3vw, 32px); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }
.h3 { font-size: clamp(18px, 2.2vw, 22px); font-weight: 700; line-height: 1.3; }
.h4 { font-size: 16px; font-weight: 600; line-height: 1.35; }
.body { font-size: 15px; color: var(--text-2); }
.body-sm { font-size: 13.5px; color: var(--text-3); }
.caption { font-size: 12px; color: var(--text-4); }
.mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
.text-gradient { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

.container { width: 100%; max-width: var(--container-max); margin-inline: auto; padding-inline: var(--content-pad); }
.stack > * + * { margin-top: var(--sp-4); }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.col { display: flex; flex-direction: column; gap: var(--sp-3); }
.grid { display: grid; gap: var(--sp-4); }

/* 1.5 Glass Components */
.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  box-shadow: var(--glass-shadow), var(--glass-inner);
  transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
}
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(120deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.05) 100%);
}
.glass-strong { background: var(--glass-bg-strong); backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%); }
.card { padding: var(--sp-5); border-radius: var(--r-lg); }
.card-lg { padding: var(--sp-6); border-radius: var(--r-xl); }

/* 1.6 Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 44px; padding: 0 var(--sp-5); border-radius: var(--r-pill);
  font-weight: 600; font-size: 14.5px; white-space: nowrap; cursor: pointer;
  position: relative; overflow: hidden;
  transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.btn i, .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn-primary { background: var(--brand-grad); color: #fff; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 24px rgba(99,102,241,0.35); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:active { transform: scale(0.97); }
.btn-glass { background: var(--glass-bg); color: var(--text-1); border: 1px solid var(--glass-border); backdrop-filter: blur(18px); }
.btn-glass:hover { background: var(--glass-bg-strong); }
.btn-ghost { background: transparent; color: var(--text-1); border: 1px solid transparent; }
.btn-ghost:hover { background: var(--surface-3); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.btn-sm { min-height: 36px; padding: 0 var(--sp-4); font-size: 13px; }
.btn-lg { min-height: 52px; padding: 0 var(--sp-7); font-size: 15.5px; }
.btn-icon { width: 44px; height: 44px; padding: 0; border-radius: 50%; }
.btn-block { width: 100%; }

/* 1.7 Inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--text-2); padding-left: 4px; }
.field-hint { font-size: 12px; color: var(--text-3); padding-left: 4px; }
.field-error { font-size: 12px; color: var(--danger); padding-left: 4px; }
.input, .textarea, .select {
  width: 100%; min-height: 46px; padding: 11px 16px; border-radius: var(--r-md);
  background: var(--surface-2); color: var(--text-1); border: 1px solid var(--border-1);
  font-size: 14.5px; transition: all var(--dur-fast) var(--ease-out);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
.select { cursor: pointer; padding-right: 42px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 4px rgba(139,92,246,0.18); background: var(--surface-solid); }
.input-group { position: relative; display: flex; align-items: center; }
.input-group .input { padding-right: 46px; }
.input-group-btn { position: absolute; right: 6px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--text-3); cursor: pointer; }

/* 1.8 FIX MODAL CHO MOBILE (Không bị bàn phím che) */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(9,12,20,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; transition: opacity var(--dur-med); z-index: var(--z-modal);
  display: flex; align-items: flex-end; justify-content: center; padding: 0;
}
@media (min-width: 640px) { .modal-backdrop { align-items: center; padding: var(--sp-4); } }
.modal-backdrop.active { opacity: 1; }
.modal {
  width: 100%; max-width: 520px; background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-highlight); border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--glass-shadow-lg);
  /* FIX QUAN TRỌNG: dùng flex column và max-height */
  display: flex; flex-direction: column;
  max-height: 92dvh; /* Sử dụng dvh cho mobile */
  transform: translateY(100%); opacity: 0;
  transition: transform var(--dur-med) var(--ease-spring), opacity var(--dur-med) var(--ease-out);
}
@media (min-width: 640px) { .modal { border-radius: var(--r-xl); transform: scale(0.94) translateY(12px); max-height: 90vh; } }
.modal-backdrop.active .modal { transform: translateY(0); opacity: 1; }
@media (min-width: 640px) { .modal-backdrop.active .modal { transform: scale(1) translateY(0); } }

.modal-header { padding: 18px 20px; border-bottom: 1px solid var(--divider); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-close { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); background: var(--surface-3); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.modal-actions { padding: 16px 20px; border-top: 1px solid var(--divider); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; flex-shrink: 0; padding-bottom: calc(16px + var(--safe-bottom)); }

/* Form Auth đặc biệt */
.auth-modal-inner { padding: 0; display: flex; flex-direction: column; }
.auth-tabs { display: flex; padding: 4px; background: var(--surface-3); border-radius: var(--r-pill); margin-bottom: 20px; position: relative; flex-shrink: 0; }
.auth-tab { flex: 1; padding: 10px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 700; color: var(--text-3); text-align: center; cursor: pointer; z-index: 1; transition: color 0.2s; }
.auth-tab.active { color: var(--text-1); }
.auth-tab-indicator { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--surface-solid); border-radius: var(--r-pill); box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.3s var(--ease-spring); z-index: 0; }
.auth-tabs[data-active="register"] .auth-tab-indicator { transform: translateX(100%); }
.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-form[hidden] { display: none !important; }

/* 1.9 Toast & Utility */
#toastRoot { position: fixed; top: calc(var(--safe-top) + 16px); right: 16px; left: 16px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: 380px; margin-left: auto; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 13px 16px; border-radius: var(--r-md); background: var(--glass-bg-strong); backdrop-filter: blur(30px); border: 1px solid var(--glass-highlight); box-shadow: var(--glass-shadow-lg); transform: translateX(120%); opacity: 0; transition: all 0.3s var(--ease-spring); font-size: 14px; }
.toast.show { transform: translateX(0); opacity: 1; }
.toast-icon { width: 20px; height: 20px; flex-shrink: 0; }
.toast-success .toast-icon { color: var(--success); }
.toast-error .toast-icon { color: var(--danger); }
.toast-info .toast-icon { color: var(--info); }
.toast-warning .toast-icon { color: var(--warning); }
.toast-msg { flex: 1; }
.toast-close { color: var(--text-4); cursor: pointer; }

/* Loading & Skeleton */
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-hover) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: skeletonShimmer 1.5s infinite; border-radius: var(--r-sm); }
@keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Reduced Motion */
[data-reduced-motion="true"] *, [data-reduced-motion="true"] *::before, [data-reduced-motion="true"] *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
</style>
</head>

<style>
/* ============================================================
   PART 2 — COMPONENTS CSS (TOOLS, WEATHER, BLOG, ADMIN, MUSIC)
   ============================================================ */

/* 2.1 Header & Navigation */
.app-header {
  position: sticky; top: 0; left: 0; right: 0; height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top); z-index: var(--z-header);
  display: flex; align-items: center; background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  border-bottom: 1px solid var(--glass-border-soft);
  transition: all var(--dur-med) var(--ease-out);
}
.app-header.scrolled { height: calc(58px + var(--safe-top)); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.header-inner { display: flex; align-items: center; gap: var(--sp-3); width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 var(--content-pad); }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }
.brand-logo { width: 38px; height: 38px; border-radius: 12px; background: var(--brand-grad); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; box-shadow: 0 6px 20px rgba(99,102,241,0.35); overflow: hidden; }
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { font-size: 15px; font-weight: 800; color: var(--text-1); }
.brand-tag { font-size: 10.5px; color: var(--text-3); }
.header-nav { display: none; align-items: center; gap: 4px; flex: 1; justify-content: center; }
.hnav-link { padding: 8px 14px; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; color: var(--text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.hnav-link.active { background: var(--brand-grad-soft); color: var(--brand-1); font-weight: 600; }
.header-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); position: relative; cursor: pointer; }
.icon-btn:hover { background: var(--surface-3); }
.icon-btn.has-badge::after { content: attr(data-badge); position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 1.5px solid var(--bg-0); }
@media (min-width: 1024px) { .header-nav { display: flex; } }

/* 2.2 Sidebar & Bottom Nav */
.app-sidebar { position: fixed; top: calc(var(--header-h) + 12px); left: 12px; width: var(--sidebar-w); bottom: 12px; background: var(--glass-bg); backdrop-filter: blur(28px); border: 1px solid var(--glass-border); border-radius: var(--r-xl); padding: var(--sp-3); overflow-y: auto; display: none; flex-direction: column; gap: 4px; z-index: var(--z-sidebar); }
.sidebar-section { padding: var(--sp-2) var(--sp-3); font-size: 10.5px; font-weight: 700; color: var(--text-4); text-transform: uppercase; margin-top: var(--sp-3); }
.snav-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--r-md); color: var(--text-2); font-size: 14px; font-weight: 500; cursor: pointer; }
.snav-link:hover { background: var(--surface-3); color: var(--text-1); }
.snav-link.active { background: var(--brand-grad); color: #fff; box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
.app-main { position: relative; z-index: var(--z-content); min-height: calc(100dvh - var(--header-h)); }

  const formatDateTime = (d) => {
    if (!d) return '—';
    const date = d instanceof Date ? d : new Date(d);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  const timeAgo = (d) => {
    if (!d) return '';
    const date = d instanceof Date ? d : new Date(d);
    const diff = (Date.now() - date.getTime()) / 1000;
    if (diff < 60) return 'vừa xong';
    if (diff < 3600) return Math.floor(diff / 60) + ' phút trước';
    if (diff < 86400) return Math.floor(diff / 3600) + ' giờ trước';

  const escapeHtml = (str) => {

  const uuidv4 = () => {

  const compressImage = (file, maxDim = 1920, quality = 0.85) => new Promise((resolve, reject) => {

      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if (!blob) return reject(new Error('compress failed'));
          blob.name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };

  });

  const applyTheme = (theme) => {

  const Modal = {

          if (a.onClick) btn.addEventListener('click', () => a.onClick(close));

        document.removeEventListener('keydown', onKey);

})();

          <div class="row-between"><span class="body-sm">Chế độ tối</span><div class="switch" id="themeSwitch" role="switch" tabindex="0" style="width:40px;height:24px;background:var(--surface-3);border-radius:999px;position:relative;cursor:pointer;"><div style="width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:0.2s;"></div></div></div>

      <div id="userMenuDropdown" style="display:none;position:fixed;top:70px;right:12px;width:220px;background:var(--glass-bg-strong);backdrop-filter:blur(30px);border:1px solid var(--glass-border);border-radius:16px;padding:8px;z-index:500;box-shadow:0 10px 40px rgba(0,0,0,0.2);">

      </div>

      <!-- MOBILE SEARCH MODAL -->
      <div id="mobileSearchModal" style="display:none;position:fixed;inset:0;background:var(--bg-0);z-index:600;padding:16px;flex-direction:column;">
        <div class="row" style="margin-bottom:16px;">
          <div style="flex:1;position:relative;">
            <input type="search" id="mobileSearchInput" placeholder="Tìm kiếm…" style="width:100%;height:44px;border-radius:22px;padding:0 16px;background:var(--surface-3);border:1px solid var(--border-1);">
          </div>
          <button class="btn btn-glass" id="mobileSearchClose">Hủy</button>
        </div>
        <div id="mobileSearchResults" style="flex:1;overflow-y:auto;"></div>
      </div>
    `;

    if (window.lucide) window.lucide.createIcons();
  }

  /* 4.2 NAVIGATION DEFINITIONS */
  const NAV_MAIN = [
    { id: 'home', label: 'Trang chủ', icon: 'home', path: '#/' },
    { id: 'shop', label: 'Shop', icon: 'shopping-bag', path: '#/shop' },
    { id: 'services', label: 'Dịch vụ', icon: 'briefcase', path: '#/services' },
    { id: 'tools', label: 'Công cụ MMO', icon: 'wrench', path: '#/tools' },
    { id: 'weather', label: 'Thời tiết', icon: 'cloud-sun', path: '#/weather' },
    { id: 'blog', label: 'Blog', icon: 'newspaper', path: '#/blog' }
  ];
  const NAV_USER = [
    { id: 'account', label: 'Tài khoản', icon: 'user', path: '#/account' },
    { id: 'wallet', label: 'Ví & nạp tiền', icon: 'wallet', path: '#/wallet' },
    { id: 'orders', label: 'Đơn hàng', icon: 'package', path: '#/orders' }
  ];

  const ROUTES = {
    '': 'home', '/': 'home',
    '/shop': 'shop',
    '/services': 'services',
    '/tools': 'tools',
    '/weather': 'weather',
    '/blog': 'blog',
    '/account': 'account',
    '/wallet': 'wallet',
    '/orders': 'orders',
    '/admin': 'admin',
    '/product': 'product',
    '/post': 'post'
  };

  /* 4.3 RENDER NAVIGATION */
  function renderNavigation() {
    const headerNav = $('#headerNav');
    if (headerNav) {
      headerNav.innerHTML = NAV_MAIN.map(n => `<a class="hnav-link" href="${n.path}" data-nav="${n.id}"><i data-lucide="${n.icon}"></i><span>${n.label}</span></a>`).join('');
    }

    const sidebar = $('#appSidebar');
    if (sidebar) {
      let html = '<div class="sidebar-section">Khám phá</div>';
      html += NAV_MAIN.map(n => `<a class="snav-link" href="${n.path}" data-nav="${n.id}"><i data-lucide="${n.icon}"></i><span>${n.label}</span></a>`).join('');
      html += '<div class="sidebar-section">Tài khoản</div>';
      html += NAV_USER.map(n => `<a class="snav-link" href="${n.path}" data-nav="${n.id}"><i data-lucide="${n.icon}"></i><span>${n.label}</span></a>`).join('');
      sidebar.innerHTML = html;
    }

    const bottomNav = $('#bottomNav');
    if (bottomNav) {
      bottomNav.innerHTML = `
        <div class="bnav-item" data-nav="home"><i data-lucide="home"></i><span>Trang chủ</span></div>
        <div class="bnav-item" data-nav="shop"><i data-lucide="shopping-bag"></i><span>Shop</span></div>
        <div class="bnav-center" id="bnavCenter"><i data-lucide="zap"></i></div>
        <div class="bnav-item" data-nav="tools"><i data-lucide="wrench"></i><span>Công cụ</span></div>
        <div class="bnav-item" data-nav="account"><i data-lucide="user"></i><span>Tài khoản</span></div>
      `;
      bottomNav.querySelectorAll('[data-nav]').forEach(item => {
        item.addEventListener('click', () => {
          const route = NAV_MAIN.concat(NAV_USER).find(n => n.id === item.dataset.nav);
          if (route) location.hash = route.path;
        });
      });
    }
    if (window.lucide) window.lucide.createIcons();
  }

  /* 4.4 ROUTER SYSTEM */
  const Router = {
    handle() {
      const hash = location.hash || '#/';
      const [path] = hash.replace(/^#/, '').split('?');
      const viewName = ROUTES[path] || 'home';
      State.currentView = viewName;

      // Update active nav
      $$('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === viewName));

      const container = $('#viewContainer');
      if (!container) return;

      // Call View renderer
      const customView = window.LH.Views && window.LH.Views[viewName];
      if (typeof customView === 'function') {
        try {
          container.innerHTML = '<div style="padding:40px;text-align:center;"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>';
          customView(container, hash);
        } catch (e) {
          console.error('[Router] View error', viewName, e);
          container.innerHTML = `<div class="glass card" style="margin-top:20px;"><h3 class="h3">Lỗi tải trang</h3><p class="body">${e.message}</p></div>`;
        }
      } else {
        container.innerHTML = `<div class="glass card" style="margin-top:20px;text-align:center;padding:40px;"><h2 class="h2 text-gradient">${viewName}</h2><p class="body">Trang này đang được phát triển.</p><a href="#/" class="btn btn-primary" style="margin-top:20px;">Về trang chủ</a></div>`;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    init() {
      window.addEventListener('hashchange', () => this.handle());
      this.handle();
    }
  };

  /* 4.5 SETTINGS & UI EVENTS */
  function bindEvents() {
    // Header scroll
    window.addEventListener('scroll', () => {
      const header = $('#appHeader');
      if (header) header.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    // Theme toggle
    $('#themeToggleBtn')?.addEventListener('click', () => {
      window.LH.toggleTheme();
      updateSwitches();
    });

    $('#themeSwitch')?.addEventListener('click', () => {
      window.LH.toggleTheme();
      updateSwitches();
    });

    // Snow toggle
    $('#snowSwitch')?.addEventListener('click', () => {
      const snow = document.getElementById('snowLayer');
      if (!snow) return;
      const isActive = snow.classList.contains('active');
      if (isActive) {
        snow.classList.remove('active');
        snow.innerHTML = '';
      } else {
        snow.classList.add('active');
        for (let i = 0; i < 40; i++) {
          const flake = document.createElement('div');
          flake.className = 'snow-flake';
          flake.style.cssText = `position:absolute;background:#fff;border-radius:50%;pointer-events:none;left:${Math.random() * 100}%;width:${Math.random() * 4 + 2}px;height:${Math.random() * 4 + 2}px;opacity:${Math.random() * 0.5 + 0.3};animation:snowFall ${Math.random() * 5 + 5}s linear infinite;animation-delay:-${Math.random() * 5}s;`;
          snow.appendChild(flake);
        }
        if (!document.getElementById('snowStyle')) {
          const style = document.createElement('style');
          style.id = 'snowStyle';
          style.textContent = `@keyframes snowFall { 0% { transform: translateY(-10vh) translateX(0); } 100% { transform: translateY(110vh) translateX(20px); } } #snowLayer { position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }`;
          document.head.appendChild(style);
        }
      }
      updateSwitches();
    });

    // User Menu toggle
    $('#userChip')?.addEventListener('click', () => {
      const dd = $('#userMenuDropdown');
      if (dd) dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    });

    // Close menus on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#userChip') && !e.target.closest('#userMenuDropdown')) {
        const dd = $('#userMenuDropdown');
        if (dd) dd.style.display = 'none';
      }
      if (!e.target.closest('#settingsPanel') && !e.target.closest('#themeToggleBtn')) {
        const sp = $('#settingsPanel');
        // Only close if opened via a specific button (we don't have one, so keep open or implement settings button)
      }
    });

    // Mobile Menu
    const menuToggle = $('#menuToggle');
    if (window.innerWidth < 1024 && menuToggle) {
      menuToggle.style.display = 'grid';
      menuToggle.innerHTML = '<i data-lucide="menu"></i>';
      if (window.lucide) window.lucide.createIcons({ nodes: [menuToggle] });
      menuToggle.addEventListener('click', () => {
        $('#appSidebar').style.display = 'flex';
        $('#appSidebar').style.transform = 'translateX(0)';
        $('#sidebarOverlay').style.display = 'block';
      });
      $('#sidebarOverlay')?.addEventListener('click', () => {
        $('#appSidebar').style.display = 'none';
        $('#sidebarOverlay').style.display = 'none';
      });
    }

    // Mobile Search
    $('#searchMobileBtn')?.addEventListener('click', () => {
      const modal = $('#mobileSearchModal');
      modal.style.display = 'flex';
      setTimeout(() => $('#mobileSearchInput').focus(), 100);
    });
    $('#mobileSearchClose')?.addEventListener('click', () => {
      $('#mobileSearchModal').style.display = 'none';
    });
  }

  function updateSwitches() {
    const themeSwitch = $('#themeSwitch');
    if (themeSwitch) {
      const isDark = State.theme === 'dark';
      themeSwitch.style.background = isDark ? 'var(--brand-1)' : 'var(--surface-3)';
      themeSwitch.children[0].style.left = isDark ? '18px' : '2px';
    }
    const snowSwitch = $('#snowSwitch');
    if (snowSwitch) {
      const isSnow = document.getElementById('snowLayer')?.classList.contains('active');
      snowSwitch.style.background = isSnow ? 'var(--brand-1)' : 'var(--surface-3)';
      snowSwitch.children[0].style.left = isSnow ? '18px' : '2px';
    }
  }

  /* 4.6 USER STATE UI */
  function renderUserState() {
    const isLogged = !!State.user;
    const chip = $('#userChip');
    const loginBtn = $('#loginBtn');
    const adminLink = $('#adminMenuLink');

    if (isLogged) {
      if (chip) {
        chip.style.display = 'flex';
        $('#userChipName').textContent = State.profile?.display_name || State.profile?.username || 'User';
        const avatar = $('#userChipAvatar');
        if (State.profile?.avatar_url) {
          avatar.innerHTML = `<img src="${State.profile.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        } else {
          avatar.textContent = (State.profile?.display_name || 'U').charAt(0).toUpperCase();
        }
      }
      if (loginBtn) loginBtn.style.display = 'none';
      if (adminLink) adminLink.style.display = State.isAdmin ? 'flex' : 'none';
      
      const umName = $('#umName');
      const umRole = $('#umRole');
      if (umName) umName.textContent = State.profile?.display_name || State.profile?.username || 'User';
      if (umRole) umRole.textContent = State.isAdmin ? 'Quản trị viên' : 'Thành viên';
    } else {
      if (chip) chip.style.display = 'none';
      if (loginBtn) loginBtn.style.display = 'grid';
      if (adminLink) adminLink.style.display = 'none';
    }
  }

  /* 4.7 INIT */
  function init() {
    injectShell();
    renderNavigation();
    bindEvents();
    Router.init();
    updateSwitches();
    
    // Set login button to trigger Auth if available later
    $('#loginBtn')?.addEventListener('click', () => {
      if (window.LH.Auth && window.LH.Auth.openLogin) {
        window.LH.Auth.openLogin();
      } else {
        Toast.info('Chức năng đăng nhập sẽ khả dụng ở phần tiếp theo.');
      }
    });

    window.addEventListener('auth:changed', renderUserState);
    renderUserState();

    window.LH.Router = Router;
    window.LH.renderUserState = renderUserState;
    console.log('%cPart 4 loaded — Shell, Nav, Router', 'color:#ec4899;font-weight:700;');
  }

  init();
})();
</script>

<script>
/* ============================================================
   PART 5 — HOME VIEW, PROFILE & SAFE FETCHING
   ============================================================ */
(function () {
  'use strict';
  const { State, supabase, $, el, CONFIG, formatCurrency, escapeHtml, formatDate, Toast } = window.LH;

  /* 5.1 SAFE DATA LAYER (Tránh lỗi Failed to fetch làm sập trang) */
  const Data = {
    async getOwnerProfile() {
      if (!supabase) return null;
      try {
        const { data, error } = await supabase.from('profiles').select('*').eq('is_owner', true).limit(1).maybeSingle();
        if (error) { console.warn('[Data] getOwnerProfile:', error.message); return null; }
        return data;
      } catch (e) { console.warn('[Data] Network error:', e); return null; }
    },

    async getCategories() {
      if (!supabase) return [];
      try {
        const { data, error } = await supabase.from('categories').select('*').order('sort_order', { ascending: true });
        if (error) return [];
        return data || [];
      } catch { return []; }
    },

    async getProducts(opts = {}) {
      if (!supabase) return { items: [], total: 0 };
      try {
        let q = supabase.from('products').select('*', { count: 'exact' }).eq('is_visible', true);
        if (opts.featuredOnly) q = q.eq('is_featured', true);
        q = q.order('created_at', { ascending: false }).limit(opts.limit || 8);
        const { data, error } = await q;
        if (error) return { items: [], total: 0 };
        return { items: data || [], total: data?.length || 0 };
      } catch { return { items: [], total: 0 }; }
    },

    async getServices(opts = {}) {
      if (!supabase) return { items: [], total: 0 };
      try {
        let q = supabase.from('services').select('*').eq('is_visible', true);
        if (opts.featuredOnly) q = q.eq('is_featured', true);
        q = q.order('created_at', { ascending: false }).limit(opts.limit || 6);
        const { data, error } = await q;
        if (error) return { items: [], total: 0 };
        return { items: data || [], total: data?.length || 0 };
      } catch { return { items: [], total: 0 }; }
    },

    async getPublicStats() {
      if (!supabase) return { users: 0, orders: 0, products: 0 };
      try {
        const [u, o, p] = await Promise.all([
          supabase.from('profiles').select('*', { count: 'exact', head: true }),
          supabase.from('orders').select('*', { count: 'exact', head: true }),
          supabase.from('products').select('*', { count: 'exact', head: true })
        ]);
        return { users: u.count || 0, orders: o.count || 0, products: p.count || 0 };
      } catch { return { users: 0, orders: 0, products: 0 }; }
    }
  };
  window.LH.Data = Data;

  /* 5.2 HELPERS */
  function getProductImage(p) {
    if (!p) return '';
    if (p.thumbnail_url) return p.thumbnail_url;
    if (Array.isArray(p.images) && p.images.length > 0) return p.images[0];
    return '';
  }

  function getDisplayPrice(p) {
    const sale = Number(p.sale_price);
    const base = Number(p.price) || 0;
    if (sale > 0 && sale < base) return { current: sale, original: base, hasSale: true };
    return { current: base, original: null, hasSale: false };
  }

  /* 5.3 COMPONENTS */
  function ProfileHero(profile, stats) {
    const p = profile || {};
    const displayName = p.display_name || p.username || 'Liquid Hub';
    const socials = [];
    if (p.zalo) socials.push({ icon: 'message-circle', label: 'Zalo', href: `https://zalo.me/${p.zalo}` });
    if (p.facebook) socials.push({ icon: 'facebook', label: 'Facebook', href: p.facebook });
    if (p.telegram) socials.push({ icon: 'send', label: 'Telegram', href: p.telegram });

    const wrap = el('div', { class: 'profile-hero anim-up' });
    wrap.innerHTML = `
      <div class="profile-cover">
        ${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="">` : ''}
      </div>
      <div class="profile-body">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar">
            ${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" alt="">` : displayName.charAt(0).toUpperCase()}
          </div>
          <div class="status-dot online"></div>
        </div>
        <div class="profile-name">
          ${escapeHtml(displayName)}
          ${p.is_verified ? `<i data-lucide="badge-check" style="width:20px;height:20px;color:var(--brand-1);"></i>` : ''}
        </div>
        <div class="profile-username">@${escapeHtml(p.username || 'user')}</div>
        ${p.title ? `<div class="profile-title"><i data-lucide="briefcase"></i>${escapeHtml(p.title)}</div>` : ''}
        ${p.bio ? `<div class="profile-bio">${escapeHtml(p.bio)}</div>` : ''}
        
        ${socials.length ? `
          <div class="profile-socials">
            ${socials.map(s => `<a href="${escapeHtml(s.href)}" target="_blank" class="social-btn"><i data-lucide="${s.icon}"></i>${s.label}</a>`).join('')}
          </div>
        ` : ''}

        <div class="profile-stats">
          <div class="pstat"><div class="pstat-value">${stats.users}</div><div class="pstat-label">Thành viên</div></div>
          <div class="pstat"><div class="pstat-value">${stats.orders}</div><div class="pstat-label">Đơn hàng</div></div>
          <div class="pstat"><div class="pstat-value">${stats.products}</div><div class="pstat-label">Sản phẩm</div></div>
          <div class="pstat"><div class="pstat-value">${p.experience_years || 5}+</div><div class="pstat-label">Năm kinh nghiệm</div></div>
        </div>
      </div>
    `;
    return wrap;
  }

  function HeroBanner() {
    const wrap = el('div', { class: 'hero-banner anim-up' });
    wrap.innerHTML = `
      <div class="hero-title">Nền tảng sản phẩm số & dịch vụ MMO hàng đầu</div>
      <div class="hero-desc">Tài khoản game, tài nguyên số, dịch vụ MMO chất lượng cao — Bảo mật, nhanh chóng, uy tín.</div>
      <div class="row" style="gap:12px;flex-wrap:wrap;">
        <a href="#/shop" class="hero-btn"><i data-lucide="shopping-bag"></i> Khám phá Shop</a>
        <a href="#/services" class="hero-btn outline"><i data-lucide="briefcase"></i> Xem dịch vụ</a>
      </div>
    `;
    return wrap;
  }

  function ProductCard(p) {
    const card = el('div', { class: 'pcard', onclick: () => location.hash = `#/product?id=${p.id}` });
    const img = getProductImage(p);
    const price = getDisplayPrice(p);
    card.innerHTML = `
      <div class="pcard-media">
        ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.name)}" loading="lazy">` : `<div style="display:grid;place-items:center;height:100%;color:var(--text-4);"><i data-lucide="image-off"></i></div>`}
        ${price.hasSale ? `<div style="position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;">SALE</div>` : ''}
      </div>
      <div class="pcard-body">
        <div class="pcard-name">${escapeHtml(p.name)}</div>
        <div class="pcard-price-row" style="display:flex;align-items:baseline;gap:6px;margin-top:auto;">
          <span class="pcard-price">${formatCurrency(price.current)}</span>
          ${price.hasSale ? `<span style="font-size:11px;color:var(--text-4);text-decoration:line-through;">${formatCurrency(price.original)}</span>` : ''}
        </div>
      </div>
    `;
    return card;
  }

  function ServiceCard(s) {
    const card = el('div', { class: 'scard', onclick: () => Toast.info('Chi tiết dịch vụ sẽ sớm cập nhật') });
    card.innerHTML = `
      <div class="scard-icon"><i data-lucide="${escapeHtml(s.icon || 'briefcase')}"></i></div>
      <div style="flex:1;min-width:0;">
        <div class="scard-name">${escapeHtml(s.name)}</div>
        <div class="scard-desc">${escapeHtml(s.short_desc || s.description || '')}</div>
        <div class="scard-price">${formatCurrency(s.price)}</div>
      </div>
    `;
    return card;
  }

  function EmptyState(title, desc) {
    const wrap = el('div', { class: 'empty-state' });
    wrap.innerHTML = `
      <div class="empty-icon"><i data-lucide="inbox"></i></div>
      <div class="empty-title">${escapeHtml(title)}</div>
      <div class="empty-desc">${escapeHtml(desc)}</div>
    `;
    return wrap;
  }

  /* 5.4 HOME VIEW RENDERER */
  async function renderHome(container) {
    container.innerHTML = `
      <div id="heroWrap"></div>
      <div class="section">
        <div class="section-head">
          <div>
            <div class="section-eyebrow">Sản phẩm</div>
            <div class="section-title">Sản phẩm nổi bật</div>
          </div>
          <a href="#/shop" class="section-action">Xem tất cả <i data-lucide="arrow-right"></i></a>
        </div>
        <div class="product-grid" id="featuredProducts"></div>
      </div>
      <div class="section">
        <div class="section-head">
          <div>
            <div class="section-eyebrow">Dịch vụ</div>
            <div class="section-title">Dịch vụ chuyên nghiệp</div>
          </div>
          <a href="#/services" class="section-action">Xem tất cả <i data-lucide="arrow-right"></i></a>
        </div>
        <div class="service-grid" id="featuredServices"></div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    // Async Data Fetch
    const [profile, stats, products, services] = await Promise.all([
      Data.getOwnerProfile(),
      Data.getPublicStats(),
      Data.getProducts({ featuredOnly: true, limit: 8 }),
      Data.getServices({ featuredOnly: true, limit: 4 })
    ]);

    // Render Hero & Profile
    const heroWrap = container.querySelector('#heroWrap');
    heroWrap.appendChild(HeroBanner());
    if (profile) {
      heroWrap.appendChild(ProfileHero(profile, stats));
    }

    // Render Products
    const prodGrid = container.querySelector('#featuredProducts');
    if (products.items.length > 0) {
      products.items.forEach(p => prodGrid.appendChild(ProductCard(p)));
    } else {
      prodGrid.innerHTML = '';
      prodGrid.appendChild(EmptyState('Chưa có sản phẩm', 'Sản phẩm nổi bật sẽ xuất hiện tại đây.'));
    }

    // Render Services
    const svcGrid = container.querySelector('#featuredServices');
    if (services.items.length > 0) {
      services.items.forEach(s => svcGrid.appendChild(ServiceCard(s)));
    } else {
      svcGrid.innerHTML = '';
      svcGrid.appendChild(EmptyState('Chưa có dịch vụ', 'Các dịch vụ MMO chất lượng cao sẽ sớm được cập nhật.'));
    }

    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
  }

  /* 5.5 REGISTER VIEW */
  window.LH.Views = window.LH.Views || {};
  window.LH.Views.home = (container) => renderHome(container);

  console.log('%cPart 5 loaded — Homepage, Profile, Safe Data Fetching', 'color:#8b5cf6;font-weight:700;');
})();
</script>

<script>

   PART 6 — SHOP & CART LOGIC

(function () {

  const { State, supabase, $, $$, el, CONFIG, formatCurrency, escapeHtml, Toast, Modal, debounce } = window.LH;
  const { getProductImage, getDisplayPrice } = (() => {

      getProductImage: (p) => p.thumbnail_url || (Array.isArray(p.images) && p.images[0]) || '',
      getDisplayPrice: (p) => {
        const sale = Number(p.sale_price);
        const base = Number(p.price) || 0;
        return (sale > 0 && sale < base) ? { current: sale, original: base, hasSale: true } : { current: base, original: null, hasSale: false };
      }
    };
  })();

  /* 6.1 CART MODULE */
  const Cart = {

    init() {

      this.injectUI();
      this.updateBadge();
    },
    injectUI() {

      overlay.onclick = () => this.close();
      document.body.appendChild(overlay);
      
      if (window.lucide) window.lucide.createIcons({ nodes: [drawer] });
    },
    add(product, qty = 1) {
      if (!product || !product.id) return;
      const exist = this.items.find(i => i.id === product.id);
      if (exist) {
        exist.qty += qty;
      } else {
        this.items.push({
          id: product.id,
          name: product.name,
          price: getDisplayPrice(product).current,
          image: getProductImage(product),
          qty
        });
      }
      this.save();
      this.updateBadge();
      this.renderItems();
      Toast.success('Đã thêm vào giỏ hàng');
    },
    remove(id) {
      this.items = this.items.filter(i => i.id !== id);
      this.save();
      this.updateBadge();
      this.renderItems();
    },
    updateQty(id, qty) {
      if (qty <= 0) return this.remove(id);
      const item = this.items.find(i => i.id === id);
      if (item) item.qty = qty;
      this.save();
      this.updateBadge();
      this.renderItems();
    },
    save() {
      window.LH.store.set(CONFIG.CART_KEY, this.items);
    },
    updateBadge() {
      const btn = $('#cartBtn');
      const count = this.items.reduce((s, i) => s + i.qty, 0);
      if (btn) {
        if (count > 0) { btn.classList.add('has-badge'); btn.dataset.badge = count; }
        else { btn.classList.remove('has-badge'); }
      }
    },
    open() {
      this.renderItems();
      $('#cartDrawer').classList.add('open');
      $('#cartOverlay').style.display = 'block';
    },
    close() {
      $('#cartDrawer').classList.remove('open');
      $('#cartOverlay').style.display = 'none';
    },
    renderItems() {
      const container = $('#cartItems');
      if (!container) return;
      if (this.items.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon"><i data-lucide="shopping-cart"></i></div><div class="empty-title">Giỏ hàng trống</div></div>';
        $('#cartTotalAmount').textContent = '0 ₫';
      } else {
        container.innerHTML = this.items.map(i => `
          <div class="cart-item">
            <img src="${i.image || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='}" class="cart-item-img">
            <div class="cart-item-info">
              <div class="cart-item-name">${escapeHtml(i.name)}</div>
              <div class="cart-item-price">${formatCurrency(i.price)}</div>
              <div class="qty-group" style="margin-top:8px;">
                <button class="btn-sm btn-glass" onclick="window.LH.Cart.updateQty('${i.id}', ${i.qty - 1})">-</button>
                <span style="font-weight:700;width:24px;text-align:center;">${i.qty}</span>
                <button class="btn-sm btn-glass" onclick="window.LH.Cart.updateQty('${i.id}', ${i.qty + 1})">+</button>
              </div>
            </div>
            <i data-lucide="trash-2" class="cart-rm" onclick="window.LH.Cart.remove('${i.id}')"></i>
          </div>
        `).join('');
        const total = this.items.reduce((s, i) => s + (i.price * i.qty), 0);
        $('#cartTotalAmount').textContent = formatCurrency(total);
        if (window.lucide) window.lucide.createIcons({ nodes: [container] });
      }
    },
    checkout() {
      if (this.items.length === 0) return;
      if (!State.user) {
        this.close();
        if (window.LH.Auth) window.LH.Auth.openLogin();
        else Toast.warning('Vui lòng đăng nhập để thanh toán');
        return;
      }
      if (window.LH.Checkout) {
        window.LH.Checkout.open(this.items);
      } else {
        Toast.info('Chức năng thanh toán đang được cập nhật');
      }
    }
  };
  window.LH.Cart = Cart;

  /* 6.2 IMAGE VIEWER MODULE */
  const ImageViewer = {
    images: [], index: 0, scale: 1, startX: 0, startY: 0, tx: 0, ty: 0, startDist: 0, isDragging: false,
    init() {
      const root = document.getElementById('imageViewerRoot');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';
      root.innerHTML = `
        <div class="iv-backdrop" id="ivBackdrop">
          <div class="iv-counter" id="ivCounter">1 / 1</div>
          <button class="iv-btn iv-close" onclick="window.LH.ImageViewer.close()"><i data-lucide="x"></i></button>
          <button class="iv-btn iv-prev" onclick="window.LH.ImageViewer.nav(-1)"><i data-lucide="chevron-left"></i></button>
          <button class="iv-btn iv-next" onclick="window.LH.ImageViewer.nav(1)"><i data-lucide="chevron-right"></i></button>
          <div class="iv-track" id="ivTrack">
            <img class="iv-img" id="ivImg" draggable="false">
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [root] });
      
      const track = document.getElementById('ivTrack');
      track.addEventListener('pointerdown', this.onDown.bind(this));
      track.addEventListener('pointermove', this.onMove.bind(this));
      track.addEventListener('pointerup', this.onUp.bind(this));
      track.addEventListener('pointercancel', this.onUp.bind(this));
      track.addEventListener('wheel', (e) => {
        e.preventDefault();
        this.zoom(e.deltaY < 0 ? 1.2 : 0.8);
      }, { passive: false });
    },
    open(images, startIndex = 0) {
      this.init();
      this.images = images;
      this.index = startIndex;
      this.scale = 1; this.tx = 0; this.ty = 0;
      document.getElementById('ivBackdrop').classList.add('active');
      document.body.style.overflow = 'hidden';
      this.render();
    },
    close() {
      document.getElementById('ivBackdrop').classList.remove('active');
      document.body.style.overflow = '';
    },
    nav(dir) {
      if (this.images.length <= 1) return;
      this.index = (this.index + dir + this.images.length) % this.images.length;
      this.scale = 1; this.tx = 0; this.ty = 0;
      this.render();
    },
    render() {
      const img = document.getElementById('ivImg');
      img.src = this.images[this.index];
      img.style.transform = `translate(${this.tx}px, ${this.ty}px) scale(${this.scale})`;
      document.getElementById('ivCounter').textContent = `${this.index + 1} / ${this.images.length}`;
    },
    zoom(factor) {
      this.scale = Math.max(1, Math.min(5, this.scale * factor));
      if (this.scale === 1) { this.tx = 0; this.ty = 0; }
      this.render();
    },
    onDown(e) {
      if (this.scale > 1) { this.isDragging = true; this.startX = e.clientX - this.tx; this.startY = e.clientY - this.ty; }
      else { this.startX = e.clientX; }
    },
    onMove(e) {
      if (this.isDragging && this.scale > 1) {
        this.tx = e.clientX - this.startX;
        this.ty = e.clientY - this.startY;
        this.render();
      }
    },
    onUp(e) {
      this.isDragging = false;
      if (this.scale === 1) {
        const dx = e.clientX - this.startX;
        if (Math.abs(dx) > 50) this.nav(dx > 0 ? -1 : 1);
      }
    }
  };
  window.LH.ImageViewer = ImageViewer;

  /* 6.3 SHOP VIEW */
  async function renderShop(container) {
    container.innerHTML = `
      <div class="shop-toolbar">
        <div class="shop-search">
          <i data-lucide="search"></i>
          <input type="search" id="shopSearch" placeholder="Tìm sản phẩm…">
        </div>
        <select class="select" id="shopSort" style="width:180px;">
          <option value="newest">Mới nhất</option>
          <option value="price_asc">Giá tăng dần</option>
          <option value="price_desc">Giá giảm dần</option>
        </select>
      </div>
      <div class="cat-scroll" id="shopCats"></div>
      <div class="product-grid" id="shopGrid" style="margin-top:16px;"></div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });

    const state = { cat: '', search: '', sort: 'newest' };
    const grid = container.querySelector('#shopGrid');
    const catsWrap = container.querySelector('#shopCats');

    // Load cats
    const cats = await window.LH.Data.getCategories();
    let catHtml = `<div class="cat-chip active" data-id="">Tất cả</div>`;
    cats.forEach(c => { catHtml += `<div class="cat-chip" data-id="${c.id}">${escapeHtml(c.name)}</div>`; });
    catsWrap.innerHTML = catHtml;
    
    catsWrap.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        catsWrap.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.cat = chip.dataset.id;
        loadProducts();
      });
    });

    container.querySelector('#shopSort').addEventListener('change', (e) => {
      state.sort = e.target.value;
      loadProducts();
    });

    container.querySelector('#shopSearch').addEventListener('input', debounce((e) => {
      state.search = e.target.value;
      loadProducts();
    }, 300));

    async function loadProducts() {
      grid.innerHTML = '<div class="skeleton" style="height:200px;border-radius:20px;"></div><div class="skeleton" style="height:200px;border-radius:20px;"></div>';
      try {
        let q = supabase.from('products').select('*').eq('is_visible', true);
        if (state.cat) q = q.eq('category_id', state.cat);
        if (state.search) q = q.ilike('name', `%${state.search}%`);
        
        if (state.sort === 'price_asc') q = q.order('price', { ascending: true });
        else if (state.sort === 'price_desc') q = q.order('price', { ascending: false });
        else q = q.order('created_at', { ascending: false });

        const { data, error } = await q.limit(40);
        if (error) throw error;

        grid.innerHTML = '';
        if (!data || data.length === 0) {
          grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-title">Không tìm thấy sản phẩm</div></div>`;
          return;
        }
        data.forEach(p => {
          const price = getDisplayPrice(p);
          const card = el('div', { class: 'pcard', onclick: () => location.hash = `#/product?id=${p.id}` });
          card.innerHTML = `
            <div class="pcard-media">
              ${getProductImage(p) ? `<img src="${getProductImage(p)}" loading="lazy">` : ''}
            </div>
            <div class="pcard-body">
              <div class="pcard-name">${escapeHtml(p.name)}</div>
              <div class="pcard-price">${formatCurrency(price.current)}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-title">Lỗi tải dữ liệu</div><div class="empty-desc">${e.message}</div></div>`;
      }
    }
    loadProducts();
  }
  window.LH.Views.shop = renderShop;

  /* 6.4 PRODUCT DETAIL VIEW */
  async function renderProduct(container, hash) {
    const qIndex = hash.indexOf('?');
    const params = new URLSearchParams(qIndex >= 0 ? hash.slice(qIndex + 1) : '');
    const id = params.get('id');
    if (!id) { container.innerHTML = '<div class="empty-state">Không tìm thấy sản phẩm</div>'; return; }

    container.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner" style="border-color:var(--brand-1);border-right-color:transparent;"></div></div>';

    try {
      const { data: p, error } = await supabase.from('products').select('*').eq('id', id).single();
      if (error || !p) throw new Error('Sản phẩm không tồn tại');

      // Parse images
      let images = [];
      if (Array.isArray(p.images) && p.images.length) images = p.images;
      if (p.thumbnail_url && !images.includes(p.thumbnail_url)) images.unshift(p.thumbnail_url);
      if (images.length === 0) images.push(''); // fallback

      const price = getDisplayPrice(p);

      container.innerHTML = `
        <div style="margin-bottom:20px;font-size:13px;color:var(--text-3);">
          <a href="#/shop" style="color:var(--brand-1);">Shop</a> <i data-lucide="chevron-right" style="width:12px;height:12px;display:inline;vertical-align:middle;"></i> ${escapeHtml(p.name)}
        </div>
        <div class="pd-wrap">
          <!-- GALLERY -->
          <div class="pd-gallery">
            <div class="pd-main-img" id="pdMainImg">
              ${images[0] ? `<img src="${images[0]}" id="pdImgDisplay">` : '<div style="display:grid;place-items:center;height:100%;"><i data-lucide="image-off"></i></div>'}
            </div>
            ${images.length > 1 ? `
              <div class="pd-thumbs" id="pdThumbs">
                ${images.map((img, i) => `<div class="pd-thumb ${i === 0 ? 'active' : ''}" data-idx="${i}"><img src="${img}"></div>`).join('')}
              </div>
            ` : ''}
          </div>

          <!-- INFO -->
          <div class="pd-info">
            <div class="pd-cat"><i data-lucide="tag"></i> Sản phẩm số</div>
            <h1 class="pd-name">${escapeHtml(p.name)}</h1>
            <div class="pd-desc">${escapeHtml(p.short_desc || '')}</div>
            
            <div class="pd-price-box">
              <div style="font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:4px;">Giá bán</div>
              <div>
                <span class="pd-price-now">${formatCurrency(price.current)}</span>
                ${price.hasSale ? `<span class="pd-price-old">${formatCurrency(price.original)}</span>` : ''}
              </div>
            </div>

            <div class="qty-group">
              <span style="font-weight:600;font-size:14px;">Số lượng:</span>
              <div class="qty-stepper">
                <div class="qty-btn" id="qtyDec"><i data-lucide="minus"></i></div>
                <div class="qty-val" id="qtyVal">1</div>
                <div class="qty-btn" id="qtyInc"><i data-lucide="plus"></i></div>
              </div>
            </div>

            <button class="btn btn-primary btn-lg" id="btnAddCart" style="margin-top:10px;">
              <i data-lucide="shopping-cart"></i> Thêm vào giỏ
            </button>

            <!-- TABS -->
            <div class="pd-tabs">
              <div class="pd-tabs-nav">
                <div class="pd-tab-btn active" data-tab="desc">Mô tả</div>
                <div class="pd-tab-btn" data-tab="specs">Thông số</div>
              </div>
              <div class="pd-tab-content" id="tabDesc">${escapeHtml(p.description || 'Chưa có mô tả chi tiết.')}</div>
              <div class="pd-tab-content" id="tabSpecs" style="display:none;">
                <div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--divider);"><span>Mã SP:</span><strong>${escapeHtml(p.code || '—')}</strong></div>
                <div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--divider);"><span>Tồn kho:</span><strong>${p.stock || 0}</strong></div>
                <div class="row-between" style="padding:8px 0;"><span>Bảo hành:</span><strong>${escapeHtml(p.warranty || 'Không')}</strong></div>
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });

      // Bind Gallery
      if (images.length > 1 && images[0]) {
        const thumbs = container.querySelectorAll('.pd-thumb');
        thumbs.forEach(t => {
          t.addEventListener('click', () => {
            thumbs.forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            container.querySelector('#pdImgDisplay').src = images[t.dataset.idx];
          });
        });
      }
      
      container.querySelector('#pdMainImg')?.addEventListener('click', () => {
        if (images[0]) ImageViewer.open(images, 0);
      });

      // Bind Qty & Cart
      let qty = 1;
      container.querySelector('#qtyDec').onclick = () => { if (qty > 1) { qty--; container.querySelector('#qtyVal').textContent = qty; } };
      container.querySelector('#qtyInc').onclick = () => { qty++; container.querySelector('#qtyVal').textContent = qty; };
      
      container.querySelector('#btnAddCart').onclick = () => {
        Cart.add(p, qty);
        Cart.open();
      };

      // Bind Tabs
      container.querySelectorAll('.pd-tab-btn').forEach(btn => {
        btn.onclick = () => {
          container.querySelectorAll('.pd-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          container.querySelector('#tabDesc').style.display = btn.dataset.tab === 'desc' ? 'block' : 'none';
          container.querySelector('#tabSpecs').style.display = btn.dataset.tab === 'specs' ? 'block' : 'none';
        };
      });

    } catch (e) {
      container.innerHTML = `<div class="empty-state"><div class="empty-title">Lỗi</div><div class="empty-desc">${e.message}</div><a href="#/shop" class="btn btn-primary" style="margin-top:16px;">Về Shop</a></div>`;
    }
  }
  window.LH.Views.product = renderProduct;

  /* INIT CART */
  document.addEventListener('DOMContentLoaded', () => {
    Cart.init();
    $('#cartBtn')?.addEventListener('click', () => Cart.open());
  });

  console.log('%cPart 6 loaded — Shop, Product, Cart, ImageViewer', 'color:#10b981;font-weight:700;');
})();
</script>

<script>
/* ============================================================
   PART 7 — AUTHENTICATION & ACCOUNT LOGIC
   ============================================================ */
(function () {
  'use strict';
  const { State, supabase, $, el, CONFIG, Toast, Modal, escapeHtml, formatCurrency, formatDate, formatDateTime } = window.LH;

  if (!supabase) return;

  /* 7.1 AUTH MODULE */
  const Auth = {
    init() {
      // Restore session on load
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) this.handleLoginSuccess(session.user);
      });

      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) this.handleLoginSuccess(session.user);
        if (event === 'SIGNED_OUT') this.handleLogout();
      });
    },

    async handleLoginSuccess(user) {
      State.user = user;
      // Fetch profile
      try {
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
        State.profile = profile || { username: user.email.split('@')[0], display_name: user.email.split('@')[0] };
        
        // Check admin role
        const { data: roleData } = await supabase.from('user_roles').select('role').eq('user_id', user.id).maybeSingle();
        State.isAdmin = roleData?.role === 'admin' || roleData?.role === 'super_admin';
      } catch (e) {
        console.warn('Profile fetch error', e);
      }
      
      window.LH.renderUserState();
      window.dispatchEvent(new Event('auth:changed'));
      State.emit('auth:login', State.user);
    },

    handleLogout() {
      State.user = null;
      State.profile = null;
      State.isAdmin = false;
      window.LH.renderUserState();
      window.dispatchEvent(new Event('auth:changed'));
      State.emit('auth:logout');
      Toast.success('Đã đăng xuất');
    },

    async logout() {
      await supabase.auth.signOut();
      location.hash = '#/';
    },

    /* MỞ MODAL ĐĂNG NHẬP / ĐĂNG KÝ */
    openModal(defaultTab = 'login') {
      const body = document.createElement('div');
      body.className = 'auth-modal-content';
      body.innerHTML = `
        <div class="auth-header">
          <div class="h2" style="font-size:22px;margin-bottom:4px;" id="authTitle">Chào mừng trở lại</div>
          <div style="font-size:13.5px;opacity:0.9;" id="authSub">Đăng nhập để tiếp tục mua sắm</div>
        </div>
        <div class="auth-body">
          <div class="auth-tabs" id="authTabs" data-active="${defaultTab}">
            <div class="auth-indicator"></div>
            <div class="auth-tab ${defaultTab === 'login' ? 'active' : ''}" data-tab="login">Đăng nhập</div>
            <div class="auth-tab ${defaultTab === 'register' ? 'active' : ''}" data-tab="register">Đăng ký</div>
          </div>

          <!-- FORM ĐĂNG NHẬP -->
          <form class="auth-form" id="formLogin" ${defaultTab === 'register' ? 'hidden' : ''}>
            <div class="field">
              <label class="field-label">Username</label>
              <input type="text" class="input" id="loginUser" placeholder="Nhập username" autocomplete="username">
            </div>
            <div class="field">
              <label class="field-label">Mật khẩu</label>
              <div class="input-group">
                <input type="password" class="input" id="loginPass" placeholder="Nhập mật khẩu" autocomplete="current-password">
                <button type="button" class="input-group-btn" onclick="const p=document.getElementById('loginPass');p.type=p.type==='password'?'text':'password';"><i data-lucide="eye"></i></button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" id="btnLogin">Đăng nhập</button>
          </form>

          <!-- FORM ĐĂNG KÝ -->
          <form class="auth-form" id="formRegister" ${defaultTab === 'login' ? 'hidden' : ''}>
            <div class="field">
              <label class="field-label">Username</label>
              <input type="text" class="input" id="regUser" placeholder="VD: LNThanhTruc" autocomplete="username">
              <div class="field-hint">Chỉ chữ, số, dấu chấm, gạch dưới (3-24 ký tự)</div>
            </div>
            <div class="field">
              <label class="field-label">Mật khẩu</label>
              <div class="input-group">
                <input type="password" class="input" id="regPass" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
                <button type="button" class="input-group-btn" onclick="const p=document.getElementById('regPass');p.type=p.type==='password'?'text':'password';"><i data-lucide="eye"></i></button>
              </div>
            </div>
            <div class="field">
              <label class="field-label">Nhập lại mật khẩu</label>
              <input type="password" class="input" id="regPassConfirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" id="btnRegister">Tạo tài khoản</button>
          </form>
        </div>
      `;

      const modal = Modal.open({
        title: '',
        content: body,
        size: 'sm',
        onMount: (mountBody, close) => {
          // Ẩn header mặc định của Modal
          mountBody.parentNode.querySelector('.modal-header').style.display = 'none';
          mountBody.style.padding = '0';
          
          if (window.lucide) window.lucide.createIcons({ nodes: [mountBody] });

          // Tab Switching
          const tabs = mountBody.querySelector('#authTabs');
          const formLogin = mountBody.querySelector('#formLogin');
          const formReg = mountBody.querySelector('#formRegister');
          const title = mountBody.querySelector('#authTitle');
          const sub = mountBody.querySelector('#authSub');

          const switchTab = (target) => {
            tabs.dataset.active = target;
            tabs.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
            formLogin.hidden = target !== 'login';
            formReg.hidden = target !== 'register';
            if (target === 'login') { title.textContent = 'Chào mừng trở lại'; sub.textContent = 'Đăng nhập để tiếp tục mua sắm'; }
            else { title.textContent = 'Tạo tài khoản mới'; sub.textContent = 'Chỉ mất 30 giây để bắt đầu'; }
          };

          tabs.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

          // Submit Đăng nhập
          formLogin.onsubmit = async (e) => {
            e.preventDefault();
            const user = mountBody.querySelector('#loginUser').value.trim();
            const pass = mountBody.querySelector('#loginPass').value;
            if (!user || !pass) return Toast.warning('Vui lòng nhập đầy đủ');

            const btn = mountBody.querySelector('#btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Đang xử lý...';

            try {
              // Supabase yêu cầu email, ta dùng email nội bộ
              const email = user.toLowerCase() + '@liquidhub.internal';
              const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
              if (error) throw error;
              
              Toast.success('Đăng nhập thành công!');
              close();
            } catch (err) {
              Toast.error(err.message === 'Invalid login credentials' ? 'Sai username hoặc mật khẩu' : err.message);
            } finally {
              btn.disabled = false;
              btn.innerHTML = 'Đăng nhập';
            }
          };

          // Submit Đăng ký
          formReg.onsubmit = async (e) => {
            e.preventDefault();
            const user = mountBody.querySelector('#regUser').value.trim();
            const pass = mountBody.querySelector('#regPass').value;
            const confirm = mountBody.querySelector('#regPassConfirm').value;

            if (!/^[a-zA-Z0-9._]{3,24}$/.test(user)) return Toast.warning('Username không hợp lệ (3-24 ký tự)');
            if (pass.length < 6) return Toast.warning('Mật khẩu tối thiểu 6 ký tự');
            if (pass !== confirm) return Toast.warning('Mật khẩu xác nhận không khớp');

            const btn = mountBody.querySelector('#btnRegister');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Đang tạo...';

            try {
              const email = user.toLowerCase() + '@liquidhub.internal';
              const { data, error } = await supabase.auth.signUp({ email, password: pass, options: { data: { username: user } } });
              if (error) throw error;
              
              if (!data.session) {
                Toast.warning('Cần tắt "Confirm email" trong Supabase Auth Settings để đăng nhập ngay.');
                // Thử đăng nhập luôn
                const { error: loginErr } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (loginErr) throw new Error('Đăng ký thành công nhưng chưa thể đăng nhập. Hãy tắt Confirm Email trong Supabase.');
              } else {
                Toast.success('Đăng ký thành công!');
              }
              close();
            } catch (err) {
              Toast.error(err.message);
            } finally {
              btn.disabled = false;
              btn.innerHTML = 'Tạo tài khoản';
            }
          };
        }
      });
    },

    openLogin() { this.openModal('login'); },
    openRegister() { this.openModal('register'); }
  };
  window.LH.Auth = Auth;

  /* 7.2 ACCOUNT VIEW */
  async function renderAccount(container) {
    if (!State.user) {
      container.innerHTML = `
        <div class="empty-state" style="margin-top:40px;">
          <div class="empty-icon"><i data-lucide="lock"></i></div>
          <div class="empty-title">Bạn chưa đăng nhập</div>
          <div class="empty-desc">Vui lòng đăng nhập để xem thông tin tài khoản.</div>
          <button class="btn btn-primary" onclick="window.LH.Auth.openLogin()" style="margin-top:16px;">Đăng nhập ngay</button>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons({ nodes: [container] });
      return;
    }

    const profile = State.profile || {};
    const shortId = State.user.id.slice(0, 8).toUpperCase();
    const isAdmin = State.isAdmin;

    container.innerHTML = `
      ${isAdmin ? `
        <div class="admin-setup-banner anim-fade">
          <div>
            <div style="font-weight:800;font-size:16px;">Quyền Quản trị viên</div>
            <div style="font-size:13px;opacity:0.9;">Bạn có toàn quyền quản lý hệ thống.</div>
          </div>
          <a href="#/admin" class="btn btn-glass" style="background:#fff;color:#d97706;"><i data-lucide="shield"></i> Vào Admin Panel</a>
        </div>
      ` : ''}

      <div class="acc-header anim-up">
        <div class="acc-avatar">
          ${profile.avatar_url ? `<img src="${profile.avatar_url}">` : (profile.display_name || 'U').charAt(0).toUpperCase()}
        </div>
        <div class="acc-name">${escapeHtml(profile.display_name || profile.username || 'User')}</div>
        <div class="acc-role">${isAdmin ? 'Quản trị viên' : 'Thành viên'}</div>
        <div style="margin-top:16px;font-size:13px;opacity:0.9;display:flex;gap:16px;">
          <div><i data-lucide="id-card" style="width:14px;height:14px;display:inline;vertical-align:-2px;"></i> ID: ${shortId}</div>
          <div><i data-lucide="calendar" style="width:14px;height:14px;display:inline;vertical-align:-2px;"></i> Tham gia: ${formatDate(State.user.created_at)}</div>
        </div>
      </div>

      <div class="acc-grid anim-fade">
        <!-- THÔNG TIN CƠ BẢN -->
        <div class="acc-card">
          <div class="acc-card-title"><i data-lucide="user"></i> Thông tin cá nhân</div>
          <div class="acc-info-row"><span class="acc-info-label">Username</span><span class="acc-info-val">@${escapeHtml(profile.username || '—')}</span></div>
          <div class="acc-info-row"><span class="acc-info-label">Tên hiển thị</span><span class="acc-info-val">${escapeHtml(profile.display_name || '—')}</span></div>
          <div class="acc-info-row"><span class="acc-info-label">Email nội bộ</span><span class="acc-info-val">${escapeHtml(State.user.email)}</span></div>
          <div class="acc-info-row"><span class="acc-info-label">Trạng thái</span><span class="acc-info-val" style="color:var(--success);">Hoạt động</span></div>
        </div>

        <!-- VÍ & GIAO DỊCH -->
        <div class="acc-card">
          <div class="acc-card-title"><i data-lucide="wallet"></i> Ví của bạn</div>
          <div class="acc-info-row"><span class="acc-info-label">Số dư khả dụng</span><span class="acc-info-val" style="color:var(--danger);font-size:18px;">${formatCurrency(State.wallet?.balance || 0)}</span></div>
          <div class="acc-info-row"><span class="acc-info-label">Tổng đã nạp</span><span class="acc-info-val">${formatCurrency(State.wallet?.total_deposited || 0)}</span></div>
          <div class="acc-info-row"><span class="acc-info-label">Tổng đã chi</span><span class="acc-info-val">${formatCurrency(State.wallet?.total_spent || 0)}</span></div>
          <a href="#/wallet" class="btn btn-primary" style="width:100%;margin-top:16px;"><i data-lucide="plus-circle"></i> Nạp thêm tiền</a>
        </div>

        <!-- BẢO MẬT -->
        <div class="acc-card">
          <div class="acc-card-title"><i data-lucide="shield"></i> Bảo mật</div>
          <div class="acc-info-row"><span class="acc-info-label">Mật khẩu</span><span class="acc-info-val">••••••••</span></div>
          <button class="btn btn-glass" style="width:100%;margin-top:16px;" onclick="window.LH.Toast.info('Tính năng đổi mật khẩu sẽ sớm cập nhật')">Đổi mật khẩu</button>
        </div>

        <!-- LỊCH SỬ -->
        <div class="acc-card">
          <div class="acc-card-title"><i data-lucide="history"></i> Lịch sử hoạt động</div>
          <div class="acc-info-row"><span class="acc-info-label">Đăng nhập gần nhất</span><span class="acc-info-val">${formatDateTime(new Date())}</span></div>
          <a href="#/orders" class="btn btn-glass" style="width:100%;margin-top:16px;"><i data-lucide="package"></i> Xem đơn hàng</a>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
  }
  window.LH.Views.account = renderAccount;

  /* 7.3 ADMIN BOOTSTRAP - TẠO TÀI KHOẢN LNThanhTruc TỰ ĐỘNG */
  async function bootstrapAdmin() {
    try {
      // Kiểm tra xem đã có admin nào chưa
      const { count, error: countErr } = await supabase
        .from('user_roles')
        .select('*', { count: 'exact', head: true })
        .in('role', ['admin', 'super_admin']);

      if (countErr) {
        console.warn('Chưa có bảng user_roles hoặc lỗi RLS.');
        return;
      }
      
      if (count > 0) {
        console.log('✅ Hệ thống đã có Admin.');
        return;
      }

      console.log('⚠️ Chưa có Admin. Đang tạo tài khoản LNThanhTruc...');
      
      // Tạo tài khoản qua Supabase Auth
      const adminEmail = 'lnthanhtruc@liquidhub.internal';
      const adminPass = 'onlybo0806'; // Mật khẩu từ yêu cầu
      
      const { data, error } = await supabase.auth.signUp({
        email: adminEmail,
        password: adminPass,
        options: { data: { username: 'LNThanhTruc' } }
      });

      if (error && error.message !== 'User already registered') {
        console.warn('Không thể tạo Admin tự động:', error.message);
        return;
      }

      // Nếu đã có user (hoặc vừa tạo xong), thử đăng nhập để lấy ID
      const { data: loginData, error: loginErr } = await supabase.auth.signInWithPassword({
        email: adminEmail,
        password: adminPass
      });

      if (loginErr) {
        console.warn('Không thể đăng nhập Admin:', loginErr.message);
        return;
      }

      const userId = loginData.user.id;

      // Cấp quyền super_admin (nếu RLS cho phép, hoặc dùng RPC)
      // Vì RLS chặn insert user_roles từ client, ta sẽ thử insert. Nếu lỗi, yêu cầu chạy SQL.
      const { error: roleErr } = await supabase.from('user_roles').upsert({
        user_id: userId,
        role: 'super_admin'
      });

      if (roleErr) {
        console.warn('Lỗi cấp quyền Admin (Cần chạy SQL):', roleErr.message);
        // Hiển thị thông báo trên UI cho chủ web
        setTimeout(() => {
          Toast.warning('Vui lòng chạy SQL cấp quyền Admin trong Supabase Dashboard!', 10000);
        }, 2000);
      } else {
        // Đánh dấu profile là owner
        await supabase.from('profiles').update({ is_owner: true }).eq('id', userId);
        
        Toast.success('Đã khởi tạo tài khoản Admin: LNThanhTruc / onlybo0806');
        console.log('✅ Tạo Admin thành công. Vui lòng đăng xuất và đăng nhập bằng LNThanhTruc.');
        
        // Đăng xuất người dùng hiện tại (nếu có)
        await supabase.auth.signOut();
      }

    } catch (e) {
      console.warn('Bootstrap Admin Error:', e);
    }
  }

  // Chạy bootstrap sau khi load 3s
  setTimeout(bootstrapAdmin, 3000);

  // Đăng xuất
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    Auth.logout();
  });

  // Khởi tạo Auth
  Auth.init();

  console.log('%cPart 7 loaded — Auth, Account, Admin Bootstrap', 'color:#f59e0b;font-weight:700;');
})();
</script>
